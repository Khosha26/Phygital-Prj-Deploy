<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Embassy Citadel — Inventory</title>

<!--
  INVENTORY v1 — Tower Selector
  · Full-screen SVG rendering of the project (1448×1086 viewBox)
  · Single transparent path overlay traces the tower silhouette
  · Path is the "tap target" — stroke cycles yellow → orange → red
    in a loop drawing the eye to it. Hover deepens the glow.
  · Click navigates to the next inventory drill-down (placeholder
    target until the next screen is built).
  · Locked top-left back button → home.html with cream-veil fade.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper: #FCFAF4; --bone: #F4F2ED; --bone-50: #F7F5EF; --bone-200: #E8E2D6;
    --gold-500: #946F38; --gold-300: #C9A567; --gold-200: #D9B97A;
    --onyx-700: #1A1814; --onyx-100: #3A332A; --taupe-400: #A89B86;
    --hair: rgba(148, 111, 56, 0.32);
    --hair-lo: rgba(148, 111, 56, 0.16);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--paper); color: var(--onyx-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none; overflow: hidden;
    position: fixed; inset: 0;
  }
  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      url('assets/bg-paper.png') center/cover no-repeat,
      radial-gradient(ellipse 80% 60% at 50% 45%, var(--paper), var(--bone-50) 55%, var(--bone-200) 100%) var(--paper);
  }
  #stage, .stage-inner {
    position: relative;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
    will-change: transform;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    background: var(--bone);
  }

  /* ── PAPER BACKGROUND (matches home.html — sits beneath the SVG) ─ */
  .stage-bg {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 0;
    background-color: var(--bone);
    background-image: url('assets/bg-paper.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  /* ── INVENTORY SVG (full screen) ──────────────────────────────── */
  .inv-canvas {
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: 1;
    overflow: hidden;
    /* Let the paper texture bleed through the SVG's cream backdrop */
    mix-blend-mode: multiply;
    /* Top + bottom mask so the SVG's hard horizontal edges dissolve
       into the paper bg under the topbar / above the bottom margin. */
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
  }
  .inv-svg {
    width: 100%; height: 100%;
    /* Explicit min box so the <object> can never collapse to 0×0 on
       tablets (which would render the tower invisible even when the
       SVG loads fine). The .inv-canvas is full-stage, so 100% resolves
       to the stage size; the min-* values are a hard floor. */
    min-width: 100%; min-height: 100%;
    display: block;
    /* Lift overall vibrancy of the sepia tower raster slightly */
    filter: brightness(1.08) contrast(1.05) saturate(1.05);
  }
  /* The <img> fallback (native + JS-swapped) fills the same box and
     uses the same fit as the SVG so the tower looks identical. */
  img.inv-svg {
    object-fit: contain;
    object-position: center center;
    pointer-events: auto;
    cursor: pointer;
  }
  /* Bone-coloured side fades blend the SVG's letterbox strips into the
     paper bg seamlessly. Wider + harder near the edge, softer as it
     reaches into the canvas — no visible vertical seam on L/R. */
  .inv-canvas::before, .inv-canvas::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 22%;
    z-index: 3;
    pointer-events: none;
  }
  .inv-canvas::before {
    left: 0;
    background: linear-gradient(90deg,
      var(--bone) 0%,
      var(--bone) 30%,
      rgba(244, 242, 237, 0.85) 55%,
      rgba(244, 242, 237, 0.45) 75%,
      transparent 100%);
  }
  .inv-canvas::after {
    right: 0;
    background: linear-gradient(270deg,
      var(--bone) 0%,
      var(--bone) 30%,
      rgba(244, 242, 237, 0.85) 55%,
      rgba(244, 242, 237, 0.45) 75%,
      transparent 100%);
  }
  /* While the SVG content document is loading, hold a paper colour */
  .inv-svg-loading {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: var(--bone);
    color: var(--taupe-400);
    font-family: 'Inter', sans-serif;
    font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase;
    pointer-events: none;
    transition: opacity 400ms ease;
  }
  .inv-svg-loading.is-hidden { opacity: 0; pointer-events: none; }

  /* ── TOP BAR (seamless — paper bg shows through) ────────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    background: linear-gradient(180deg, rgba(252,250,244,0.55), rgba(252,250,244,0) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  /* Unified left-side brand-back */
  .ec-brand-back {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: opacity 240ms ease, transform 240ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    min-height: 44px;
  }
  .ec-brand-back:hover { opacity: 0.78; transform: translateX(-1px); }
  .ec-brand-back:focus-visible { outline: none; opacity: 0.78; }
  .ec-brand-back .brand-diamond {
    width: 18px; height: 18px;
    position: relative; display: inline-block;
    transform: rotate(45deg);
    border: 1px solid var(--gold-500);
    background: linear-gradient(135deg, var(--gold-200) 0%, var(--gold-500) 100%);
    box-shadow: 0 0 6px rgba(148,111,56,0.20);
    flex-shrink: 0;
  }
  .ec-brand-back .brand-diamond::before {
    content: ''; position: absolute; inset: 3px;
    border: 0.5px solid rgba(255,255,255,0.55); background: transparent;
  }
  .ec-brand-back .brand-text { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
  .ec-brand-back .brand-text .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500; font-size: 22px;
    color: var(--onyx-700); letter-spacing: 0.04em;
  }
  .ec-brand-back .brand-text .loc {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 9px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
  }
  /* Right-side BACK button */
  .ec-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 92px; min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 220ms ease, color 220ms ease,
                border-color 220ms ease, transform 200ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    -webkit-appearance: none; appearance: none;
  }
  .ec-back-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .ec-back-btn:active { transform: scale(0.96); }
  .ec-back-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-500); }
  .ec-back-btn .arr { font-size: 13px; line-height: 1; transform: translateY(-0.5px); letter-spacing: 0; }
  /* ── TAP RESPONSIVENESS — interactive surfaces inside the app ── */
  button, [role="button"], a[href] {
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  svg .tap, svg [data-tap], svg [role="button"], svg path[id*="tower"] { pointer-events: all; cursor: pointer; }
  /* Kill any focus ring / blue tap-highlight box on the clickable tower SVG */
  .inv-canvas, .inv-svg, #invSvg, object.inv-svg, img.inv-svg, #invSvgImgFallback {
    -webkit-tap-highlight-color: transparent;
    outline: none !important;
    -webkit-user-select: none; user-select: none;
    -webkit-user-drag: none;
  }
  .inv-canvas:focus, .inv-svg:focus, #invSvg:focus, img.inv-svg:focus,
  .inv-canvas:focus-visible, .inv-svg:focus-visible, #invSvg:focus-visible,
  img.inv-svg:focus-visible {
    outline: none !important; box-shadow: none !important;
  }
  .brand {
    position: absolute;
    top: 38px; left: 44px;
    z-index: 12; /* above topbar (8) and SVG canvas (1) */
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: opacity 240ms ease, transform 240ms ease;
    transform: translateY(-50%);
  }
  .brand:hover { opacity: 0.72; transform: translateY(-50%) translateX(-1px); }
  .brand::after {
    content: '← Home';
    position: absolute;
    left: 100%; top: 50%;
    transform: translate(8px, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 8.5px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
    opacity: 0; white-space: nowrap;
    transition: opacity 260ms ease, transform 260ms ease;
    pointer-events: none;
  }
  .brand:hover::after, .brand:focus-visible::after {
    opacity: 0.85;
    transform: translate(12px, -50%);
  }
  .brand-wordmark {
    width: 130px; height: 36px;
    color: var(--onyx-700);
  }
  .brand-wordmark svg { width: 100%; height: 100%; display: block; }
  .top-eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 400; font-size: 9px;
    letter-spacing: 0.55em; text-transform: uppercase;
    color: var(--gold-500); opacity: 0.78;
  }
  .top-right {
    display: flex; align-items: center; gap: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 400; font-size: 10px;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--onyx-100); opacity: 0.78;
    font-variant-numeric: tabular-nums;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold-300);
    box-shadow: 0 0 8px rgba(217,185,122,0.6);
    animation: livePulse 2.6s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.18); }
  }
  /* ── RIGHT-SIDE "PICK THE TOWER" CTA with animated arrow ─────── */
  .inv-cta {
    position: absolute;
    right: 70px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 8;
    display: flex; align-items: center; gap: 26px;
    pointer-events: none;
    opacity: 0;
    animation: ctaFadeIn 900ms cubic-bezier(0.22, 1, 0.36, 1) 600ms forwards;
  }
  @keyframes ctaFadeIn {
    from { opacity: 0; transform: translateY(-50%) translateX(10px); }
    to   { opacity: 1; transform: translateY(-50%) translateX(0); }
  }
  /* The pointer line + arrow — sits LEFT of text, points further left toward tower */
  .inv-cta-line {
    position: relative;
    width: 220px;
    height: 60px;
    display: flex; align-items: center;
  }
  /* Dashed gold track */
  .inv-cta-line::before {
    content: '';
    position: absolute;
    left: 56px; right: 0;
    top: 50%;
    height: 1.5px;
    background-image: linear-gradient(90deg,
      var(--gold-500) 0, var(--gold-500) 5px, transparent 5px, transparent 12px);
    background-size: 12px 1.5px;
    background-repeat: repeat-x;
    opacity: 0.55;
  }
  /* Flowing pulse traveling RIGHT→LEFT along the track */
  .inv-cta-line::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 3px;
    margin-top: -1.5px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 210, 74, 0.85) 35%,
      #FFE0A0 50%,
      rgba(255, 210, 74, 0.85) 65%,
      transparent 100%);
    background-size: 60% 100%;
    background-repeat: no-repeat;
    background-position: 120% 0;
    filter: blur(0.5px);
    box-shadow: 0 0 8px rgba(255, 210, 74, 0.85);
    animation: ctaFlow 1.8s ease-in-out infinite;
  }
  @keyframes ctaFlow {
    0%   { background-position: 120% 0; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { background-position: -120% 0; opacity: 0; }
  }
  /* Arrow head at the LEFT end of the line — large, matches headline weight */
  .inv-cta-arrow {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 56px; height: 56px;
    color: var(--gold-500);
    filter: drop-shadow(0 0 10px rgba(255, 210, 74, 0.7))
            drop-shadow(0 0 20px rgba(255, 210, 74, 0.35));
    animation: ctaNudge 1.8s ease-in-out infinite;
  }
  @keyframes ctaNudge {
    0%, 100% { transform: translateY(-50%) translateX(0);    }
    50%      { transform: translateY(-50%) translateX(-14px); }
  }
  .inv-cta-arrow svg { width: 100%; height: 100%; display: block; }

  /* The text block (right of the line) */
  .inv-cta-text {
    text-align: right;
    display: flex; flex-direction: column; gap: 6px;
  }
  .inv-cta-eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-500);
    opacity: 0.78;
    margin-bottom: 4px;
  }
  .inv-cta-headline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 400;
    font-size: 56px;
    line-height: 1.0;
    letter-spacing: -0.005em;
    color: var(--onyx-700);
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .inv-cta-headline .em {
    color: var(--gold-500);
  }
  .inv-cta-sub {
    font-family: 'Inter', sans-serif;
    font-weight: 400; font-size: 11px;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--taupe-400);
    margin-top: 6px;
  }

  /* ── Veil (cream fade, matches paper bg) ─────────────────────── */
  .veil {
    position: absolute; inset: 0;
    background: var(--bone);
    opacity: 0;
    pointer-events: none;
    z-index: 99;
    transition: opacity 220ms ease-in-out;
  }
  body.is-leaving .veil { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .live-dot, .inv-hint .pip { animation: none; }
  }
</style>

<script>
  // Stage scaler — scale-to-fit (contain). Fixes iPad13 side overflow.
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);

    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

<!-- Embassy Citadel wordmark symbol (top-left back button) -->

<div id="stage-wrap">
  <div id="stage" class="stage-inner">

    <!-- Paper background (matches home.html — beneath everything) -->
    <div class="stage-bg"></div>

    <!-- Full-screen inventory SVG.
         The <object> embeds a 3.6 MB SVG (a base64 PNG + outline path).
         On tablets (mobile Safari / Samsung Internet) a data-URI of this
         size inside an <object> can render BLANK due to renderer memory
         limits. Two safeguards:
           1. A native <img> fallback INSIDE the <object> — shown by the
              browser automatically if the object can't render.
           2. A JS robustness guard (below) that, after ~1.2s, checks the
              object's contentDocument for an <svg>; if missing, it swaps
              in a full-box <img src="assets/inventory.svg"> with the same
              tap-to-navigate behaviour. -->
    <div class="inv-canvas">
      <object class="inv-svg" id="invSvg" type="image/svg+xml" data="assets/inventory.svg" aria-label="Inventory tower selector">
        <img class="inv-svg" id="invSvgImgFallback" src="assets/inventory.svg" alt="Embassy Citadel tower selector" draggable="false" />
      </object>
      <div class="inv-svg-loading" id="invLoading">Loading inventory</div>
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <a class="ec-brand-back" id="brandLink" aria-label="Embassy Citadel">
        <div class="brand-wordmark">
          <svg viewBox="0 0 1000 500" aria-label="Embassy Citadel"><use href="#ec-wordmark" /></svg>
        </div>
      </a>
      <button class="ec-back-btn" id="ecBackBtn" type="button" aria-label="Back to home">
        <span class="arr" aria-hidden="true">←</span>
        <span>Back</span>
      </button>
    </header>

    <!-- Right-side "Pick the Tower" CTA with animated arrow pointer -->
    <div class="inv-cta" aria-hidden="true">
      <div class="inv-cta-line">
        <span class="inv-cta-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12 L4 12" />
            <path d="M10 6 L4 12 L10 18" />
          </svg>
        </span>
      </div>
      <div class="inv-cta-text">
        <div class="inv-cta-eyebrow">Selection</div>
        <div class="inv-cta-headline">Pick the <span class="em">Tower</span></div>
        <div class="inv-cta-sub">to view residences</div>
      </div>
    </div>

    <!-- Cream fade veil -->
    <div class="veil" id="veil"></div>

  </div>
</div>

<script>
  // ── Brand wordmark (top-left) → back to home with cream veil ────
  function invNavBack(e) {
    if (e) e.preventDefault();
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = 'home.html'; }, 220);
  }
  document.getElementById('brandLink').addEventListener('click', invNavBack);
  const ecBackBtn = document.getElementById('ecBackBtn');
  if (ecBackBtn) {
    ecBackBtn.addEventListener('click', invNavBack);
    ecBackBtn.addEventListener('touchend', invNavBack, { passive: false });
  }

  // ── Live clock (guarded — clock chip removed from topbar) ──────
  function tickClock() {
    const el = document.getElementById('clock');
    if (!el) return;
    const d = new Date();
    el.textContent =
      String(d.getHours()).padStart(2, '0') + ':' +
      String(d.getMinutes()).padStart(2, '0') + ' IST';
  }
  tickClock();
  setInterval(tickClock, 30000);

  // ── Inject styles + click handler into the embedded SVG ────────
  // The SVG ships with a single transparent path that traces the
  // tower silhouette. We make it the tap target, cycle its stroke
  // colour yellow → orange → red, and route the click to the next
  // inventory drill-down screen.
  const obj = document.getElementById('invSvg');
  const loading = document.getElementById('invLoading');
  let towerReady = false;      // set true once <object> SVG verified
  let fallbackDone = false;    // set true once <img> fallback installed

  // ── Shared navigation → floor selector, passing tap origin as % ──
  // ox/oy are 0..100 viewport-relative so inventory-floors.html can
  // originate its iris reveal at the exact tap point.
  function navToFloors(clientX, clientY) {
    const vw = window.innerWidth  || document.documentElement.clientWidth;
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const ox = Math.max(0, Math.min(100, (clientX / vw) * 100));
    const oy = Math.max(0, Math.min(100, (clientY / vh) * 100));
    // Clear any leaving state first so forward nav never carries a veil.
    document.body.classList.remove('is-leaving', 'is-firing');
    window.location.href = 'inventory-floors.html?ox=' +
      ox.toFixed(2) + '&oy=' + oy.toFixed(2);
  }

  // ── <img> FALLBACK ──────────────────────────────────────────────
  // Used when the <object>'s SVG fails to render on a tablet. Swaps the
  // object for a plain <img> of the same file in the same box, wired
  // with the same tap-to-navigate (coords computed from the bounding
  // rect of the tap target). Idempotent.
  function installImgFallback(reason) {
    if (fallbackDone || towerReady) return;
    fallbackDone = true;
    try { obj.style.display = 'none'; } catch (_) {}
    const canvas = document.querySelector('.inv-canvas');
    if (!canvas) return;
    let img = document.getElementById('invSvgImgFallbackActive');
    if (!img) {
      img = document.createElement('img');
      img.id = 'invSvgImgFallbackActive';
      img.className = 'inv-svg';
      img.src = 'assets/inventory.svg';
      img.alt = 'Embassy Citadel tower selector';
      img.draggable = false;
      img.addEventListener('click', (e) => navToFloors(e.clientX, e.clientY));
      // Insert as the first child so it sits beneath the gradient edges.
      canvas.insertBefore(img, canvas.firstChild);
    }
    loading.classList.add('is-hidden');
    console.warn('inventory.svg <object> fell back to <img>:', reason);
  }

  obj.addEventListener('load', () => {
    try {
      const doc = obj.contentDocument;
      // contentDocument can be null/empty on tablets that refuse to
      // render the large data-URI SVG → use the <img> fallback.
      if (!doc || !doc.documentElement ||
          doc.documentElement.tagName.toLowerCase() !== 'svg' ||
          !doc.querySelector('svg, image, path')) {
        installImgFallback('empty contentDocument on load');
        return;
      }
      towerReady = true;

      // Keep the SVG at its natural fit (contain) — user prefers no zoom.
      // Side strips are handled by gradient overlays on .inv-canvas.
      const svgRoot = doc.documentElement;
      if (svgRoot && svgRoot.tagName.toLowerCase() === 'svg') {
        svgRoot.style.width  = '100%';
        svgRoot.style.height = '100%';
      }

      // Inject style into the SVG document — a gold light segment
      // travels around the tower outline via stroke-dashoffset animation.
      // Fill is barely visible; the perimeter shine is the focal effect.
      const style = doc.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = `
        svg { background: transparent; -webkit-tap-highlight-color: transparent; }
        svg, svg * {
          outline: none !important;
          -webkit-tap-highlight-color: transparent !important;
          -webkit-user-select: none; user-select: none;
        }
        svg :focus, svg :focus-visible, svg *:focus { outline: none !important; }
        .cls-1, .cls-2 {
          /* NO !important on fill — keyframe needs to interpolate it */
          fill: rgba(255, 210, 74, 0);
          stroke: #FFD24A !important;
          stroke-width: 3 !important;
          stroke-linecap: round !important;
          stroke-linejoin: round !important;
          stroke-miterlimit: 10 !important;
          cursor: pointer;
          filter: drop-shadow(0 0 6px rgba(255, 210, 74, 0.85))
                  drop-shadow(0 0 16px rgba(255, 210, 74, 0.45))
                  drop-shadow(0 0 36px rgba(255, 175, 80, 0.22));
          /* Two simultaneous animations: outer outline tracer + inside-glow pulse */
          animation: shineTravel 7s linear infinite,
                     insideGlowPulse 3.4s ease-in-out infinite;
          transition: stroke-width 220ms ease;
        }
        @keyframes shineTravel {
          to { stroke-dashoffset: var(--path-length, -2000px); }
        }
        /* !important in @keyframes is IGNORED per CSS spec — keep these plain */
        @keyframes insideGlowPulse {
          0%, 100% { fill: rgba(255, 210, 74, 0); }
          50%      { fill: rgba(255, 210, 74, 0.25); }
        }
        .cls-1:hover, .cls-2:hover {
          stroke-width: 4.5 !important;
        }
      `;
      doc.documentElement.appendChild(style);

      // Find ALL tower paths and wire them as the tap target
      const paths = doc.querySelectorAll('path.cls-1, path.cls-2, path');
      // Configure the stroke-dasharray so a short bright segment travels
      // around each path's full perimeter; stagger so multiple paths chase.
      paths.forEach((path, i) => {
        try {
          const len = (typeof path.getTotalLength === 'function')
            ? path.getTotalLength()
            : 0;
          if (len > 0) {
            const seg = Math.max(120, Math.min(220, len * 0.06));
            path.style.strokeDasharray = seg + ' ' + Math.max(1, len - seg);
            path.style.setProperty('--path-length', (-len) + 'px');
            // Stagger so the two outlines look like chasing lights
            path.style.animationDelay = (i * -2.2) + 's';
          }
        } catch (_) { /* non-path elements ignored */ }
        path.style.cursor = 'pointer';
        path.style.outline = 'none';
        try { path.setAttribute('tabindex', '-1'); path.setAttribute('focusable', 'false'); } catch (_) {}
        path.addEventListener('click', (e) => {
          e.preventDefault();
          // Capture tap position in viewport coords → % for iris reveal origin.
          // The click event from inside an <object> SVG reports clientX/Y
          // relative to the OUTER document, so we can use it directly.
          navToFloors(e.clientX, e.clientY);
        });
      });

      // Hide the loading caption
      loading.classList.add('is-hidden');
    } catch (err) {
      // Cross-document access can fail in some configs (e.g. the SVG is
      // treated as a separate origin) — fall back to a plain <img> so the
      // tower is always visible + tappable.
      console.warn('Could not access inventory SVG:', err);
      installImgFallback('contentDocument access threw: ' + err);
    }
  });

  // ── ROBUSTNESS GUARD ───────────────────────────────────────────
  // On tablets the <object> 'load' event may fire late, never, or with
  // an empty document. After ~1.2s, if the tower hasn't been verified
  // as rendered, swap in the <img> fallback so the tower NEVER vanishes.
  setTimeout(() => {
    if (towerReady || fallbackDone) return;
    let ok = false;
    try {
      const doc = obj.contentDocument;
      ok = !!(doc && doc.documentElement &&
              doc.documentElement.tagName.toLowerCase() === 'svg' &&
              doc.querySelector('svg, image, path'));
    } catch (_) { ok = false; }   // cross-doc access blocked → not verifiable → fall back
    if (ok) { towerReady = true; loading.classList.add('is-hidden'); }
    else    { installImgFallback('1.2s guard: object not rendered'); }
  }, 1200);

  // Failsafe: hide loading after 5s even if nothing else fired
  setTimeout(() => { loading.classList.add('is-hidden'); }, 5000);
</script>

<script>
  // Service worker registration (PWA + offline cache)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  // iOS double-tap zoom guard
  (function() {
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    // Block pinch-zoom gesture events (iOS Safari)
    ['gesturestart','gesturechange','gestureend'].forEach(function(ev) {
      document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });
    });
    // Cache --vh CSS var for iOS Safari URL-bar collapse handling
    function setVh() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', function() { setTimeout(setVh, 120); });
  })();

  // ── Prefetch next-screen on touchstart for faster transitions ───
  (function() {
    function wirePrefetch() {
      document.querySelectorAll('a[href], button[data-href]').forEach(function(el) {
        var href = el.getAttribute('href') || el.dataset.href;
        if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:')) return;
        el.addEventListener('touchstart', function() {
          if (!document.querySelector('link[rel="prefetch"][href="' + href + '"]')) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
          }
        }, { passive: true, once: true });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wirePrefetch);
    } else {
      wirePrefetch();
    }
    // Idle: preload back-to-home
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function() {
        if (location.pathname.indexOf('home.html') !== -1) return;
        if (document.querySelector('link[rel="prefetch"][href="home.html"]')) return;
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'home.html';
        document.head.appendChild(link);
      });
    }
  })();
</script>

<script>
  /* ── BFCACHE / BACK-NAVIGATION GUARD ─────────────────────────────────
     Tablets (iOS Safari, Samsung Internet, Chrome-Android) restore the
     previous page from the back-forward cache with its DOM intact — including
     the cream "is-leaving" veil that was set just before navigating away. That
     left the restored screen BLANK on back. Clear the leaving/firing state
     whenever the page is shown (including a bfcache restore) or on popstate. */
  (function () {
    function clearLeave() { document.body.classList.remove('is-leaving', 'is-firing'); }
    window.addEventListener('pageshow', clearLeave);
    window.addEventListener('popstate', clearLeave);
  })();
</script>
