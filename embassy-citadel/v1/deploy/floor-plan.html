<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Embassy Citadel — Floor Plans</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  FLOOR-PLAN v4 — Living-Tree multi-window comparison pattern
  ──────────────────────────────────────────────────────────────────────
  Default: ONE full floor-plan window taking the whole stage.
  Click "+ ADD WINDOW" → a SECOND full window appears side-by-side.
  Click again → THIRD window. Max 3.
  Each window is independently configurable: own plan / BHK / facing /
  zoom. Comparison happens naturally because the user sees N plans
  side-by-side, each with its own price sheet.

  Stage: 1440 × 900 (same scaler contract as the rest of v4/).

  Top bar (consistent with other inside screens):
    LEFT  : Embassy Citadel wordmark SVG (#ec-wordmark) → home.html
    RIGHT : "N / 3 Windows" + ‹ › + "+ ADD WINDOW" pill + BACK pill

  Body: .windows-grid with data-count="1|2|3" driving grid columns and
  a CSS custom property --base-font that scales internal type/canvas.

  Removed (vs prior build):
    · Far-right thumbnail-switcher rail
    · PRICING COMPARISON table in the right stack
    · The single-card layout — replaced by uniform self-contained
      .plan-window cards, each one a complete unit detail.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper:      #FCFAF4;
    --paper-2:    #F9F6EE;
    --bone:       #F4F2ED;
    --bone-50:    #F7F5EF;
    --bone-200:   #E8E2D6;
    --warm-grey:  #DAD5CD;
    --taupe-300:  #C2B5A3;
    --taupe-400:  #A89B86;
    --taupe-500:  #7E725F;

    --gold-100:   #E8CFA1;
    --gold-200:   #D9B97A;
    --gold-300:   #C9A567;
    --gold-400:   #B89968;
    --gold-500:   #946F38;
    --gold-600:   #6E5A37;
    --copper:     #C26B2A;
    --copper-50:  #F7EBDD;
    --copper-100: #EDD2B6;

    --onyx-100:   #3A332A;
    --onyx-300:   #2A2620;
    --onyx-500:   #1F1B15;
    --onyx-700:   #1A1814;

    --hair-lo:    rgba(148, 111, 56, 0.16);
    --hair:       rgba(148, 111, 56, 0.32);
    --hair-hi:    rgba(148, 111, 56, 0.58);

    --blueprint-fill:      #C5DAE8;
    --blueprint-fill-soft: #D8E5EF;
    --blueprint-fill-deep: #B0C8D9;
    --blueprint-wall:      #2F5A78;
    --blueprint-deck:      #A9C2D2;
    --blueprint-text:      #1F3D55;
    --blueprint-text-soft: #5B7C95;

    --card-shadow:  0 14px 32px -10px rgba(80, 58, 28, 0.22),
                    0 4px 12px  -4px  rgba(40, 28, 10, 0.10);
    --plate-shadow: 0 30px 60px -18px rgba(80, 58, 28, 0.30),
                    0 14px 30px -10px rgba(80, 58, 28, 0.18),
                    0 4px 10px        rgba(40, 28, 10, 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--paper);
    color: var(--onyx-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
    position: fixed; inset: 0;
  }
  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  /* ── Stage scaler — paper bg fills viewport edge-to-edge ─────── */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background-color: var(--bone);
    background-image: url('assets/bg-paper.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  #stage, .stage-inner {
    position: relative;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: transparent;
  }
  .stage-bg {
    position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    z-index: 0; pointer-events: none;
    background-color: var(--bone);
    background-image: url('assets/bg-paper.png');
    background-size: cover; background-position: center center; background-repeat: no-repeat;
  }
  .stage-grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    opacity: 0.022;
    background-image:
      radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 1px;
  }

  /* ── TOP BAR (consistent with home / unit-detail) ───────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    background: linear-gradient(180deg, rgba(252,250,244,0.55), rgba(252,250,244,0) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .brand-back {
    display: inline-flex; align-items: center; gap: 14px;
    text-decoration: none; color: var(--onyx-700);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: opacity 220ms ease;
  }
  .brand-back:hover { opacity: 0.82; }
  .brand-wordmark { width: 170px; height: 56px; display: inline-flex; color: var(--onyx-700); }
  .brand-wordmark svg { width: 100%; height: 100%; }

  .top-chips { display: flex; align-items: center; gap: 10px; }
  .top-eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--taupe-400);
    padding: 0 14px 0 4px;
    user-select: none;
    font-variant-numeric: tabular-nums;
  }
  .top-eyebrow strong { color: var(--gold-500); font-weight: 600; }
  .tc {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300; font-size: 22px; line-height: 1;
    transition: background 220ms ease, color 220ms ease, border-color 220ms ease, transform 200ms ease;
  }
  .tc:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .tc:active { transform: scale(0.94); }

  .add-window-pill {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-100), var(--gold-300));
    border: 1px solid var(--gold-500);
    color: var(--onyx-700);
    font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 10px;
    letter-spacing: 0.36em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 12px -4px rgba(148, 111, 56, 0.45);
    transition: background 220ms ease, transform 200ms ease, opacity 240ms ease, box-shadow 220ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    margin-left: 6px;
  }
  .add-window-pill .plus {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400; font-size: 18px; line-height: 1;
    letter-spacing: 0; transform: translateY(-1px);
  }
  .add-window-pill:hover {
    background: linear-gradient(180deg, var(--gold-200), var(--gold-500));
    color: var(--paper);
    box-shadow: 0 6px 16px -4px rgba(148, 111, 56, 0.55);
  }
  .add-window-pill:active { transform: scale(0.96); }
  .add-window-pill.is-hidden { opacity: 0; pointer-events: none; transform: scale(0.92); }

  .ec-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 92px; min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 220ms ease, color 220ms ease, border-color 220ms ease, transform 200ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    margin-left: 6px;
  }
  .ec-back-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .ec-back-btn:active { transform: scale(0.96); }
  .ec-back-btn .arr { font-size: 13px; line-height: 1; transform: translateY(-0.5px); letter-spacing: 0; }

  /* ── BODY: windows grid (1 → 2 → 3 cols) ─────────────────────── */
  .windows-grid {
    position: absolute;
    top: 86px; left: 22px; right: 22px; bottom: 22px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    z-index: 4;
    transition: grid-template-columns 380ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .windows-grid[data-count="2"] { grid-template-columns: 1fr 1fr; }
  .windows-grid[data-count="3"] { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ── PLAN WINDOW (each is a complete self-contained unit) ────── */
  .plan-window {
    --base-font: 14px;
    --pad-x: 26px;
    --pad-y: 20px;
    --title-size: 38px;
    --carpet-size: 26px;
    --canvas-pad: 18px;
    --spec-num: 26px;
    --total-size: 28px;
    --price-row-pad: 10px;
    --canvas-radius: 16px;

    position: relative;
    background: var(--paper);
    border: 1px solid var(--hair-lo);
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    display: grid;
    grid-template-rows: auto auto 1fr auto auto;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    font-size: var(--base-font);
    transform-origin: center top;
    animation: pw-fade-in 380ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .plan-window.is-removing {
    animation: pw-fade-out 280ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes pw-fade-in {
    from { opacity: 0; transform: translateX(24px) scale(0.96); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes pw-fade-out {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.94); }
  }

  /* When 2 windows: medium sizing */
  .windows-grid[data-count="2"] .plan-window {
    --base-font: 12px;
    --pad-x: 22px;
    --pad-y: 16px;
    --title-size: 30px;
    --carpet-size: 22px;
    --canvas-pad: 14px;
    --spec-num: 22px;
    --total-size: 24px;
    --price-row-pad: 8px;
    --canvas-radius: 14px;
  }
  /* When 3 windows: compact sizing */
  .windows-grid[data-count="3"] .plan-window {
    --base-font: 10.5px;
    --pad-x: 16px;
    --pad-y: 13px;
    --title-size: 24px;
    --carpet-size: 18px;
    --canvas-pad: 10px;
    --spec-num: 18px;
    --total-size: 20px;
    --price-row-pad: 6px;
    --canvas-radius: 12px;
  }

  /* ── WINDOW HEAD: title + tier + carpet + close ─────────────── */
  .pw-head {
    position: relative;
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) * 0.6);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    border-bottom: 1px solid var(--hair-lo);
  }
  .pw-title-row {
    display: flex; align-items: baseline; gap: 12px;
    min-width: 0;
  }
  .pw-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: var(--title-size);
    line-height: 1;
    color: var(--onyx-700);
    letter-spacing: 0.01em;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pw-tier-pill {
    display: inline-flex; align-items: center;
    height: calc(var(--base-font) * 1.55);
    padding: 0 10px;
    background: var(--paper-2);
    border: 1px solid var(--gold-300);
    border-radius: 999px;
    color: var(--gold-500);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.68);
    letter-spacing: 0.30em;
    text-transform: uppercase;
    transform: translateY(-3px);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pw-carpet {
    text-align: right;
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 3px;
    margin-right: calc(var(--base-font) * 2.4);
  }
  .pw-carpet .lbl {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: calc(var(--base-font) * 0.68);
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--taupe-400);
    white-space: nowrap;
  }
  .pw-carpet .val {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: var(--carpet-size);
    line-height: 1;
    color: var(--onyx-700);
    letter-spacing: 0.005em;
    white-space: nowrap;
  }

  .pw-sub-row {
    grid-column: 1 / -1;
    display: flex; align-items: baseline; gap: 14px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .pw-sub {
    font-family: 'Inter', sans-serif;
    font-size: calc(var(--base-font) * 0.82);
    font-weight: 400;
    color: var(--taupe-500);
    letter-spacing: 0.06em;
  }
  .pw-sub-tag {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: calc(var(--base-font) * 1.05);
    color: var(--gold-500);
    letter-spacing: 0.02em;
  }

  /* Close button — only visible when N > 1 (toggled in JS) */
  .pw-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair-lo);
    color: var(--taupe-400);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 300; font-size: 18px; line-height: 1;
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease, transform 160ms ease;
    -webkit-tap-highlight-color: transparent;
    z-index: 5;
  }
  .pw-close:hover {
    background: var(--paper);
    color: var(--onyx-700);
    border-color: var(--hair-hi);
  }
  .pw-close:active { transform: scale(0.92); }
  .pw-close.is-hidden { display: none; }

  /* ── FILTERS ROW + plan selector ─────────────────────────────── */
  .pw-filters {
    display: flex; align-items: center;
    gap: calc(var(--base-font) * 1.4);
    padding: calc(var(--base-font) * 0.85) var(--pad-x);
    border-bottom: 1px solid var(--hair-lo);
    flex-wrap: wrap;
  }
  .pw-filter-group {
    display: inline-flex; align-items: center; gap: 7px;
  }
  .pw-flabel {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.68);
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--taupe-400);
    margin-right: 3px;
  }
  .pw-fpill {
    display: inline-flex; align-items: center; justify-content: center;
    height: calc(var(--base-font) * 2);
    min-width: calc(var(--base-font) * 3.6);
    padding: 0 calc(var(--base-font) * 0.85);
    border-radius: 999px;
    background: transparent;
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: calc(var(--base-font) * 0.78);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease, transform 160ms ease;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .pw-fpill.is-active {
    background: linear-gradient(180deg, var(--gold-300), var(--gold-500));
    border-color: var(--gold-500);
    color: var(--paper);
    box-shadow: 0 4px 10px -4px rgba(148, 111, 56, 0.55);
  }
  .pw-fpill:hover:not(.is-active) {
    border-color: var(--hair-hi);
    color: var(--onyx-700);
  }
  .pw-fpill:active { transform: scale(0.96); }
  .pw-fpill.is-disabled { opacity: 0.32; pointer-events: none; }

  /* Plan selector — sits with filters on the right */
  .pw-plan-select {
    margin-left: auto;
    position: relative;
    display: inline-flex; align-items: center;
  }
  .pw-plan-select select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--paper-2);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.74);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    height: calc(var(--base-font) * 2);
    padding: 0 calc(var(--base-font) * 2) 0 calc(var(--base-font) * 0.9);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease, color 200ms ease;
  }
  .pw-plan-select select:hover {
    border-color: var(--hair-hi);
    color: var(--onyx-700);
  }
  .pw-plan-select::after {
    content: '';
    position: absolute;
    right: calc(var(--base-font) * 0.85);
    top: 50%;
    width: 6px; height: 6px;
    border-right: 1.2px solid var(--gold-500);
    border-bottom: 1.2px solid var(--gold-500);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  /* ── CANVAS (floor-plan area) ────────────────────────────────── */
  .pw-canvas-wrap {
    position: relative;
    margin: var(--canvas-pad) var(--canvas-pad) calc(var(--canvas-pad) * 0.7);
    background: var(--paper-2);
    border: 1px solid var(--hair-lo);
    border-radius: var(--canvas-radius);
    overflow: hidden;
    min-height: 0;
  }
  .pw-canvas-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(47, 90, 120, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47, 90, 120, 0.05) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
  }
  .pw-zoom-stage {
    position: absolute; inset: 0;
    transform-origin: center center;
    transform: translate(0, 0) scale(1);
    transition: transform 200ms ease;
    will-change: transform;
    cursor: grab;
    touch-action: none;
  }
  .pw-zoom-stage.is-zoomed { cursor: grab; }
  .pw-zoom-stage.is-panning { cursor: grabbing; transition: none; }
  .pw-blueprint {
    position: absolute;
    inset: 6% 6% 6% 6%;
    width: 88%;
    height: 88%;
  }

  .pw-compass {
    position: absolute;
    top: calc(var(--base-font) * 1); left: calc(var(--base-font) * 1.1);
    width: calc(var(--base-font) * 3.6);
    height: calc(var(--base-font) * 3.6);
    z-index: 4;
    color: var(--blueprint-wall);
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.04));
  }

  .pw-zoom-stack {
    position: absolute;
    top: calc(var(--base-font) * 1); right: calc(var(--base-font) * 1.1);
    display: flex; flex-direction: column;
    gap: calc(var(--base-font) * 0.45);
    z-index: 4;
  }
  .pw-zoom-btn {
    width: calc(var(--base-font) * 2.6);
    height: calc(var(--base-font) * 2.6);
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.92);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: calc(var(--base-font) * 1.4);
    line-height: 1;
    box-shadow: 0 2px 6px rgba(40, 28, 10, 0.08);
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease, transform 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .pw-zoom-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .pw-zoom-btn:active { transform: scale(0.92); }
  .pw-zoom-btn.pw-zoom-fit {
    font-size: calc(var(--base-font) * 0.66);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--taupe-400);
  }

  .pw-view3d {
    position: absolute;
    bottom: calc(var(--base-font) * 1); right: calc(var(--base-font) * 1.1);
    height: calc(var(--base-font) * 2.4);
    padding: 0 calc(var(--base-font) * 1.1);
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.92);

<script>
  // ── Stage scaler — scale-to-fit (contain). Fixes iPad13 side overflow.
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);

    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

  function render() {
    grid.setAttribute('data-count', String(windows.length));
    winCounterEl.textContent = String(windows.length);

    // Rebuild children
    grid.innerHTML = '';
    windows.forEach(state => {
      const el = buildWindow(state);

    closeBtn.addEventListener('click', () => {
      if (windows.length <= 1) return;
      el.classList.add('is-removing');

        const idx = windows.findIndex(w => w.id === state.id);
        if (idx !== -1) windows.splice(idx, 1);
        render();
      }, 200);
    });

    // BHK pills
    el.querySelectorAll('[data-bhk]').forEach(btn => {
      btn.addEventListener('click', () => {
        const bhk = parseInt(btn.dataset.bhk, 10);
        state.bhk = bhk;
        el.querySelectorAll('[data-bhk]').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        updateBhkLabel(el, state);
      });
    });

    // Facing pills
    el.querySelectorAll('[data-facing]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.facing = btn.dataset.facing;
        el.querySelectorAll('[data-facing]').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        updateBhkLabel(el, state);
      });
    });

    // Plan selector
    const dd = el.querySelector('.pw-plan-dd');
    dd.addEventListener('change', () => {
      const newPlan = parseInt(dd.value, 10);
      if (newPlan === state.planId) return;
      state.planId = newPlan;
      const p = PLANS[newPlan];
      state.bhk = p.bhk;
      state.facing = p.facing;
      state.scale = 1; state.tx = 0; state.ty = 0;
      render();
    });

    // Zoom buttons
    el.querySelector('.pw-zoom-in').addEventListener('click', () => {
      setScale(state, el, state.scale + 0.25);
    });
    el.querySelector('.pw-zoom-out').addEventListener('click', () => {
      setScale(state, el, state.scale - 0.25);
    });
    el.querySelector('.pw-zoom-fit').addEventListener('click', () => {
      state.scale = 1; state.tx = 0; state.ty = 0;
      applyTransform(el, state);
    });

    // View 3D — stub toast
    el.querySelector('.pw-view3d').addEventListener('click', () => {
      flashToast('3D walkthrough — coming soon.');
    });

    // Wheel + pinch + pan on the canvas
    const canvasWrap = el.querySelector('.pw-canvas-wrap');
    canvasWrap.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.12 : 0.12;
      setScale(state, el, state.scale + delta);
    }, { passive: false });

    canvasWrap.addEventListener('dblclick', () => {
      state.scale = 1; state.tx = 0; state.ty = 0;
      applyTransform(el, state);
    });

    // Pointer pan + pinch
    const zoomStage = el.querySelector('.pw-zoom-stage');
    const pointers = new Map();
    let panning = false, panSx = 0, panSy = 0, panTx0 = 0, panTy0 = 0;
    let pinchStart = null;

    canvasWrap.addEventListener('pointerdown', e => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      // Mark this window focused on any interaction
      focusedWinId = state.id;
      if (pointers.size === 1 && state.scale > 1.01) {
        panning = true;
        panSx = e.clientX; panSy = e.clientY;
        panTx0 = state.tx; panTy0 = state.ty;
        zoomStage.classList.add('is-panning');
        try { canvasWrap.setPointerCapture(e.pointerId); } catch (_) {}
      }
    });
    canvasWrap.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2) {
        panning = false;
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinchStart == null) {
          pinchStart = { dist, scale: state.scale };
        } else {
          const ratio = dist / pinchStart.dist;
          setScale(state, el, pinchStart.scale * ratio);
        }
        return;
      }

      if (panning && state.scale > 1.01) {
        const dx = e.clientX - panSx;
        const dy = e.clientY - panSy;
        state.tx = panTx0 + dx;
        state.ty = panTy0 + dy;
        zoomStage.style.transition = 'none';
        zoomStage.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
      }
    });
    const onUp = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStart = null;
      if (pointers.size === 0) {
        panning = false;
        zoomStage.classList.remove('is-panning');
        zoomStage.style.transition = '';
        try { canvasWrap.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    };
    canvasWrap.addEventListener('pointerup', onUp);
    canvasWrap.addEventListener('pointercancel', onUp);
    canvasWrap.addEventListener('pointerleave', onUp);

    // Focus tracking on any click within window
    el.addEventListener('mousedown', () => { focusedWinId = state.id; });
  }

  function updateBhkLabel(el, state) {
    const p = PLANS[state.planId];
    const facingFull = FACING_FULL[state.facing] || state.facing;
    el.querySelector('.pw-bhk-name').textContent =
      state.bhk + ' BHK ' + p.tier + ' · ' + facingFull;
  }

  function setScale(state, el, next) {
    state.scale = Math.max(0.7, Math.min(3, next));
    if (state.scale <= 1.01) { state.tx = 0; state.ty = 0; }
    applyTransform(el, state);
  }

  function applyTransform(el, state) {
    const zoomStage = el.querySelector('.pw-zoom-stage');
    const indicator = el.querySelector('.pw-zoom-indicator');
    zoomStage.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
    zoomStage.classList.toggle('is-zoomed', state.scale > 1.01);
    indicator.textContent = Math.round(state.scale * 100) + '%';
  }

  // ──────────────────────────────────────────────────────────────
  // TOP BAR HANDLERS
  // ──────────────────────────────────────────────────────────────
  addBtn.addEventListener('click', () => {
    if (windows.length >= 3) {
      flashToast('Maximum 3 windows.');
      return;
    }
    // Spawn a new window. Default to a different plan than the focused
    // one when possible, so the comparison feels meaningful.
    const focused = windows.find(w => w.id === focusedWinId) || windows[0];
    const usedPlans = windows.map(w => w.planId);
    let newPlanId = focused.planId;
    for (let pid = 1; pid <= 3; pid++) {
      if (!usedPlans.includes(pid)) { newPlanId = pid; break; }
    }
    windows.push(makeWindowState(newPlanId));
    focusedWinId = windows[windows.length - 1].id;
    render();
  });

  // Chevron prev/next — cycle the focused window's plan
  document.getElementById('prevBtn').addEventListener('click', () => {
    const w = windows.find(w => w.id === focusedWinId) || windows[0];
    w.planId = w.planId === 1 ? 3 : w.planId - 1;
    const p = PLANS[w.planId];
    w.bhk = p.bhk; w.facing = p.facing;
    w.scale = 1; w.tx = 0; w.ty = 0;
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    const w = windows.find(w => w.id === focusedWinId) || windows[0];
    w.planId = w.planId === 3 ? 1 : w.planId + 1;
    const p = PLANS[w.planId];
    w.bhk = p.bhk; w.facing = p.facing;
    w.scale = 1; w.tx = 0; w.ty = 0;
    render();
  });

  // ──────────────────────────────────────────────────────────────
  // TOAST
  // ──────────────────────────────────────────────────────────────
  function flashToast(msg) {
    toast.textContent = msg;
    toast.classList.add('is-on');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => toast.classList.remove('is-on'), 1800);
  }

  // ──────────────────────────────────────────────────────────────
  // CREAM-VEIL EXIT NAV
  // ──────────────────────────────────────────────────────────────
  function fadeTo(href) {
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = href; }, 220);
  }
  document.getElementById('brandBack').addEventListener('click', e => {
    e.preventDefault();
    fadeTo('home.html');
  });
  document.getElementById('ecBackBtn').addEventListener('click', e => {
    e.preventDefault();
    fadeTo('home.html');
  });

  // ──────────────────────────────────────────────────────────────
  // INITIAL RENDER
  // ──────────────────────────────────────────────────────────────
  render();
</script>

<script>
  // Service worker registration (PWA + offline cache)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  // iOS double-tap zoom guard
  (function() {
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    // Block pinch-zoom gesture events (iOS Safari)
    ['gesturestart','gesturechange','gestureend'].forEach(function(ev) {
      document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });
    });
    // Cache --vh CSS var for iOS Safari URL-bar collapse handling
    function setVh() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', function() { setTimeout(setVh, 120); });
  })();

  // ── Prefetch next-screen on touchstart for faster transitions ───
  (function() {
    function wirePrefetch() {
      document.querySelectorAll('a[href], button[data-href]').forEach(function(el) {
        var href = el.getAttribute('href') || el.dataset.href;
        if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:')) return;
        el.addEventListener('touchstart', function() {
          if (!document.querySelector('link[rel="prefetch"][href="' + href + '"]')) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
          }
        }, { passive: true, once: true });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wirePrefetch);
    } else {
      wirePrefetch();
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function() {
        if (location.pathname.indexOf('home.html') !== -1) return;
        if (document.querySelector('link[rel="prefetch"][href="home.html"]')) return;
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'home.html';
        document.head.appendChild(link);
      });
    }
  })();
</script>

<script>
  /* ── BFCACHE / BACK-NAVIGATION GUARD ─────────────────────────────────
     Tablets (iOS Safari, Samsung Internet, Chrome-Android) restore the
     previous page from the back-forward cache with its DOM intact — including
     the cream "is-leaving" veil that was set just before navigating away. That
     left the restored screen BLANK on back. Clear the leaving/firing state
     whenever the page is shown (including a bfcache restore) or on popstate. */
  (function () {
    function clearLeave() { document.body.classList.remove('is-leaving', 'is-firing'); }
    window.addEventListener('pageshow', clearLeave);
    window.addEventListener('popstate', clearLeave);
  })();
</script>
