<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0E0C09" />
<title>Embassy Citadel</title>
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

<!--
  INTRO v12 — assumptions + reasoning
  ===================================
  Concept: "The Door". Onyx full-bleed. A bronze vertical slit pierces darkness, opens,
  the stacked-triangle Embassy mark builds tier-by-tier (bottom-up, architectural strata),
  then the wordmark settles. A bronze fingerprint pad at the bottom-center is the only
  interaction: HOLD 1200ms to cross the threshold into home.html.

  Key timings:
    - Slit pierce (point to ~42vh line):        900ms (Expo.out)
    - Slit open (widens + soft glow bloom):     520ms (Cubic.out), begins at t=900
    - Mark draw (3 tiers, bottom-up, 200ms gap, 700ms per tier): t=1500..2400
    - Eyebrow fade in:                          t=2200, 700ms
    - Headline rise (16px → 0, opacity 0→1):    t=2500, 1200ms
    - Sub-headline italic line:                 t=3400, 800ms
    - Fingerprint pad reveal:                   t=3900, 600ms
    - Hold-to-enter duration:                   1200ms (ring fills, scale pulse every 400ms)
    - Veil transition out → home.html:          600ms

  Nav target: home.html (sibling file, not built here)

  Placeholders pending (NOT BLOCKING):
    - No SFX / audio wired (skill rule: add later if user requests)
    - Manifest.json is referenced but built by sibling agent
    - bg.png reference comp NOT loaded (we want monolithic minimalism, not literal copy)

  Anti-slop checks passed:
    - No purple/teal gradients, only bronze accent (slit + pad), bone-on-onyx everywhere else
    - No emoji, no rounded-border-accent cards, no SVG figures beyond the logo
    - No banned vocab present (verified: incredible/amazing/unparalleled/luxury(adj)/iconic/
      prime/breathtaking/spectacular all absent)
    - Real Cormorant + Inter loaded, real logo SVG inlined (the only illustrative SVG)
-->

<style>
  :root {
    --bone:        #F4F2ED;
    --warm-grey:  #DAD5CD;
    --onyx:       #010000;
    --onyx-deep:  #0E0C09;
    --olive:      #9B9378;
    --taupe:      #C2B5A3;
    --bronze:     #E07E27;
    --bronze-lt:  #D9B97A;
    --bronze-md:  #C9A567;
    --bronze-dp:  #946F38;

    --stage-w: 1440px;
    --stage-h: 900px;

    --type-display: 'Cormorant Garamond', 'Cormorant', Georgia, serif;
    --type-body:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--onyx-deep);
    color: var(--bone);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    font-family: var(--type-body);
  }

  /* Stage scaling — Living Tree pattern */
  #stage-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--onyx-deep);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    transform-origin: 0 0;
    background: var(--onyx-deep);
    overflow: hidden;
  }

  /* Onyx deepening vignette for depth */
  .vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 1100px 720px at 50% 50%, rgba(20,16,10,0) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Film grain — base64 noise SVG, very subtle */
  .grain {
    position: absolute;
    inset: -10%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85   0 0 0 0 0.8   0 0 0 0 0.7   0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>");
    background-size: 220px 220px;
    opacity: 0.035;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 60;
  }

  /* Dust particles */
  .dust {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  .mote {
    position: absolute;
    bottom: -20px;
    border-radius: 50%;
    background: var(--bronze-lt);
    will-change: transform, opacity;
    filter: blur(0.8px);
  }

  /* Top corner: live time */
  .corner-time {
    position: absolute;
    top: 36px;
    right: 48px;
    font-family: var(--type-body);
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(244, 242, 237, 0.5);
    font-variant-numeric: tabular-nums;
    z-index: 20;
    opacity: 0;
    animation: cornerFade 1200ms ease-out 2400ms forwards;
  }
  .corner-mark {
    position: absolute;
    top: 36px;
    left: 48px;
    font-family: var(--type-body);
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(244, 242, 237, 0.45);
    z-index: 20;
    opacity: 0;
    animation: cornerFade 1200ms ease-out 2400ms forwards;
  }
  @keyframes cornerFade { to { opacity: 1; } }

  /* Center composition */
  .composition {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  /* The slit — vertical light shaft.
     Lives in its own layer behind the mark.
     Driven by .slit-pierce and .slit-open animations. */
  .slit-layer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1440px;
    height: 900px;
    z-index: 4;
    pointer-events: none;
  }
  .slit {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 0;
    background: linear-gradient(180deg,
      rgba(217, 185, 122, 0) 0%,
      rgba(217, 185, 122, 0.95) 18%,
      rgba(248, 226, 178, 1) 50%,
      rgba(217, 185, 122, 0.95) 82%,
      rgba(217, 185, 122, 0) 100%);
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 18px rgba(217, 185, 122, 0.55),
      0 0 48px rgba(217, 185, 122, 0.25);
    animation:
      slitPierce 900ms cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
  }
  @keyframes slitPierce {
    0%   { height: 0;    width: 2px; opacity: 0; }
    8%   { opacity: 1; }
    100% { height: 378px; width: 2px; opacity: 1; }
  }
  .slit-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 378px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse 70% 95% at 50% 50%,
      rgba(217, 185, 122, 0.35) 0%,
      rgba(217, 185, 122, 0.12) 40%,
      rgba(217, 185, 122, 0) 75%);
    border-radius: 50%;
    opacity: 0;
    animation: slitOpen 720ms cubic-bezier(0.22, 1, 0.36, 1) 1100ms forwards;
    filter: blur(8px);
  }
  @keyframes slitOpen {
    0%   { width: 0;   opacity: 0; }
    40%  { opacity: 0.85; }
    100% { width: 168px; opacity: 0.55; }
  }

  /* Mark — emerges from the slit, draws tier-by-tier bottom-up */
  .mark-wrap {
    position: relative;
    z-index: 6;
    width: 96px;
    height: 96px;
    margin-bottom: 28px;
    opacity: 0;
    animation: markFade 700ms ease-out 1400ms forwards;
  }
  @keyframes markFade { to { opacity: 1; } }

  .mark-wrap svg {
    width: 100%;
    height: 100%;
    color: var(--bone);
    overflow: visible;
  }
  .mark-wrap svg polygon {
    fill: none;
    stroke: var(--bone);
    stroke-width: 1.1;
    stroke-linejoin: miter;
    stroke-linecap: square;
  }
  .mark-wrap svg polygon.tier-1 { /* smallest, top — drawn last */
    stroke-dasharray: 38;
    stroke-dashoffset: 38;
    animation:
      strokeDraw 700ms cubic-bezier(0.22, 1, 0.36, 1) 1900ms forwards,
      tierFill 600ms ease-out 2600ms forwards;
  }
  .mark-wrap svg polygon.tier-2 { /* middle */
    stroke-dasharray: 58;
    stroke-dashoffset: 58;
    animation:
      strokeDraw 700ms cubic-bezier(0.22, 1, 0.36, 1) 1700ms forwards,
      tierFill 600ms ease-out 2400ms forwards;
  }
  .mark-wrap svg polygon.tier-3 { /* base, largest — drawn first */
    stroke-dasharray: 84;
    stroke-dashoffset: 84;
    animation:
      strokeDraw 700ms cubic-bezier(0.22, 1, 0.36, 1) 1500ms forwards,
      tierFill 600ms ease-out 2200ms forwards;
  }
  @keyframes strokeDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes tierFill {
    to { fill: rgba(244, 242, 237, 0.92); stroke: rgba(244, 242, 237, 0.92); }
  }

  /* Typographic block */
  .eyebrow {
    font-family: var(--type-body);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(217, 185, 122, 0.7);
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) 2200ms forwards;
  }
  .headline {
    font-family: var(--type-display);
    font-weight: 400;
    font-style: normal;
    font-size: 74px;
    line-height: 1.05;
    letter-spacing: 0.18em;
    color: var(--bone);
    text-transform: uppercase;
    margin: 0 0 22px 0;
    text-align: center;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 1200ms cubic-bezier(0.22, 1, 0.36, 1) 2500ms forwards;
    /* Indent the trailing letter to balance the wide tracking */
    text-indent: 0.18em;
  }
  .sub {
    font-family: var(--type-display);
    font-weight: 400;
    font-style: italic;
    font-size: 19px;
    line-height: 1.4;
    letter-spacing: 0.04em;
    color: rgba(244, 242, 237, 0.62);
    text-align: center;
    margin: 0;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) 3400ms forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Fingerprint hold pad */
  .pad-wrap {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 8;
    opacity: 0;
    animation: rise 800ms cubic-bezier(0.22, 1, 0.36, 1) 3900ms forwards;
  }
  .pad {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
    touch-action: none;
  }
  .pad-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(217, 185, 122, 0.0) 0%,
        rgba(217, 185, 122, 0.0) 60%,
        rgba(217, 185, 122, 0.18) 100%),
      conic-gradient(from 220deg,
        rgba(217, 185, 122, 0.85) 0deg,
        rgba(148, 111, 56, 0.85) 140deg,
        rgba(217, 185, 122, 0.85) 360deg);
    -webkit-mask: radial-gradient(circle, transparent 56%, #000 58%, #000 100%);
            mask: radial-gradient(circle, transparent 56%, #000 58%, #000 100%);
    opacity: 0.85;
    transition: opacity 220ms ease;
  }
  .pad-core {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 35%,
        rgba(217, 185, 122, 0.22) 0%,
        rgba(148, 111, 56, 0.08) 50%,
        rgba(14, 12, 9, 0.0) 100%);
    border: 0.5px solid rgba(217, 185, 122, 0.35);
    transition: background 220ms ease, border-color 220ms ease;
  }
  /* Inner fingerprint glyph — concentric arcs, minimal */
  .pad-glyph {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .pad-glyph svg {
    width: 100%;
    height: 100%;
  }
  .pad-glyph path {
    fill: none;
    stroke: rgba(217, 185, 122, 0.55);
    stroke-width: 0.7;
    stroke-linecap: round;
    transition: stroke 220ms ease;
  }
  .pad:hover .pad-core {
    background:
      radial-gradient(circle at 50% 35%,
        rgba(217, 185, 122, 0.32) 0%,
        rgba(148, 111, 56, 0.14) 55%,
        rgba(14, 12, 9, 0.0) 100%);
    border-color: rgba(217, 185, 122, 0.55);
  }
  .pad:hover .pad-glyph path { stroke: rgba(248, 226, 178, 0.75); }

  .pad.pressing { transform: scale(1.04); }
  .pad.pressing .pad-ring { opacity: 1; }
  .pad.pulse .pad-core {
    box-shadow: 0 0 24px rgba(217, 185, 122, 0.4);
  }

  /* Progress ring SVG — sits above the pad */
  .pad-progress {
    position: absolute;
    inset: -6px;
    pointer-events: none;
  }
  .pad-progress svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .pad-progress circle {
    fill: none;
    stroke: var(--bronze-lt);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 232; /* circumference of r=37 ≈ 232.5 */
    stroke-dashoffset: 232;
    transition: stroke-dashoffset 60ms linear;
    filter: drop-shadow(0 0 4px rgba(217, 185, 122, 0.55));
  }

  .pad-label {
    margin-top: 18px;
    font-family: var(--type-body);
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(244, 242, 237, 0.6);
    transition: color 240ms ease;
  }
  .pad-wrap.holding .pad-label {
    color: rgba(248, 226, 178, 0.95);
  }

  /* Bronze veil for transition out */
  .veil {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(248, 226, 178, 1) 0%,
      rgba(217, 185, 122, 0.95) 35%,
      rgba(201, 165, 103, 0.75) 60%,
      rgba(148, 111, 56, 0.0) 100%);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;
    z-index: 90;
    will-change: transform, opacity;
  }
  .veil.active {
    animation: veilOut 620ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }
  @keyframes veilOut {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(60); opacity: 1; }
  }

  /* Final fade-to-bone scrim that lingers before nav so the eye is rinsed */
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--bone);
    opacity: 0;
    pointer-events: none;
    z-index: 91;
    transition: opacity 240ms ease-in;
  }
  .scrim.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<div id="stage-wrap">
  <div id="stage">

    <div class="vignette"></div>
    <div class="dust" id="dust"></div>

    <div class="corner-mark">Embassy Citadel</div>
    <div class="corner-time" id="time">Mumbai · 00:00 IST</div>

    <div class="slit-layer">
      <div class="slit-glow"></div>
      <div class="slit"></div>
    </div>

    <div class="composition">
      <div class="mark-wrap" aria-hidden="true">
        <!-- Embassy stacked-triangle mark — inlined from /brand/logo.svg -->
        <svg viewBox="0 0 60 60" role="img" aria-label="Embassy">
          <polygon class="tier-1" points="30,3 22,16 38,16" />
          <polygon class="tier-2" points="30,19 18,33 42,33" />
          <polygon class="tier-3" points="30,36 12,57 48,57" />
        </svg>
      </div>

      <div class="eyebrow">Embassy Citadel &middot; Worli &middot; Mumbai</div>
      <h1 class="headline">A World Unto Itself</h1>
      <p class="sub">The world changes at the door.</p>
    </div>

    <div class="pad-wrap" id="padWrap">
      <div class="pad" id="pad" role="button" aria-label="Hold to enter">
        <div class="pad-ring"></div>
        <div class="pad-core"></div>
        <div class="pad-glyph" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path d="M20 36 Q32 24 44 36" />
            <path d="M22 41 Q32 31 42 41" />
            <path d="M25 46 Q32 39 39 46" />
            <path d="M29 50 Q32 47 35 50" />
          </svg>
        </div>
        <div class="pad-progress">
          <svg viewBox="0 0 80 80">
            <circle id="progressCircle" cx="40" cy="40" r="37" />
          </svg>
        </div>
      </div>
      <div class="pad-label">Hold to Enter</div>
    </div>

    <div class="veil" id="veil"></div>
    <div class="scrim" id="scrim"></div>

    <div class="grain"></div>

  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Stage scaling (Living Tree pattern) ---------- */
  const STAGE_W = 1440;
  const STAGE_H = 900;
  const stage = document.getElementById('stage');
  const wrap  = document.getElementById('stage-wrap');

  function fitStage() {
    const vv = window.visualViewport;
    const vw = vv ? vv.width  : window.innerWidth;
    const vh = vv ? vv.height : window.innerHeight;
    const scale = Math.min(vw / STAGE_W, vh / STAGE_H);
    const dx = (vw - STAGE_W * scale) / 2;
    const dy = (vh - STAGE_H * scale) / 2;
    stage.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
  }
  fitStage();
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitStage);
    window.visualViewport.addEventListener('scroll', fitStage);
  }

  /* ---------- Block iOS pinch + double-tap zoom ---------- */
  document.addEventListener('gesturestart',  function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend',    function (e) { e.preventDefault(); }, { passive: false });
  let lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouch <= 320) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  /* ---------- Live time (Mumbai / IST) ---------- */
  const timeEl = document.getElementById('time');
  function tickTime() {
    const now = new Date();
    // IST = UTC+5:30
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const ist = new Date(utc + 5.5 * 3600 * 1000);
    const h = String(ist.getHours()).padStart(2, '0');
    const m = String(ist.getMinutes()).padStart(2, '0');
    timeEl.textContent = 'Mumbai · ' + h + ':' + m + ' IST';
  }
  tickTime();
  setInterval(tickTime, 1000);

  /* ---------- Dust motes drifting upward ---------- */
  const dust = document.getElementById('dust');
  const MOTE_COUNT = 18;
  for (let i = 0; i < MOTE_COUNT; i++) {
    const m = document.createElement('div');
    m.className = 'mote';
    const size = 1.2 + Math.random() * 2.6;        // 1.2 – 3.8 px
    const xStart = Math.random() * STAGE_W;
    const dur = 18 + Math.random() * 14;            // 18 – 32s
    const delay = -Math.random() * dur;
    const drift = (Math.random() - 0.5) * 140;      // horizontal drift
    const op = 0.04 + Math.random() * 0.11;         // 0.04 – 0.15
    const blur = (0.6 + Math.random() * 0.8).toFixed(2);
    m.style.left = xStart + 'px';
    m.style.width = size + 'px';
    m.style.height = size + 'px';
    m.style.opacity = op;
    m.style.filter = 'blur(' + blur + 'px)';
    m.style.animation = 'rise-mote-' + i + ' ' + dur + 's linear ' + delay + 's infinite';

    // Inject per-mote keyframes (so each has a unique horizontal drift)
    const style = document.createElement('style');
    style.textContent =
      '@keyframes rise-mote-' + i + ' {' +
        '0%   { transform: translate(0, 0); opacity: 0; }' +
        '10%  { opacity: ' + op + '; }' +
        '90%  { opacity: ' + op + '; }' +
        '100% { transform: translate(' + drift + 'px, -' + (STAGE_H + 60) + 'px); opacity: 0; }' +
      '}';
    document.head.appendChild(style);
    dust.appendChild(m);
  }

  /* ---------- Fingerprint hold pad ---------- */
  const HOLD_MS = 1200;
  const pad      = document.getElementById('pad');
  const padWrap  = document.getElementById('padWrap');
  const progress = document.getElementById('progressCircle');
  const veil     = document.getElementById('veil');
  const scrim    = document.getElementById('scrim');
  const CIRC     = 232; // ~ 2 * pi * 37

  let pressing      = false;
  let pressStart    = 0;
  let rafId         = null;
  let pulseInterval = null;
  let committed     = false;

  function setProgress(pct) {
    progress.style.strokeDashoffset = (CIRC * (1 - pct)).toFixed(2);
  }
  setProgress(0);

  function startPress(e) {
    if (committed) return;
    if (e.cancelable) e.preventDefault();
    if (pressing) return;
    pressing = true;
    pressStart = performance.now();
    pad.classList.add('pressing');
    padWrap.classList.add('holding');
    // Heartbeat pulse every 400ms while holding
    pulseInterval = setInterval(function () {
      pad.classList.add('pulse');
      setTimeout(function () { pad.classList.remove('pulse'); }, 220);
    }, 400);
    loop();
  }

  function loop() {
    if (!pressing) return;
    const t = performance.now() - pressStart;
    const pct = Math.min(1, t / HOLD_MS);
    setProgress(pct);
    if (pct >= 1) {
      commitEnter();
      return;
    }
    rafId = requestAnimationFrame(loop);
  }

  function endPress(e) {
    if (!pressing) return;
    pressing = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (pulseInterval) { clearInterval(pulseInterval); pulseInterval = null; }
    pad.classList.remove('pressing', 'pulse');
    padWrap.classList.remove('holding');
    if (!committed) {
      // Smooth snap-back
      progress.style.transition = 'stroke-dashoffset 220ms cubic-bezier(0.22, 1, 0.36, 1)';
      setProgress(0);
      setTimeout(function () { progress.style.transition = 'stroke-dashoffset 60ms linear'; }, 240);
    }
  }

  function commitEnter() {
    if (committed) return;
    committed = true;
    pressing = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (pulseInterval) { clearInterval(pulseInterval); pulseInterval = null; }
    pad.classList.remove('pressing', 'pulse');

    // Trigger veil from pad center
    veil.classList.add('active');
    setTimeout(function () { scrim.classList.add('on'); }, 360);
    setTimeout(function () {
      window.location.href = 'home.html';
    }, 640);
  }

  // Pointer events cover mouse + touch + pen
  pad.addEventListener('pointerdown', startPress);
  pad.addEventListener('pointerup', endPress);
  pad.addEventListener('pointerleave', endPress);
  pad.addEventListener('pointercancel', endPress);
  // Block native context menu on long-press
  pad.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Keyboard accessibility — Enter or Space holds the pad
  let keyDown = false;
  document.addEventListener('keydown', function (e) {
    if (committed) return;
    if ((e.key === 'Enter' || e.key === ' ') && !keyDown) {
      keyDown = true;
      startPress({ cancelable: false, preventDefault: function () {} });
    }
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      keyDown = false;
      endPress({});
    }
  });
})();
</script>
