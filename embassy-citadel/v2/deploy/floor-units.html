<html lang="en">

<title>Embassy Citadel — Choose Your Residence</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  FLOOR UNITS v2 — "Choose your residence"
  ──────────────────────────────────────────────────────────────────────
  Reached from inventory-floors.html after a floor is confirmed
  (sessionStorage 'ec.floor'). This screen is two coordinated halves:

  Layout (1440 × 900 stage, paper bg full-bleed)
  · Top bar 76px — shared chrome:
      LEFT   wordmark (brand-back) → home.html (cream veil)
      RIGHT  BACK pill → inventory-floors.html (drill-up, cream veil)

  · HERO (left, ~62%) — the FULL TYPICAL FLOOR PLATE for the chosen
    floor: EC_INV.floorToTypical(lvl).file, drawn object-fit:contain on
    a clean paper card so the ENTIRE plate is visible, never cropped.
    This is the focus of the screen. Floating eyebrow ("Choose your
    residence") + big "Floor N" title sit over the card's top-left;
    a small band tag (the plate's floor band) sits bottom-left.

  · UNIT RAIL (right, ~38%) — one selectable card per residence on
    this floor, from EC_INV.unitsOnFloor(lvl) (codes N01/N02/N03/
    S01/S02/S03). Each card shows: code, wing (North/South from the
    code's N/S), bedrooms, and usable carpet (sq.ft.). Selecting a
    card sets ec.unit + ec.floor in sessionStorage and cream-veils to
    unit-detail.html.

  How units map to the floor
  · The hero plate is the WHOLE floor (both wings). The right-rail
    cards are the individually-purchasable residences sitting on that
    plate. North-wing codes (N01–N03) and South-wing codes (S01–S03)
    are split into two labelled groups in the rail so the spatial
    read (which side of the plate) stays legible. Selecting a card =
    choosing that residence on the displayed floor.

  No prices anywhere. No marker badges. Cormorant for display,
  Inter for body. Bronze used only as the decision accent on the
  selected / hovered card.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="assets/inventory-data.js"></script>
<style>
  :root {
    --paper:      #FCFAF4;
    --bone:       #F4F2ED;
    --bone-50:    #F7F5EF;
    --bone-200:   #E8E2D6;
    --warm-grey:  #DAD5CD;
    --taupe-300:  #C2B5A3;
    --taupe-400:  #A89B86;

    --gold-100:   #E8CFA1;
    --gold-200:   #D9B97A;
    --gold-300:   #C9A567;
    --gold-400:   #B89968;
    --gold-500:   #946F38;
    --gold-600:   #6E5A37;

    --onyx-100:   #3A332A;
    --onyx-300:   #2A2620;
    --onyx-500:   #1F1B15;
    --onyx-700:   #1A1814;
    --onyx-900:   #0E0C09;

    --hair-lo:    rgba(148, 111, 56, 0.16);
    --hair:       rgba(148, 111, 56, 0.32);
    --hair-hi:    rgba(148, 111, 56, 0.58);

    --card-shadow: 0 14px 32px -10px rgba(80, 58, 28, 0.22),
                   0 4px 12px  -4px  rgba(40, 28, 10, 0.10);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--paper);
    color: var(--onyx-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
    position: fixed; inset: 0;
  }
  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  /* ── Stage ─────────────────────────────────────────────────────── */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    isolation: isolate;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: url('assets/bg-paper.png') center/cover no-repeat, var(--paper);
  }
  #stage, .stage-inner {
    position: relative;
    z-index: 1;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: var(--bone);
  }

  /* Paper bg — full bleed, slight overshoot to hide rounding seams */
  .stage-bg {
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    z-index: 0; pointer-events: none;
    background-color: var(--bone);
    background-image: url('assets/bg-paper.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .stage-grain {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
    opacity: 0.025;
    background-image:
      radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 1px;
  }

  /* ── TOP BAR (seamless — paper bg shows through) ────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    background: linear-gradient(180deg, rgba(252,250,244,0.55), rgba(252,250,244,0) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  /* Unified right-side BACK button */
  .ec-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 92px; min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 220ms ease, color 220ms ease,
                border-color 220ms ease, transform 200ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    -webkit-appearance: none; appearance: none;
    margin-left: 8px;
  }
  .ec-back-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .ec-back-btn:active { transform: scale(0.96); }
  .ec-back-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-500); }
  .ec-back-btn .arr { font-size: 13px; line-height: 1; transform: translateY(-0.5px); letter-spacing: 0; }

  /* ── TAP RESPONSIVENESS — interactive surfaces inside the app ── */
  button, [role="button"], a[href], .unit-card {
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .brand-back {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: opacity 240ms ease, transform 240ms ease;
    position: relative;
  }
  .brand-back:hover { opacity: 0.78; transform: translateX(-1px); }
  .brand-back:focus-visible { outline: none; opacity: 0.78; }
  .brand-back::after {
    content: '← Home';
    position: absolute; left: 100%; top: 50%;
    transform: translate(10px, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 8.5px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
    opacity: 0; white-space: nowrap;
    transition: opacity 260ms ease, transform 260ms ease;
    pointer-events: none;
  }
  .brand-back:hover::after, .brand-back:focus-visible::after {
    opacity: 0.85; transform: translate(14px, -50%);
  }
  .brand-wordmark {
    width: 130px; height: 36px;
    color: var(--onyx-700);
  }
  .brand-wordmark svg { width: 100%; height: 100%; display: block; }

  /* ── BODY GRID — hero (left) + unit rail (right) ───────────────── */
  .floor-stage {
    position: absolute;
    left: 0; right: 0; top: 76px; bottom: 0;
    display: grid;
    grid-template-columns: 1fr 432px;
    z-index: 3;
  }

  /* ── HERO — full floor plate ───────────────────────────────────── */
  .hero {
    position: relative;
    padding: 30px 24px 30px 44px;
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
  }
  .hero-head {
    position: relative; z-index: 4;
    flex: 0 0 auto;
    margin-bottom: 14px;
  }
  .hero-eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-500);
    margin-bottom: 9px;
  }
  .hero-eyebrow::before {
    content: ''; width: 22px; height: 1px;
    background: var(--gold-500); opacity: 0.6;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400; font-size: 52px; line-height: 0.98;
    letter-spacing: -0.01em;
    color: var(--onyx-700);
    margin: 0;
  }
  .hero-title .lvl {
    font-style: italic; font-weight: 500;
    color: var(--gold-500);
  }
  .hero-sub {
    margin-top: 7px;
    font-family: 'Inter', sans-serif;
    font-weight: 400; font-size: 11.5px;
    letter-spacing: 0.03em;
    color: var(--taupe-400);
  }

  /* The plate card holds the full floor image, contained */
  .plate-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    border-radius: 6px;
    background:
      linear-gradient(180deg, #FFFDF8 0%, #FBF8F1 100%);
    border: 1px solid var(--hair-lo);
    box-shadow: var(--card-shadow);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* faint inner frame line for a drawn-on-paper feel */
  .plate-card::after {
    content: '';
    position: absolute; inset: 12px;
    border: 1px solid var(--hair-lo);
    border-radius: 3px;
    pointer-events: none;
  }
  .plate-img {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    padding: 26px;
    mix-blend-mode: multiply;
    filter: contrast(1.04);
  }
  /* North arrow tucked in the plate's top-right */
  .plate-compass {
    position: absolute;
    top: 18px; right: 18px;
    z-index: 3;
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.82);
    border: 1px solid var(--hair);
    display: grid; place-items: center;
    color: var(--gold-500);
    box-shadow: 0 4px 10px rgba(80, 58, 28, 0.10);
  }
  .plate-compass .n {
    position: absolute; top: 4px; left: 50%;
    transform: translateX(-50%);
    font-size: 8px; letter-spacing: 0.28em;
    font-family: 'Inter', sans-serif; font-weight: 600;
    text-transform: uppercase;
  }
  .plate-compass .needle {
    width: 2px; height: 16px;
    background: linear-gradient(180deg, var(--gold-500) 0%, var(--gold-500) 50%, var(--hair) 50%, var(--hair) 100%);
    border-radius: 1px;
  }
  /* Floor band tag bottom-left of the plate */
  .plate-band {
    position: absolute;
    bottom: 16px; left: 16px;
    z-index: 3;
    padding: 7px 13px;
    background: rgba(252, 250, 244, 0.88);
    border: 1px solid var(--hair-lo);
    border-radius: 999px;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 4px 10px rgba(80, 58, 28, 0.08);
  }
  .plate-band .lbl {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 8px;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--taupe-400);
  }
  .plate-band .val {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500; font-size: 14px;
    color: var(--gold-500); line-height: 1;
  }

  /* ── UNIT RAIL — selectable residence cards ────────────────────── */
  .rail {
    position: relative;
    background:
      linear-gradient(180deg, rgba(244,242,237,0.42), rgba(244,242,237,0.16));
    border-left: 1px solid var(--hair-lo);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .rail-head {
    flex: 0 0 auto;
    padding: 30px 38px 16px 38px;
  }
  .rail-eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 9px;
    letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--gold-500);
    margin-bottom: 8px;
  }
  .rail-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400; font-size: 26px; line-height: 1.05;
    color: var(--onyx-700);
    margin: 0;
  }
  .rail-hint {
    margin-top: 7px;
    font-family: 'Inter', sans-serif;
    font-weight: 400; font-size: 10.5px;
    letter-spacing: 0.02em;
    color: var(--taupe-400);
  }
  .rail-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 32px 30px 32px;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    scrollbar-width: thin;
    scrollbar-color: var(--hair) transparent;
  }
  .rail-scroll::-webkit-scrollbar { width: 5px; }
  .rail-scroll::-webkit-scrollbar-thumb { background: var(--hair-lo); border-radius: 99px; }

  .wing-group + .wing-group { margin-top: 18px; }
  .wing-label {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 8.5px;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--taupe-400);
    margin: 4px 6px 11px 6px;
  }
  .wing-label::after {
    content: ''; flex: 1; height: 1px;
    background: var(--hair-lo);
  }

  .unit-card {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0 16px;
    width: 100%;
    padding: 15px 16px 15px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--hair-lo);
    border-radius: 8px;
    background: rgba(255, 253, 248, 0.62);
    cursor: pointer;
    text-align: left;
    font-family: inherit; color: inherit;
    -webkit-appearance: none; appearance: none;
    transition: border-color 200ms ease, background 200ms ease,
                transform 180ms ease, box-shadow 220ms ease;
  }
  .unit-card::before {
    /* left accent rail — bronze, reveals on hover/active only */
    content: '';
    position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 2px; border-radius: 99px;
    background: var(--gold-400);
    transform: scaleY(0); transform-origin: center;
    transition: transform 220ms cubic-bezier(.2,.7,.2,1);
  }
  @media (hover: hover) {
    .unit-card:hover {
      border-color: var(--hair);
      background: rgba(255, 253, 248, 0.95);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px -12px rgba(80, 58, 28, 0.30);
    }
    .unit-card:hover::before { transform: scaleY(1); }
  }
  .unit-card:active { transform: translateY(0) scale(0.992); }
  .unit-card.is-selected {
    border-color: var(--gold-400);
    background:
      linear-gradient(180deg, rgba(232,207,161,0.20), rgba(232,207,161,0.08));
    box-shadow: 0 12px 26px -14px rgba(148, 111, 56, 0.38);
  }
  .unit-card.is-selected::before { transform: scaleY(1); background: var(--gold-500); }
  .unit-card:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-500); }

  .uc-code {
    grid-row: 1 / span 2;
    width: 50px; height: 50px;
    border-radius: 7px;
    display: grid; place-items: center;
    background: var(--bone-50);
    border: 1px solid var(--hair-lo);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500; font-size: 19px; letter-spacing: 0.02em;
    color: var(--onyx-700);
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease;
  }
  .unit-card.is-selected .uc-code {
    background: var(--gold-500); color: var(--paper); border-color: var(--gold-500);
  }
  .uc-main { min-width: 0; }
  .uc-wing {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 12px;
    color: var(--onyx-700);
    margin-bottom: 3px;
  }
  .uc-beds {
    font-family: 'Inter', sans-serif;
    font-weight: 400; font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--taupe-400);
  }
  .uc-carpet {
    grid-row: 1 / span 2;
    text-align: right;
    white-space: nowrap;
  }
  .uc-carpet .num {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500; font-size: 21px; line-height: 1;
    color: var(--gold-500);
  }
  .uc-carpet .unit-lbl {
    display: block; margin-top: 4px;
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 7.5px;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--taupe-400);
  }

  .rail-empty {
    padding: 40px 8px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 16px;
    color: var(--taupe-400);
  }

  /* ── Cream-veil ─────────────────────────────────────────────────── */
  .veil {
    position: absolute; inset: 0;
    background: var(--bone);
    opacity: 0;
    pointer-events: none;
    z-index: 99;
    transition: opacity 220ms ease-in-out;
  }
  body.is-leaving .veil { opacity: 1; }

  /* Entrance — quiet stagger (transform/opacity only) */
  @keyframes ec-rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim { opacity: 0; animation: ec-rise 520ms cubic-bezier(.2,.7,.2,1) forwards; }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none; opacity: 1; }
    .unit-card, .unit-card:hover { transform: none !important; }
  }

  /* Tab S7 / 65" handled by the stage scaler (contain). The 1440×900
     stage is the single source of truth; the scaler fits it to any
     4:3 / 16:10 / 16:9 viewport without reflow. */
</style>

<script>
  // ── Stage scaler — scale-to-fit (contain). Fixes iPad13 side overflow.
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);

    // iOS hardening
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

<body>

<!-- Embassy Citadel wordmark — same SVG symbol as home -->

<div id="stage-wrap">
  <div id="stage" class="stage-inner">

    <div class="stage-bg" aria-hidden="true"></div>
    <div class="stage-grain" aria-hidden="true"></div>

    <!-- ── TOP BAR ───────────────────────────────────────────── -->
    <header class="topbar">
      <a class="brand-back" href="home.html" id="brandBack" aria-label="Embassy Citadel — home">
        <div class="brand-wordmark">
          <svg viewBox="0 0 1000 500" aria-label="Embassy Citadel"><use href="#ec-wordmark" /></svg>
        </div>
      </a>
      <div class="top-chips">
        <button class="ec-back-btn" id="ecBackBtn" type="button" aria-label="Back to floor selection">
          <span class="arr" aria-hidden="true">←</span>
          <span>Back</span>
        </button>
      </div>
    </header>

    <!-- ── BODY: hero plate + unit rail ──────────────────────── -->
    <main class="floor-stage" aria-label="Choose your residence">

      <!-- HERO — full typical floor plate -->
      <section class="hero anim" style="animation-delay:40ms;" aria-label="Floor plan">
        <div class="hero-head">
          <div class="hero-eyebrow">Choose your residence</div>
          <h1 class="hero-title">Floor <span class="lvl" id="heroLvl">45</span></h1>
          <div class="hero-sub" id="heroSub">The full floor — both wings, drawn to plan.</div>
        </div>

        <div class="plate-card">
          <img class="plate-img" id="plateImg" alt="" decoding="async">
          <div class="plate-compass" aria-hidden="true">
            <span class="n">N</span>
            <span class="needle"></span>
          </div>
          <div class="plate-band">
            <span class="lbl">Plate</span>
            <span class="val" id="plateBand">—</span>
          </div>
        </div>
      </section>

      <!-- UNIT RAIL — selectable residences -->
      <aside class="rail anim" style="animation-delay:120ms;" aria-label="Residences on this floor">
        <div class="rail-head">
          <div class="rail-eyebrow">The residences</div>
          <h2 class="rail-title" id="railTitle">Select a home</h2>
          <div class="rail-hint" id="railHint">Each home, drawn for this floor.</div>
        </div>
        <div class="rail-scroll" id="railScroll">
          <!-- unit cards injected here -->
        </div>
      </aside>

    </main>

    <div class="veil" id="veil" aria-hidden="true"></div>

  </div>
</div>

<script>
  // ── 1 · Read the selected floor (sessionStorage; default 45) ─────
  var lvl = parseInt(sessionStorage.getItem('ec.floor') || '45', 10);
  if (!(lvl >= 1 && lvl <= 79)) lvl = 45;

  var INV = window.EC_INV || null;

  // ── 2 · HERO — full typical floor plate ──────────────────────────
  function nearestTypical(level) {
    // floorToTypical can return null for some levels (e.g. 19/34/48 are
    // refuge-only, or 41/55/70). Fall back to the band whose floor list
    // is numerically closest so the hero always shows a full plate.
    if (!INV) return null;
    var direct = INV.floorToTypical(level);
    if (direct) return direct;
    var best = null, bestDist = Infinity;
    (INV.TYPICAL || []).forEach(function (p) {
      (p.floors || []).forEach(function (f) {
        var d = Math.abs(f - level);
        if (d < bestDist) { bestDist = d; best = p; }
      });
    });
    return best;
  }

  (function paintHero() {
    document.getElementById('heroLvl').textContent = String(lvl);
    var plate = nearestTypical(lvl);
    var img = document.getElementById('plateImg');
    var band = document.getElementById('plateBand');
    if (plate && plate.file) {
      img.src = plate.file;
      img.alt = 'Embassy Citadel — full floor plate for floor ' + lvl;
      // Band label: "Floors 43–47" style, derived from the band string.
      var bandTxt = (plate.band || '').replace(/-/g, '–').replace(/\+/g, ' · ');
      band.textContent = bandTxt ? ('Floors ' + bandTxt) : ('Floor ' + lvl);
      // If the matched plate isn't this exact floor's typical, note kind.
      if (plate.kind === 'refuge') band.textContent = 'Refuge · ' + (bandTxt || lvl);
    } else {
      img.style.display = 'none';
      band.textContent = 'Floor ' + lvl;
    }
  })();

  // ── 3 · UNIT RAIL — selectable residences on this floor ──────────
  function wingName(code) { return code.charAt(0) === 'N' ? 'North' : 'South'; }
  function bedsLabel(n) { return n + ' Bedroom' + (n === 1 ? '' : 's'); }

  function buildRail() {
    var scroll = document.getElementById('railScroll');
    var units = INV ? INV.unitsOnFloor(lvl) : [];

    if (!units.length) {
      scroll.innerHTML = '<div class="rail-empty">No residences listed for this floor.</div>';
      document.getElementById('railTitle').textContent = 'Select a home';
      return;
    }

    document.getElementById('railTitle').textContent =
      units.length + (units.length === 1 ? ' residence' : ' residences');

    // Split into North / South groups, preserving N01..N03, S01..S03 order.
    var north = units.filter(function (u) { return u.code.charAt(0) === 'N'; });
    var south = units.filter(function (u) { return u.code.charAt(0) === 'S'; });

    var html = '';
    function groupHtml(arr, label) {
      if (!arr.length) return '';
      var rows = arr.map(unitCardHtml).join('');
      return '<div class="wing-group">'
        + '<div class="wing-label">' + label + '</div>'
        + rows + '</div>';
    }
    html += groupHtml(north, 'North Wing');
    html += groupHtml(south, 'South Wing');
    scroll.innerHTML = html;

    // Wire selection on each card.
    Array.prototype.forEach.call(scroll.querySelectorAll('.unit-card'), function (card) {
      var code = card.getAttribute('data-code');
      var select = function (e) {
        if (e) e.preventDefault();
        Array.prototype.forEach.call(scroll.querySelectorAll('.unit-card'), function (c) {
          c.classList.remove('is-selected');
        });
        card.classList.add('is-selected');
        try {
          sessionStorage.setItem('ec.unit', code);
          sessionStorage.setItem('ec.floor', String(lvl));
        } catch (_) {}
        document.body.classList.add('is-leaving');
        setTimeout(function () { window.location.href = 'unit-detail.html'; }, 220);
      };
      card.addEventListener('click', select);
      card.addEventListener('touchend', select, { passive: false });
    });
  }

  function unitCardHtml(u) {
    var carpet = u.carpet || '—';
    return ''
      + '<button type="button" class="unit-card" data-code="' + u.code + '" '
      +   'aria-label="' + u.code + ', ' + wingName(u.code) + ' wing, '
      +   bedsLabel(u.beds) + ', ' + carpet + ' square feet usable carpet">'
      +   '<span class="uc-code">' + u.code + '</span>'
      +   '<span class="uc-main">'
      +     '<span class="uc-wing">' + wingName(u.code) + ' Wing</span>'
      +     '<span class="uc-beds">' + bedsLabel(u.beds) + '</span>'
      +   '</span>'
      +   '<span class="uc-carpet">'
      +     '<span class="num">' + carpet + '</span>'
      +     '<span class="unit-lbl">sq.ft. carpet</span>'
      +   '</span>'
      + '</button>';
  }

  buildRail();

  // ── 4 · Navigation chrome ────────────────────────────────────────
  // Brand wordmark → home (top-level identity)
  document.getElementById('brandBack').addEventListener('click', function (e) {
    e.preventDefault();
    document.body.classList.add('is-leaving');
    setTimeout(function () { window.location.href = 'home.html'; }, 220);
  });
  // Right-side BACK → inventory-floors (drill-up)
  var ecBackBtn = document.getElementById('ecBackBtn');
  if (ecBackBtn) {
    var goBack = function (e) {
      if (e) e.preventDefault();
      document.body.classList.add('is-leaving');
      setTimeout(function () { window.location.href = 'inventory-floors.html'; }, 220);
    };
    ecBackBtn.addEventListener('click', goBack);
    ecBackBtn.addEventListener('touchend', goBack, { passive: false });
  }
</script>

<script>
  // Service worker registration (PWA + offline cache)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      var ecHadCtrl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(function(){});
      var ecReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (ecReloaded || !ecHadCtrl) return;   // skip the first-ever claim
        ecReloaded = true; window.location.reload();   // new version deployed -> refresh
      });
    });
  }
  // iOS double-tap zoom guard
  (function() {
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    // Block pinch-zoom gesture events (iOS Safari)
    ['gesturestart','gesturechange','gestureend'].forEach(function(ev) {
      document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });
    });
    // Cache --vh CSS var for iOS Safari URL-bar collapse handling
    function setVh() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', function() { setTimeout(setVh, 120); });
  })();

  // ── Prefetch next-screen on touchstart for faster transitions ───
  (function() {
    function wirePrefetch() {
      document.querySelectorAll('a[href], button[data-href]').forEach(function(el) {
        var href = el.getAttribute('href') || el.dataset.href;
        if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:')) return;
        el.addEventListener('touchstart', function() {
          if (!document.querySelector('link[rel="prefetch"][href="' + href + '"]')) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
          }
        }, { passive: true, once: true });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wirePrefetch);
    } else {
      wirePrefetch();
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function() {
        if (location.pathname.indexOf('home.html') !== -1) return;
        if (document.querySelector('link[rel="prefetch"][href="home.html"]')) return;
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'home.html';
        document.head.appendChild(link);
      });
    }
  })();
</script>

<script>
  /* ── BFCACHE / BACK-NAVIGATION GUARD ─────────────────────────────────
     Tablets restore the previous page from bfcache with its DOM intact —
     including the cream "is-leaving" veil set just before navigating away.
     Clear the leaving state whenever the page is shown (incl. bfcache). */
  (function () {
    function clearLeave() { document.body.classList.remove('is-leaving', 'is-firing'); }
    window.addEventListener('pageshow', clearLeave);
    window.addEventListener('popstate', clearLeave);
  })();
