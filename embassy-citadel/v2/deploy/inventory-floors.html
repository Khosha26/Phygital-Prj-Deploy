<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Embassy Citadel — Choose a Floor</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  INVENTORY · CHOOSE FLOORS — assumptions + reasoning
  ──────────────────────────────────────────────────────────────────────
  Arrived from inventory.html, which stored the tapped section in
  sessionStorage('ec.section'). This screen reads that section and:

  · LEFT HALF of the 1440×900 stage = the TOWER. The angled render
    (assets/inventory/tower-types.webp, 2752×2064) is shown at a natural
    large size occupying the left half — NOT cropped/zoomed into a small
    box. The chosen section glows in its per-type gradient + soft glow;
    the rest of the tower is dimmed. So the tower reads as the tower,
    just lit on the section you picked.
  · RIGHT HALF = the FLOOR SELECTOR in the prior slider style the client
    liked: a tall vertical colour-coded track with one band per level of
    the chosen section, a draggable pill handle (.fs-handle with a
    Cormorant numeral .fs-handle-label), level labels on the left rail,
    ticks on the right, and a dashed gold leader line drawn from the
    handle across to the tower. Drag / click the track / arrow keys move
    the handle; the band you land on is the chosen level.
  · A "View Floor Plan" CTA under the slider confirms the level:
    sessionStorage('ec.floor') + cream-veil → floor-plan.html.

  Bands are equal-height per level (top = first/highest in the section
  list, bottom = last). For 1-level sections the single band fills the
  track. Labels thin out automatically for long lists (residential ~45).

  Stage scaler, #stage-wrap responsiveness, PWA blocks and back
  navigation are preserved from the prior build.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:      #FCFAF4;
    --bone:       #F4F2ED;
    --bone-50:    #F7F5EF;
    --bone-200:   #E8E2D6;
    --warm-grey:  #DAD5CD;
    --taupe-300:  #C2B5A3;
    --taupe-400:  #A89B86;

    --gold-100:   #E8CFA1;
    --gold-200:   #D9B97A;
    --gold-300:   #C9A567;
    --gold-400:   #B89968;
    --gold-500:   #946F38;
    --gold-600:   #6E5A37;

    --onyx-100:   #3A332A;
    --onyx-300:   #2A2620;
    --onyx-500:   #1F1B15;
    --onyx-700:   #1A1814;
    --onyx-900:   #0E0C09;

    --hair-lo:    rgba(148, 111, 56, 0.16);
    --hair:       rgba(148, 111, 56, 0.32);
    --hair-hi:    rgba(148, 111, 56, 0.58);

    /* The active section accent — set at runtime from the type palette */
    --accent-a:   #E67E22;
    --accent-b:   #F1C40F;

    --plate-shadow:  0 30px 60px -18px rgba(80, 58, 28, 0.30),
                     0 14px 30px -10px rgba(80, 58, 28, 0.18),
                     0 4px 10px        rgba(40, 28, 10, 0.08);
    --card-shadow:   0 14px 32px -10px rgba(80, 58, 28, 0.22),
                     0 4px 12px  -4px  rgba(40, 28, 10, 0.10);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--paper);
    color: var(--onyx-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
    position: fixed; inset: 0;
  }

  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  /* ── IRIS REVEAL ───────────────────────────────────────────────── */
  body.is-arriving {
    clip-path: circle(0% at var(--reveal-x, 50%) var(--reveal-y, 50%));
    -webkit-clip-path: circle(0% at var(--reveal-x, 50%) var(--reveal-y, 50%));
    animation: irisReveal 900ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }
  @keyframes irisReveal {
    to {
      clip-path: circle(150% at var(--reveal-x, 50%) var(--reveal-y, 50%));
      -webkit-clip-path: circle(150% at var(--reveal-x, 50%) var(--reveal-y, 50%));
    }
  }

  /* ── Stage scaler ─────────────────────────────────────────────── */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    isolation: isolate;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: url('assets/bg-paper.png') center/cover no-repeat, var(--paper);
  }
  #stage, .stage-inner {
    position: relative;
    z-index: 1;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: var(--bone);
  }

  /* ── PAPER + GRAIN BG ─────────────────────────────────────────── */
  .stage-bg {
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    z-index: 0; pointer-events: none;
    background-color: var(--bone);
    background-image: url('assets/bg-paper.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .stage-grain {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.025;
    background-image:
      radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 1px;
  }

  /* ── TOP BAR ──────────────────────────────────────────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    background: linear-gradient(180deg, rgba(252,250,244,0.78), rgba(252,250,244,0) 100%);
    /* solid-ish gradient instead of a wide backdrop-blur over the moving
       tower — avoids per-frame blur recompute (flicker) with no visual loss */
  }
  .ec-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 92px; min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 220ms ease, color 220ms ease,
                border-color 220ms ease, transform 200ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    -webkit-appearance: none; appearance: none;
    margin-left: 8px;
  }
  .ec-back-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .ec-back-btn:active { transform: scale(0.96); }
  .ec-back-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-500); }
  .ec-back-btn .arr { font-size: 13px; line-height: 1; transform: translateY(-0.5px); letter-spacing: 0; }

  button, [role="button"], a[href], .floor-row {
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }

  .brand-back {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: opacity 240ms ease, transform 240ms ease;
    position: relative;
  }
  .brand-back:hover { opacity: 0.78; transform: translateX(-1px); }
  .brand-back:focus-visible { outline: none; opacity: 0.78; }
  .brand-back::after {
    content: '← Home';
    position: absolute;
    left: 100%; top: 50%;
    transform: translate(10px, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 8.5px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
    opacity: 0; white-space: nowrap;
    transition: opacity 260ms ease, transform 260ms ease;
    pointer-events: none;
  }
  .brand-back:hover::after, .brand-back:focus-visible::after {
    opacity: 0.85;
    transform: translate(14px, -50%);
  }
  .brand-wordmark {
    width: 130px; height: 36px;
    color: var(--onyx-700);
  }
  .brand-wordmark svg { width: 100%; height: 100%; display: block; }

  .top-reset {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 9.5px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
    text-decoration: none;
    padding: 8px 14px;
    border: 1px solid var(--hair-lo);
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.6);
    cursor: pointer;
    transition: background 220ms ease, color 220ms ease, transform 220ms ease;
  }
  .top-reset:hover {
    background: var(--paper);
    color: var(--onyx-700);
    transform: translateX(-2px);
  }
  .top-reset .glyph { display: inline-block; transition: transform 280ms ease; }
  .top-reset:hover .glyph { transform: rotate(-90deg); }

  /* ── LEFT HALF : THE TOWER ────────────────────────────────────────
     The render occupies the left half of the stage at a natural large
     size. It is NOT clipped into a small box — the SVG is a full-height
     panel and the image is fit by height, so the tower stands tall on
     the page. The chosen section is lit; the rest is dimmed. */
  .tower-panel {
    position: absolute;
    top: 0; left: 0;
    width: 720px;      /* exactly the left half of the 1440 stage */
    bottom: 0;
    z-index: 3;
    pointer-events: none;
  }
  .tower-panel svg { display: block; width: 100%; height: 100%; }

  /* Editorial eyebrow + section title, sat over the upper-left */
  .tower-head {
    position: absolute;
    top: 100px; left: 72px;
    width: 480px;
    z-index: 5;
    pointer-events: none;
  }
  .th-eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-500);
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .th-eyebrow::before {
    content: ''; width: 16px; height: 1px;
    background: var(--gold-500); opacity: 0.6; display: inline-block;
  }
  .th-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400; font-size: 46px;
    line-height: 1.0; letter-spacing: -0.01em;
    color: var(--onyx-700); margin: 0 0 10px;
  }
  .th-title .em { font-style: italic; color: var(--gold-500); }
  .th-sub {
    font-family: 'Inter', sans-serif;
    font-weight: 400; font-size: 12px;
    line-height: 1.6; color: var(--taupe-400);
    max-width: 380px; margin: 0;
  }

  /* floating swatch + section badge, bottom-left over the tower */
  .tower-badge {
    position: absolute;
    left: 72px; bottom: 48px;
    z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px 10px 12px;
    background: rgba(252, 250, 244, 0.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--hair-lo);
    border-radius: 999px;
    box-shadow: var(--card-shadow);
    pointer-events: none;
  }
  .tower-badge .sw {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), 0 2px 6px rgba(40,28,10,0.18);
    flex-shrink: 0;
  }
  .tower-badge .tx { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
  .tower-badge .tx .nm {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--onyx-100);
  }
  .tower-badge .tx .sb {
    font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--taupe-400);
  }

  /* ── ALTITUDE LINE OVERLAY ────────────────────────────────────────
     Dashed gold leader drawn from the slider handle (right) across to
     the lit section on the tower (left). Y follows the handle; the
     pill carries the current level. */
  .altitude-overlay {
    position: absolute;
    left: 0; top: 0;
    width: 1440px; height: 900px;
    pointer-events: none;
    z-index: 6;
    overflow: visible;
    transform: translateZ(0);          /* own compositing layer → no flicker */
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  /* Straight, thick horizontal indicator that tracks the handle's Y.
     Cheap to repaint: a solid stroke driven only by y attributes — no
     dash-offset redraw loop, no blur. transform compositing hint keeps
     drag smooth on Tab. */
  .altitude-overlay .alt-line {
    stroke: var(--gold-500);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0.7;
    fill: none;
    will-change: transform;
  }
  .altitude-overlay .alt-dot {
    fill: var(--gold-500);
    opacity: 0.9;
  }
  .altitude-overlay .alt-pill {
    fill: var(--paper);
    stroke: var(--gold-500);
    stroke-width: 0.75;
    opacity: 0.96;
  }
  .altitude-overlay .alt-pill-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 16px;
    fill: var(--gold-500);
    letter-spacing: 0.01em;
    dominant-baseline: middle;
    text-anchor: middle;
  }

  /* ── RIGHT HALF : FLOOR SELECTOR (slider) + CTA ───────────────────
     The right rail is a vertical stack:
       [Floor Selector card]  (fills available height)
       [View Floor Plan CTA]  (fixed height, bottom) */
  .right-rail {
    position: absolute;
    top: 104px; right: 72px;
    width: 300px;
    bottom: 36px;
    z-index: 5;
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .fs-card {
    flex: 1;
    min-height: 0;
    background: var(--paper);
    border: 1px solid var(--hair-lo);
    border-radius: 16px;
    padding: 22px 22px 18px;
    box-shadow: var(--card-shadow);
    display: flex; flex-direction: column;
    position: relative;
  }
  .fs-card::before {
    content: '';
    position: absolute; top: 0; left: 22px; right: 22px; height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    opacity: 0.85;
  }
  .fs-head {
    display: flex; flex-direction: column; gap: 5px;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  .fs-eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-500);
  }
  .fs-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 22px; line-height: 1.1;
    color: var(--onyx-700);
  }

  /* Slider track region */
  .fs-track-wrap {
    flex: 1;
    display: flex;
    gap: 12px;
    align-items: stretch;
    position: relative;
    margin: 8px 4px 12px;
    min-height: 0;
  }
  /* Left side labels */
  .fs-labels {
    width: 56px;
    position: relative;
    flex-shrink: 0;
  }
  .fs-label {
    position: absolute;
    right: 4px;
    transform: translateY(50%);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--gold-500);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-align: right;
    white-space: nowrap;
  }
  .fs-label .lab-kick {
    display: block;
    font-size: 7px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--taupe-400);
    margin-bottom: 2px;
  }
  /* The colour-banded track */
  .fs-track {
    position: relative;
    flex: 1;
    background: var(--bone-50);
    border: 1px solid var(--hair-lo);
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: inset 0 1px 3px rgba(20,14,6,0.08);
  }
  .fs-band {
    position: absolute; left: 0; right: 0;
    transition: filter 280ms ease, box-shadow 280ms ease, opacity 280ms ease;
  }
  .fs-band.is-active {
    box-shadow: inset 0 0 0 1.5px rgba(148,111,56,0.55),
                inset 0 0 18px rgba(255,210,74,0.30);
    filter: saturate(1.18) brightness(1.06);
  }
  /* faint divider lines between bands so individual levels read */
  .fs-band::after {
    content: '';
    position: absolute; left: 0; right: 0; top: 0;
    height: 1px;
    background: rgba(255,255,255,0.30);
    pointer-events: none;
  }

  /* Right side ticks */
  .fs-ticks {
    width: 12px;
    position: relative;
    flex-shrink: 0;
  }
  .fs-tick {
    position: absolute;
    left: 0;
    width: 6px;
    height: 1px;
    background: var(--gold-500);
    opacity: 0.5;
    transform: translateY(50%);
  }
  .fs-tick.major {
    width: 10px;
    opacity: 0.8;
    height: 1.5px;
  }

  /* The handle */
  .fs-handle {
    position: absolute;
    left: -10px; right: -10px;
    height: 30px;
    transform: translateY(-50%);
    background: var(--paper);
    border: 1.5px solid var(--gold-500);
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
    box-shadow: 0 6px 14px rgba(80,58,28,0.22),
                0 2px 6px rgba(40,28,10,0.10);
    z-index: 10;
    transition: box-shadow 200ms ease, transform 60ms ease;
    will-change: top;
  }
  .fs-handle:active { cursor: grabbing; }
  .fs-handle.dragging {
    box-shadow: 0 10px 22px rgba(80,58,28,0.32),
                0 4px 10px rgba(40,28,10,0.16);
  }
  .fs-handle:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-500), 0 6px 14px rgba(80,58,28,0.22); }
  .fs-handle-label {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 15px;
    color: var(--onyx-700);
    letter-spacing: 0.01em;
    pointer-events: none;
    white-space: nowrap;
  }
  .fs-handle::before {
    content: '';
    position: absolute;
    left: -26px; top: 50%;
    width: 16px; height: 1px;
    background: var(--gold-500);
    opacity: 0.6;
  }
  .fs-handle::after {
    content: '';
    position: absolute;
    right: -26px; top: 50%;
    width: 16px; height: 1px;
    background: var(--gold-500);
    opacity: 0.6;
  }

  .fs-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px;
    border-top: 1px dashed var(--hair-lo);
    flex-shrink: 0;
  }
  .fs-foot-label {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 9px;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: var(--taupe-400);
    display: flex; align-items: center; gap: 8px;
  }
  .fs-foot-label .dot {
    width: 9px; height: 9px; border-radius: 3px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  }
  .fs-foot-num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 18px;
    color: var(--gold-500);
    font-variant-numeric: tabular-nums;
  }

  /* ── View Floor Plan CTA ──────────────────────────────────────── */
  .cta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px;
    width: 100%;
    padding: 16px 22px;
    background: linear-gradient(180deg, var(--paper) 0%, rgba(217, 185, 122, 0.08) 100%);
    border: 1.5px solid var(--gold-500);
    border-radius: 14px;
    text-decoration: none;
    color: var(--onyx-700);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    transition: background 220ms ease, transform 220ms ease, box-shadow 220ms ease;
    box-shadow:
      0 18px 36px -10px rgba(80, 58, 28, 0.22),
      0 8px 16px  -6px  rgba(80, 58, 28, 0.16),
      0 2px 4px         rgba(80, 58, 28, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  .cta:hover {
    background: linear-gradient(180deg, var(--paper) 0%, rgba(217, 185, 122, 0.16) 100%);
    transform: translateY(-2px);
    box-shadow:
      0 24px 48px -10px rgba(80, 58, 28, 0.30),
      0 12px 22px  -6px rgba(80, 58, 28, 0.22),
      0 2px 4px         rgba(80, 58, 28, 0.10),
      inset 0 1px 0 rgba(255, 255, 255, 0.72);
  }
  .cta-floor-label {
    display: inline-flex; align-items: center; flex-shrink: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 30px; letter-spacing: 0.01em;
    color: var(--gold-500); text-transform: none; line-height: 1;
    white-space: nowrap;
  }
  .cta-action {
    display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0;
    font-family: 'Inter', sans-serif; font-weight: 600;
    text-transform: uppercase; font-size: 11px;
    letter-spacing: 0.40em; line-height: 1.2;
    color: var(--onyx-700); white-space: nowrap;
  }
  .cta-arrow {
    color: var(--gold-500); font-size: 20px; line-height: 1;
    transition: transform 240ms ease; flex-shrink: 0;
  }
  .cta:hover .cta-arrow { transform: translateX(5px); }

  /* ── Veil ─────────────────────────────────────────────────────── */
  .veil {
    position: absolute; inset: 0;
    background: var(--bone);
    opacity: 0;
    pointer-events: none;
    z-index: 99;
    transition: opacity 220ms ease-in-out;
  }
  body.is-leaving .veil { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    body.is-arriving { animation-duration: 1ms !important; }
  }
</style>

<script>
  // ── Iris reveal from the tap point — must run BEFORE first paint ──
  (function () {
    try {
      const params = new URLSearchParams(window.location.search);
      const ox = parseFloat(params.get('ox'));
      const oy = parseFloat(params.get('oy'));
      const x = isFinite(ox) ? ox : 50;
      const y = isFinite(oy) ? oy : 50;
      const root = document.documentElement;
      root.style.setProperty('--reveal-x', x + '%');
      root.style.setProperty('--reveal-y', y + '%');
      document.addEventListener('DOMContentLoaded', () => {
        document.body.style.setProperty('--reveal-x', x + '%');
        document.body.style.setProperty('--reveal-y', y + '%');
        document.body.classList.add('is-arriving');
        setTimeout(() => { document.body.classList.remove('is-arriving'); }, 1000);
      });
    } catch (e) { /* no-op */ }
  })();

  // ── Stage scaler — scale-to-fit (contain). ──────────────────────
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);

    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

  const SECTION_BOX = {
    mansion:     { x: 1177.66, y: 243.32,  w: 348.81, h: 252.39 },
    residential: { x: 1177.66, y: 343.67,  w: 348.81, h: 556.67 },
    refuge:      { x: 1177.66, y: 806.67,  w: 348.81, h: 668.64 },
    amenity:     { x: 1177.66, y: 1453.86, w: 380.20, h: 135.06 },
    parking:     { x: 1165.68, y: 1502.19, w: 392.18, h: 219.44 },
    entrance:    { x: 1280.93, y: 1721.63, w: 66.65,  h: 53.52  },
    basement:    { x: 1165.68, y: 1775.14, w: 410.30, h: 40.14  },
    service:     { x: 1177.66, y: 343.67,  w: 348.81, h: 556.67 },
  };

  // ── Read selection ─────────────────────────────────────────────────
  let sectionKey = 'residential';
  try { sectionKey = sessionStorage.getItem('ec.section') || 'residential'; } catch (e) {}
  if (!SECTION_META[sectionKey]) sectionKey = 'residential';

  const meta   = SECTION_META[sectionKey];
  const levels = (SECTION_LEVELS[sectionKey] || []).slice();   // top → bottom
  const box    = SECTION_BOX[sectionKey] || SECTION_BOX.residential;
  const N       = Math.max(1, levels.length);

  // ── Apply accent palette to CSS + SVG gradient ─────────────────────
  document.documentElement.style.setProperty('--accent-a', meta.a);
  document.documentElement.style.setProperty('--accent-b', meta.b);
  document.getElementById('accentStopA').setAttribute('stop-color', meta.a);
  document.getElementById('accentStopB').setAttribute('stop-color', meta.b);
  document.getElementById('accentStopSoftA').setAttribute('stop-color', meta.a);
  document.getElementById('accentStopSoftB').setAttribute('stop-color', meta.b);

  // ── Header copy + badges ───────────────────────────────────────────
  document.getElementById('thTitle').innerHTML = meta.word + ' <span class="em">' + meta.em + '</span>';
  document.getElementById('thSub').textContent = meta.blurb + ' Choose a level to view its plan.';
  document.getElementById('badgeName').textContent = meta.name;
  document.getElementById('fsFootType').textContent = meta.name;
  document.getElementById('fsFootNum').textContent = N;

  // ── Position the tower render in the left-half panel ────────────────
  // Fit the 2752×2064 image by HEIGHT into the 720×900 SVG viewBox so it
  // stands tall (natural large size), pulled toward the left/centre of
  // the panel. Then place the active clip + ring around the section box,
  // all in the same scaled/translated coordinate space.
  let towerScale = 1, towerTx = 0, towerTy = 0;
  (function placeTower() {
    const IMG_W = 2752, IMG_H = 2064;
    const VB_W = 720, VB_H = 900;
    // Fit by height with a little top/bottom breathing room.
    const usableH = VB_H * 0.86;
    const s = usableH / IMG_H;               // height-fit scale
    towerScale = s;
    const drawW = IMG_W * s;
    // Centre the (tall) image horizontally within the panel; nudge right
    // so the tower body sits toward the panel's centre, near the slider.
    towerTx = (VB_W - drawW) / 2 + 40;
    towerTy = (VB_H - IMG_H * s) / 2;

    const g = document.getElementById('towerImgGroup');
    g.setAttribute('transform', 'translate(' + towerTx + ',' + towerTy + ') scale(' + s + ')');

    // Active clip + ring around the real section box (image pixel coords).
    const clip = document.getElementById('activeClipRect');
    const ring = document.getElementById('activeRing');
    const ring2 = document.getElementById('activeRing2');
    const cpad = 8;
    [clip, ring, ring2].forEach(el => {
      el.setAttribute('x', box.x - cpad);
      el.setAttribute('y', box.y - cpad);
      el.setAttribute('width',  box.w + cpad * 2);
      el.setAttribute('height', box.h + cpad * 2);
    });
    ring.setAttribute('rx', '14'); ring2.setAttribute('rx', '14');
  })();

  // Section centre in STAGE coordinates (1440×900) — anchor for the
  // dashed leader line's left endpoint. The tower panel occupies stage
  // x:[0,720], y:[0,900], and its SVG viewBox is 720×900 → 1:1 with the
  // panel pixels, so image→panel→stage is just the group transform.
  function sectionCentreStage() {
    const cx = box.x + box.w / 2;
    const cy = box.y + box.h / 2;
    return {
      x: towerTx + cx * towerScale,            // panel x == stage x (panel at left:0)
      y: towerTy + cy * towerScale,
    };
  }

  // ── Level label formatting ─────────────────────────────────────────
  function levelShort(lv) {
    if (typeof lv === 'string') return lv;                 // P3 / Ground / B1
    return 'L' + lv;
  }
  function levelLong(lv) {
    if (typeof lv === 'string') {
      if (lv === 'Ground')   return 'Arrival · Ground';
      if (lv[0] === 'P')     return 'Parking · ' + lv;
      if (lv[0] === 'B')     return 'Basement · ' + lv;
      return lv;
    }
    if (sectionKey === 'refuge')  return 'Refuge · ' + lv;
    if (sectionKey === 'mansion') return 'Mansion · L' + lv;
    if (sectionKey === 'amenity') return 'Amenity · L' + lv;
    if (sectionKey === 'service') return 'Service · L' + lv;
    return 'Level ' + lv;
  }
  // CTA / handle / pill formatting
  function levelDisplay(lv) {
    if (typeof lv === 'string') return lv;                 // Ground / P3 / B1
    return 'L ' + lv;
  }

  // ── Slider geometry ────────────────────────────────────────────────
  // Each level = one equal-height band. Band i (0=top) spans
  //   top   = i/N * 100%
  //   height= 1/N * 100%
  // The selected index's value runs 0..N-1 (0 at top).
  const track   = document.getElementById('fsTrack');
  const labelsEl = document.getElementById('fsLabels');
  const ticksEl  = document.getElementById('fsTicks');

  const state = { idx: 0, dragging: false };
  // default selected: ec.floor if it's in this section, else first level.
  (function defaultIdx() {
    let init = 0;
    try {
      const f = sessionStorage.getItem('ec.floor');
      if (f != null) {
        const hit = levels.findIndex(lv => String(lv) === String(f));
        if (hit >= 0) init = hit;
      }
    } catch (e) {}
    state.idx = init;
  })();

  // pct (from top) of the CENTRE of band i
  function pctForIdx(i) { return ((i + 0.5) / N) * 100; }

  function renderBands() {
    track.innerHTML = '';
    const bandH = 100 / N;
    levels.forEach((lv, i) => {
      const div = document.createElement('div');
      div.className = 'fs-band';
      div.dataset.idx = i;
      div.style.top    = (i * bandH) + '%';
      div.style.height = bandH + '%';
      // colour-coded: blend the section's accent A→B across the stack so
      // the track reads as a smooth coded gradient (like the old bands).
      const t = N === 1 ? 0.5 : i / (N - 1);
      div.style.background = 'linear-gradient(90deg, ' +
        mix(meta.a, meta.b, t) + ' 0%, ' + mix(meta.a, meta.b, Math.min(1, t + 0.18)) + ' 100%)';
      track.appendChild(div);
    });
    // handle on top
    const handle = document.createElement('div');
    handle.className = 'fs-handle';
    handle.id = 'fsHandle';
    handle.setAttribute('role', 'slider');
    handle.setAttribute('aria-orientation', 'vertical');
    handle.setAttribute('aria-valuemin', '0');
    handle.setAttribute('aria-valuemax', String(N - 1));
    handle.tabIndex = 0;
    handle.innerHTML = '<span class="fs-handle-label" id="fsHandleLabel"></span>';
    track.appendChild(handle);
  }

  // colour mix helper (hex → hex)
  function mix(h1, h2, t) {
    const a = hex(h1), b = hex(h2);
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function hex(h) {
    h = h.replace('#', '');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }

  function renderLabels() {
    labelsEl.innerHTML = '';
    // choose a step so we show ~8-12 labels max for long lists
    let step = 1;
    if (N > 12) step = Math.ceil(N / 10);
    for (let i = 0; i < N; i += step) {
      addLabel(i);
    }
    // always label the last one
    if ((N - 1) % step !== 0) addLabel(N - 1);
  }
  function addLabel(i) {
    const el = document.createElement('div');
    el.className = 'fs-label';
    el.style.top = pctForIdx(i) + '%';
    el.innerHTML = '<span class="lab-kick">' + meta.kick + '</span>' + levelShort(levels[i]);
    labelsEl.appendChild(el);
  }

  function renderTicks() {
    ticksEl.innerHTML = '';
    let step = 1;
    if (N > 16) step = Math.ceil(N / 16);
    for (let i = 0; i < N; i += step) {
      const t = document.createElement('div');
      t.className = 'fs-tick' + (i % (step * 2) === 0 ? ' major' : '');
      t.style.top = pctForIdx(i) + '%';
      ticksEl.appendChild(t);
    }
  }

  // ── Sync handle + bands + CTA + leader line ─────────────────────────
  function syncHandle() {
    const handle = document.getElementById('fsHandle');
    const label  = document.getElementById('fsHandleLabel');
    if (!handle) return;
    const lv = levels[state.idx];

    handle.style.top = pctForIdx(state.idx) + '%';
    label.textContent = levelDisplay(lv);
    handle.setAttribute('aria-valuenow', String(state.idx));
    handle.setAttribute('aria-valuetext', levelLong(lv));

    // active band highlight
    track.querySelectorAll('.fs-band').forEach((b, i) => {
      b.classList.toggle('is-active', i === state.idx);
    });

    // CTA
    const ctaLabel = document.getElementById('ctaFloorLabel');
    ctaLabel.textContent = levelDisplay(lv);

    syncLeaderLine();
  }

  // A straight, thick HORIZONTAL indicator line at the handle's current
  // level. Both endpoints share the handle's Y (perfectly horizontal); the
  // whole line — line, dot and pill — travels UP/DOWN with the handle. It is
  // NOT anchored to a fixed tower section. Cheap: only x/y attrs change, no
  // dash-offset redraw, no blur → smooth, no flicker.
  function syncLeaderLine() {
    const line  = document.getElementById('altLine');
    const dot   = document.getElementById('altDot');
    const label = document.getElementById('altLabel');
    const labelText = document.getElementById('altLabelText');
    const handle = document.getElementById('fsHandle');
    const stage  = document.getElementById('stage');
    if (!line || !label || !handle || !stage) return;

    const handleRect = handle.getBoundingClientRect();
    const stageRect  = stage.getBoundingClientRect();
    if (stageRect.height === 0) return;
    const scale = stageRect.height / 900;

    // handle centre + left edge in stage (1440×900) coords
    const hy = (handleRect.top + handleRect.height / 2 - stageRect.top) / scale;
    const hx = (handleRect.left - stageRect.left) / scale;   // left edge of handle

    // Tower-side pointer is CONSTRAINED to the selected SECTION BOX: as the
    // slider moves, the pointer maps the current floor to a position WITHIN
    // that lit box on the tower — it never travels the full tower height.
    const boxTopY = towerTy + box.y * towerScale;
    const boxBotY = towerTy + (box.y + box.h) * towerScale;
    const t = N > 1 ? ((state.idx + 0.5) / N) : 0.5;
    const towerY = Math.max(boxTopY, Math.min(boxBotY, boxTopY + t * (boxBotY - boxTopY)));
    const lx = towerTx + (box.x + box.w) * towerScale + 4;   // box right edge
    const rx = Math.max(lx + 40, hx - 16);
    const handleY = Math.max(20, Math.min(880, hy));

    // line: slider handle (right, at handle Y) → in-box pointer (left, in box)
    line.setAttribute('x1', lx);
    line.setAttribute('y1', towerY);
    line.setAttribute('x2', rx);
    line.setAttribute('y2', handleY);

    // dot = the pointer; sits on the section box and moves only within it
    dot.setAttribute('cx', lx);
    dot.setAttribute('cy', towerY);

    // pill rides above the in-box pointer
    const lv = levels[state.idx];
    const disp = levelDisplay(lv);
    labelText.textContent = disp;
    const pillW = Math.max(56, disp.length * 9 + 28);
    document.getElementById('altPill').setAttribute('width', pillW);
    document.getElementById('altPill').setAttribute('x', -pillW / 2);
    label.setAttribute('transform', 'translate(' + lx + ', ' + (towerY - 22) + ')');
  }

  // ── Pointer interactions ───────────────────────────────────────────
  function idxAtClientY(clientY) {
    const rect = track.getBoundingClientRect();
    if (rect.height === 0) return state.idx;
    let y = clientY - rect.top;
    y = Math.max(0, Math.min(rect.height, y));
    const i = Math.floor((y / rect.height) * N);
    return Math.max(0, Math.min(N - 1, i));
  }
  function setIdx(i) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i === state.idx) return;
    state.idx = i;
    syncHandle();
  }

  track.addEventListener('click', e => {
    if (track.dataset.justDragged === '1') { track.dataset.justDragged = ''; return; }
    setIdx(idxAtClientY(e.clientY));
  });

  let dragId = null;
  track.addEventListener('pointerdown', e => {
    dragId = e.pointerId;
    state.dragging = true;
    track.setPointerCapture(e.pointerId);
    const handle = document.getElementById('fsHandle');
    if (handle) handle.classList.add('dragging');
    setIdx(idxAtClientY(e.clientY));
  });
  track.addEventListener('pointermove', e => {
    if (!state.dragging || e.pointerId !== dragId) return;
    setIdx(idxAtClientY(e.clientY));
  });
  function endDrag(e) {
    if (!state.dragging) return;
    state.dragging = false;
    track.dataset.justDragged = '1';
    setTimeout(() => track.dataset.justDragged = '', 100);
    const handle = document.getElementById('fsHandle');
    if (handle) handle.classList.remove('dragging');
    try { track.releasePointerCapture(e.pointerId); } catch (_) {}
    dragId = null;
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // Keyboard: arrows move through the section's levels
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowUp')   { e.preventDefault(); setIdx(state.idx - 1); }   // up = higher floor (earlier in list)
    if (e.key === 'ArrowDown') { e.preventDefault(); setIdx(state.idx + 1); }
    if (e.key === 'PageUp')    { e.preventDefault(); setIdx(state.idx - 5); }
    if (e.key === 'PageDown')  { e.preventDefault(); setIdx(state.idx + 5); }
    if (e.key === 'Home')      { e.preventDefault(); setIdx(0); }
    if (e.key === 'End')       { e.preventDefault(); setIdx(N - 1); }
    if (e.key === 'Enter')     { e.preventDefault(); confirmFloor(); }
  });

  // ── Confirm → store floor + cream veil → floor-plan.html ────────────
  function confirmFloor() {
    const lv = levels[state.idx];
    try { sessionStorage.setItem('ec.floor', String(lv)); } catch (e) {}
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = 'floor-units.html'; }, 220);
  }
  document.getElementById('ctaView').addEventListener('click', e => {
    e.preventDefault();
    confirmFloor();
  });

  // ── Back navigation ────────────────────────────────────────────────
  document.getElementById('brandBack').addEventListener('click', e => {
    e.preventDefault();
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = 'home.html'; }, 220);
  });
  document.getElementById('topReset').addEventListener('click', e => {
    e.preventDefault();
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = 'inventory.html'; }, 220);
  });
  const ecBackBtn = document.getElementById('ecBackBtn');
  if (ecBackBtn) {
    const goBack = (e) => {
      if (e) e.preventDefault();
      document.body.classList.add('is-leaving');
      setTimeout(() => { window.location.href = 'inventory.html'; }, 220);
    };
    ecBackBtn.addEventListener('click', goBack);
    ecBackBtn.addEventListener('touchend', goBack, { passive: false });
  }

  // ── Boot ───────────────────────────────────────────────────────────
  renderBands();
  renderLabels();
  renderTicks();
  syncHandle();

  // The handle/leader geometry depends on layout + scale + fonts; re-sync.
  window.addEventListener('load',   () => { try { syncLeaderLine(); } catch (e) {} });
  window.addEventListener('resize', () => { try { syncLeaderLine(); } catch (e) {} });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { try { syncLeaderLine(); } catch (e) {} });
  }
  requestAnimationFrame(() => { try { syncLeaderLine(); } catch (e) {} });
</script>

<script>
  // Service worker registration (PWA + offline cache)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      var ecHadCtrl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(function(){});
      var ecReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (ecReloaded || !ecHadCtrl) return;   // skip the first-ever claim
        ecReloaded = true; window.location.reload();   // new version deployed -> refresh
      });
    });
  }
  // iOS double-tap zoom guard
  (function() {
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    ['gesturestart','gesturechange','gestureend'].forEach(function(ev) {
      document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });
    });
    function setVh() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', function() { setTimeout(setVh, 120); });
  })();

  // ── Prefetch next-screen on touchstart for faster transitions ───
  (function() {
    function wirePrefetch() {
      document.querySelectorAll('a[href], button[data-href]').forEach(function(el) {
        var href = el.getAttribute('href') || el.dataset.href;
        if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:')) return;
        el.addEventListener('touchstart', function() {
          if (!document.querySelector('link[rel="prefetch"][href="' + href + '"]')) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
          }
        }, { passive: true, once: true });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wirePrefetch);
    } else {
      wirePrefetch();
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function() {
        if (document.querySelector('link[rel="prefetch"][href="floor-plan.html"]')) return;
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'floor-plan.html';
        document.head.appendChild(link);
      });
    }
  })();
</script>

    window.addEventListener('pageshow', clearLeave);
