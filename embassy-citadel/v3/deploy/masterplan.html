<!--
  ──────────────────────────────────────────────────────────────────────
  MASTERPLAN v1 — assumptions + reasoning
  ──────────────────────────────────────────────────────────────────────
  Concept
  · Inside-screen reached from the home's "02 Masterplan" tile. The
    masterplan canvas is the protagonist; left rail carries the
    editorial frame, right rail carries the legend + filters. No
    bottom footer chrome — the canvas takes the full height down to
    the "drag to explore" indicator.

  Layout (1440 × 900 stage)
  · Top bar 76px — identical chrome to gallery/amenities (brand
    wordmark at left @ 44 / 38, eyebrow centre, Worli + clock +
    right). Brand is the back button (cream-veil to home).
  · Left rail @ x=64, w=300: tiny eyebrow, "Explore. Envision.
    Experience." Cormorant headline, gold hairline, body paragraph,
    4 stat tiles in a vertical stack pinned to the bottom of the rail.
  · Centre canvas @ x≈386, w≈680, h≈648: zoomable, pannable
    site-plan.png with 13 markers absolutely positioned in % of the
    image. Wheel zoom (anchored at cursor), pointer drag pan,
    pinch (gesture* events on iOS) zoom, double-click reset, +/-
    floating buttons. Marker click → animate to scale 2.5 centered
    on marker + activate spotlight + show info card.
  · Right rail @ x=1080, w=320: category filter pills (ALL / AMEN /
    LAND / ACCESS), legend toggles (7 categories on/off), about-
    project mini-card pinned to bottom.

  Zoom contract
  · MIN_SCALE = 1 (image fits the canvas — floor)
  · MAX_SCALE = 4 (zoom-in detail)
  · Anchor-at-cursor math keeps the same image-point under the
    cursor when zooming, both for wheel and pinch.
  · clampPan() prevents the stage edges from pulling inside the
    viewport when scaled (so you never see an empty gutter).

  Markers (13 total, % coords on site-plan.png)
  · Buildings:          North Tower, South Tower, Wing A
  · Amenities (4):     Pool, Gym, Spa, Club House
  · Landscape (2):     Sculpted Garden, Sky Lawn
  · Water (1):         Reflective Pool
  · Pathways (1):      Jogging Loop
  · Access (2):        Main Gate, Service Gate
  · (Parking is in the legend with default OFF — no marker by default;
    the legend toggle reveals zero markers, faithful to the spec.)

  Spotlight overlay
  · Radial-gradient mask centred on the marker's screen position,
    fading to a warm dark veil over the rest of the canvas. Fade
    400ms.

  Info card
  · Cream tile, gold thin border, soft shadow, ~200×120, positioned
    near the marker (right + down 20px), clipped to canvas edges.

  Background contract
  · Same paper bg + grain. NO tower silhouette (canvas is the
    focus). NO day-tint cycle (would shift masterplan colors).
    Faint cross-hatching blueprint-grid behind the canvas (5%
    opacity) as an architectural cue.

  Interactions wired
  · Wheel zoom anchored at cursor
  · Pinch zoom (gesturestart/change/end) anchored at gesture origin
  · Pointer drag pan when scale > 1
  · +/- floating buttons → ±0.5 scale
  · Double-click empty canvas → reset to scale 1 centered
  · Marker click → spotlight + animated zoom to ~2.5
  · Click outside info card → reset
  · Category filter tabs (ALL / AMEN / LAND / ACCESS) → filter
    visible markers by data-cat
  · Legend toggles → hide/show marker categories (multiplied with
    the category filter)
  · Brand wordmark → cream veil → home.html
  · About-the-project card → cream veil → about (overview) page
  · Live clock updates every 30s

  Placeholders / to-wire-later
  · Marker coordinates are reasonable guesses on the masterplan
    image — they should be refined once an architect's overlay is
    available (the existing screen-03-masterplan has ref-with-pins
    coordinates for ground/circ; this v4 uses a curated 12-marker
    storytelling set, not the 12 ground pins).
  · Topbar has no menu button.
  · About-the-project mini-card navigates to overview screen as a
    soft fallback ("about" hasn't been built in v4 yet).
-->

<style>
  :root {
    --paper:      #FCFAF4;
    --bone:       #F4F2ED;
    --bone-50:    #F7F5EF;
    --bone-200:   #E8E2D6;
    --warm-grey:  #DAD5CD;
    --taupe-300:  #C2B5A3;
    --taupe-400:  #A89B86;

    --gold-100:   #E8CFA1;
    --gold-200:   #D9B97A;
    --gold-300:   #C9A567;
    --gold-400:   #B89968;
    --gold-500:   #946F38;
    --gold-600:   #6E5A37;

    --onyx-100:   #3A332A;
    --onyx-300:   #2A2620;
    --onyx-500:   #1F1B15;
    --onyx-700:   #1A1814;
    --onyx-900:   #0E0C09;

    --hair-lo:    rgba(148, 111, 56, 0.16);
    --hair:       rgba(148, 111, 56, 0.32);
    --hair-hi:    rgba(148, 111, 56, 0.58);

    --tile-shadow:   0 18px 38px rgba(20, 14, 6, 0.16),
                     0 6px 14px  rgba(20, 14, 6, 0.10);
    --plate-shadow:  0 30px 60px -18px rgba(80, 58, 28, 0.32),
                     0 14px 30px -10px rgba(80, 58, 28, 0.18),
                     0 4px 10px        rgba(40, 28, 10, 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--paper);
    color: var(--onyx-700);
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
    position: fixed; inset: 0;
  }

  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  /* ── Stage scaler — flex-center letterbox ─────────────────────────── */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    padding: 0;   /* edge-to-edge — stage fills the whole viewport */
    display: flex; align-items: center; justify-content: center;
    isolation: isolate;
    /* Flat paper — matches the stage's own paper edge so the letterbox/
       pillarbox margins (iPad 4:3, 65" 16:9) blend with no visible "cut".
       (This screen has NO dayCycle keyframe, so no ::before tint per spec.) */
    background: url('assets/bg-paper.png') center/cover no-repeat, var(--paper);
  }
  #stage, .stage-inner {
    position: relative;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    z-index: 1;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
  }

  /* ── PAPER BACKGROUND ─────────────────────────────────────────── */
  .stage-bg {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: url('assets/bg-paper.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  .stage-grain {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.02;
    background-image:
      radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 1px;
    mix-blend-mode: multiply;
  }

  /* ── TOP BAR (seamless — paper bg shows through) ────────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    background: linear-gradient(180deg, rgba(252,250,244,0.55), rgba(252,250,244,0) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  /* Unified left-side brand-back */
  .ec-brand-back {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: opacity 240ms ease, transform 240ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    min-height: 44px;
  }
  .ec-brand-back:hover { opacity: 0.78; transform: translateX(-1px); }
  .ec-brand-back:focus-visible { outline: none; opacity: 0.78; }
  .ec-brand-back .brand-diamond {
    width: 18px; height: 18px;
    position: relative; display: inline-block;
    transform: rotate(45deg);
    border: 1px solid var(--gold-500);
    background: linear-gradient(135deg, var(--gold-200) 0%, var(--gold-500) 100%);
    box-shadow: 0 0 6px rgba(148,111,56,0.20);
    flex-shrink: 0;
  }
  .ec-brand-back .brand-diamond::before {
    content: ''; position: absolute; inset: 3px;
    border: 0.5px solid rgba(255,255,255,0.55); background: transparent;
  }
  .ec-brand-back .brand-text { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
  .ec-brand-back .brand-text .name {
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 500; font-size: 22px;
    color: var(--onyx-700); letter-spacing: 0.04em;
  }
  .ec-brand-back .brand-text .loc {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 9px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
  }
  /* Right-side BACK button */
  .ec-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 92px; min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 220ms ease, color 220ms ease,
                border-color 220ms ease, transform 200ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    -webkit-appearance: none; appearance: none;
  }
  .ec-back-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .ec-back-btn:active { transform: scale(0.96); }
  .ec-back-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-500); }
  .ec-back-btn .arr { font-size: 13px; line-height: 1; transform: translateY(-0.5px); letter-spacing: 0; }
  /* ── TAP RESPONSIVENESS — interactive surfaces inside the app ── */
  button, [role="button"], a[href], .stat-row, .spotlight, .pill {
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  svg .tap, svg [data-tap], svg [role="button"], .spotlight, .mp-region { pointer-events: all; cursor: pointer; }
  .brand {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: opacity 240ms ease, transform 240ms ease;
    position: relative;
  }
  .brand:hover { opacity: 0.72; transform: translateX(-1px); }
  .brand:focus-visible { outline: none; opacity: 0.72; }
  .brand::after {
    content: '← Home';
    position: absolute;
    left: 100%; top: 50%;
    transform: translate(8px, -50%);
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 8.5px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
    opacity: 0;
    white-space: nowrap;
    transition: opacity 260ms ease, transform 260ms ease;
    pointer-events: none;
  }
  .brand:hover::after, .brand:focus-visible::after {
    opacity: 0.85;
    transform: translate(12px, -50%);
  }
  .brand-wordmark {
    width: 156px; height: 43.2px;
    color: var(--onyx-700);
  }
  .brand-wordmark svg { width: 100%; height: 100%; display: block; }
  .top-eyebrow {
    font-family: 'Lato', sans-serif;
    font-weight: 400; font-size: 9px;
    letter-spacing: 0.55em; text-transform: uppercase;
    color: var(--gold-500); opacity: 0.78;
  }
  .top-right {
    display: flex; align-items: center; gap: 14px;
    font-family: 'Lato', sans-serif;
    font-weight: 400; font-size: 10px;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--onyx-100); opacity: 0.78;
    font-variant-numeric: tabular-nums;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold-300);
    box-shadow: 0 0 8px rgba(217,185,122,0.6);
    animation: livePulse 2.6s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.18); }
  }
  /* ── LEFT EDITORIAL RAIL ─────────────────────────────────────────── */
  .leftrail {
    position: absolute;
    left: 64px;
    top: 108px;
    width: 300px;
    height: 760px;
    z-index: 6;
    display: flex; flex-direction: column;
  }
  .lr-eyebrow {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-500);
    opacity: 0.85;
    margin-bottom: 18px;
  }
  .lr-headline {
    font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 52px;
    line-height: 1.02;
    letter-spacing: 0.02em;
    color: var(--onyx-700);
    margin: 0 0 14px 0;
  }
  .lr-rule {
    height: 1px; width: 70px;
    background: var(--hair-hi);
    margin: 0 0 16px 0;
  }
  .lr-body {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.65;
    color: var(--onyx-100);
    opacity: 0.82;
    margin: 0 0 28px 0;
  }

  /* Stat tile stack */
  .stat-list {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .stat-row {
    display: flex; align-items: center; gap: 16px;
  }
  .stat-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(252, 250, 244, 0.85);
    border: 1px solid var(--hair-lo);
    display: grid; place-items: center;
    color: var(--gold-500);
    flex-shrink: 0;
    box-shadow:
      0 6px 14px -6px rgba(80, 58, 28, 0.2),
      0 2px 4px rgba(40, 28, 10, 0.06);
  }
  .stat-icon svg { width: 22px; height: 22px; display: block; }
  .stat-text {
    display: flex; flex-direction: column; gap: 3px;
  }
  .stat-num {
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-style: italic;
    font-weight: 400;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--onyx-700);
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-family: 'Lato', sans-serif;
    font-weight: 500;
    font-size: 9.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--taupe-400);
  }

  /* ── FULL-BLEED MASTERPLAN CANVAS (extends edge-to-edge) ────────── */
  .mp-wrap {
    position: absolute;
    left: 0;
    top: 76px;          /* below top bar */
    right: 0;
    bottom: 0;          /* extends to stage bottom */
    z-index: 2;         /* below rails (z:6) and back nav, above bg paper */
  }
  /* Blueprint cross-hatch hidden — masterplan is full-bleed now, no plate chrome */
  .mp-blueprint { display: none; }
  .mp-canvas {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;       /* let stage paper show through any letterbox */
    touch-action: none;
    cursor: grab;
  }
  .mp-canvas.is-panning { cursor: grabbing; }
  .mp-stage {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    transform: translate(0px, 0px) scale(1);
    will-change: transform;
  }
  .mp-stage.is-animating {
    transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mp-image {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    object-fit: contain;           /* real extracted plan on transparent canvas — never stretch */
    object-position: center;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    /* Crisp-up the washed-out render — subtle contrast + saturation lift,
       a hair darker so the linework reads. Static (no animated tint loop). */
    filter: contrast(1.08) saturate(1.06) brightness(0.99);
  }
  .mp-image-fallback {
    position: absolute; inset: 0;
    display: none;
    place-items: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, var(--paper) 0%, var(--bone-50) 55%, var(--bone-200) 100%);
  }
  .mp-image-fallback.is-on { display: grid; }
  .mp-image-fallback span {
    font-family: 'Lato', sans-serif;
    font-weight: 400; font-size: 10px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--taupe-400);
    opacity: 0.7;
  }

  /* ── MARKER ───────────────────────────────────────────────────────
     Anchored to .mp-stage (tracks the map point on pan/zoom). The button
     itself is a generous 36px hit-target (well over the 28px minimum);
     a 30px bronze-ringed disc sits inside with a clear gold core dot and
     an always-pulsing halo, so it unmistakably reads as "tap me". */
  .mp-marker {
    position: absolute;
    width: 36px; height: 36px;          /* ≥28px hit area (36px) */
    padding: 0;
    border: none;
    background: transparent;
    color: var(--gold-500);
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: transform 200ms cubic-bezier(0.22,1,0.36,1), opacity 240ms ease;
    z-index: 4;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
  }
  /* The visible disc */
  .mp-marker .mk-disc {
    position: absolute; top: 50%; left: 50%;
    width: 30px; height: 30px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, var(--gold-300) 0%, var(--gold-500) 62%, var(--gold-600) 100%);
    border: 1.5px solid var(--gold-200);
    display: grid; place-items: center;
    color: #FFFFFF;
    box-shadow:
      0 0 0 4px rgba(252, 250, 244, 0.7),     /* cream collar lifts it off the plan */
      0 8px 16px -5px rgba(80, 58, 28, 0.45),
      0 2px 5px rgba(40, 28, 10, 0.20),
      inset 0 1px 1px rgba(255,255,255,0.40);
    transition: background 200ms ease, border-color 200ms ease,
                box-shadow 220ms ease, transform 200ms ease;
  }
  .mp-marker .mk-disc svg {
    width: 14px; height: 14px; display: block;
    stroke-width: 2;
  }
  /* Always-visible pulsing halo (the "tappable" affordance) */
  .mp-marker::before {
    content: '';
    position: absolute; top: 50%; left: 50%;
    width: 30px; height: 30px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1.5px solid var(--gold-300);
    opacity: 0.6;
    animation: markerPulse 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes markerPulse {
    0%   { transform: translate(-50%,-50%) scale(1);    opacity: 0.6;  }
    70%  { transform: translate(-50%,-50%) scale(1.9);  opacity: 0;    }
    100% { transform: translate(-50%,-50%) scale(1.9);  opacity: 0;    }
  }

  /* Always-visible label chip below the disc */
  .mp-marker .mk-label {
    position: absolute; top: calc(50% + 20px); left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 3px 9px;
    background: rgba(252, 250, 244, 0.94);
    border: 1px solid var(--hair);
    border-radius: 100px;
    font-family: 'Lato', sans-serif;
    font-weight: 600; font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--onyx-700);
    box-shadow: 0 3px 8px -3px rgba(80,58,28,0.30);
    pointer-events: none;
    opacity: 0.92;
    transition: opacity 200ms ease, transform 200ms ease, background 200ms ease;
  }

  .mp-marker.is-hidden {
    opacity: 0;
    pointer-events: none;
  }
  /* Hover lift + brighten — obvious interactive feedback */
  .mp-marker:hover { transform: translate(-50%, -50%) scale(1.06); }
  .mp-marker:hover .mk-disc {
    background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, var(--paper) 50%, var(--bone-50) 100%);
    border-color: var(--gold-500);
    box-shadow:
      0 0 0 4px rgba(252, 250, 244, 0.75),
      0 12px 22px -6px rgba(80, 58, 28, 0.50),
      0 3px 7px rgba(40, 28, 10, 0.22),
      inset 0 1px 1px rgba(255,255,255,0.9);
  }
  .mp-marker:hover .mk-label {
    opacity: 1;
    background: var(--paper);
    transform: translateX(-50%) translateY(1px);
  }
  .mp-marker:focus-visible { outline: none; }
  .mp-marker:focus-visible .mk-disc {
    border-color: var(--gold-500);
    box-shadow:
      0 0 0 3px var(--gold-300),
      0 8px 16px -5px rgba(80, 58, 28, 0.45);
  }
  .mp-marker:active { transform: translate(-50%, -50%) scale(0.94); }

  /* Active marker — bronze-filled core + standing gold ring */
  .mp-marker.is-active {
    z-index: 6;
  }
  .mp-marker.is-active .mk-disc {
    background: radial-gradient(circle at 38% 32%, var(--gold-200) 0%, var(--gold-400) 55%, var(--gold-500) 100%);
    border-color: var(--gold-500);
    color: var(--paper);
    box-shadow:
      0 0 0 4px rgba(252, 250, 244, 0.65),
      0 0 18px rgba(217, 185, 122, 0.55),
      0 10px 24px -6px rgba(80, 58, 28, 0.50),
      inset 0 1px 1px rgba(255,255,255,0.5);
  }
  .mp-marker.is-active .mk-label {
    opacity: 1;
    background: var(--gold-500);
    border-color: var(--gold-500);
    color: var(--paper);
  }
  /* Gold radius ring — visible "spotlight area" around the active marker */
  .mp-marker.is-active::after {
    content: '';
    position: absolute; top: 50%; left: 50%;
    width: 84px; height: 84px;
    transform: translate(-50%, -50%);
    border-radius: 50%;

<script>
  // Stage scaler — fit-to-viewport (letterbox on either axis as needed).
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      // FULL-SCREEN FILL: grow the stage to exactly cover the viewport. Uniform
      // scale (no distortion); design dims stay >= 1440x900 so no content is
      // cropped; the surplus is breathing room around the anchored chrome.
      stage.style.width  = Math.ceil(vw / s) + 'px';
      stage.style.height = Math.ceil(vh / s) + 'px';
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

          caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
        }
      } catch (e) {}
    }
  })();
</script>

<script>
  // ─────────────────────────────────────────────────────────────
  // ICON LIBRARY (line stroke, gold)
  // ─────────────────────────────────────────────────────────────
  const ICONS = {
    pin:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-7-7-12a7 7 0 0 1 14 0c0 5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
    building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v16"/><path d="M3 21h18M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/></svg>',
    lotus:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-2 3-2 7 0 10 2-3 2-7 0-10z"/><path d="M4 14c2 3 5 4 8 4s6-1 8-4"/><path d="M7 11c1 4 3 6 5 7 2-1 4-3 5-7"/></svg>',
    tree:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M12 8c-3-2-6-2-6 0M12 8c3-2 6-2 6 0M12 13c-3-2-6-2-6 0M12 13c3-2 6-2 6 0"/></svg>',
    water:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c2-2 4 2 6 0s4-2 6 0 4-2 6 0"/><path d="M3 16c2-2 4 2 6 0s4-2 6 0 4-2 6 0"/></svg>',
    walk:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M9 22l3-7-3-3 2-5 4 5 3 1M9 14l-3 6"/></svg>',
    parking:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 17V8h3a2.5 2.5 0 0 1 0 5h-3"/></svg>',
    car:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h14M6 16l1-5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2l1 5"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/></svg>',
    grid:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="0.6"/><rect x="14" y="3" width="7" height="7" rx="0.6"/><rect x="3" y="14" width="7" height="7" rx="0.6"/><rect x="14" y="14" width="7" height="7" rx="0.6"/></svg>',
  };

  // ─────────────────────────────────────────────────────────────
  // LEFT-RAIL STATS
  // ─────────────────────────────────────────────────────────────
  const STATS = [
    { icon: 'pin',      num: '6.4+',  label: 'Acres of Land Parcel' },
    { icon: 'building', num: '2',     label: 'Towers' },
    { icon: 'lotus',    num: '12+',   label: 'Amenity Zones' },
    { icon: 'tree',     num: '80%+',  label: 'Open Spaces' },
  ];

  const statListEl = document.getElementById('statList');
  STATS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML =
      '<span class="stat-icon">' + ICONS[s.icon] + '</span>' +
      '<span class="stat-text">' +
      '<span class="stat-num">' + s.num + '</span>' +
      '<span class="stat-label">' + s.label + '</span>' +
      '</span>';
    statListEl.appendChild(row);
  });

  // ─────────────────────────────────────────────────────────────
  // CATEGORY FILTER (top-of-right-rail pills)
  // ALL maps to every legend-on category. Each named filter maps
  // to a subset of legend categories.
  // ─────────────────────────────────────────────────────────────
  const FILTERS = [
    { key: 'all',       label: 'All',       icon: 'grid',  cats: ['buildings','amenities','landscape','water','pathways','parking','access'] },
    { key: 'amenities', label: 'Amenities', icon: 'lotus', cats: ['amenities','water'] },
    { key: 'landscape', label: 'Landscape', icon: 'tree',  cats: ['landscape','pathways'] },
    { key: 'access',    label: 'Access',    icon: 'car',   cats: ['access','parking'] },
  ];

  const filterPillsEl = document.getElementById('filterPills');
  FILTERS.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-pill' + (i === 0 ? ' is-active' : '');
    btn.dataset.filter = f.key;
    btn.innerHTML = ICONS[f.icon] + '<span class="lab">' + f.label + '</span>';
    btn.addEventListener('click', () => setFilter(f.key));
    filterPillsEl.appendChild(btn);
  });

  // ─────────────────────────────────────────────────────────────
  // LEGEND (7 categories, each with on/off toggle).
  // PARKING is OFF by default (per task spec).
  // ─────────────────────────────────────────────────────────────
  const LEGEND = [
    { key: 'buildings', label: 'Buildings',      icon: 'building', on: true  },
    { key: 'amenities', label: 'Amenities',      icon: 'lotus',    on: true  },
    { key: 'landscape', label: 'Landscape',      icon: 'tree',     on: true  },
    { key: 'water',     label: 'Water Features', icon: 'water',    on: true  },
    { key: 'pathways',  label: 'Pathways',       icon: 'walk',     on: true  },
    { key: 'parking',   label: 'Parking',        icon: 'parking',  on: false },
    { key: 'access',    label: 'Access Points',  icon: 'car',      on: true  },
  ];
  const legendOn = {};
  LEGEND.forEach(l => { legendOn[l.key] = l.on; });

  const legendBodyEl = document.getElementById('legendBody');

  // ─────────────────────────────────────────────────────────────
  // ZOOM + PAN MATH
  // ─────────────────────────────────────────────────────────────
  // The stage is sized to fill the canvas at scale=1 (transform-origin 0 0).
  // Translation moves the stage in canvas-pixels.
  // Clamp: at scale s, the stage is canvasW*s × canvasH*s. To keep the
  // stage filling the canvas, tx ∈ [canvasW*(1-s), 0] and similar for ty.
  const MIN_SCALE = 1;
  const MAX_SCALE = 4;

  let scale = 1, tx = 0, ty = 0;

  function getCanvasSize() {
    // Use layout (offset) size, NOT getBoundingClientRect: the whole screen is
    // a 1440x900 stage scaled to fit big displays. getBoundingClientRect would
    // return post-scale pixels, but tx/ty operate in pre-scale design pixels —
    // mixing them makes the focused pin drift on larger screens. offsetWidth/
    // Height are unaffected by CSS transforms, so they match the tx/ty space.
    return { w: canvas.offsetWidth, h: canvas.offsetHeight };
  }

  function clampPan() {
    const { w, h } = getCanvasSize();
    const minTx = w * (1 - scale);
    const minTy = h * (1 - scale);
    if (tx > 0) tx = 0;
    if (ty > 0) ty = 0;
    if (tx < minTx) tx = minTx;
    if (ty < minTy) ty = minTy;
  }

  function applyTransform(animate) {
    if (animate) stage.classList.add('is-animating');
    else stage.classList.remove('is-animating');
    stage.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
    scaleRead.textContent = Math.round(scale * 100) + '%';
  }

  function setScaleAtPoint(newScale, anchorX, anchorY) {
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    if (newScale === scale) return;
    const ratio = newScale / scale;
    // Keep the anchor point fixed under the cursor:
    // newTx = anchorX - ratio * (anchorX - tx)
    tx = anchorX - ratio * (anchorX - tx);
    ty = anchorY - ratio * (anchorY - ty);
    scale = newScale;
    clampPan();
    applyTransform(false);
  }

  // Wheel zoom (anchored at cursor)

    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const ax = e.clientX - rect.left;
    const ay = e.clientY - rect.top;
    const dz = e.deltaY < 0 ? 1.12 : (1 / 1.12);
    setScaleAtPoint(scale * dz, ax, ay);
  }, { passive: false });

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    gestureAnchor = { x: (e.clientX || rect.width / 2) - rect.left,
                      y: (e.clientY || rect.height / 2) - rect.top };
  });
  canvas.addEventListener('gesturechange', (e) => {
    e.preventDefault();
    setScaleAtPoint(gestureStartScale * e.scale, gestureAnchor.x, gestureAnchor.y);
  });

  canvas.addEventListener('pointerdown', (e) => {

      // Still allow clicks; record so we can treat as a "background click"

      return;

    drag.sx = e.clientX; drag.sy = e.clientY;
    drag.btx = tx; drag.bty = ty;
    drag.moved = false;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('is-panning');
  });

    if (!drag.active) return;
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    tx = drag.btx + dx;
    ty = drag.bty + dy;
    clampPan();
    applyTransform(false);
  });

    if (drag.active) {

      canvas.classList.remove('is-panning');

  // ─────────────────────────────────────────────────────────────
  // SMART CARD PLACEMENT — try right/left/below/above based on space,
  // and ensure the card never overlaps the marker or its gold ring.
  // ─────────────────────────────────────────────────────────────
  const CARD_W = 220, CARD_H = 130, MARKER_HALO = 46, GAP = 14, PAD = 16;
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function placeCardSmart(mx, my, cw, ch) {
    // mx, my = marker SCREEN position in canvas pixels
    // Try right
    if (mx + MARKER_HALO + GAP + CARD_W <= cw - PAD) {
      return {
        left: mx + MARKER_HALO + GAP,
        top:  clamp(my - CARD_H / 2, PAD, ch - CARD_H - PAD),
      };
    }
    // Try left
    if (mx - MARKER_HALO - GAP - CARD_W >= PAD) {
      return {
        left: mx - MARKER_HALO - GAP - CARD_W,
        top:  clamp(my - CARD_H / 2, PAD, ch - CARD_H - PAD),
      };
    }
    // Try below
    if (my + MARKER_HALO + GAP + CARD_H <= ch - PAD) {
      return {
        left: clamp(mx - CARD_W / 2, PAD, cw - CARD_W - PAD),
        top:  my + MARKER_HALO + GAP,
      };
    }
    // Above (fallback)
    return {
      left: clamp(mx - CARD_W / 2, PAD, cw - CARD_W - PAD),
      top:  Math.max(PAD, my - MARKER_HALO - GAP - CARD_H),
    };
  }

  // Place the card ABOVE the marker, horizontally centred on it, clamped to the
  // canvas, never overlapping the disc/gold-ring. Falls back to below only when
  // there genuinely isn't room above.
  function placeCardAbove(mx, my, cw, ch, cardH) {
    cardH = cardH || CARD_H;                            // taller for tower (plan) cards
    const left = clamp(mx - CARD_W / 2, PAD, cw - CARD_W - PAD);
    let top = my - MARKER_HALO - GAP - cardH;          // sit above the halo
    if (top < PAD) top = my + MARKER_HALO + GAP;       // no room up top -> drop below
    top = clamp(top, PAD, ch - cardH - PAD);
    return { left, top };
  }

  // ── Fullscreen floor-plan viewer (North/South Tower plates) ─────
  const lb      = document.getElementById('mpLightbox');
  const lbStage = document.getElementById('mpLbStage');
  const lbImg   = document.getElementById('mpLbImg');
  const lbWrap  = document.getElementById('mpLbWrap');
  const lbCap   = document.getElementById('mpLbCap');
  const lbClose = document.getElementById('mpLbClose');
  let lbOpen = false;
  const lz = { s: 1, x: 0, y: 0 };
  function lbApply(anim) {
    lbWrap.style.transition = anim === false ? 'transform 0s' : 'transform 300ms cubic-bezier(.16,.84,.32,1)';
    lbWrap.style.transform = 'translate(' + lz.x + 'px,' + lz.y + 'px) scale(' + lz.s + ')';
    lbWrap.classList.toggle('is-zoomed', lz.s > 1.01);
  }
  function lbClamp() {
    const r = lbWrap.getBoundingClientRect();
    const mx = Math.max(0, (r.width  - window.innerWidth)  / 2 + 8);
    const my = Math.max(0, (r.height - window.innerHeight) / 2 + 8);
    lz.x = Math.max(-mx, Math.min(mx, lz.x));
    lz.y = Math.max(-my, Math.min(my, lz.y));
  }
  function lbSet(n, anim) { lz.s = Math.max(1, Math.min(4, n)); if (lz.s <= 1.01) { lz.x = 0; lz.y = 0; } else lbClamp(); lbApply(anim); }
  function lbReset() { lz.s = 1; lz.x = 0; lz.y = 0; lbApply(false); }
  function openPlanLightbox(src, cap, wing) {
    lbReset();
    lbWrap.classList.remove('show-north', 'show-south', 'show-both');
    if (wing === 'north') lbWrap.classList.add('show-north');
    else if (wing === 'south') lbWrap.classList.add('show-south');
    lbImg.style.opacity = '0';
    const tmp = new Image();
    tmp.onload = tmp.onerror = function () { lbImg.src = src; lbImg.style.opacity = '1'; };
    tmp.src = src;
    lbCap.textContent = cap || '';
    lbOpen = true; lb.classList.add('is-open');
  }
  function closePlanLightbox() { lbOpen = false; lb.classList.remove('is-open'); lbReset(); }
  lbClose.addEventListener('click', closePlanLightbox);
  lbStage.addEventListener('click', function (e) { if (e.target === lbStage && lz.s <= 1.01) closePlanLightbox(); });
  lbImg.addEventListener('dblclick', function (e) { e.preventDefault(); if (lz.s > 1.01) lbReset(); else { lz.s = 2.4; lbClamp(); lbApply(true); } });
  lb.addEventListener('wheel', function (e) { if (!lbOpen) return; e.preventDefault(); e.stopPropagation(); lbSet(lz.s + (e.deltaY < 0 ? 0.4 : -0.4), false); }, { passive: false });
  window.addEventListener('keydown', function (e) { if (lbOpen && e.key === 'Escape') closePlanLightbox(); });
  const lbpts = new Map(); let lbpan = null, lbpinch = 0, lbsb = 1;
  lbImg.addEventListener('pointerdown', function (e) {
    if (!lbOpen) return;
    try { lbImg.setPointerCapture(e.pointerId); } catch (_) {}
    lbpts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (lbpts.size === 2) { const p = [...lbpts.values()]; lbpinch = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); lbsb = lz.s; }
    else if (lz.s > 1.01) { lbpan = { x: e.clientX - lz.x, y: e.clientY - lz.y }; lbWrap.classList.add('is-panning'); }
  });
  lbImg.addEventListener('pointermove', function (e) {
    if (!lbpts.has(e.pointerId)) return;
    lbpts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (lbpts.size === 2 && lbpinch) { const p = [...lbpts.values()]; const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); lbSet(lbsb * (d / lbpinch), false); }
    else if (lbpan && lz.s > 1.01) { lz.x = e.clientX - lbpan.x; lz.y = e.clientY - lbpan.y; lbClamp(); lbApply(false); }
  });
  function lbUp(e) { lbpts.delete(e.pointerId); if (lbpts.size < 2) lbpinch = 0; if (lbpts.size === 0) { lbpan = null; lbWrap.classList.remove('is-panning'); lbApply(true); } }
  lbImg.addEventListener('pointerup', lbUp);
  lbImg.addEventListener('pointercancel', lbUp);

  // Aim the spotlight's bright centre at a specific canvas-pixel point.
  function setSpotlightAt(mx, my, cw, ch) {
    const px = (mx / cw) * 100, py = (my / ch) * 100;
    spotlight.style.background =
      'radial-gradient(circle at ' + px.toFixed(2) + '% ' + py.toFixed(2) + '%, ' +
      'transparent 0%, transparent 10%, rgba(20, 14, 6, 0.12) 18%, rgba(20, 14, 6, 0.55) 36%, rgba(20, 14, 6, 0.7) 100%)';
  }

  // Marker's CURRENT screen position in canvas pixels (accounting for tx/ty/scale)
  function markerScreenPos(m) {
    const { w, h } = getCanvasSize();
    return {
      x: (m.px / 100) * w * scale + tx,
      y: (m.py / 100) * h * scale + ty,
    };
  }

  function writeCardContent(m) {
    infoIcon.innerHTML = ICONS[m.icon] || ICONS.pin;
    infoTitle.textContent = m.label;
    infoBody.textContent  = m.desc;
    infoCat.textContent   = '— ' + m.cat;
    // Towers (North/South) carry a typical floor plate — shown in the card, click to enlarge.
    if (m.plan) {
      if (infoPlanImg.getAttribute('src') !== m.plan) infoPlanImg.src = m.plan;
      infoPlanCap.textContent = m.planLabel || 'Typical Floor Plan';
      infoPlan.hidden = false;
      infoPlanWrap.classList.remove('show-north', 'show-south', 'show-both');
      if (m.wing === 'north') infoPlanWrap.classList.add('show-north');
      else if (m.wing === 'south') infoPlanWrap.classList.add('show-south');
      infoPlanBtn.onclick = function (e) { e.stopPropagation(); openPlanLightbox(m.plan, m.planLabel || m.label, m.wing); };
    } else {
      infoPlan.hidden = true;
      infoPlanBtn.onclick = null;
    }
  }

  // ─────────────────────────────────────────────────────────────
  // FOCUS A MARKER (full reveal — animated zoom + spotlight + card)
  // Used when user clicks a marker from the default zoomed-out state.
  // ─────────────────────────────────────────────────────────────
  let wasFocusedZoom = false;
  function focusMarker(m) {
    activeMarker = m;
    Object.values(markerEls).forEach(el => el.classList.remove('is-active'));
    markerEls[m.id].classList.add('is-active');

    const targetScale = 2.5;
    const { w, h } = getCanvasSize();
    // Land the marker EXACTLY at the canvas centre. We intentionally skip
    // clampPan() here — clamping would shove edge pins off-centre, which is
    // the bug. The dark spotlight vignette covers any plan-edge gap, so the
    // selected pin always sits dead-centre of the screen.
    tx = w / 2 - (m.px / 100) * w * targetScale;
    ty = h / 2 - (m.py / 100) * h * targetScale;
    scale = targetScale;
    applyTransform(true);
    wasFocusedZoom = true;

    // Marker is now at the exact canvas centre → spotlight + card anchor there.
    setSpotlightAt(w / 2, h / 2, w, h);
    spotlight.classList.add('is-on');

    writeCardContent(m);
    // Tower cards carry a plan thumbnail and are taller — measure, then place above.
    const cardH = infoCard.offsetHeight || CARD_H;
    const placement = placeCardAbove(w / 2, h / 2, w, h, cardH);   // right above the pin
    infoCard.style.left = placement.left + 'px';
    infoCard.style.top  = placement.top  + 'px';
    infoCard.classList.add('is-on');
    syncLegendActive(m.id);
  }

  // ─────────────────────────────────────────────────────────────
  // SHOW MARKER INFO (multi-touch — used when already zoomed in)
  // No re-zoom, no spotlight darkening. Card hops to the new marker.
  // ─────────────────────────────────────────────────────────────
  function showMarkerInfo(m) {
    activeMarker = m;
    Object.values(markerEls).forEach(el => el.classList.remove('is-active'));
    markerEls[m.id].classList.add('is-active');

    // Make sure spotlight isn't darkening the view in this mode
    spotlight.classList.remove('is-on');

    const { w, h } = getCanvasSize();
    const pos = markerScreenPos(m);
    // Clamp marker pos to visible canvas (when scrolled off-screen the
    // card still anchors to the nearest visible edge in that direction)
    const visMx = clamp(pos.x, 0, w);
    const visMy = clamp(pos.y, 0, h);
    writeCardContent(m);
    const cardH = infoCard.offsetHeight || CARD_H;
    const placement = placeCardAbove(visMx, visMy, w, h, cardH);
    infoCard.style.left = placement.left + 'px';
    infoCard.style.top  = placement.top  + 'px';
    infoCard.classList.add('is-on');
    syncLegendActive(m.id);
  }

  function clearFocus() {
    activeMarker = null;
    Object.values(markerEls).forEach(el => el.classList.remove('is-active'));
    spotlight.classList.remove('is-on');
    infoCard.classList.remove('is-on');
    syncLegendActive(null);
    // Only reset zoom if the active state was triggered by focusMarker
    // (so user-pan zooms are preserved when they click around)
    if (wasFocusedZoom) {
      resetView();
      wasFocusedZoom = false;
    }
  }

  function resetView() {
    scale = 1; tx = 0; ty = 0;
    clampPan();
    applyTransform(true);
    spotlight.classList.remove('is-on');
    infoCard.classList.remove('is-on');
    Object.values(markerEls).forEach(el => el.classList.remove('is-active'));
    syncLegendActive(null);
    activeMarker = null;
  }

  infoClose.addEventListener('click', (e) => {
    e.stopPropagation();
    clearFocus();
  });

  // ─────────────────────────────────────────────────────────────
  // VISIBILITY UPDATE — combines filter + legend toggles.
  // ─────────────────────────────────────────────────────────────
  function updateVisibility() {
    const filterDef = FILTERS.find(f => f.key === activeFilter);
    const allowed = new Set(filterDef ? filterDef.cats : []);
    currentMarkers.forEach(m => {
      const el = markerEls[m.id];
      if (!el) return;
      const visible = allowed.has(m.cat) && legendOn[m.cat];
      el.classList.toggle('is-hidden', !visible);
    });
    // If active marker is now hidden, close the focus
    if (activeMarker) {
      const el = markerEls[activeMarker.id];
      if (el.classList.contains('is-hidden')) clearFocus();
    }
  }
  updateVisibility();

  function setFilter(key) {
    activeFilter = key;
    document.querySelectorAll('.filter-pill').forEach(p => {
      p.classList.toggle('is-active', p.dataset.filter === key);
    });
    // Swap the base plan drawing + its calibrated pointer set for this category.
    const planSrc = PLAN_BASE[key] || PLAN_BASE.all;
    const planMk  = PLAN_MARKERS[key] || MARKERS;
    clearFocus();
    if (imageEl.getAttribute('src') !== planSrc) {
      imageEl.style.display = '';
      fallback.classList.remove('is-on');
      imageEl.setAttribute('src', planSrc);
    }
    renderMarkers(planMk);
    renderLegend(planMk);
    resetView();
    updateVisibility();
  }

  function toggleLegend(key) {
    legendOn[key] = !legendOn[key];
    const row = document.querySelector('[data-toggle="' + key + '"]');
    if (row) {
      row.classList.toggle('is-off', !legendOn[key]);
      const tog = row.querySelector('.lr-toggle');
      if (tog) tog.classList.toggle('is-on', legendOn[key]);
    }
    updateVisibility();
  }

  // ─────────────────────────────────────────────────────────────
  // LIVE CLOCK
  // ─────────────────────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    // IST = UTC + 5h30m
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const ist = new Date(utc + (5.5 * 60 * 60 * 1000));
    const hh = String(ist.getHours()).padStart(2, '0');
    const mm = String(ist.getMinutes()).padStart(2, '0');
    const el = document.getElementById('clock');
    if (el) el.textContent = hh + ':' + mm + ' IST';
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ─────────────────────────────────────────────────────────────
  // CREAM-VEIL NAVIGATION
  // ─────────────────────────────────────────────────────────────
  function navFade(href) {
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = href; }, 220);
  }

  const brandLink = document.getElementById('brandLink');
  if (brandLink) {
    brandLink.addEventListener('click', (e) => {
      e.preventDefault();
      navFade('home.html?from=masterplan');
    });
  }
  const ecBackBtn = document.getElementById('ecBackBtn');
  if (ecBackBtn) {
    const goBack = (e) => { if (e) e.preventDefault(); navFade('home.html?from=masterplan'); };
    ecBackBtn.addEventListener('click', goBack);
    ecBackBtn.addEventListener('touchend', goBack, { passive: false });
  }
  // Fast-entry veil when arriving from home
  if (location.search && location.search.indexOf('from=home') !== -1) {
    document.body.classList.add('fast-entry');
  }

  // Initial transform
  applyTransform(false);
</script>

<!-- PWA-JS-START -->
<script>
  // Service worker registration (PWA + offline cache)
  if ('serviceWorker' in navigator && !window.__EC_LOCAL) {
    window.addEventListener('load', function() {
      var ecHadCtrl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(function(){});
      var ecReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (ecReloaded || !ecHadCtrl) return;   // skip the first-ever claim
        ecReloaded = true; window.location.reload();   // new version deployed -> refresh
      });
    });
  }
  // iOS double-tap zoom guard
  (function() {
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    // Block pinch-zoom gesture events (iOS Safari)
    ['gesturestart','gesturechange','gestureend'].forEach(function(ev) {
      document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });
    });
    // Cache --vh CSS var for iOS Safari URL-bar collapse handling
    function setVh() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', function() { setTimeout(setVh, 120); });
  })();
</script>
<!-- PWA-JS-END -->

<script>
  // ── Preload likely next screens + touch-start prefetch on tap targets ───
  (function () {
    function prefetch(url) {
      if (!url || url.startsWith('http') || document.querySelector('link[rel="prefetch"][href="' + url + '"]')) return;
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = url;
      document.head.appendChild(link);
    }
    function preloadNextScreens(urls) {
      var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 400); };
      idle(function () { urls.forEach(prefetch); });
    }
    // masterplan.html → preload home.html
    preloadNextScreens(['home.html']);

    document.querySelectorAll('a[href], button[data-href]').forEach(function (el) {
      var href = el.getAttribute('href') || el.dataset.href;
      if (!href || href.startsWith('http')) return;
      el.addEventListener('touchstart', function () { prefetch(href); }, { passive: true, once: true });
    });
  })();
</script>
<script>
  /* ── BFCACHE / BACK-NAVIGATION GUARD ─────────────────────────────────
     Tablets (iOS Safari, Samsung Internet, Chrome-Android) restore the
     previous page from the back-forward cache with its DOM intact — including
     the cream "is-leaving" veil that was set just before navigating away. That
     left the restored screen BLANK on back. Clear the leaving/firing state
     whenever the page is shown (including a bfcache restore) or on popstate. */
  (function () {
    function clearLeave() { document.body.classList.remove('is-leaving', 'is-firing'); }
    window.addEventListener('pageshow', clearLeave);
    window.addEventListener('popstate', clearLeave);
  })();
</script>
  <script src="assets/tools-dock.js"></script>
