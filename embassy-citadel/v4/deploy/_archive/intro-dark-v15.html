<style>
  :root {
    --onyx: #0E0C09; --onyx-700: #1A1814; --onyx-500: #2A2620;
    --bone: #F4F2ED; --paper: #FCFAF4;
    --gold-100: #E8CFA1; --gold-200: #D9B97A; --gold-300: #C9A567;
    --gold-400: #B89968; --gold-500: #946F38; --gold-600: #6E5A37;
    --taupe-400: #A89B86;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--onyx); color: var(--bone);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none; overflow: hidden;
    position: fixed; inset: 0;
  }
  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; pointer-events: none; }

  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: radial-gradient(ellipse 80% 60% at 50% 45%, var(--onyx-700) 0%, var(--onyx) 70%, #050403 100%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    overflow: hidden; will-change: transform;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }

  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.82 0 0 0 0 0.50 0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.05; mix-blend-mode: screen;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, transparent 0%, transparent 55%, rgba(0,0,0,0.55) 100%);
    opacity: 0; animation: fadeIn 800ms ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .motes { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .mote {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold-200); opacity: 0.16; bottom: -10px;
    animation: moteRise linear infinite; filter: blur(0.6px);
  }
  @keyframes moteRise {
    0%   { transform: translate(0, 0); opacity: 0; }
    8%   { opacity: 0.18; }
    92%  { opacity: 0.10; }
    100% { transform: translate(var(--drift, 20px), calc(-100vh - 80px)); opacity: 0; }
  }

  .corner {
    position: absolute; z-index: 8;
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 9px;
    letter-spacing: 0.45em; text-transform: uppercase; color: var(--bone);
    opacity: 0; animation: fadeIn 900ms ease 200ms forwards;
  }
  .corner.tl { top: 38px; left: 44px; }
  .corner.tr { top: 38px; right: 44px;
    display: flex; align-items: center; gap: 12px;
    font-variant-numeric: tabular-nums;
  }
  .corner.tr .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold-300);
    box-shadow: 0 0 8px rgba(217,185,122,0.6);
    animation: livePulse 2.6s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.18); }
  }
  .corner.bl { bottom: 38px; left: 44px; font-size: 8.5px; letter-spacing: 0.5em; }
  .corner.br { bottom: 38px; right: 44px; font-size: 8.5px; letter-spacing: 0.5em; }
  .corner .em { color: var(--gold-200); }
  /* Hold final opacity AFTER fade-in (no longer 1 — keep restrained) */
  .corner.tl, .corner.tr { animation: fadeInTo55 900ms ease 200ms forwards; }
  .corner.bl, .corner.br { animation: fadeInTo40 900ms ease 200ms forwards; }
  @keyframes fadeInTo55 { from { opacity: 0; } to { opacity: 0.55; } }
  @keyframes fadeInTo40 { from { opacity: 0; } to { opacity: 0.40; } }

  /* ── Wordmark stage ─────────────────────────────────────────────── */
  .word-stage {
    position: absolute; left: 50%; top: 50%;
    width: 700px; height: 360px;
    transform: translate(-50%, -54%);
    z-index: 5; pointer-events: none;
  }
  .word-eyebrow {
    position: absolute; top: -4px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 9.5px;
    letter-spacing: 0.55em; text-transform: uppercase; color: var(--gold-200);
    opacity: 0;
    animation: textIn 1000ms cubic-bezier(0.22, 1, 0.36, 1) 2800ms forwards;
    white-space: nowrap;
    display: flex; align-items: center; gap: 12px;
  }
  .word-eyebrow::before, .word-eyebrow::after {
    content: ''; width: 22px; height: 1px; background: var(--gold-200); opacity: 0.55;
  }
  @keyframes textIn {
    from { opacity: 0; transform: translate(-50%, 6px); }
    to   { opacity: 0.85; transform: translate(-50%, 0); }
  }

  .wordmark {
    position: absolute; left: 0; right: 0; top: 36px;
    height: 160px; color: var(--bone);
    filter: drop-shadow(0 0 22px rgba(217,185,122,0.18));
    -webkit-mask-image: linear-gradient(90deg,
       #000 0%, #000 calc(var(--reveal, 0) * 1%),
       transparent calc(var(--reveal, 0) * 1%), transparent 100%);
            mask-image: linear-gradient(90deg,
       #000 0%, #000 calc(var(--reveal, 0) * 1%),
       transparent calc(var(--reveal, 0) * 1%), transparent 100%);
    animation: revealSweep 1900ms cubic-bezier(0.65, 0.05, 0.36, 1) 350ms forwards;
  }
  .wordmark svg { width: 100%; height: 100%; display: block; }
  @keyframes revealSweep { from { --reveal: 0; } to { --reveal: 100; } }

  .sheen {
    position: absolute; left: 0; right: 0; top: 36px;
    height: 160px; pointer-events: none;
    background: linear-gradient(105deg,
      transparent 30%, rgba(255, 230, 170, 0.42) 47%,
      rgba(255, 230, 170, 0.66) 50%, rgba(255, 230, 170, 0.42) 53%,
      transparent 70%);
    background-size: 220% 100%; background-position: -120% 0;
    mix-blend-mode: screen; opacity: 0;
    animation: sheenSweep 1300ms cubic-bezier(0.22, 1, 0.36, 1) 2400ms forwards;
  }
  @keyframes sheenSweep {
    0%   { opacity: 0;    background-position: -120% 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0;    background-position: 220% 0; }
  }

  .nib {
    position: absolute; left: 0; top: 36px;
    width: 4px; height: 160px;
    transform: translateX(calc(var(--nib-x, 0) * 1px - 2px));
    background: linear-gradient(180deg,
       transparent 0%, rgba(232, 207, 161, 0.85) 18%,
       var(--gold-200) 50%, rgba(232, 207, 161, 0.85) 82%, transparent 100%);
    box-shadow:
       0 0 18px rgba(232, 207, 161, 0.85),
       0 0 38px rgba(217, 185, 122, 0.55),
       0 0 70px rgba(217, 185, 122, 0.25);
    border-radius: 2px; opacity: 0;
    animation: nibSweep 1900ms cubic-bezier(0.65, 0.05, 0.36, 1) 350ms forwards;
    pointer-events: none;
  }
  @keyframes nibSweep {
    0%   { opacity: 0;    --nib-x: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { opacity: 0;    --nib-x: 700; }
  }
  .nib-flare {
    position: absolute; right: -10px; top: 36px;
    width: 80px; height: 160px;
    background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(232, 207, 161, 0.45), transparent 70%);
    opacity: 0;
    animation: flareIn 700ms ease 2150ms forwards, flareOut 1100ms ease 2700ms forwards;
    pointer-events: none;
  }
  @keyframes flareIn  { from { opacity: 0; } to { opacity: 0.85; } }
  @keyframes flareOut { from { opacity: 0.85; } to { opacity: 0; } }

  .tagline {
    position: absolute; left: 50%; top: 226px;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif; font-weight: 400;
    font-style: italic; font-size: 30px;
    color: var(--bone); letter-spacing: 0.08em; text-transform: uppercase;
    opacity: 0;
    animation: textInBone 1100ms cubic-bezier(0.22, 1, 0.36, 1) 3000ms forwards;
    white-space: nowrap;
  }
  @keyframes textInBone {
    from { opacity: 0; transform: translate(-50%, 6px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .sub {
    position: absolute; left: 50%; top: 276px;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-style: italic; font-size: 15px;
    color: var(--gold-200); letter-spacing: 0.04em;
    opacity: 0;
    animation: textInGold 1100ms cubic-bezier(0.22, 1, 0.36, 1) 3300ms forwards;
    white-space: nowrap;
  }
  @keyframes textInGold {
    from { opacity: 0; transform: translate(-50%, 6px); }
    to   { opacity: 0.85; transform: translate(-50%, 0); }
  }

  /* ── Hold pad ───────────────────────────────────────────────────── */
  .pad-wrap {
    position: absolute; bottom: 84px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    opacity: 0;
    animation: textInBone 900ms cubic-bezier(0.22, 1, 0.36, 1) 3700ms forwards;
    pointer-events: auto;
  }
  .pad {
    position: relative; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
        var(--gold-200) 0%, var(--gold-400) 40%, var(--gold-600) 100%);
    cursor: pointer;
    box-shadow:
      0 12px 28px rgba(217, 185, 122, 0.22),
      0 0 0 1px rgba(217, 185, 122, 0.40),
      inset 0 -8px 18px rgba(74, 61, 36, 0.55),
      inset 0 6px 12px rgba(255, 230, 170, 0.30);
    display: grid; place-items: center;
    transition: transform 220ms ease;
    overflow: visible;
    -webkit-appearance: none; appearance: none; border: none;
    animation: padPulse 2.4s ease-in-out infinite;
    padding: 0;
  }
  @keyframes padPulse {
    0%, 100% { box-shadow:
      0 12px 28px rgba(217, 185, 122, 0.22),
      0 0 0 1px rgba(217, 185, 122, 0.40),
      0 0 0  0px rgba(217, 185, 122, 0.0),
      inset 0 -8px 18px rgba(74, 61, 36, 0.55),
      inset 0 6px 12px rgba(255, 230, 170, 0.30); }
    50%      { box-shadow:
      0 16px 36px rgba(217, 185, 122, 0.30),
      0 0 0 1px rgba(217, 185, 122, 0.55),
      0 0 0 10px rgba(217, 185, 122, 0.10),
      inset 0 -8px 18px rgba(74, 61, 36, 0.55),
      inset 0 6px 12px rgba(255, 230, 170, 0.30); }
  }
  .pad.is-holding { transform: scale(1.04); animation: holdingPulse 400ms ease-in-out infinite; }
  @keyframes holdingPulse {
    0%, 100% { transform: scale(1.04); }
    50%      { transform: scale(1.06); }
  }
  .pad-glyph { width: 22px; height: 22px; color: var(--onyx-700); opacity: 0.55; }
  .pad-glyph svg { width: 100%; height: 100%; }
  .pad-ring { position: absolute; inset: -8px; transform: rotate(-90deg); pointer-events: none; }
  .pad-ring svg { width: 100%; height: 100%; }
  .pad-ring circle {
    fill: none; stroke: var(--gold-200); stroke-width: 1.4; stroke-linecap: round;
    stroke-dasharray: 251.327;     /* 2*PI*40 */
    stroke-dashoffset: 251.327;
    transition: stroke-dashoffset 1200ms linear;
    filter: drop-shadow(0 0 6px rgba(217,185,122,0.6));
  }
  .pad-ring.is-on circle { stroke-dashoffset: 0; }
  .pad-label {
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 9.5px;
    letter-spacing: 0.55em; text-transform: uppercase; color: var(--bone); opacity: 0.55;
  }

  .veil {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 88%, var(--gold-100) 0%, var(--gold-300) 35%, var(--paper) 70%, var(--bone) 100%);
    opacity: 0; pointer-events: none; z-index: 99;
    transition: opacity 620ms ease-out;
  }
  body.is-leaving .veil { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .nib, .sheen, .nib-flare { animation: none; }
    .wordmark { -webkit-mask-image: none; mask-image: none; opacity: 1; }
    .word-eyebrow, .tagline, .sub, .pad-wrap, .corner { animation-duration: 200ms; }
    .pad { animation: none; }
    .mote { display: none; }
  }
</style>

<script>
  // Stage scaler (Living Tree contract)
  (function () {
    const W = 1440, H = 900;
    const STAGE_ASPECT = W / H;
    const COVER_THRESHOLD = 0.97;
    function scale() {
      const wrap = document.getElementById('stage-wrap');
      const stage = document.getElementById('stage');
      if (!wrap || !stage) return;
      let vw = wrap.clientWidth, vh = wrap.clientHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const va = vw / vh;
      const squarish = va > 1 && va < STAGE_ASPECT * COVER_THRESHOLD;
      const s = squarish ? Math.max(vw / W, vh / H) : Math.min(vw / W, vh / H);
      const t = 'translate(-50%, -50%) scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

<div id="stage-wrap">
  <div id="stage">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="motes" id="motes"></div>

    <div class="corner tl">EMBASSY&nbsp;CITADEL</div>
    <div class="corner tr">
      Worli&nbsp;·&nbsp;Mumbai
      <span class="live-dot"></span>
      <span id="clock">00:00&nbsp;IST</span>
    </div>
    <div class="corner bl">Threshold&nbsp;·&nbsp;<span class="em">No.&nbsp;01</span></div>

    <div class="word-stage">
      <div class="word-eyebrow">Embassy&nbsp;Citadel</div>
      <div class="wordmark">
        <svg viewBox="0 0 1000 500"><use href="#ec-wordmark" /></svg>
      </div>
      <div class="sheen"></div>
      <div class="nib"></div>
      <div class="nib-flare"></div>
      <div class="tagline">A&nbsp;World&nbsp;Unto&nbsp;Itself</div>
      <div class="sub">The world changes at the door.</div>
    </div>

    <div class="pad-wrap">
      <button class="pad" id="pad" type="button" aria-label="Hold to enter">
        <span class="pad-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <path d="M12 5c-3.86 0-7 3.14-7 7v3"/>
            <path d="M12 8.5c-1.9 0-3.5 1.6-3.5 3.5v3.5"/>
            <path d="M12 12c-.83 0-1.5.67-1.5 1.5V18"/>
            <path d="M12 5c3.86 0 7 3.14 7 7v2"/>
          </svg>
        </span>
        <span class="pad-ring" id="padRing" aria-hidden="true">
          <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" /></svg>
        </span>
      </button>
      <div class="pad-label">Hold&nbsp;to&nbsp;Enter</div>
    </div>

    <div class="veil"></div>
  </div>
</div>

<script>
  // Dust motes
  const motesEl = document.getElementById('motes');
  for (let i = 0; i < 16; i++) {
    const m = document.createElement('span');
    m.className = 'mote';
    m.style.left = (4 + Math.random() * 92) + '%';
    m.style.animationDuration = (18 + Math.random() * 18) + 's';
    m.style.animationDelay    = (-Math.random() * 32) + 's';
    m.style.setProperty('--drift', ((Math.random() - 0.5) * 100) + 'px');
    m.style.width = m.style.height = (2 + Math.random() * 3) + 'px';
    m.style.opacity = (0.08 + Math.random() * 0.14);
    motesEl.appendChild(m);
  }

  // Hold-to-Enter
  const HOLD_MS = 1200;
  const pad  = document.getElementById('pad');
  const ring = document.getElementById('padRing');
  let holdTimer = null;
  function startHold(e) {
    e.preventDefault();
    if (holdTimer) return;
    pad.classList.add('is-holding');
    ring.classList.add('is-on');
    holdTimer = setTimeout(commit, HOLD_MS + 20);
  }
  function cancelHold() {
    if (!holdTimer) return;
    clearTimeout(holdTimer);
    holdTimer = null;
    pad.classList.remove('is-holding');
    ring.classList.remove('is-on');
  }
  function commit() {
    holdTimer = null;
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = 'home.html'; }, 600);
  }
  pad.addEventListener('pointerdown', startHold);
  pad.addEventListener('pointerup',   cancelHold);
  pad.addEventListener('pointerleave',cancelHold);
  pad.addEventListener('pointercancel',cancelHold);
  window.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !holdTimer) {
      e.preventDefault();
      pad.classList.add('is-holding');
      ring.classList.add('is-on');
      holdTimer = setTimeout(commit, HOLD_MS + 20);
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'Enter' || e.key === ' ') cancelHold();
  });

  // Live clock
  function tickClock() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = hh + ':' + mm + ' IST';
  }
  tickClock();
  setInterval(tickClock, 30000);
</script>
