<!--
  ──────────────────────────────────────────────────────────────────────
  GALLERY v1 — assumptions + reasoning
  ──────────────────────────────────────────────────────────────────────
  Concept
  · An inside screen reached from the home's Gallery tile. A
    three-column hi-fi viewer: left rail of categories + filters,
    center hero plate, right rail of vertical thumbnails. Bottom
    metadata strip carries the project numbers; top bar + footer
    are identical to home so the chrome is continuous across the
    sales-suite chapters.
  · The hero is content-forward. NO tower silhouette this time —
    the paper background carries the warmth, the picture carries
    the show.
  · Editorial tone is The Frank Curator. Numbers are stated. No
    banned-word adjectives. Tagline: "Experience the Vision."

  Layout (1440 × 900 stage)
  · Top bar 76px — Cormorant-free; wordmark at left, eyebrow centre,
    live IST + Worli on the right. The wordmark IS the back button
    (cream-veil fade → home.html).
  · Editorial column at x=44, w=300 — eyebrow, big Cormorant
    "GALLERY", tagline, hairline, category list (5 rows), filter
    cluster (5 collapsible rows), reset link.
  · Hero plate 880px wide between rails — rounded 18px, soft warm
    shadow, ← / → arrows floating outside, counter at bottom, a
    maximize chip at top-right.
  · Right rail w=150 — 5 thumbs stacked, each labelled 01-05 to the
    left of the thumb, active gets a gold ring. A small vertical
    dot column lives between the thumbs and the stage edge.
  · Metadata strip just above the footer — 6 inline stat columns
    in the project's exact phrasing.
  · Footer 56px — same chrome as home; chapter dot 01 is filled.

  Interactions wired
  · Category click → switches the active filter, resets to image 01,
    updates counter and thumbs.
  · Arrow buttons → prev/next with 200ms opacity crossfade on hero.
  · Thumb click → jumps to that index in current category.
  · Filter dropdown rows → chevron rotates, placeholder list opens.
  · Reset filters link → clears filter state, returns to ALL.
  · Brand wordmark (top-left) → cream veil → home.html.
  · "← Threshold" (bottom-right) → cream veil → intro.html.
  · Maximize chip → toggles a .is-max class on the hero plate
    (visual only).
  · Live clock — updates every 30s. Live dot pulses gold.

  Image set (categorized — REAL client renders, go-live)
  · EXTERIORS 05: assets/client/gallery/ext-tower-01..05 (03 portrait).
  · INTERIORS 17: int-living-room, int-dining, int-family-area,
    int-master-suite, int-master-wardrobe, int-bedroom-2/3/4,
    int-study, int-bar, int-office, int-balcony-deck,
    int-entertainment, lobby-1..4.
  · AMENITIES 14: assets/client/amenities/am-* (entrance/amenity lobby,
    bowling, kids play, padel, banquet, restaurant, gym ×2, indoor
    games, aqua lounge, salon & spa, party hall, resident living).
  · LANDSCAPE 03: assets/client/gallery/view-01..03 — the view FROM
    the tower (infinity decks over the Mumbai skyline).
  · ALL = 39. FILM 01: a real HTML5 <video> (teaser.mp4 + poster).
  · Initial active = ALL; initial image = ext-tower-01.

  Each still carries a short editorial caption (Frank Curator voice),
  shown lower-left over the photo. object-fit: cover seats any aspect
  (portrait included) into the plate / thumbs.

  Placeholders / to-wire-later
  · Filter dropdowns show static placeholder options; they do not
    actually filter the image set in this pass. That's a real
    feature — needs metadata per image (time/space/view/mood/
    material) to be tagged before it can do work.
  · If an image fails to load, it falls back to a cream gradient
    with a tiny "image pending" caption (honest placeholder, not
    a stock photo).
  · No tower silhouette intentionally — gallery is image-forward.
-->

<style>
  :root {
    --paper:      #FCFAF4;
    --bone:       #F4F2ED;
    --bone-50:    #F7F5EF;
    --bone-200:   #E8E2D6;
    --warm-grey:  #DAD5CD;
    --taupe-300:  #C2B5A3;
    --taupe-400:  #A89B86;

    --gold-100:   #E8CFA1;
    --gold-200:   #D9B97A;
    --gold-300:   #C9A567;
    --gold-400:   #B89968;
    --gold-500:   #946F38;
    --gold-600:   #6E5A37;

    --onyx-100:   #3A332A;
    --onyx-300:   #2A2620;
    --onyx-500:   #1F1B15;
    --onyx-700:   #1A1814;
    --onyx-900:   #0E0C09;

    --hair-lo:    rgba(148, 111, 56, 0.16);
    --hair:       rgba(148, 111, 56, 0.32);
    --hair-hi:    rgba(148, 111, 56, 0.58);

    --tile-shadow:   0 18px 38px rgba(20, 14, 6, 0.16),
                     0 6px 14px  rgba(20, 14, 6, 0.10);
    --plate-shadow:  0 30px 60px -18px rgba(80, 58, 28, 0.32),
                     0 14px 30px -10px rgba(80, 58, 28, 0.18),
                     0 4px 10px        rgba(40, 28, 10, 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--paper);
    color: var(--onyx-700);
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
    position: fixed; inset: 0;
  }

  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  /* ── Stage scaler — flex-center letterbox ─────────────────────────── */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    padding: 0;   /* edge-to-edge — stage fills the whole viewport */
    display: flex; align-items: center; justify-content: center;
    isolation: isolate;
    /* Flat paper — matches the stage's own paper edge exactly, so the
       letterbox/pillarbox margins on non-16:10 screens (iPad 4:3, 65" 16:9)
       blend seamlessly into the stage with no visible "cut". */
    background: url('assets/bg-paper.png') center/cover no-repeat, var(--paper);
  }
  /* Full-bleed warm wash behind the stage so the letterbox margins match the
     stage's paper edge. STATIC tint (no blend-mode, no animation) — the old
     animated `mix-blend-mode: color` loop forced a full-viewport recomposite
     on every frame, which collided with the hero crossfade and caused the
     image-swap flicker on the Samsung Tab. A flat translucent fill costs
     nothing to composite. */
  #stage-wrap::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    pointer-events: none;
    background-color: rgba(255, 250, 240, 0.04);
  }
  #stage, .stage-inner {
    position: relative;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    z-index: 1;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
  }

  /* ── PAPER BACKGROUND (same artwork as home) ───────────────────── */
  .stage-bg {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: url('assets/bg-paper.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  /* Very subtle grain layer */
  .stage-grain {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.02;
    background-image:
      radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 1px;
    mix-blend-mode: multiply;
  }

  /* Time-of-day cream tint — now a STATIC golden-hour wash. The previous
     `mix-blend-mode: multiply` + 120s dayCycle loop repainted/re-blended the
     entire stage (including the hero image) on every animation frame, which
     is the root cause of image-swap flicker on tablets. A single flat fill
     gives the same warmth with zero per-frame compositing cost. */
  .day-tint {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
    background-color: rgba(255, 240, 210, 0.035);
  }

  /* ── TOP BAR (seamless — paper bg shows through) ────────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    /* Static opaque-ish gradient instead of backdrop-filter: a full-width
       blur layer over the stage forces the GPU to re-sample the backdrop
       every frame the hero changes. The gradient reads identically here. */
    background: linear-gradient(180deg, rgba(252,250,244,0.92), rgba(252,250,244,0) 100%);

  /* ── TAP RESPONSIVENESS — interactive surfaces inside the app ── */

  /* ── HERO PLATE ──────────────────────────────────────────────────── */
  .hero-wrap {
    position: absolute;
    left: 380px;
    top: 108px;
    width: 880px;
    height: 716px;
    z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }
  .hero-plate {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(160deg, var(--bone-50) 0%, var(--bone-200) 60%, var(--warm-grey) 100%);
    box-shadow: var(--plate-shadow);
    border: 1px solid var(--hair-lo);
    transition: box-shadow 260ms ease;
    touch-action: none;
  }
  /* Double-buffered hero: two stacked <img> layers. The NEW image is
     decoded fully, then cross-faded in over the OLD one (opacity only —
     no layout, no src swap on a visible layer), so an undecoded/empty
     frame is never revealed. GPU-compositing hints keep the fade on its
     own layer and off the main-thread paint path — the key to a
     flicker-free swap on the Samsung Tab. */
  .hero-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 220ms ease-out;
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
    will-change: opacity;
    -webkit-transform: translateZ(0);
  }
  .hero-img.is-active { opacity: 1; }
  /* Honest fallback when image fails */
  .hero-fallback {
    position: absolute; inset: 0;
    display: none;
    place-items: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, var(--paper) 0%, var(--bone-50) 55%, var(--bone-200) 100%);
  }
  .hero-fallback.is-on { display: grid; }
  .hero-fallback span {
    font-family: 'Lato', sans-serif;
    font-weight: 400; font-size: 10px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--taupe-400);
    opacity: 0.7;
  }
  /* Inner warm vignette to seat the photo into the paper */
  .hero-plate::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
      radial-gradient(ellipse 110% 100% at 50% 50%,
        transparent 60%,
        rgba(40, 28, 10, 0.18) 100%);
    border-radius: 18px;
  }

  .hero-video {

    z-index: 3;
    background: transparent;        /* no dark plate */

  .hero-video-el {

    width: 100%;

    max-height: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;            /* show the whole frame, no crop */
    display: block;
    border: none;
    border-radius: 0;
    background: var(--onyx-900);    /* letterbox bars only inside the video */
    box-shadow: none;

  .hero-plate.is-film {

  .hero-plate.is-film::after { display: none; }   /* kill inner vignette */

<script>
  // Stage scaler — fit-to-viewport (letterbox on either axis as needed).
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      stage.style.width  = Math.ceil(vw / s) + 'px';   // FULL-SCREEN FILL
      stage.style.height = Math.ceil(vh / s) + 'px';
      window.__galleryScale = s;
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

        }

  const LANDSCAPE = [
    { src: 'assets/client/gallery/view-01.webp', cap: 'Skyline View' },
    { src: 'assets/client/gallery/view-02.webp', cap: 'Pool Deck Over the City' },
    { src: 'assets/client/gallery/view-03.webp', cap: 'Sea Face from Above' },
  ];
  const ALL = [].concat(EXTERIORS, INTERIORS, AMENITIES, LANDSCAPE);

  // Film — a single real video card (replaces the old play-glyph placeholder)
  const FILM = [
    { video: 'assets/client/video/teaser.mp4', poster: 'assets/client/video/teaser-poster.webp', cap: 'A Film of the Tower' },
  ];

  const CATEGORIES = [
    { key: 'ALL',        label: 'All',        count: ALL.length,        icon: 'all',       set: ALL       },
    { key: 'EXTERIORS',  label: 'Exteriors',  count: EXTERIORS.length,  icon: 'exterior',  set: EXTERIORS },
    { key: 'INTERIORS',  label: 'Interiors',  count: INTERIORS.length,  icon: 'interior',  set: INTERIORS },
    { key: 'AMENITIES',  label: 'Amenities',  count: AMENITIES.length,  icon: 'amenities', set: AMENITIES },
    { key: 'LANDSCAPE',  label: 'Landscape',  count: LANDSCAPE.length,  icon: 'landscape', set: LANDSCAPE },
    { key: 'FILM',       label: 'Film',       count: FILM.length,       icon: 'film',      set: FILM, isVideo: true },
  ];

  const FILTERS = [
    { key: 'TIME',   label: 'Time of Day', icon: 'sun',    opts: ['Dawn', 'Noon', 'Golden Hour', 'Dusk', 'Night'] },
    { key: 'SPACE',  label: 'Space Type',  icon: 'home',   opts: ['Living', 'Bedroom', 'Bath', 'Kitchen', 'Terrace'] },
    { key: 'VIEW',   label: 'View',        icon: 'eye',    opts: ['Sea Face', 'Skyline', 'Bridge', 'Garden Court'] },
    { key: 'MOOD',   label: 'Mood',        icon: 'mood',   opts: ['Quiet', 'Warm', 'Cinematic', 'Editorial'] },
    { key: 'MATERIAL', label: 'Material',  icon: 'swatch', opts: ['Travertine', 'Burl Walnut', 'Brushed Bronze', 'Cream Linen'] },
  ];

  // ── State ─────────────────────────────────────────────────────────
  const state = {
    catIndex: 0,   // points into CATEGORIES
    imgIndex: 0,   // points into the active category set
  };
  function currentSet() { return CATEGORIES[state.catIndex].set; }
  function pad2(n) { return String(n).padStart(2, '0'); }

  // ── Render category list ─────────────────────────────────────────
  const catListEl = document.getElementById('catList');
  CATEGORIES.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-row' + (i === 0 ? ' is-active' : '');
    btn.dataset.idx = i;
    btn.innerHTML =
      '<span class="ic">' + ICONS[c.icon] + '</span>' +
      '<span class="label">' + c.label + '</span>' +
      '<span class="count">' + pad2(c.count) + '</span>';
    btn.addEventListener('click', () => setCategory(i));
    catListEl.appendChild(btn);
  });

  // ── Filter list removed (secondary 'Filter By' rail dropped per request).
  const filterListEl = document.getElementById('filterList');   // null now
  if (filterListEl) {
    FILTERS.forEach((f, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter-row';
      btn.dataset.idx = i;
      btn.innerHTML =
        '<span class="ic">' + ICONS[f.icon] + '</span>' +
        '<span class="label">' + f.label + '</span>' +
        '<span class="chev">' + ICONS.chev + '</span>';
      btn.addEventListener('click', () => toggleFilter(i));
      filterListEl.appendChild(btn);
      const drop = document.createElement('div');
      drop.className = 'filter-dropdown';
      drop.innerHTML = f.opts.map(o => '<span>' + o + '</span>').join('');
      filterListEl.appendChild(drop);
    });
  }
  function toggleFilter(i) {
    if (!filterListEl) return;
    const rows = filterListEl.querySelectorAll('.filter-row');
    rows.forEach((r, j) => {
      if (j === i) r.classList.toggle('is-open');
      else r.classList.remove('is-open');
    });
  }

  // ── Render thumbnails + scroll dots ──────────────────────────────
  const thumbsEl = document.getElementById('thumbs');
  const scrollDotsEl = document.getElementById('scrolldots');

  function renderThumbs() {
    thumbsEl.innerHTML = '';
    scrollDotsEl.innerHTML = '';
    const cat = CATEGORIES[state.catIndex];
    const set = currentSet();
    const total = set.length;

    // Render ALL thumbnails — strip is vertically scrollable
    for (let i = 0; i < total; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'thumb' + (i === state.imgIndex ? ' is-active' : '');
      btn.dataset.idx = i;
      if (cat.isVideo) {
        // Film category — dark play-glyph thumb, no image to load
        btn.innerHTML =
          '<span class="tn-num">' + pad2(i + 1) + '</span>' +
          '<span class="tn-frame" style="background:radial-gradient(ellipse 90% 80% at 50% 42%, var(--onyx-300) 0%, var(--onyx-700) 70%, var(--onyx-900) 100%);display:grid;place-items:center;">' +
            '<svg viewBox="0 0 24 24" width="20" height="20" fill="var(--gold-200)" style="margin-left:2px"><path d="M6 4.5l13 7.5-13 7.5z"/></svg>' +
          '</span>';
      } else {
        const item = set[i];
        btn.innerHTML =
          '<span class="tn-num">' + pad2(i + 1) + '</span>' +
          '<span class="tn-frame"><img alt="" loading="lazy" onerror="this.style.display=\'none\'; this.parentNode.style.background=\'linear-gradient(160deg, var(--bone-50) 0%, var(--bone-200) 100%)\';" /></span>';
        const img = btn.querySelector('img');
        img.src = item.src;
        img.alt = item.cap || '';
      }
      btn.addEventListener('click', () => setImage(i));
      thumbsEl.appendChild(btn);
    }

    // Scroll the active thumb into view (centered) when it would be off-screen
    requestAnimationFrame(() => {
      const active = thumbsEl.querySelector('.thumb.is-active');
      if (active && typeof active.scrollIntoView === 'function') {
        const aTop = active.offsetTop;
        const aBot = aTop + active.offsetHeight;
        const sTop = thumbsEl.scrollTop;
        const sBot = sTop + thumbsEl.clientHeight;
        if (aTop < sTop || aBot > sBot) {
          thumbsEl.scrollTop = Math.max(0, aTop - (thumbsEl.clientHeight - active.offsetHeight) / 2);
        }
      }
    });

    // Scroll dots — one per item in current set, but cap at 8 for visual sanity
    const DOT_MAX = 8;
    const dotCount = Math.min(total, DOT_MAX);
    const activeDot = Math.floor((state.imgIndex / Math.max(1, total - 1)) * (dotCount - 1));
    for (let i = 0; i < dotCount; i++) {
      const dot = document.createElement('span');
      dot.className = 'sd' + (i === activeDot ? ' is-active' : '');
      scrollDotsEl.appendChild(dot);
    }
  }

  // ── Hero image + counter ─────────────────────────────────────────
  const heroPlate   = document.getElementById('heroPlate');
  const heroFallbk  = document.getElementById('heroFallback');
  const heroVideo   = document.getElementById('heroVideo');
  const heroVideoEl = document.getElementById('heroVideoEl');
  const heroCap     = document.getElementById('heroCap');
  const counterText = document.getElementById('counterText');

  // Double-buffer: two <img> layers. `frontImg` is the one currently shown;
  // the new frame is loaded + decoded on the back layer, then we swap which
  // layer carries `.is-active`. A monotonically increasing token guards
  // against out-of-order decodes when the user switches rapidly — only the
  // newest request is allowed to reveal.
  const heroImgA = document.getElementById('heroImgA');
  const heroImgB = document.getElementById('heroImgB');
  let frontImg = heroImgA;        // visible layer
  let backImg  = heroImgB;        // hidden layer being prepped
  let heroToken = 0;

  function swapHeroBuffers() {
    const t = frontImg; frontImg = backImg; backImg = t;
  }

  function renderHero() {
    const cat = CATEGORIES[state.catIndex];
    const set = currentSet();
    const item = set[state.imgIndex];

    // Switching the still always returns the viewer to a fit (1×) state.
    resetZoom();

    // Invalidate any in-flight decode from a previous switch.
    const myToken = ++heroToken;

    // Film category → show the real video, hide the photo plate + caption.
    if (cat.isVideo) {
      heroPlate.classList.add('is-film');
      heroFallbk.classList.remove('is-on');
      heroCap.classList.add('is-hidden');
      heroVideo.classList.add('is-on');
      counterText.textContent = pad2(state.imgIndex + 1) + ' / ' + pad2(set.length);
      return;
    }
    heroPlate.classList.remove('is-film');

    // Leaving Film → pause the video so audio/playback stops.
    if (heroVideo.classList.contains('is-on') && heroVideoEl) {
      try { heroVideoEl.pause(); } catch (_) {}
    }
    heroVideo.classList.remove('is-on');
    heroCap.classList.remove('is-hidden');

    const src = item.src;

    // Caption fades with the image.
    heroCap.classList.add('is-fading');

    // Prep the BACK layer with the new src and DECODE it fully before we
    // touch any opacity — this guarantees the layer we fade in is a complete,
    // painted frame, never a blank/half-loaded one (the flicker source).
    backImg.alt = item.cap || 'Gallery image';

    const reveal = () => {
      if (myToken !== heroToken) return;   // a newer switch superseded us
      heroFallbk.classList.remove('is-on');
      // Cross-fade: bring the back layer in, drop the front layer out.
      backImg.classList.add('is-active');
      frontImg.classList.remove('is-active');
      swapHeroBuffers();
      heroCap.textContent = item.cap || '';
      heroCap.classList.remove('is-fading');
    };
    const fail = () => {
      if (myToken !== heroToken) return;
      heroFallbk.classList.add('is-on');
      heroCap.textContent = item.cap || '';
      heroCap.classList.remove('is-fading');
    };

    backImg.src = src;
    if (backImg.decode) {
      backImg.decode().then(reveal).catch(fail);
    } else if (backImg.complete && backImg.naturalWidth) {
      reveal();
    } else {
      backImg.addEventListener('load',  reveal, { once: true });
      backImg.addEventListener('error', fail,  { once: true });
    }

    counterText.textContent = pad2(state.imgIndex + 1) + ' / ' + pad2(set.length);
  }

  // ── HERO ZOOM ENGINE ─────────────────────────────────────────────
  // In-place pan/zoom of the active still. The image rides on a
  // transformed stage clipped by the plate (overflow:hidden). Panning is
  // clamped so the scaled image can never be dragged past the frame.
  // Same interaction feel as the floor-plan viewer; reset on image swap.
  const zoomStage = document.getElementById('heroZoomStage');
  const zoomInd   = document.getElementById('heroZoomInd');
  const Z_MIN = 1, Z_MAX = 4;
  const zoom = { scale: 1, tx: 0, ty: 0 };

  function clampPan() {
    // At scale s the stage grows by (s-1) of the plate size in each axis;
    // max translate (each direction) is half that overflow.
    const r = heroPlate.getBoundingClientRect();
    const s = window.__galleryScale || 1;       // stage scaler factor
    const w = r.width / s, h = r.height / s;     // unscaled plate size (1440-space)
    const maxX = Math.max(0, (zoom.scale - 1) * w / 2);
    const maxY = Math.max(0, (zoom.scale - 1) * h / 2);
    zoom.tx = Math.max(-maxX, Math.min(maxX, zoom.tx));
    zoom.ty = Math.max(-maxY, Math.min(maxY, zoom.ty));
  }

  function applyZoom(animate) {
    clampPan();
    zoomStage.style.transition = animate ? '' : 'none';
    zoomStage.style.transform =
      'translate(' + zoom.tx + 'px,' + zoom.ty + 'px) scale(' + zoom.scale + ')';
    const zoomed = zoom.scale > 1.01;
    zoomStage.classList.toggle('is-zoomed', zoomed);
    zoomInd.textContent = Math.round(zoom.scale * 100) + '%';
    zoomInd.classList.toggle('is-on', zoomed);
  }

  function setZoom(next, animate) {
    zoom.scale = Math.max(Z_MIN, Math.min(Z_MAX, next));
    if (zoom.scale <= 1.01) { zoom.tx = 0; zoom.ty = 0; }
    applyZoom(animate !== false);
  }

  function resetZoom() {
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    if (zoomStage) {
      zoomStage.style.transition = 'none';
      zoomStage.style.transform = 'translate(0,0) scale(1)';
      zoomStage.classList.remove('is-zoomed', 'is-panning');
    }
    if (zoomInd) { zoomInd.textContent = '100%'; zoomInd.classList.remove('is-on'); }
  }

  // Button controls
  document.getElementById('heroZoomIn').addEventListener('click', () => setZoom(zoom.scale + 0.5));
  document.getElementById('heroZoomOut').addEventListener('click', () => setZoom(zoom.scale - 0.5));
  document.getElementById('heroZoomFit').addEventListener('click', () => resetZoom());

  // Wheel / trackpad zoom (no Film card)
  heroPlate.addEventListener('wheel', e => {
    if (heroPlate.classList.contains('is-film')) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.18 : 0.18;
    setZoom(zoom.scale + delta);
  }, { passive: false });

  // Double-click / double-tap toggles between fit and 2×
  heroPlate.addEventListener('dblclick', e => {
    if (heroPlate.classList.contains('is-film')) return;
    e.preventDefault();
    if (zoom.scale > 1.01) resetZoom();
    else setZoom(2);
  });

  // Pointer pan + two-finger pinch
  const pointers = new Map();
  let panning = false, panSx = 0, panSy = 0, panTx0 = 0, panTy0 = 0;
  let pinchStart = null;

  heroPlate.addEventListener('pointerdown', e => {
    if (heroPlate.classList.contains('is-film')) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1 && zoom.scale > 1.01) {
      panning = true;
      panSx = e.clientX; panSy = e.clientY;
      panTx0 = zoom.tx; panTy0 = zoom.ty;
      zoomStage.classList.add('is-panning');
      try { heroPlate.setPointerCapture(e.pointerId); } catch (_) {}
    }
  });
  heroPlate.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2) {
      panning = false;
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchStart == null) {
        pinchStart = { dist, scale: zoom.scale };
      } else {
        setZoom(pinchStart.scale * (dist / pinchStart.dist), false);
      }
      return;
    }

    if (panning && zoom.scale > 1.01) {
      // clientX/Y are in screen px; divide by stage scaler to get 1440-space.
      const s = window.__galleryScale || 1;
      zoom.tx = panTx0 + (e.clientX - panSx) / s;
      zoom.ty = panTy0 + (e.clientY - panSy) / s;
      applyZoom(false);
    }
  });
  const onZoomUp = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) {
      panning = false;
      zoomStage.classList.remove('is-panning');
      applyZoom(true);   // settle clamp with a smooth ease
      try { heroPlate.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  };
  heroPlate.addEventListener('pointerup', onZoomUp);
  heroPlate.addEventListener('pointercancel', onZoomUp);

  // ── Category / image actions ─────────────────────────────────────
  function setCategory(i) {
    if (i === state.catIndex) return;
    state.catIndex = i;
    state.imgIndex = 0;
    catListEl.querySelectorAll('.cat-row').forEach((el, j) => {
      el.classList.toggle('is-active', j === i);
    });
    renderHero();
    renderThumbs();
  }
  function setImage(i) {
    const set = currentSet();
    state.imgIndex = (i + set.length) % set.length;
    renderHero();
    renderThumbs();
  }
  function prevImage() { setImage(state.imgIndex - 1); }
  function nextImage() { setImage(state.imgIndex + 1); }

  // ── Full-screen image viewer (lightbox) ─────────────────────────
  const lb        = document.getElementById('lightbox');
  const lbStage   = document.getElementById('lbStage');
  const lbImg     = document.getElementById('lbImg');
  const lbCap     = document.getElementById('lbCap');
  const lbCounter = document.getElementById('lbCounter');
  const lbClose   = document.getElementById('lbClose');
  const lbPrev    = document.getElementById('lbPrev');
  const lbNext    = document.getElementById('lbNext');
  const lbHint    = document.getElementById('lbHint');
  const lbFsBtn   = document.getElementById('heroZoomFs');
  let lbOpen = false;
  const lz = { scale: 1, tx: 0, ty: 0 };

  function lbApply(animate) {
    lbImg.style.transition = animate
      ? 'transform 300ms cubic-bezier(0.16,0.84,0.32,1)'
      : 'transform 0s';
    lbImg.style.transform = 'translate(' + lz.tx + 'px,' + lz.ty + 'px) scale(' + lz.scale + ')';
    lbImg.classList.toggle('is-zoomed', lz.scale > 1.01);
    lbHint.textContent = lz.scale > 1.01
      ? Math.round(lz.scale * 100) + '%  ·  drag to pan'
      : 'Scroll or pinch to zoom · Esc to close';
  }
  function lbClampPan() {
    const r = lbImg.getBoundingClientRect();
    const baseW = r.width / lz.scale, baseH = r.height / lz.scale;
    const maxX = Math.max(0, (baseW * lz.scale - window.innerWidth)  / 2 + 8);
    const maxY = Math.max(0, (baseH * lz.scale - window.innerHeight) / 2 + 8);
    lz.tx = Math.max(-maxX, Math.min(maxX, lz.tx));
    lz.ty = Math.max(-maxY, Math.min(maxY, lz.ty));
  }
  function lbSetZoom(next, animate) {
    lz.scale = Math.max(1, Math.min(4, next));
    if (lz.scale === 1) { lz.tx = 0; lz.ty = 0; }
    else lbClampPan();
    lbApply(animate !== false);
  }
  function lbResetZoom() { lz.scale = 1; lz.tx = 0; lz.ty = 0; lbApply(false); }

  function lbRender() {
    const cat = CATEGORIES[state.catIndex];
    if (cat.isVideo) return;                 // film handled by native player
    const set = currentSet();
    const item = set[state.imgIndex];
    lbResetZoom();
    lbImg.style.opacity = '0';
    const tmp = new Image();
    tmp.onload = () => { lbImg.src = item.src; lbImg.style.opacity = '1'; };
    tmp.onerror = () => { lbImg.src = item.src; lbImg.style.opacity = '1'; };
    tmp.src = item.src;
    lbImg.alt = item.cap || 'Gallery image';
    lbCap.textContent = item.cap || '';
    lbCounter.textContent = pad2(state.imgIndex + 1) + ' / ' + pad2(set.length);
    const single = set.length <= 1;
    lbPrev.classList.toggle('is-hidden', single);
    lbNext.classList.toggle('is-hidden', single);
  }
  function lbOpenView() {
    if (CATEGORIES[state.catIndex].isVideo) return;
    lbOpen = true;
    lb.classList.add('is-open');
    document.body.classList.add('lb-locked');
    lbRender();
  }
  function lbCloseView() {
    lbOpen = false;
    lb.classList.remove('is-open');
    document.body.classList.remove('lb-locked');
    lbResetZoom();
  }
  // keep lightbox in sync when the underlying still changes
  function lbStep(dir) { setImage(state.imgIndex + dir); if (lbOpen) lbRender(); }

  if (lbFsBtn) lbFsBtn.addEventListener('click', lbOpenView);
  lbClose.addEventListener('click', lbCloseView);
  lbPrev.addEventListener('click', () => lbStep(-1));
  lbNext.addEventListener('click', () => lbStep(1));
  // tap the dark backdrop (not the image) closes
  lbStage.addEventListener('click', e => { if (e.target === lbStage && lz.scale <= 1.01) lbCloseView(); });
  // double-click / double-tap toggles zoom
  lbImg.addEventListener('dblclick', e => {
    e.preventDefault();
    if (lz.scale > 1.01) lbResetZoom();
    else { lz.scale = 2.4; lbClampPan(); lbApply(true); }
  });
  // wheel zoom
  lb.addEventListener('wheel', e => {
    if (!lbOpen) return;
    e.preventDefault();
    lbSetZoom(lz.scale + (e.deltaY < 0 ? 0.4 : -0.4), false);
  }, { passive: false });

  // pointer drag-to-pan + two-finger pinch
  const lbPts = new Map();
  let lbPinchBase = 0, lbScaleBase = 1, lbPanStart = null;
  lbImg.addEventListener('pointerdown', e => {
    if (!lbOpen) return;
    lbImg.setPointerCapture(e.pointerId);
    lbPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (lbPts.size === 2) {
      const p = [...lbPts.values()];
      lbPinchBase = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      lbScaleBase = lz.scale;
    } else if (lz.scale > 1.01) {
      lbPanStart = { x: e.clientX - lz.tx, y: e.clientY - lz.ty };
      lbImg.classList.add('is-panning');
    }
  });
  lbImg.addEventListener('pointermove', e => {
    if (!lbPts.has(e.pointerId)) return;
    lbPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (lbPts.size === 2 && lbPinchBase) {
      const p = [...lbPts.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      lbSetZoom(lbScaleBase * (d / lbPinchBase), false);
    } else if (lbPanStart && lz.scale > 1.01) {
      lz.tx = e.clientX - lbPanStart.x;
      lz.ty = e.clientY - lbPanStart.y;
      lbClampPan(); lbApply(false);
    }
  });
  function lbPtrUp(e) {
    lbPts.delete(e.pointerId);
    if (lbPts.size < 2) lbPinchBase = 0;
    if (lbPts.size === 0) { lbPanStart = null; lbImg.classList.remove('is-panning'); lbApply(true); }
  }
  lbImg.addEventListener('pointerup', lbPtrUp);
  lbImg.addEventListener('pointercancel', lbPtrUp);

  // Keyboard arrows (prev/next overlay buttons removed — keyboard still works)
  window.addEventListener('keydown', e => {
    if (lbOpen) {
      if (e.key === 'Escape')     lbCloseView();
      if (e.key === 'ArrowLeft')  lbStep(-1);
      if (e.key === 'ArrowRight') lbStep(1);
      if (e.key === '+' || e.key === '=') lbSetZoom(lz.scale + 0.4);
      if (e.key === '-' || e.key === '_') lbSetZoom(lz.scale - 0.4);
      return;
    }
    if (e.key === 'ArrowLeft')  prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

  // Reset filters button removed with the 'Filter By' rail.
  const _resetBtn = document.getElementById('resetBtn');
  if (_resetBtn) _resetBtn.addEventListener('click', () => {
    if (filterListEl) filterListEl.querySelectorAll('.filter-row').forEach(r => r.classList.remove('is-open'));
    setCategory(0);
  });

  // ── Footer chapter dots (Gallery = 01 active) ───────────────────
  const footerDotsEl = document.getElementById('footerDots');
  for (let i = 0; i < 8; i++) {
    const d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' is-active' : '');
    footerDotsEl.appendChild(d);
  }

  // ── Cream-veil navigation transitions ───────────────────────────
  const veilEl = document.getElementById('veil');

  function navFade(href) {
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = href; }, 220);
  }

  const brandLink = document.getElementById('brandLink');
  if (brandLink) {
    brandLink.addEventListener('click', e => {
      e.preventDefault();
      navFade('home.html?from=gallery');
    });
  }
  const ecBackBtn = document.getElementById('ecBackBtn');
  if (ecBackBtn) {
    const goBack = (e) => { if (e) e.preventDefault(); navFade('home.html?from=gallery'); };
    ecBackBtn.addEventListener('click', goBack);
    ecBackBtn.addEventListener('touchend', goBack, { passive: false });
