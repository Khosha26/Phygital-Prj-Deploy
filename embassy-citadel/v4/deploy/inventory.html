<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Embassy Citadel — Inventory</title>

<!--
  INVENTORY v2 — Living Section selector
  · Inline SVG (viewBox 0 0 2752 2064) scaled to ~820px tall inside the
    1440×900 stage. Base layer = assets/inventory/tower-types.webp.
  · 7 hit-shapes (exact coords from assets/inventory/inventory-types.svg)
    overlay the render as real, keyboard-accessible buttons.
  · Each section carries a per-type linearGradient + soft glow that animates
    0 → 0.70 on hover and stays lit when selected. Thin bronze hover stroke.
  · Gray leader-lines/dots from the source SVG anchor each type label
    (swatch + name). A side COLOR INDEX legend lists all 8 types; the matching
    row lights up when its section is hovered or selected.
  · Click a section → sessionStorage 'ec.section' → inventory-floors.html.
  · SECTION→LEVELS mapping inlined (shared with the floors screen).
  · Keeps the stage scaler, #stage-wrap responsiveness, PWA blocks, and the
    brand-back / topbar navigation.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FCFAF4; --bone: #F4F2ED; --bone-50: #F7F5EF; --bone-200: #E8E2D6;
    --gold-500: #946F38; --gold-300: #C9A567; --gold-200: #D9B97A;
    --onyx-700: #1A1814; --onyx-100: #3A332A; --taupe-400: #A89B86;
    --hair: rgba(148, 111, 56, 0.32);
    --hair-hi: rgba(148, 111, 56, 0.55);
    --hair-lo: rgba(148, 111, 56, 0.16);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--paper); color: var(--onyx-700);
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none; overflow: hidden;
    position: fixed; inset: 0;
  }
  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 0;   /* edge-to-edge — stage fills the whole viewport */
    isolation: isolate;
    background: url('assets/bg-paper.png') center/cover no-repeat, var(--paper);
  }
  #stage, .stage-inner {
    position: relative;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    z-index: 1;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
    background: transparent;
    pointer-events: none;           /* chrome re-enables below; gaps pass to tower */
  }
  .inv-head, .veil { pointer-events: none; }
  .legend, .topbar, .ec-back-btn, .ec-brand-back, .legend-row { pointer-events: auto; }

  /* ── PAPER BACKGROUND (matches home.html) ─────────────────────── */
  .stage-bg {
    display: none;
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 0;
    background-color: var(--bone);
    background-image: url('assets/bg-paper.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  /* ── HEADLINE / EYEBROW (top-centre over the section) ──────────── */
  .inv-head {
    position: absolute;
    top: 96px; left: 56px;
    z-index: 6;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
    opacity: 0;
    animation: headIn 900ms cubic-bezier(0.22, 1, 0.36, 1) 320ms forwards;
  }
  @media (prefers-reduced-motion: reduce){ .sect-fill,.sect-glow{ animation:none; opacity:.28 } }
  @keyframes headIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .inv-head .eyebrow {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-500); opacity: 0.85;
  }
  .inv-head .title {
    font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
     font-weight: 400;
    font-size: 46px; line-height: 1.02;
    letter-spacing: 0.02em;
    color: var(--onyx-700);
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .inv-head .sub {
    font-family: 'Lato', sans-serif;
    font-weight: 400; font-size: 11px;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--taupe-400);
    margin-top: 2px;
  }

  /* ── TOWER STAGE — inline SVG holder ──────────────────────────── */
  /* Zoomed-in hero tower: holder enlarged + centered in the 1440×900
     stage. viewBox 2752×2064 (1.333:1) preserved, so all sections,
     leader-lines and labels scale proportionally and stay anchored.
     Nudged slightly left so the slim right-side legend never collides. */
  .inv-stage {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: block;
    pointer-events: none;           /* container only; section hit-shapes re-enable */
  }
  .inv-stage svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* The base tower render: lift vibrancy a touch to sit on paper */
  .tower-base { filter: brightness(1.05) contrast(1.04) saturate(1.04); }

  /* ── SECTION BUTTONS (hit shapes) ─────────────────────────────── */
  .sect {
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: filter 240ms ease;
  }
  /* fill is the per-type gradient; ONLY opacity animates (cheap, GPU-composited).
     No SVG filter here — the old animated feGaussianBlur was the flicker source. */
  .sect-fill {
    opacity: 0.10;
    animation: sectPulse 3.8s ease-in-out infinite;
    transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    will-change: opacity;
    transform: translateZ(0);            /* promote to its own GPU layer */
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  /* the soft outer glow halo — soft edge now comes from a STATIC CSS blur
     (computed once, GPU-cached) instead of an animated SVG feGaussianBlur. */
  .sect-glow {
    opacity: 0.10;
    animation: sectPulse 3.8s ease-in-out infinite;
    transition: opacity 360ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    filter: blur(11px);                  /* static soft halo, not animated */
    will-change: opacity;
    transform: translateZ(0);
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  /* the thin bronze stroke (idle invisible) */
  .sect-edge {
    fill: none;
    stroke: var(--gold-500);
    stroke-width: 4;
    opacity: 0;
    transition: opacity 240ms ease;
    pointer-events: none;
    vector-effect: non-scaling-stroke;
  }
  /* the invisible hit target sits on top so pointer events are reliable */
  .sect-hit {
    fill: rgba(0,0,0,0.001);
    cursor: pointer;
    outline: none;
    pointer-events: auto;
  }


  /* auto-glow loop — solid bands breathe 10%↔60% on their own */
  @keyframes sectPulse { 0%, 100% { opacity: 0.10; } 50% { opacity: 0.60; } }
  .sect[data-type="mansion"]     .sect-fill, .sect[data-type="mansion"]     .sect-glow { animation-delay: 0s; }
  .sect[data-type="residential"] .sect-fill, .sect[data-type="residential"] .sect-glow { animation-delay: -.5s; }
  .sect[data-type="refuge"]      .sect-fill, .sect[data-type="refuge"]      .sect-glow { animation-delay: -1s; }
  .sect[data-type="amenity"]     .sect-fill, .sect[data-type="amenity"]     .sect-glow { animation-delay: -1.5s; }
  .sect[data-type="parking"]     .sect-fill, .sect[data-type="parking"]     .sect-glow { animation-delay: -2s; }
  .sect[data-type="entrance"]    .sect-fill, .sect[data-type="entrance"]    .sect-glow { animation-delay: -2.5s; }
  .sect[data-type="basement"]    .sect-fill, .sect[data-type="basement"]    .sect-glow { animation-delay: -3s; }

  /* hover / focus / selected lighting — overrides the loop to a stable solid */
  .sect.is-hot .sect-fill { opacity: 0.72; animation: none; }
  .sect.is-hot .sect-glow { opacity: 0.66; animation: none; }
  .sect.is-hot .sect-edge { opacity: 0.85; }

  .sect.is-selected .sect-fill { opacity: 0.80; animation: none; }
  .sect.is-selected .sect-glow { opacity: 0.78; animation: none; }
  .sect.is-selected .sect-edge { opacity: 1; stroke-width: 5; }

  .sect-hit:focus-visible { outline: none; }
  .sect.is-focus .sect-fill { opacity: 0.72; animation: none; }
  .sect.is-focus .sect-glow { opacity: 0.66; animation: none; }
  .sect.is-focus .sect-edge { opacity: 0.95; }

  /* ── LEADER-LINE LABELS (anchored to gray pointers) ───────────── */
  .lead-line { stroke: var(--taupe-400); stroke-width: 2.4; opacity: 0.5; }
  .lead-dot  { fill: var(--taupe-400); opacity: 0.6; }
  .lead-line, .lead-dot { transition: stroke 240ms ease, fill 240ms ease, opacity 240ms ease; }

  .lbl-grp { pointer-events: none; }
  .lbl-grp .lbl-swatch { rx: 2; }
  .lbl-grp .lbl-name {
    font-family: 'Lato', sans-serif;
    font-weight: 600; font-size: 27px;
    letter-spacing: 0.5px;
    fill: var(--onyx-700);
  }
  .lbl-grp .lbl-kicker {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 17px;
    letter-spacing: 3px; text-transform: uppercase;
    fill: var(--taupe-400);
  }
  /* leader brightens to the type colour when its section is active */
  .lead-grp.is-hot .lead-line { opacity: 0.95; }
  .lead-grp.is-hot .lead-dot  { opacity: 1; }
  .lead-grp.is-hot .lbl-name  { fill: var(--gold-500); }

  /* ── SIDE COLOR INDEX LEGEND ──────────────────────────────────── */
  /* Slimmer card so the enlarged tower stays the hero and never collides */
  .legend {
    position: absolute;
    right: 28px; top: 50%;
    transform: translateY(-50%);
    z-index: 6;
    width: 204px;
    padding: 18px 16px 16px;
    border: 1px solid var(--hair-lo);
    border-radius: 13px;
    background: linear-gradient(180deg, rgba(252,250,244,0.88), rgba(247,245,239,0.74));
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    box-shadow: 0 12px 40px rgba(26,24,20,0.06);
    opacity: 0;
    animation: legIn 900ms cubic-bezier(0.22, 1, 0.36, 1) 520ms forwards;
  }
  @keyframes legIn {
    from { opacity: 0; transform: translateY(-50%) translateX(10px); }
    to   { opacity: 1; transform: translateY(-50%) translateX(0); }
  }
  .legend-title {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 9px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold-500);
    margin-bottom: 11px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--hair-lo);
  }
  .legend-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 7px; margin: 0 -7px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 200ms ease;
    min-height: 30px;
  }
  .legend-row + .legend-row { margin-top: 1px; }
  .legend-row .sw {
    width: 14px; height: 14px; border-radius: 3px;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.18);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .legend-row .nm {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 12.5px;
    letter-spacing: 0.01em;
    color: var(--onyx-100);
    transition: color 200ms ease;
  }
  .legend-row .ct {
    margin-left: auto;
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--taupe-400);
    font-variant-numeric: tabular-nums;
    transition: color 200ms ease;
  }
  .legend-row.is-disabled { opacity: 0.5; cursor: default; }
  .legend-row.is-hot {
    background: rgba(148,111,56,0.08);
  }
  .legend-row.is-hot .nm { color: var(--onyx-700); font-weight: 600; }
  .legend-row.is-hot .ct { color: var(--gold-500); }
  .legend-row.is-hot .sw {
    transform: scale(1.18);
    box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.18), 0 0 10px var(--glow, rgba(148,111,56,0.4));
  }
  .legend-hint {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--hair-lo);
    font-family: 'Lato', sans-serif;
    font-weight: 400; font-size: 9px;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--taupe-400);
    text-align: center;
  }

  /* ── TOP BAR ──────────────────────────────────────────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    background: linear-gradient(180deg, rgba(252,250,244,0.55), rgba(252,250,244,0) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .ec-brand-back {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: opacity 240ms ease, transform 240ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    min-height: 44px;
  }
  .ec-brand-back:hover { opacity: 0.78; transform: translateX(-1px); }
  .ec-brand-back:focus-visible { outline: none; opacity: 0.78; }
  .ec-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 92px; min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 220ms ease, color 220ms ease,
                border-color 220ms ease, transform 200ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    -webkit-appearance: none; appearance: none;
  }
  .ec-back-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .ec-back-btn:active { transform: scale(0.96); }
  .ec-back-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-500); }
  .ec-back-btn .arr { font-size: 13px; line-height: 1; transform: translateY(-0.5px); letter-spacing: 0; }
  button, [role="button"], a[href] {
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .brand-wordmark { width: 156px; height: 43.2px; color: var(--onyx-700); }
  .brand-wordmark svg { width: 100%; height: 100%; display: block; }

  /* ── Veil (cream fade) ────────────────────────────────────────── */
  .veil {
    position: absolute; inset: 0;
    background: var(--bone);
    opacity: 0;
    pointer-events: none;
    z-index: 99;
    transition: opacity 220ms ease-in-out;
  }
  body.is-leaving .veil { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .inv-head, .legend { animation: none; opacity: 1; transform: translateY(-50%); }
    .inv-head { transform: none; }
  }
</style>

<script>
  // Stage scaler — scale-to-fit (contain).
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      // FULL-SCREEN FILL: grow the stage to exactly cover the viewport. Uniform
      // scale (no distortion); design dims stay >= 1440x900 so no content is
      // cropped; the surplus is breathing room around the anchored chrome.
      stage.style.width  = Math.ceil(vw / s) + 'px';
      stage.style.height = Math.ceil(vh / s) + 'px';
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);

    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

<script>
  /* LOCAL PREVIEW GUARD — on localhost, never let a stale service worker /
     cache mask live edits. Production (real domain) is unaffected. */
  (function () {
    var h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h === '') {
      window.__EC_LOCAL = true;
      try {
        if ('serviceWorker' in navigator && !window.__EC_LOCAL) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
        }
      } catch (e) {}
    }
  })();
</script>

<!-- Embassy Citadel wordmark symbol (top-left back button) -->

<script>
  // ── Brand wordmark (top-left) → back to home with cream veil ────
  function invNavBack(e) {
    if (e) e.preventDefault();
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = 'home.html'; }, 220);
  }
  document.getElementById('brandLink').addEventListener('click', invNavBack);
  const ecBackBtn = document.getElementById('ecBackBtn');
  if (ecBackBtn) {
    ecBackBtn.addEventListener('click', invNavBack);
    ecBackBtn.addEventListener('touchend', invNavBack, { passive: false });
  }

  // ── Build the side legend from EC_SECTIONS ─────────────────────
  (function buildLegend() {
    const wrap = document.getElementById('legendRows');
    if (!wrap) return;
    window.EC_SECTION_ORDER.forEach(function (k) {
      const s = window.EC_SECTIONS[k];
      if (!s) return;
      const row = document.createElement('div');
      row.className = 'legend-row' + (s.legendOnly ? ' is-disabled' : '');
      row.dataset.type = k;
      row.style.setProperty('--glow', s.glow);
      const count = s.levels.length;
      row.innerHTML =
        '<span class="sw" style="background:linear-gradient(135deg,' + s.from + ',' + s.to + ')"></span>' +
        '<span class="nm">' + s.name + '</span>' +
        '<span class="ct">' + count + '</span>';
      wrap.appendChild(row);
    });
  })();

  // ── Hover / select wiring across tower groups + legend rows ────
  (function wireSections() {
    const sectGroups = Array.from(document.querySelectorAll('.sect[data-type]'));
    const leadGroups = Array.from(document.querySelectorAll('.lead-grp[data-type]'));
    const legendRows = Array.from(document.querySelectorAll('.legend-row[data-type]'));
    let selected = null;

    function groupsFor(type) { return sectGroups.filter(g => g.dataset.type === type); }
    function leadsFor(type)  { return leadGroups.filter(g => g.dataset.type === type); }
    function rowFor(type)    { return legendRows.find(r => r.dataset.type === type); }

    function setHot(type, on) {
      groupsFor(type).forEach(g => g.classList.toggle('is-hot', on));
      leadsFor(type).forEach(g => g.classList.toggle('is-hot', on || (selected === type)));
      const row = rowFor(type);
      if (row) row.classList.toggle('is-hot', on || (selected === type));
    }

    function select(type, originX, originY) {
      const cfg = window.EC_SECTIONS[type];
      if (!cfg || cfg.legendOnly) return;
      selected = type;
      sectGroups.forEach(g => g.classList.toggle('is-selected', g.dataset.type === type));
      leadGroups.forEach(g => g.classList.toggle('is-hot', g.dataset.type === type));
      legendRows.forEach(r => r.classList.toggle('is-hot', r.dataset.type === type));
      // Store + navigate
      try { sessionStorage.setItem('ec.section', type); } catch (_) {}
      const vw = window.innerWidth || 1440, vh = window.innerHeight || 900;
      const ox = Math.max(0, Math.min(100, ((originX || vw/2) / vw) * 100));
      const oy = Math.max(0, Math.min(100, ((originY || vh/2) / vh) * 100));
      document.body.classList.remove('is-leaving', 'is-firing');
      document.body.classList.add('is-leaving');
      setTimeout(function () {
        window.location.href = 'inventory-floors.html?ox=' + ox.toFixed(2) + '&oy=' + oy.toFixed(2);
      }, 200);
    }

    // Tower hit shapes
    sectGroups.forEach(function (g) {
      const type = g.dataset.type;
      const hit = g.querySelector('.sect-hit');
      if (!hit) return;
      g.addEventListener('mouseenter', () => setHot(type, true));
      g.addEventListener('mouseleave', () => setHot(type, false));
      hit.addEventListener('focus', () => { g.classList.add('is-focus'); setHot(type, true); });
      hit.addEventListener('blur',  () => { g.classList.remove('is-focus'); setHot(type, false); });
      hit.addEventListener('click', (e) => { e.preventDefault(); select(type, e.clientX, e.clientY); });
      hit.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          const r = hit.getBoundingClientRect();
          select(type, r.left + r.width / 2, r.top + r.height / 2);
        }
      });
    });

    // Legend rows mirror hover + allow selection
    legendRows.forEach(function (row) {
      const type = row.dataset.type;
      const cfg = window.EC_SECTIONS[type];
      row.addEventListener('mouseenter', () => setHot(type, true));
      row.addEventListener('mouseleave', () => setHot(type, false));
      if (cfg && !cfg.legendOnly) {
        row.addEventListener('click', () => {
          const g = groupsFor(type)[0];
          const r = g ? g.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2, width: 0, height: 0 };
          select(type, r.left + r.width / 2, r.top + r.height / 2);
        });
      }
    });
  })();

  // ── BFCACHE / back-navigation guard ────────────────────────────
  (function () {
    function clearLeave() { document.body.classList.remove('is-leaving', 'is-firing'); }
    window.addEventListener('pageshow', clearLeave);
    window.addEventListener('popstate', clearLeave);
  })();
</script>
