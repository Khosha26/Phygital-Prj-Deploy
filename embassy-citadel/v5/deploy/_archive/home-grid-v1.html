<!--
  ──────────────────────────────────────────────────────────────────────
  HOME v12 — assumptions + reasoning
  ──────────────────────────────────────────────────────────────────────

  DESIGN CONCEPT
  · Metaphor: the building IS the navigation. Left = architectural
    east-elevation cross-section of the 79-floor tower with a bronze
    elevator car that travels to the altitude of whichever chapter the
    user is reading on the right.
  · Editorial chapter index, not a dashboard: large italic numerals,
    hairline rules, no card chrome, ample whitespace.
  · Reference moods: Pentagram annual report, Bottega Veneta lookbook,
    Kenya Hara restraint, The Drawing Center, Atelier Bow-Wow drawings.

  LAYOUT DECISIONS
  · Stage is the locked 1440×900 contract (contain on landscape, cover
    when viewport aspect < 1.55× stage aspect).
  · Left column 38% (tower section), right column 62% (chapter grid).
  · Chapters arranged 2 cols × 4 rows on right — chose grid over a
    single vertical list because (a) Tab S7 landscape rewards two
    columns of editorial reading, (b) keeps the elevator-to-card
    guide-line short, (c) lets the eye sweep ground-floor chapters at
    bottom and sky-floor chapters at top, mirroring the building.

  INTERACTION MODEL
  · Hover/pointerenter on a chapter card:
      - elevator car slides (700ms cubic-bezier 0.22,1,0.36,1)
        to that chapter's tower altitude (mapped from floor range)
      - thin bronze guide-line draws from elevator -> card
      - card title shifts bone -> bronze-light
      - hairline rule extends from 30% to 100% width
      - background tint adds rgba(217,185,122,0.04)
      - meta line slides up 8px + fades in (300ms)
      - floor counter under section updates to chapter's floor range
  · Click on card: bronze veil flashes (600ms), then navigates.

  NAV TARGETS
      01 GALLERY      -> ../screen-02-gallery.html
      02 MASTERPLAN   -> ../screen-03-masterplan.html
      03 INVENTORY    -> ../screen-05-inventory.html
      04 FLOOR PLANS  -> ../screen-06-floor-plans.html
      05 AMENITIES    -> ../screen-04-amenities.html
      06 LOCATION     -> ../screen-07-location.html
      07 TOOLS        -> ../screen-08-tools.html
      08 ABOUT        -> ../screen-01-overview.html

  PLACEHOLDERS / TO-WIRE-LATER
  · Inventory counts ("12 of 158 residences available · 4 BHK from
    ₹85 Cr") are hardcoded — wire to real data layer later.
  · Time ticker uses local clock — fine for kiosk, but a sales suite
    might want the operator's set time/timezone.
  · Tower section is CSS+SVG — accurate enough for the metaphor; if
    we ever want a true building elevation we'd swap in an SVG export.

  TECH CONTRACT KEPT
  · Pure HTML + CSS + vanilla JS. No React, no Babel, no bundlers.
  · Stage architecture: #stage-wrap (fixed inset:0) + #stage
    (transformed scale, 1440×900). Same scaling logic as Living Tree.
  · iOS hardening: gesture/double-tap blocked, touch-action none, no
    tap highlight, no user-select, no pinch zoom.
  · Inline logo SVG (stacked triangles). Cormorant + Inter only.
-->

<style>
  :root {
    --bone:        #F4F2ED;
    --warm-grey:   #DAD5CD;
    --onyx:        #010000;
    --onyx-deep:   #0E0C09;
    --olive:       #9B9378;
    --taupe:       #C2B5A3;
    --bronze:      #E07E27;
    --bronze-lite: #D9B97A;
    --bronze-mid:  #C9A567;
    --bronze-deep: #946F38;

    --hair:        rgba(217, 185, 122, 0.18);
    --hair-soft:   rgba(217, 185, 122, 0.08);
    --hair-strong: rgba(217, 185, 122, 0.32);

    --ease-arc:    cubic-bezier(0.22, 1, 0.36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--onyx-deep);
    color: var(--bone);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* ── Stage scaffolding (Living Tree-compatible) ─────────── */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    background:
      radial-gradient(ellipse at center,
        var(--onyx-deep) 0%,
        #060503 70%,
        var(--onyx) 100%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    -webkit-transform: translate(-50%, -50%) scale(1);
    overflow: hidden;
    touch-action: none;
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 50%, #14110C 0%, #0B0907 70%, #050402 100%);
  }

  /* Grain overlay — base64 SVG noise, 0.03 opacity */
  #stage::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0.035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.73  0 0 0 0 0.48  0 0 0 1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* Particles container — sparse drifting bronze dust */
  .dust {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  .dust span {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: var(--bronze-lite);
    opacity: 0;
    box-shadow: 0 0 6px rgba(217,185,122,0.55);
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translateY(40px) translateX(0);   opacity: 0; }
    12%  { opacity: 0.35; }
    88%  { opacity: 0.35; }
    100% { transform: translateY(-940px) translateX(var(--dx, 0px)); opacity: 0; }
  }

  /* ── Layout grid ─────────────────────────────────────────── */
  .stage-grid {
    position: relative;
    width: 100%; height: 100%;
    display: grid;
    grid-template-rows: 76px 1fr 56px;
    z-index: 4;
    animation: stage-in 800ms ease-out both;
  }
  @keyframes stage-in { from { opacity: 0; } to { opacity: 1; } }

  /* ─── TOP BAR ──────────────────────────────────────────── */
  .topbar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 48px;
    border-bottom: 1px solid var(--hair-soft);
  }
  .top-left {
    display: flex; align-items: center; gap: 14px;
    justify-self: start;
  }
  .brand-mark {
    width: 24px; height: 24px;
    color: var(--bronze-mid);
    display: block;
  }
  .brand-mark svg { width: 100%; height: 100%; display: block; }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--bone);
    text-transform: uppercase;
  }
  .top-center {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 9px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(217, 185, 122, 0.6);
    white-space: nowrap;
  }
  .top-right {
    display: flex; align-items: center; gap: 10px;
    justify-self: end;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(244, 242, 237, 0.6);
  }
  .pulse-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--bronze-lite);
    box-shadow: 0 0 8px rgba(217,185,122,0.7);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; transform: scale(0.9); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }

  /* ─── BODY (two columns) ───────────────────────────────── */
  .body {
    position: relative;
    display: grid;
    grid-template-columns: 38% 62%;
    overflow: hidden;
  }

  /* ─── LEFT: TOWER SECTION ─────────────────────────────── */
  .section-col {
    position: relative;
    padding: 36px 32px 24px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--hair-soft);
  }
  .section-label {
    align-self: flex-start;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 9px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(217, 185, 122, 0.5);
    margin-bottom: 18px;
  }
  .tower {
    position: relative;
    width: 180px;
    flex: 1;
    min-height: 0;
  }
  .tower svg {
    width: 100%; height: 100%;
    display: block;
    overflow: visible;
  }
  .tower-spine { stroke: var(--bronze-deep); stroke-width: 1; fill: none; }
  .tower-tick { stroke: var(--bronze-deep); stroke-width: 0.8; opacity: 0.55; }
  .tower-tick.major { opacity: 0.9; }
  .tower-cap { fill: var(--bronze-deep); opacity: 0.85; }
  .tower-base { stroke: var(--bronze-deep); stroke-width: 1; fill: none; opacity: 0.7; }

  /* the elevator car */
  .elevator {
    position: absolute;
    left: 50%;
    top: 0;
    width: 40px;
    height: 14px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: top 700ms var(--ease-arc);
  }
  .elevator::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(217,185,122,0) 0%, var(--bronze-lite) 50%, rgba(217,185,122,0) 100%);
    border-radius: 8px;
    box-shadow:
      0 0 12px rgba(217,185,122,0.6),
      0 0 28px rgba(217,185,122,0.25);
  }
  .elevator::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 22px; height: 4px;
    background: var(--bronze-lite);
    border-radius: 2px;
  }

  /* horizontal guide-line from elevator -> card (right side) */
  .guide {
    position: absolute;
    left: 50%;
    top: 0;
    height: 1px;
    width: 0;
    background: linear-gradient(90deg, var(--bronze-lite) 0%, rgba(217,185,122,0.0) 100%);
    transform: translateY(-50%);
    opacity: 0;
    transition:
      width 700ms var(--ease-arc),
      opacity 400ms ease-out,
      top 700ms var(--ease-arc);
    pointer-events: none;
    z-index: 1;
  }
  .guide.on { opacity: 0.7; }

  .floor-counter {
    margin-top: 18px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 18px;
    color: var(--bone);
    letter-spacing: 0.04em;
    transition: color 300ms ease;
  }
  .floor-counter b {
    font-weight: 400;
    color: var(--bronze-lite);
  }

  /* ─── RIGHT: CHAPTER GRID ─────────────────────────────── */
  .chapter-col {
    position: relative;
    padding: 28px 56px 28px 48px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, 1fr);
    column-gap: 32px;
    row-gap: 0;
  }

  .chapter {
    position: relative;
    padding: 18px 22px 16px 22px;
    cursor: pointer;
    transition: background-color 350ms ease;
    opacity: 0;
    transform: translateY(10px);
    animation: card-in 480ms var(--ease-arc) forwards;
  }
  @keyframes card-in {
    to { opacity: 1; transform: none; }
  }
  .chapter:hover { background-color: rgba(217,185,122,0.04); }

  .chap-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px;
  }
  .chap-num {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 64px;
    line-height: 0.95;
    color: var(--bronze-deep);
    letter-spacing: -0.01em;
  }
  .chap-floor {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px;
    font-family: 'Inter', sans-serif;
    font-feature-settings: "tnum" 1;
    font-weight: 400;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(217, 185, 122, 0.65);
  }
  .chap-floor::before {
    content: '';
    width: 5px; height: 5px;
    background: var(--bronze-mid);
    display: inline-block;
  }

  .chap-rule {
    margin: 10px 0 12px 0;
    height: 1px;
    width: 30%;
    background: var(--hair-strong);
    transition: width 500ms var(--ease-arc), background-color 350ms ease;
  }
  .chapter:hover .chap-rule { width: 100%; background: var(--bronze-mid); }

  .chap-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.05;
    color: var(--bone);
    letter-spacing: 0.005em;
    transition: color 350ms ease;
  }
  .chapter:hover .chap-title { color: var(--bronze-lite); }

  .chap-kicker {
    margin-top: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(194, 181, 163, 0.55);
  }

  .chap-meta {
    margin-top: 10px;
    min-height: 18px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 12.5px;
    line-height: 1.45;
    color: rgba(244, 242, 237, 0.0);
    transform: translateY(8px);
    transition: color 320ms ease, transform 320ms var(--ease-arc);
    text-wrap: pretty;
  }
  .chapter:hover .chap-meta {
    color: rgba(244, 242, 237, 0.72);
    transform: translateY(0);
  }

  /* ─── BOTTOM BAR ───────────────────────────────────────── */
  .bottombar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 48px;
    border-top: 1px solid var(--hair-soft);
  }
  .bot-left {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(244, 242, 237, 0.3);
    justify-self: start;
  }
  .progress {
    display: flex; gap: 10px; align-items: center;
    justify-self: center;
  }
  .progress span {
    width: 6px; height: 6px;
    background: rgba(217, 185, 122, 0.2);
    transition: background-color 350ms ease, transform 350ms ease;
  }
  .progress span.on {
    background: var(--bronze-lite);
    transform: scale(1.15);
  }
  .bot-right {
    justify-self: end;
    display: flex; align-items: center; gap: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(244, 242, 237, 0.5);
    cursor: pointer;
    transition: color 250ms ease;
  }
  .bot-right:hover { color: var(--bronze-lite); }
  .bot-right .arrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0;
    color: var(--bronze-mid);
  }

  /* ─── VEIL (click transition) ──────────────────────────── */
  #veil {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(217,185,122,0.95) 0%, rgba(148,111,56,0.85) 50%, rgba(14,12,9,0.98) 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 99;
    transition: opacity 600ms cubic-bezier(0.4, 0, 0.6, 1);
  }
  #veil.on { opacity: 1; }
</style>
</head>

<script>
/* ──────────────────────────────────────────────────────────
   1. CHAPTER DATA

const DEFAULT_ELEVATOR_TOP_PCT = 50;

/* ──────────────────────────────────────────────────────────
   2. BUILD TOWER TICKS (79 floors, denser at top)
   ────────────────────────────────────────────────────────── */
(function buildTicks() {
  const g = document.getElementById('ticks');
  // Tower spine runs y=18 (top) to y=572 (bottom) over 79 floors.
  // F79 (top) -> y ~22, F01 (bottom) -> y ~568
  const TOP = 22, BOT = 568;
  for (let i = 0; i < 79; i++) {
    const floor = 79 - i; // top tick = F79
    const y = TOP + (i * (BOT - TOP) / 78);
    // Major tick every 10 floors, longer
    const major = (floor % 10 === 0) || floor === 1 || floor === 79;
    const len = major ? 14 : 7;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    t.setAttribute('x1', 90 - len);
    t.setAttribute('x2', 90 + len);
    t.setAttribute('y1', y);
    t.setAttribute('y2', y);
    t.setAttribute('class', 'tower-tick' + (major ? ' major' : ''));
    g.appendChild(t);
  }
})();

/* ──────────────────────────────────────────────────────────
   3. BUILD CHAPTER GRID + WIRE INTERACTIONS
   ────────────────────────────────────────────────────────── */
(function buildChapters() {
  const grid = document.getElementById('chapters');
  const elevator = document.getElementById('elevator');
  const guide = document.getElementById('guide');
  const counter = document.getElementById('floor-counter');
  const progress = document.getElementById('progress');
  const veil = document.getElementById('veil');
  const tower = document.getElementById('tower');

  // Map a floor number 0..79 to a percentage along the tower's spine.
  // F79 = top (≈3%), F01 = bottom (≈95%), F00 = below bottom (≈98%)
  function floorToPct(f) {
    if (f <= 0) return 98;
    if (f >= 79) return 3.5;
    // tower spine maps F01..F79 to roughly 95..3.5
    return 95 - ((f - 1) / 78) * (95 - 3.5);
  }

  CHAPTERS.forEach((c, i) => {
    const card = document.createElement('article');
    card.className = 'chapter';
    card.style.animationDelay = (120 + i * 60) + 'ms';
    card.dataset.idx = i;

    card.innerHTML = `
      <div class="chap-head">
        <div class="chap-num">${c.n}</div>
        <div class="chap-floor">${c.floor}</div>
      </div>
      <div class="chap-rule"></div>
      <div class="chap-title">${c.title}</div>
      <div class="chap-kicker">${c.kicker}</div>
      <div class="chap-meta">${c.meta}</div>
    `;

    // ── Hover / focus → move elevator, draw guide, update counter
    const activate = () => {
      // pick midpoint of floor range for elevator
      const mid = (c.f1 + c.f2) / 2;
      const pct = floorToPct(mid);
      elevator.style.top = pct + '%';

      // update floor counter
      if (c.f1 === c.f2) {
        counter.innerHTML = 'F' + String(c.f1).padStart(2, '0');
      } else {
        counter.innerHTML = 'F' + String(c.f1).padStart(2, '0') +
                            '&nbsp; <b>—</b> &nbsp;F' +
                            String(c.f2).padStart(2, '0');
      }

      // guide line: from elevator's right edge to the card
      // Compute geometry relative to the .body container.
      requestAnimationFrame(() => {
        const body = document.querySelector('.body');
        if (!body) return;
        const bodyRect = body.getBoundingClientRect();
        const elevRect = elevator.getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();
        const startX = elevRect.right - bodyRect.left;
        const endX   = cardRect.left  - bodyRect.left + 12;
        const y      = elevRect.top + elevRect.height / 2 - bodyRect.top;
        guide.style.left = startX + 'px';
        guide.style.top  = y + 'px';
        guide.style.width = Math.max(0, endX - startX) + 'px';
        guide.classList.add('on');
      });

      // progress dots
      progress.querySelectorAll('span').forEach((dot, di) => {
        dot.classList.toggle('on', di === i);
      });
    };

    const deactivate = () => {
      // We only reset if no other chapter took over (handled by re-activate)
    };

    card.addEventListener('pointerenter', activate);
    card.addEventListener('focus', activate);
    card.tabIndex = 0;

    // ── Click → veil flash → navigate
    card.addEventListener('click', () => {
      // freeze any hover transitions
      veil.classList.add('on');
      setTimeout(() => { window.location.href = c.href; }, 580);
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.click();
      }
    });

    grid.appendChild(card);
  });

  // When pointer leaves the grid entirely → restore defaults
  grid.addEventListener('pointerleave', () => {
    elevator.style.top = DEFAULT_ELEVATOR_TOP_PCT + '%';
    counter.innerHTML = DEFAULT_FLOOR_LABEL;
    guide.classList.remove('on');
    guide.style.width = '0';
    progress.querySelectorAll('span').forEach(d => d.classList.remove('on'));
  });
})();

/* ──────────────────────────────────────────────────────────
   4. LIVE CLOCK (WORLI · MUMBAI · HH:MM IST)
   ────────────────────────────────────────────────────────── */
(function clock() {
  const el = document.getElementById('clock');
  function tick() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    el.textContent = 'WORLI · MUMBAI · ' + hh + ':' + mm + ' IST';
  }
  tick();
  setInterval(tick, 1000);
})();

/* ──────────────────────────────────────────────────────────
   5. BRONZE DUST (6 particles, slow upward drift)
   ────────────────────────────────────────────────────────── */
(function dust() {
  const c = document.getElementById('dust');
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('span');
    const dur = 18 + Math.random() * 22;
    const delay = -Math.random() * dur;
    const x = 4 + Math.random() * 92;
    const dx = (Math.random() - 0.5) * 60;
    s.style.left = x + '%';
    s.style.bottom = '-20px';
    s.style.setProperty('--dx', dx + 'px');
    s.style.animationDuration = dur + 's';
    s.style.animationDelay = delay + 's';
    c.appendChild(s);
  }
})();

/* ──────────────────────────────────────────────────────────
   6. STAGE SCALER (contain on landscape; cover when viewport
       aspect < 1.55× stage aspect — iPad-shaped screens)
   ────────────────────────────────────────────────────────── */
(function scaler() {
  const W = 1440, H = 900;
  const STAGE_ASPECT = W / H; // 1.6
  const COVER_THRESHOLD = 0.97; // trigger cover only when viewport < 97% of stage aspect

  function scale() {
    const wrap = document.getElementById('stage-wrap');
    const stage = document.getElementById('stage');
    if (!wrap || !stage) return;
    let vw = wrap.clientWidth, vh = wrap.clientHeight;
    if (window.visualViewport) {
      vw = Math.min(vw, window.visualViewport.width);
      vh = Math.min(vh, window.visualViewport.height);
    }
    const viewAspect = vw / vh;
    const isSquarishLandscape =
      viewAspect > 1 && viewAspect < STAGE_ASPECT * COVER_THRESHOLD;
    const s = isSquarishLandscape
      ? Math.max(vw / W, vh / H)
      : Math.min(vw / W, vh / H);
    const t = 'translate(-50%, -50%) scale(' + s + ')';
    stage.style.transform = t;
    stage.style.webkitTransform = t;
  }
  window.__ecScale = scale;
  window.addEventListener('resize', scale);
  window.addEventListener('orientationchange', scale);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scale);
    window.visualViewport.addEventListener('scroll', scale);
  }
  document.addEventListener('DOMContentLoaded', scale);
  window.addEventListener('load', scale);
  scale();
})();

/* ──────────────────────────────────────────────────────────
   7. iOS HARDENING — block double-tap zoom + pinch gestures
   ────────────────────────────────────────────────────────── */
(function ios() {
  let last = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - last < 350) e.preventDefault();
    last = now;
  }, { passive: false });
  document.addEventListener('gesturestart',  (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('gestureend',    (e) => e.preventDefault());
})();
</script>
