      { name: 'typical-lvl-57-62', label: 'Typical · Floors 57–62', title: 'Typical · Floors 57–62', file: 'assets/floorplans-final/typical/typical-lvl-57-62.webp' },
      { name: 'refuge-lvl-63', label: 'Refuge · Floor 63', title: 'Refuge · Floor 63', file: 'assets/floorplans-final/typical/refuge-lvl-63.webp' },
      { name: 'typical-lvl-64-69', label: 'Typical · Floors 64–69', title: 'Typical · Floors 64–69', file: 'assets/floorplans-final/typical/typical-lvl-64-69.webp' },
      { name: 'refuge-lvl-70', label: 'Refuge · Floor 70', title: 'Refuge · Floor 70', file: 'assets/floorplans-final/typical/refuge-lvl-70.webp' },
      { name: 'floor-lvl-71', label: 'Floor 71', title: 'Floor 71', file: 'assets/floorplans-final/typical/floor-lvl-71.webp' },
      { name: 'typical-lvl-72-76', label: 'Typical · Floors 72–76', title: 'Typical · Floors 72–76', file: 'assets/floorplans-final/typical/typical-lvl-72-76.webp' },
      { name: 'refuge-lvl-77', label: 'Refuge · Floor 77', title: 'Refuge · Floor 77', file: 'assets/floorplans-final/typical/refuge-lvl-77.webp' },
    ]},
    { group: 'Amenity Floors', items: [
      { name: 'amenity-ground-floor', label: 'Amenity · Ground Floor', title: 'Amenity · Ground Floor', file: 'assets/floorplans-final/amenity/amenity-ground-floor.webp' },
      { name: 'amenity-lvl-10', label: 'Amenity · Level 10', title: 'Amenity · Level 10', file: 'assets/floorplans-final/amenity/amenity-lvl-10.webp' },
      { name: 'amenity-lvl-12', label: 'Amenity · Level 12', title: 'Amenity · Level 12', file: 'assets/floorplans-final/amenity/amenity-lvl-12.webp' },
      { name: 'amenity-lvl-13', label: 'Amenity · Level 13', title: 'Amenity · Level 13', file: 'assets/floorplans-final/amenity/amenity-lvl-13.webp' },
      { name: 'amenity-lvl-14', label: 'Amenity · Level 14', title: 'Amenity · Level 14', file: 'assets/floorplans-final/amenity/amenity-lvl-14.webp' },
      { name: 'amenity-lvl-15', label: 'Amenity · Level 15', title: 'Amenity · Level 15', file: 'assets/floorplans-final/amenity/amenity-lvl-15.webp' },
      { name: 'amenity-lvl-79', label: 'Amenity · Level 79', title: 'Amenity · Level 79', file: 'assets/floorplans-final/amenity/amenity-lvl-79.webp' },
    ]},
  ];

  // Flat lookup name → {name,label,file}
  const REAL_PLAN_BY_NAME = {};
  REAL_PLAN_GROUPS.forEach(g => g.items.forEach(it => { REAL_PLAN_BY_NAME[it.name] = it; }));

  const DEFAULT_REAL_PLAN = 'unit-S01-lvl-43-47';

  // ──────────────────────────────────────────────────────────────
  // TYPE MODEL — three plan TYPES the segmented control switches between.
  //   unit    → the 6 unit groups (North/South · 01/02/03)
  //   typical → the "Typical & Refuge Floors" group
  //   amenity → the "Amenity Floors" group
  // For "unit" we further index every item by wing (N/S) + unit (01/02/03)
  // so the Wing / Unit / Floor-band selectors + Bed filter can narrow it.
  // ──────────────────────────────────────────────────────────────
  const TYPICAL_GROUP = REAL_PLAN_GROUPS.find(g => g.group === 'Typical & Refuge Floors');
  const AMENITY_GROUP = REAL_PLAN_GROUPS.find(g => g.group === 'Amenity Floors');

  // Unit catalogue: list of {wing,unit,beds,name,label,...} from every unit group.
  const UNIT_ITEMS = [];
  REAL_PLAN_GROUPS.forEach(g => {
    g.items.forEach(it => {
      const m = it.name.match(/^unit-([NS])(\d{2})-/);
      if (!m) return;
      UNIT_ITEMS.push(Object.assign({ wing: m[1], unit: m[2] }, it));
    });
  });

  const WING_FULL = { N: 'North', S: 'South' };

  function planType(name) {
    if (!name) return 'unit';
    if (/^unit-/.test(name)) return 'unit';
    if (/^amenity-/.test(name)) return 'amenity';
    return 'typical';
  }

  // Available bed counts present in the unit catalogue (for the Bed filter).
  const UNIT_BEDS = Array.from(new Set(UNIT_ITEMS.map(i => i.beds))).sort((a, b) => a - b);

  // Given a wing+unit+bedFilter, return the matching unit items (the floor bands).
  function unitBandsFor(wing, unit, bedFilter) {
    return UNIT_ITEMS.filter(i =>
      i.wing === wing && i.unit === unit &&
      (bedFilter === 'all' || i.beds === bedFilter));
  }
  // Units (01/02/03) available within a wing under the active bed filter.
  function unitsForWing(wing, bedFilter) {
    const set = new Set(UNIT_ITEMS
      .filter(i => i.wing === wing && (bedFilter === 'all' || i.beds === bedFilter))
      .map(i => i.unit));
    return Array.from(set).sort();
  }
  function wingsForBed(bedFilter) {
    const set = new Set(UNIT_ITEMS
      .filter(i => bedFilter === 'all' || i.beds === bedFilter)
      .map(i => i.wing));
    return ['N', 'S'].filter(w => set.has(w));
  }

  // <option> list helper for a plain (non-grouped) select.
  function optionsMarkup(items, selectedName) {
    return items.map(it =>
      `<option value="${it.name}" ${it.name === selectedName ? 'selected' : ''}>${it.label}</option>`
    ).join('');
  }

  // ──────────────────────────────────────────────────────────────
  // WINDOW STATE — array of { id, planId, bhk, facing, scale, tx, ty }
  // Each window is independent.
  // ──────────────────────────────────────────────────────────────
  let nextWinId = 1;
  let focusedWinId = null;

  function makeWindowState(planId, realName) {
    const p = PLANS[planId];
    const name = realName || DEFAULT_REAL_PLAN;
    const st = {
      id: nextWinId++,
      planId,
      realName: name,
      type: planType(name),       // 'unit' | 'typical' | 'amenity'
      bedFilter: 'all',           // 'all' | 3 | 4 | 5
      wing: 'S', unit: '01',      // active wing / unit (unit type only)
      bhk: p.bhk,
      facing: p.facing,
      scale: 1, tx: 0, ty: 0,
    };
    syncUnitSelectorsToName(st);
    return st;
  }

  // Keep wing/unit in sync with the active unit plan name.
  function syncUnitSelectorsToName(st) {
    if (st.type !== 'unit') return;
    const it = UNIT_ITEMS.find(i => i.name === st.realName);
    if (it) { st.wing = it.wing; st.unit = it.unit; }
  }

  // Default: open TWO windows for instant comparison.
  // Window 1 = the 4 BHK default (unit-S01-stack01); window 2 = a contrasting unit.
  // User can add a 3rd via ADD WINDOW pill (max 3) or close to drop back to 1.
  const windows = [
    makeWindowState(3, 'unit-S01-lvl-43-47'),
    makeWindowState(1, 'unit-N02-lvl-43-47'),
  ];
  focusedWinId = windows[0].id;

  // ──────────────────────────────────────────────────────────────
  // BUILD A SINGLE .plan-window ELEMENT (per state)
  // ──────────────────────────────────────────────────────────────
  // Build the selector row markup for the active type.
  function buildControlsMarkup(state) {
    if (state.type === 'unit') {
      const wings = wingsForBed(state.bedFilter);
      if (!wings.includes(state.wing)) state.wing = wings[0] || 'S';
      const units = unitsForWing(state.wing, state.bedFilter);
      if (!units.includes(state.unit)) state.unit = units[0] || '01';
      const bands = unitBandsFor(state.wing, state.unit, state.bedFilter);
      if (!bands.find(b => b.name === state.realName) && bands[0]) {
        state.realName = bands[0].name;
      }
      const unitOpts = units.map(u =>
        `<option value="${u}" ${u === state.unit ? 'selected' : ''}>Unit ${u}</option>`
      ).join('');
      return `
        <div class="pw-ctl">
          <span class="pw-ctl-lbl">Unit</span>
          <div class="pw-select">
            <select class="pw-unit-dd" aria-label="Select unit">${unitOpts}</select>
          </div>
        </div>
        <div class="pw-ctl is-grow">
          <span class="pw-ctl-lbl">Floor Band</span>
          <div class="pw-select">
            <select class="pw-band-dd" aria-label="Select floor band">${optionsMarkup(bands, state.realName)}</select>
          </div>
        </div>
      `;
    }
    if (state.type === 'amenity') {
      const items = AMENITY_GROUP.items;
      if (!items.find(i => i.name === state.realName)) state.realName = items[0].name;
      return `
        <div class="pw-ctl is-grow">
          <span class="pw-ctl-lbl">Amenity Level</span>
          <div class="pw-select">
            <select class="pw-band-dd" aria-label="Select amenity level">${optionsMarkup(items, state.realName)}</select>
          </div>
        </div>
      `;
    }
    // typical
    const items = TYPICAL_GROUP.items;
    if (!items.find(i => i.name === state.realName)) state.realName = items[0].name;
    return `
      <div class="pw-ctl is-grow">
        <span class="pw-ctl-lbl">Floor Band</span>
        <div class="pw-select">
          <select class="pw-band-dd" aria-label="Select floor">${optionsMarkup(items, state.realName)}</select>
        </div>
      </div>
    `;
  }

  // Default the realName when switching TYPE so the frame loads a valid plan.
  function defaultNameForType(state, type) {
    if (type === 'unit') {
      const bands = unitBandsFor(state.wing, state.unit, state.bedFilter);
      if (bands[0]) return bands[0].name;
      // fall back to any unit
      return UNIT_ITEMS[0].name;
    }
    if (type === 'amenity') return AMENITY_GROUP.items[0].name;
    return TYPICAL_GROUP.items[0].name;
  }

  function buildWindow(state) {
    const p = PLANS[state.planId];
    const rp = REAL_PLAN_BY_NAME[state.realName] || REAL_PLAN_BY_NAME[DEFAULT_REAL_PLAN];
    // RealDesk — rank which floor-plan asset is viewed most
    try { if (window.RDA) RDA.track('floorplan_view', rp.name, 1, { title: rp.title || rp.label, file: rp.file, wing: state.wing, unit: state.unit }); } catch(e){}
    const facingFull = FACING_FULL[state.facing] || state.facing;
    const liveBhkName = state.bhk + ' BHK ' + p.tier + ' · ' + facingFull;

    const el = document.createElement('article');
    el.className = 'plan-window';
    el.setAttribute('data-window-id', state.id);

    const typeLabel = state.type === 'unit' ? 'Residence'
                    : state.type === 'amenity' ? 'Amenity Floor' : 'Typical Floor';

    // Head — title · type eyebrow · carpet · close
    const head = document.createElement('header');
    head.className = 'pw-head';
    head.innerHTML = `
      <div class="pw-title-row">
        <h3 class="pw-title">${rp.title || rp.label}</h3>
        ${rp.beds ? `<span class="pw-tier-pill">${rp.beds} Bed</span>` : ''}
      </div>
      ${rp.carpet ? `<div class="pw-carpet">
        <span class="lbl">Usable&nbsp;Carpet&nbsp;Area</span>
        <span class="val">${rp.carpet}</span>
      </div>` : ''}
      <div class="pw-sub-row">
        <span class="pw-sub-tag">${typeLabel}</span>
        ${rp.beds ? `<span class="pw-sub">${WING_FULL[state.wing] || ''} Wing · Unit ${state.unit}</span>` : ''}
      </div>
      <button class="pw-close" type="button" aria-label="Close window">×</button>
    `;
    el.appendChild(head);

    // Lightweight switch bar — step ‹ › within the group, or open the catalog drawer
    const sw = document.createElement('div');
    sw.className = 'pw-switch';
    sw.innerHTML = `
      <button class="pw-step pw-prev" type="button" aria-label="Previous plan">‹</button>
      <button class="pw-change" type="button" aria-label="Change plan">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 7h11l-3-3" /><path d="M17 17H6l3 3" /></svg>
        <span>Change plan</span>
      </button>
      <button class="pw-step pw-next" type="button" aria-label="Next plan">›</button>
    `;
    el.appendChild(sw);

    // Canvas
    const canvas = document.createElement('div');
    canvas.className = 'pw-canvas-wrap';
    canvas.innerHTML = `
      <div class="pw-canvas-bg"></div>
      <svg class="pw-compass" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
        <polygon points="32,8 36,32 32,56 28,32" fill="currentColor" opacity="0.85"/>
        <polygon points="8,32 32,28 56,32 32,36" fill="currentColor" opacity="0.45"/>
        <circle cx="32" cy="8" r="2.4" fill="currentColor"/>
        <text x="32" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="700" letter-spacing="0.18em" fill="currentColor">N</text>
        <text x="32" y="63" text-anchor="middle" font-family="Inter, sans-serif" font-size="5" font-weight="600" letter-spacing="0.18em" fill="currentColor" opacity="0.6">S</text>
        <text x="3" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="5" font-weight="600" letter-spacing="0.18em" fill="currentColor" opacity="0.6">W</text>
        <text x="61" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="5" font-weight="600" letter-spacing="0.18em" fill="currentColor" opacity="0.6">E</text>
      </svg>
      <div class="pw-zoom-stack">
        <button class="pw-zoom-btn pw-zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="pw-zoom-btn pw-zoom-out" type="button" aria-label="Zoom out">−</button>
        <button class="pw-zoom-btn pw-zoom-fit" type="button" aria-label="Reset zoom">Fit</button>
      </div>
      <div class="pw-zoom-stage">
        <div class="pw-blueprint">
          <div class="pw-sheet">
            <img class="pw-plan-img" src="${rp.file}" alt="${rp.label}">
          </div>
        </div>
      </div>
      <div class="pw-zoom-indicator">100%</div>
    `;
    el.appendChild(canvas);

    // Specs — real bedroom / bathroom counts (Unit plans only)
    if (rp.beds) {
      const specs = document.createElement('div');
      specs.className = 'pw-specs';
      specs.innerHTML = `
      <div class="pw-spec">
        <span class="ico"><svg><use href="#ic-bed"/></svg></span>
        <span class="num pw-bed">${rp.beds}</span>
        <span class="lbl">Bedrooms</span>
      </div>
      <div class="pw-spec">
        <span class="ico"><svg><use href="#ic-bath"/></svg></span>
        <span class="num pw-bath">${rp.beds}</span>
        <span class="lbl">Bathrooms</span>
      </div>
    `;
      el.appendChild(specs);
    }

    // Price sheet — indicative numbers pending final pricing
    const price = document.createElement('section');
    price.className = 'pw-price';
    price.setAttribute('data-', 'Pricing — not final');
    price.innerHTML = `
      <h4>Price Sheet</h4>
      <div class="pw-row"><span class="k">Basic Price</span><span class="v">${p.basic}</span></div>
      <div class="pw-row"><span class="k">PLC (Preferential Location)</span><span class="v">${p.plc}</span></div>
      <div class="pw-row"><span class="k">Other Charges</span><span class="v">${p.other}</span></div>
      <div class="pw-row"><span class="k">GST &amp; Taxes</span><span class="v">${p.gst}</span></div>
      <div class="pw-total">
        <span class="k">Total Price</span>
        <span class="v">${p.total}<span style="font-size:0.55em;color:var(--taupe-400);">*</span></span>
      </div>
      <p class="pw-rera">* Indicative · RERA PR1170002501931</p>
    `;
    el.appendChild(price);

    return el;
  }

  // ──────────────────────────────────────────────────────────────
  // MAIN RENDER — rebuild the grid + counter + ADD button vis
  // ──────────────────────────────────────────────────────────────
  const grid = document.getElementById('windowsGrid');
  const winCounterEl = document.getElementById('winCounter');
  const addBtn = document.getElementById('addWinBtn');
  const toast = document.getElementById('toast');

  function render() {
    grid.setAttribute('data-count', String(windows.length));
    winCounterEl.textContent = String(windows.length);

    // Rebuild children
    grid.innerHTML = '';
    windows.forEach(state => {
      const el = buildWindow(state);
      grid.appendChild(el);
      wireWindow(el, state);
      applyTransform(el, state);
    });

    // Toggle close-button visibility
    const showClose = windows.length > 1;
    grid.querySelectorAll('.pw-close').forEach(btn => {
      btn.classList.toggle('is-hidden', !showClose);
    });

    // Toggle ADD WINDOW pill visibility
    addBtn.classList.toggle('is-hidden', windows.length >= 3);

    // Make sure focusedWinId is still valid
    if (!windows.find(w => w.id === focusedWinId)) {
      focusedWinId = windows[0]?.id ?? null;
    }
  }

  // ──────────────────────────────────────────────────────────────
  // WIRE A SINGLE WINDOW (event handlers)
  // ──────────────────────────────────────────────────────────────
  function wireWindow(el, state) {
    // Close
    const closeBtn = el.querySelector('.pw-close');
    closeBtn.addEventListener('click', () => {
      if (windows.length <= 1) return;
      el.classList.add('is-removing');
      setTimeout(() => {
        const idx = windows.findIndex(w => w.id === state.id);
        if (idx !== -1) windows.splice(idx, 1);
        render();
      }, 200);
    });

    // Helper — rebuild this window in place after a state change.
    function rebuild() {
      state.scale = 1; state.tx = 0; state.ty = 0;
      const fresh = buildWindow(state);
      el.replaceWith(fresh);
      wireWindow(fresh, state);
      applyTransform(fresh, state);
    }

    // Per-panel: step within the plan's group, or open the change drawer
    const prevB = el.querySelector('.pw-prev');
    const nextB = el.querySelector('.pw-next');
    if (prevB) prevB.addEventListener('click', () => { focusedWinId = state.id; stepInGroup(state, -1); rebuild(); });
    if (nextB) nextB.addEventListener('click', () => { focusedWinId = state.id; stepInGroup(state, 1); rebuild(); });
    const changeB = el.querySelector('.pw-change');
    if (changeB) changeB.addEventListener('click', () => { focusedWinId = state.id; openDrawer(state); });

    // Type segmented control — Unit · Typical · Amenity
    el.querySelectorAll('[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.type;
        if (t === state.type) return;
        state.type = t;
        state.realName = defaultNameForType(state, t);
        rebuild();
      });
    });

    // Bedroom filter pills (Unit only)
    el.querySelectorAll('[data-bed]').forEach(btn => {
      btn.addEventListener('click', () => {
        const raw = btn.dataset.bed;
        state.bedFilter = raw === 'all' ? 'all' : parseInt(raw, 10);
        // narrow wing/unit/band; buildControlsMarkup resolves a valid plan
        const wings = wingsForBed(state.bedFilter);
        if (!wings.includes(state.wing)) state.wing = wings[0] || 'S';
        const units = unitsForWing(state.wing, state.bedFilter);
        if (!units.includes(state.unit)) state.unit = units[0] || '01';
        const bands = unitBandsFor(state.wing, state.unit, state.bedFilter);
        state.realName = (bands[0] || UNIT_ITEMS[0]).name;
        rebuild();
      });
    });

    // Wing filter pills (Unit only)
    el.querySelectorAll('[data-wing]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.wing = btn.dataset.wing;
        const units = unitsForWing(state.wing, state.bedFilter);
        if (!units.includes(state.unit)) state.unit = units[0] || '01';
        const bands = unitBandsFor(state.wing, state.unit, state.bedFilter);
        state.realName = (bands[0] || UNIT_ITEMS[0]).name;
        rebuild();
      });
    });

    // Unit selector (Unit only)
    const unitDd = el.querySelector('.pw-unit-dd');
    if (unitDd) unitDd.addEventListener('change', () => {
      state.unit = unitDd.value;
      const bands = unitBandsFor(state.wing, state.unit, state.bedFilter);
      state.realName = (bands[0] || UNIT_ITEMS[0]).name;
      rebuild();
    });

    // Floor-band / level selector — loads the plan into the frame
    const bandDd = el.querySelector('.pw-band-dd');
    if (bandDd) bandDd.addEventListener('change', () => {
      if (bandDd.value === state.realName) return;
      state.realName = bandDd.value;
      syncUnitSelectorsToName(state);
      rebuild();
    });

    // Zoom buttons
    el.querySelector('.pw-zoom-in').addEventListener('click', () => {
      setScale(state, el, state.scale + 0.25);
    });
    el.querySelector('.pw-zoom-out').addEventListener('click', () => {
      setScale(state, el, state.scale - 0.25);
    });
    el.querySelector('.pw-zoom-fit').addEventListener('click', () => {
      state.scale = 1; state.tx = 0; state.ty = 0;
      applyTransform(el, state);
    });

    // Wheel + pinch + pan on the canvas
    const canvasWrap = el.querySelector('.pw-canvas-wrap');
    canvasWrap.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.12 : 0.12;
      setScale(state, el, state.scale + delta);
    }, { passive: false });

    canvasWrap.addEventListener('dblclick', () => {
      state.scale = 1; state.tx = 0; state.ty = 0;
      applyTransform(el, state);
    });

    // Pointer pan + pinch
    const zoomStage = el.querySelector('.pw-zoom-stage');
    const pointers = new Map();
    let panning = false, panSx = 0, panSy = 0, panTx0 = 0, panTy0 = 0;
    let pinchStart = null;

    canvasWrap.addEventListener('pointerdown', e => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      // Mark this window focused on any interaction
      focusedWinId = state.id;
      if (pointers.size === 1 && state.scale > 1.01) {
        panning = true;
        panSx = e.clientX; panSy = e.clientY;
        panTx0 = state.tx; panTy0 = state.ty;
        zoomStage.classList.add('is-panning');
        try { canvasWrap.setPointerCapture(e.pointerId); } catch (_) {}
      }
    });
    canvasWrap.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2) {
        panning = false;
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinchStart == null) {
          pinchStart = { dist, scale: state.scale };
        } else {
          const ratio = dist / pinchStart.dist;
          setScale(state, el, pinchStart.scale * ratio);
        }
        return;
      }

      if (panning && state.scale > 1.01) {
        const dx = e.clientX - panSx;
        const dy = e.clientY - panSy;
        state.tx = panTx0 + dx;
        state.ty = panTy0 + dy;
        zoomStage.style.transition = 'none';
        zoomStage.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
      }
    });
    const onUp = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStart = null;
      if (pointers.size === 0) {
        panning = false;
        zoomStage.classList.remove('is-panning');
        zoomStage.style.transition = '';
        try { canvasWrap.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    };
    canvasWrap.addEventListener('pointerup', onUp);
    canvasWrap.addEventListener('pointercancel', onUp);
    canvasWrap.addEventListener('pointerleave', onUp);

    // Focus tracking on any click within window
    el.addEventListener('mousedown', () => { focusedWinId = state.id; });
  }

  function setScale(state, el, next) {
    state.scale = Math.max(0.7, Math.min(3, next));
    if (state.scale <= 1.01) { state.tx = 0; state.ty = 0; }
    applyTransform(el, state);
  }

  function applyTransform(el, state) {
    const zoomStage = el.querySelector('.pw-zoom-stage');
    const indicator = el.querySelector('.pw-zoom-indicator');
    zoomStage.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
    zoomStage.classList.toggle('is-zoomed', state.scale > 1.01);
    indicator.textContent = Math.round(state.scale * 100) + '%';
  }

  // ──────────────────────────────────────────────────────────────
  // TOP BAR HANDLERS
  // ──────────────────────────────────────────────────────────────
  addBtn.addEventListener('click', () => {
    if (windows.length >= 3) {
      flashToast('Maximum 3 windows.');
      return;
    }
    // Spawn a new window. Default to a different plan than the focused
    // one when possible, so the comparison feels meaningful.
    const focused = windows.find(w => w.id === focusedWinId) || windows[0];
    const usedPlans = windows.map(w => w.planId);
    let newPlanId = focused.planId;
    for (let pid = 1; pid <= 3; pid++) {
      if (!usedPlans.includes(pid)) { newPlanId = pid; break; }
    }
    windows.push(makeWindowState(newPlanId));
    focusedWinId = windows[windows.length - 1].id;
    render();
  });

  // Chevron prev/next — step through the focused window's current plan list
  // (the floor-band / level options for the active type + filters).
  function currentPlanList(w) {
    if (w.type === 'unit') return unitBandsFor(w.wing, w.unit, w.bedFilter);
    if (w.type === 'amenity') return AMENITY_GROUP.items;
    return TYPICAL_GROUP.items;
  }
  function stepFocusedPlan(dir) {
    const w = windows.find(w => w.id === focusedWinId) || windows[0];
    const list = currentPlanList(w);
    if (!list.length) return;
    let idx = list.findIndex(it => it.name === w.realName);
    if (idx === -1) idx = 0;
    idx = (idx + dir + list.length) % list.length;
    w.realName = list[idx].name;
    syncUnitSelectorsToName(w);
    w.scale = 1; w.tx = 0; w.ty = 0;
    render();
  }
  document.getElementById('prevBtn')?.addEventListener('click', () => stepFocusedPlan(-1));
  document.getElementById('nextBtn')?.addEventListener('click', () => stepFocusedPlan(1));

  // ──────────────────────────────────────────────────────────────
  // TOAST
  // ──────────────────────────────────────────────────────────────
  function flashToast(msg) {
    toast.textContent = msg;
    toast.classList.add('is-on');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => toast.classList.remove('is-on'), 1800);
  }

  // ──────────────────────────────────────────────────────────────
  // CREAM-VEIL EXIT NAV
  // ──────────────────────────────────────────────────────────────
  function fadeTo(href) {
    document.body.classList.add('is-leaving');
    setTimeout(() => { window.location.href = href; }, 220);
  }
  document.getElementById('brandBack').addEventListener('click', e => {
    e.preventDefault();
    fadeTo('home.html');
  });
  document.getElementById('ecBackBtn').addEventListener('click', e => {
    e.preventDefault();
    fadeTo('home.html');
  });

  // ══════════════════════════════════════════════════════════════
  // COMPARE FLOW — pre-comparison picker + in-comparison change drawer
  //   Shared plan catalog rendered from REAL_PLAN_GROUPS.
  // ══════════════════════════════════════════════════════════════
  const TYPE_TABS = [
    { key: 'residences', label: 'Residences' },
    { key: 'typical',    label: 'Typical Floors' },
    { key: 'amenity',    label: 'Amenities' },
  ];
  function sectionsForTab(tabKey) {
    if (tabKey === 'typical') return [TYPICAL_GROUP];
    if (tabKey === 'amenity') return [AMENITY_GROUP];
    return REAL_PLAN_GROUPS.filter(g => /Unit/.test(g.group));
  }
  function tabForName(name) {
    const t = planType(name);
    return t === 'unit' ? 'residences' : (t === 'amenity' ? 'amenity' : 'typical');
  }
  function groupItemsOf(name) {
    for (const g of REAL_PLAN_GROUPS) { if (g.items.some(i => i.name === name)) return g.items; }
    return [];
  }
  function stepInGroup(state, dir) {
    const list = groupItemsOf(state.realName);
    if (!list.length) return;
    let idx = list.findIndex(i => i.name === state.realName);
    if (idx === -1) idx = 0;
    idx = (idx + dir + list.length) % list.length;
    state.realName = list[idx].name;
    state.type = planType(state.realName);
    syncUnitSelectorsToName(state);
    state.scale = 1; state.tx = 0; state.ty = 0;
  }
  function planSubLabel(it) {
    if (it.carpet) return it.carpet;
    if (it.label && it.label.indexOf('·') >= 0) return it.label.split('·').slice(1).join(' · ').trim();
    return '';
  }
  function cardHTML(it, badge) {
    const sub = planSubLabel(it);
    return '<button class="fp-card" type="button" data-name="' + it.name + '">' +
      '<span class="fp-card-badge">' + (badge || '') + '</span>' +
      '<span class="fp-card-pick">+</span>' +
      '<span class="fp-card-thumb"><img loading="lazy" src="' + it.file + '" alt="' + (it.title || it.label) + '"></span>' +
      '<div class="fp-card-title">' + (it.title || it.label) + '</div>' +
      (sub ? '<div class="fp-card-sub">' + sub + '</div>' : '') +
      '</button>';
  }
  function renderCatalog(gridEl, tabKey, selectedNames) {
    let html = '';
    sectionsForTab(tabKey).forEach(g => {
      html += '<div class="fp-sec"><div class="fp-sec-head"><span class="fp-sec-name">' +
        g.group + '</span><span class="fp-sec-rule"></span></div><div class="fp-cards">';
      g.items.forEach(it => {
        const bi = selectedNames ? selectedNames.indexOf(it.name) : -1;
        html += cardHTML(it, bi >= 0 ? (bi + 1) : '');
      });
      html += '</div></div>';
    });
    gridEl.innerHTML = html;
  }
  function renderTabs(tabsEl, activeKey, onPick) {
    tabsEl.innerHTML = TYPE_TABS.map(t =>
      '<button class="fp-tab' + (t.key === activeKey ? ' is-active' : '') + '" data-tab="' + t.key + '" type="button">' + t.label + '</button>'
    ).join('');
    tabsEl.querySelectorAll('.fp-tab').forEach(b => b.addEventListener('click', () => onPick(b.dataset.tab)));
  }

  // ── PICKER ──
  const picker        = document.getElementById('planPicker');
  const pickerTabs    = document.getElementById('pickerTabs');
  const pickerGrid    = document.getElementById('pickerGrid');
  const pickerSlots   = document.getElementById('pickerSlots');
  const pickerCompare = document.getElementById('pickerCompare');
  let pickerTab = 'residences';
  let pickerSel = [];

  function renderPickerTray() {
    let html = '';
    for (let i = 0; i < 3; i++) {
      const nm = pickerSel[i];
      if (nm) {
        const it = REAL_PLAN_BY_NAME[nm];
        html += '<div class="fp-slot is-filled"><span class="n">' + (i + 1) + '</span>' +
          '<span class="t">' + (it.title || it.label) + '</span>' +
          '<button class="x" type="button" data-rm="' + nm + '" aria-label="Remove">×</button></div>';
      } else if (i < 2 || pickerSel.length >= 2) {
        html += '<div class="fp-slot is-empty">Slot ' + (i + 1) + (i < 2 ? '' : ' · optional') + '</div>';
      }
    }
    pickerSlots.innerHTML = html;
    pickerSlots.querySelectorAll('[data-rm]').forEach(b =>
      b.addEventListener('click', () => { pickerSel = pickerSel.filter(n => n !== b.dataset.rm); renderPicker(); }));
    pickerCompare.disabled = pickerSel.length < 2;
  }
  function renderPicker() {
    renderTabs(pickerTabs, pickerTab, k => { pickerTab = k; renderPicker(); });
    renderCatalog(pickerGrid, pickerTab, pickerSel);
    pickerGrid.querySelectorAll('.fp-card').forEach(c => {
      if (pickerSel.indexOf(c.dataset.name) >= 0) c.classList.add('is-selected');
      c.addEventListener('click', () => {
        const nm = c.dataset.name;
        const i = pickerSel.indexOf(nm);
        if (i >= 0) pickerSel.splice(i, 1);
        else { if (pickerSel.length >= 3) { flashToast('Compare up to 3 plans.'); return; } pickerSel.push(nm); }
        renderPicker();
      });
    });
    renderPickerTray();
  }
  function openPicker() { renderPicker(); picker.classList.add('is-open'); }
  function closePicker() { picker.classList.remove('is-open'); }
  function startComparison(names) {
    windows.length = 0;
    names.forEach((nm, i) => windows.push(makeWindowState((i % 3) + 1, nm)));
    focusedWinId = windows[0].id;
    render();
    closePicker();
  }
  pickerCompare.addEventListener('click', () => { if (pickerSel.length >= 2) startComparison(pickerSel.slice()); });
  document.getElementById('pickerClose').addEventListener('click', () => {
    if (windows.length) closePicker(); else fadeTo('home.html');
  });

  // ── DRAWER ──
  const drawer      = document.getElementById('planDrawer');
  const drawerScrim = document.getElementById('drawerScrim');
  const drawerTabs  = document.getElementById('drawerTabs');
  const drawerGrid  = document.getElementById('drawerGrid');
  const drawerSub   = document.getElementById('drawerSub');
  let drawerWin = null;
  let drawerTab = 'residences';

  function renderDrawer() {
    renderTabs(drawerTabs, drawerTab, k => { drawerTab = k; renderDrawer(); });
    renderCatalog(drawerGrid, drawerTab, null);
    drawerGrid.querySelectorAll('.fp-card').forEach(c => {
      if (drawerWin && c.dataset.name === drawerWin.realName) c.classList.add('is-selected');
      c.addEventListener('click', () => {
        if (!drawerWin) return;
        drawerWin.realName = c.dataset.name;
        drawerWin.type = planType(c.dataset.name);
        syncUnitSelectorsToName(drawerWin);
        drawerWin.scale = 1; drawerWin.tx = 0; drawerWin.ty = 0;
        render();
        closeDrawer();
      });
    });
  }
  function openDrawer(state) {
    drawerWin = state;
    drawerTab = tabForName(state.realName);
    const rp = REAL_PLAN_BY_NAME[state.realName];
    drawerSub.textContent = 'Currently · ' + (rp ? (rp.title || rp.label) : '');
    renderDrawer();
    drawerScrim.classList.add('is-open');
    drawer.classList.add('is-open');
  }
  function closeDrawer() {
    drawer.classList.remove('is-open');
    drawerScrim.classList.remove('is-open');
    drawerWin = null;
  }
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  drawerScrim.addEventListener('click', closeDrawer);

  // ──────────────────────────────────────────────────────────────
  // INITIAL RENDER
  // ──────────────────────────────────────────────────────────────
  render();

  // ── DEEP-LINK from Inventory → Choose-Floors ──────────────────
  // If the user arrived via a section/level selection, preselect the
  // matching plan in the focused window.
  (function () {
    var lvl = null, sec = null;
    try { lvl = sessionStorage.getItem('ec.floor'); sec = sessionStorage.getItem('ec.section'); } catch (e) {}
    if (!lvl && !sec) return;
    try { sessionStorage.removeItem('ec.floor'); sessionStorage.removeItem('ec.section'); } catch (e) {}
    function rangeOf(name) {
      var m = name.match(/lvl-([\d+\-]+)/); if (!m) return null;
      var nums = m[1].split(/[-+]/).map(Number).filter(function (n){return !isNaN(n);});
      return nums.length ? [Math.min.apply(null,nums), Math.max.apply(null,nums)] : null;
    }
    var amenityHint = sec != null && /amenit/i.test(String(sec));
    var target = null;
    var n = lvl != null ? parseInt(lvl, 10) : NaN;
    if (amenityHint) {
      // Arrived from an amenity section → prefer an amenity plan.
      if (!isNaN(n) && REAL_PLAN_BY_NAME['amenity-lvl-'+n]) target = 'amenity-lvl-'+n;
      else target = AMENITY_GROUP.items[0].name;
    }
    if (!target && !isNaN(n)) {
      // 1) exact refuge / amenity level, else 2) a typical band containing it, else 3) any plan whose range covers it
      var pref = ['refuge-lvl-'+n, 'amenity-lvl-'+n];
      for (var i=0;i<pref.length;i++){ if (REAL_PLAN_BY_NAME[pref[i]]) { target = pref[i]; break; } }
      if (!target) {
        var names = Object.keys(REAL_PLAN_BY_NAME);
        // prefer a typical-floor band, then any unit/plan band
        var order = names.filter(function(k){return k.indexOf('typical')===0;}).concat(names);
        for (var j=0;j<order.length;j++){ var r=rangeOf(order[j]); if (r && n>=r[0] && n<=r[1]) { target = order[j]; break; } }
      }
    }
    if (target && REAL_PLAN_BY_NAME[target] && windows[0]) {
      windows[0].realName = target;
      windows[0].type = planType(target);
      syncUnitSelectorsToName(windows[0]);
      windows[0].scale = 1; windows[0].tx = 0; windows[0].ty = 0;
      window.__ecDeepLinked = true;
      render();
    }
  })();

  // Show the picker first unless we deep-linked straight to a plan.
  if (!window.__ecDeepLinked) { openPicker(); }
</script>
