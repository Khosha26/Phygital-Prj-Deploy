<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Embassy Citadel — Floor Plans</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  FLOOR-PLAN v4 — Living-Tree multi-window comparison pattern
  ──────────────────────────────────────────────────────────────────────
  Default: ONE full floor-plan window taking the whole stage.
  Click "+ ADD WINDOW" → a SECOND full window appears side-by-side.
  Click again → THIRD window. Max 3.
  Each window is independently configurable: own plan / BHK / facing /
  zoom. Comparison happens naturally because the user sees N plans
  side-by-side, each with its own price sheet.

  Stage: 1440 × 900 (same scaler contract as the rest of v4/).

  Top bar (consistent with other inside screens):
    LEFT  : Embassy Citadel wordmark SVG (#ec-wordmark) → home.html
    RIGHT : "N / 3 Windows" + ‹ › + "+ ADD WINDOW" pill + BACK pill

  Body: .windows-grid with data-count="1|2|3" driving grid columns and
  a CSS custom property --base-font that scales internal type/canvas.

  Removed (vs prior build):
    · Far-right thumbnail-switcher rail
    · PRICING COMPARISON table in the right stack
    · The single-card layout — replaced by uniform self-contained
      .plan-window cards, each one a complete unit detail.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet" />

<!-- GOAL 2: placeholder-marker styles (.nu) -->
<style>
  :root {
    --paper:      #FCFAF4;
    --paper-2:    #F9F6EE;
    --bone:       #F4F2ED;
    --bone-50:    #F7F5EF;
    --bone-200:   #E8E2D6;
    --warm-grey:  #DAD5CD;
    --taupe-300:  #C2B5A3;
    --taupe-400:  #A89B86;
    --taupe-500:  #7E725F;

    --gold-100:   #E8CFA1;
    --gold-200:   #D9B97A;
    --gold-300:   #C9A567;
    --gold-400:   #B89968;
    --gold-500:   #946F38;
    --gold-600:   #6E5A37;
    --copper:     #C26B2A;
    --copper-50:  #F7EBDD;
    --copper-100: #EDD2B6;

    --onyx-100:   #3A332A;
    --onyx-300:   #2A2620;
    --onyx-500:   #1F1B15;
    --onyx-700:   #1A1814;

    --hair-lo:    rgba(148, 111, 56, 0.16);
    --hair:       rgba(148, 111, 56, 0.32);
    --hair-hi:    rgba(148, 111, 56, 0.58);

    --blueprint-fill:      #C5DAE8;
    --blueprint-fill-soft: #D8E5EF;
    --blueprint-fill-deep: #B0C8D9;
    --blueprint-wall:      #2F5A78;
    --blueprint-deck:      #A9C2D2;
    --blueprint-text:      #1F3D55;
    --blueprint-text-soft: #5B7C95;

    --card-shadow:  0 14px 32px -10px rgba(80, 58, 28, 0.22),
                    0 4px 12px  -4px  rgba(40, 28, 10, 0.10);
    --plate-shadow: 0 30px 60px -18px rgba(80, 58, 28, 0.30),
                    0 14px 30px -10px rgba(80, 58, 28, 0.18),
                    0 4px 10px        rgba(40, 28, 10, 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--paper);
    color: var(--onyx-700);
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
    position: fixed; inset: 0;
  }
  img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }

  /* ── Stage scaler — paper bg fills viewport edge-to-edge ─────── */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 0;   /* edge-to-edge — stage fills the whole viewport */
    isolation: isolate;
    /* Flat paper — matches the stage's own paper edge exactly, so the
       letterbox/pillarbox margins on non-16:10 screens (iPad 4:3, 65" 16:9)
       blend seamlessly into the stage with no visible "cut". */
    background: url('assets/bg-paper.png') center/cover no-repeat, var(--paper);
  }
  #stage, .stage-inner {
    position: relative;
    width: 1440px; height: 900px;
    flex-shrink: 0;
    z-index: 1;
    transform-origin: center center;
    transform: scale(1);
    overflow: hidden;
    background: transparent;
  }
  .stage-bg {
    position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    z-index: 0; pointer-events: none;
    background-color: var(--paper);
    background-image: url('assets/bg-paper.png');
    background-size: cover; background-position: center center; background-repeat: no-repeat;
  }
  .stage-grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    opacity: 0.022;
    background-image:
      radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 1px;
  }

  /* ── TOP BAR (consistent with home / unit-detail) ───────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
    z-index: 8;
    background: linear-gradient(180deg, rgba(252,250,244,0.55), rgba(252,250,244,0) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .brand-back {
    display: inline-flex; align-items: center; gap: 14px;
    text-decoration: none; color: var(--onyx-700);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: opacity 220ms ease;
  }
  .brand-back:hover { opacity: 0.82; }
  .brand-wordmark { width: 156px; height: 43.2px; display: inline-flex; color: var(--onyx-700); }
  .brand-wordmark svg { width: 100%; height: 100%; }

  .top-chips { display: flex; align-items: center; gap: 10px; }
  .top-eyebrow {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--taupe-400);
    padding: 0 14px 0 4px;
    user-select: none;
    font-variant-numeric: tabular-nums;
  }
  .top-eyebrow strong { color: var(--gold-500); font-weight: 600; }
  .tc {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 300; font-size: 22px; line-height: 1;
    transition: background 220ms ease, color 220ms ease, border-color 220ms ease, transform 200ms ease;
  }
  .tc:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .tc:active { transform: scale(0.94); }

  .add-window-pill {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-100), var(--gold-300));
    border: 1px solid var(--gold-500);
    color: var(--onyx-700);
    font-family: 'Lato', sans-serif;
    font-weight: 600; font-size: 10px;
    letter-spacing: 0.36em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 12px -4px rgba(148, 111, 56, 0.45);
    transition: background 220ms ease, transform 200ms ease, opacity 240ms ease, box-shadow 220ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    margin-left: 6px;
  }
  .add-window-pill .plus {
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 400; font-size: 18px; line-height: 1;
    letter-spacing: 0; transform: translateY(-1px);
  }
  .add-window-pill:hover {
    background: linear-gradient(180deg, var(--gold-200), var(--gold-500));
    color: var(--paper);
    box-shadow: 0 6px 16px -4px rgba(148, 111, 56, 0.55);
  }
  .add-window-pill:active { transform: scale(0.96); }
  .add-window-pill.is-hidden { opacity: 0; pointer-events: none; transform: scale(0.92); }

  .ec-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 92px; min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.42em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 220ms ease, color 220ms ease, border-color 220ms ease, transform 200ms ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
    margin-left: 6px;
  }
  .ec-back-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .ec-back-btn:active { transform: scale(0.96); }
  .ec-back-btn .arr { font-size: 13px; line-height: 1; transform: translateY(-0.5px); letter-spacing: 0; }

  /* ── BODY: windows grid (1 → 2 → 3 cols) ─────────────────────── */
  .windows-grid {
    position: absolute;
    top: 86px; left: 22px; right: 22px; bottom: 22px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    z-index: 4;
    transition: grid-template-columns 380ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .windows-grid[data-count="2"] { grid-template-columns: 1fr 1fr; }
  .windows-grid[data-count="3"] { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ── PLAN WINDOW (each is a complete self-contained unit) ────── */
  .plan-window {
    --base-font: 14px;
    --pad-x: 26px;
    --pad-y: 20px;
    --title-size: 38px;
    --carpet-size: 26px;
    --canvas-pad: 18px;
    --spec-num: 26px;
    --total-size: 28px;
    --price-row-pad: 10px;
    --canvas-radius: 16px;

    position: relative;
    background: var(--paper);
    border: 1px solid var(--hair-lo);
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    font-size: var(--base-font);
    transform-origin: center top;
    animation: pw-fade-in 380ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .plan-window.is-removing {
    animation: pw-fade-out 280ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes pw-fade-in {
    from { opacity: 0; transform: translateX(24px) scale(0.96); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes pw-fade-out {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.94); }
  }

  /* When 2 windows: medium sizing */
  .windows-grid[data-count="2"] .plan-window {
    --base-font: 12px;
    --pad-x: 22px;
    --pad-y: 16px;
    --title-size: 30px;
    --carpet-size: 22px;
    --canvas-pad: 14px;
    --spec-num: 22px;
    --total-size: 24px;
    --price-row-pad: 8px;
    --canvas-radius: 14px;
  }
  /* When 3 windows: compact sizing */
  .windows-grid[data-count="3"] .plan-window {
    --base-font: 10.5px;
    --pad-x: 16px;
    --pad-y: 13px;
    --title-size: 24px;
    --carpet-size: 18px;
    --canvas-pad: 10px;
    --spec-num: 18px;
    --total-size: 20px;
    --price-row-pad: 6px;
    --canvas-radius: 12px;
  }

  /* ── WINDOW HEAD: title + tier + carpet + close ─────────────── */
  .pw-head {
    position: relative;
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) * 0.6);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    border-bottom: 1px solid var(--hair-lo);
  }
  .pw-title-row {
    display: flex; align-items: baseline; gap: 12px;
    min-width: 0;
  }
  .pw-title {
    font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
    font-weight: 500;
    font-size: var(--title-size);
    line-height: 1;
    color: var(--onyx-700);
    letter-spacing: 0.01em;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pw-tier-pill {
    display: inline-flex; align-items: center;
    height: calc(var(--base-font) * 1.55);
    padding: 0 10px;
    background: var(--paper-2);
    border: 1px solid var(--gold-300);
    border-radius: 999px;
    color: var(--gold-500);
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.68);
    letter-spacing: 0.30em;
    text-transform: uppercase;
    transform: translateY(-3px);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pw-carpet {
    text-align: right;
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 3px;
    margin-right: calc(var(--base-font) * 2.4);
  }
  .pw-carpet .lbl {
    font-family: 'Lato', sans-serif;
    font-weight: 500;
    font-size: calc(var(--base-font) * 0.68);
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--taupe-400);
    white-space: nowrap;
  }
  .pw-carpet .val {
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-style: italic; font-weight: 500;
    font-size: var(--carpet-size);
    line-height: 1;
    color: var(--onyx-700);
    letter-spacing: 0.005em;
    white-space: nowrap;
  }

  .pw-sub-row {
    grid-column: 1 / -1;
    display: flex; align-items: baseline; gap: 14px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .pw-sub {
    font-family: 'Lato', sans-serif;
    font-size: calc(var(--base-font) * 0.82);
    font-weight: 400;
    color: var(--taupe-500);
    letter-spacing: 0.06em;
  }
  .pw-sub-tag {
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-style: italic; font-weight: 500;
    font-size: calc(var(--base-font) * 1.05);
    color: var(--gold-500);
    letter-spacing: 0.02em;
  }

  /* Close button — only visible when N > 1 (toggled in JS) */
  .pw-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.72);
    border: 1px solid var(--hair-lo);
    color: var(--taupe-400);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    font-weight: 300; font-size: 18px; line-height: 1;
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease, transform 160ms ease;
    -webkit-tap-highlight-color: transparent;
    z-index: 5;
  }
  .pw-close:hover {
    background: var(--paper);
    color: var(--onyx-700);
    border-color: var(--hair-hi);
  }
  .pw-close:active { transform: scale(0.92); }
  .pw-close.is-hidden { display: none; }

  /* ── TYPE SEGMENTED CONTROL (Unit · Typical · Amenity) ───────── */
  .pw-types {
    display: flex; align-items: stretch;
    gap: 0;
    margin: calc(var(--base-font) * 0.7) var(--pad-x) 0;
    padding: calc(var(--base-font) * 0.28);
    background: var(--paper-2);
    border: 1px solid var(--hair-lo);
    border-radius: 999px;
  }
  .pw-type {
    flex: 1 1 0; min-width: 0;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    height: calc(var(--base-font) * 2.3);
    padding: 0 calc(var(--base-font) * 0.6);
    border-radius: 999px;
    background: transparent;
    border: none;
    color: var(--taupe-500);
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.72);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: color 200ms ease, background 220ms ease, box-shadow 220ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .pw-type:hover:not(.is-active) { color: var(--onyx-700); }
  .pw-type.is-active {
    background: var(--paper);
    color: var(--gold-500);
    box-shadow:
      0 2px 8px -3px rgba(80, 58, 28, 0.28),
      inset 0 0 0 1px var(--gold-300);
  }
  .pw-type:active { transform: translateY(0.5px); }

  /* ── FILTERS ROW + plan selector ─────────────────────────────── */
  .pw-filters {
    display: flex; align-items: center;
    gap: calc(var(--base-font) * 1.4);
    padding: calc(var(--base-font) * 0.85) var(--pad-x);
    border-bottom: 1px solid var(--hair-lo);
    flex-wrap: wrap;
  }
  .pw-filter-group {
    display: inline-flex; align-items: center; gap: 7px;
  }
  .pw-flabel {
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.68);
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--taupe-400);
    margin-right: 3px;
  }
  .pw-fpill {
    display: inline-flex; align-items: center; justify-content: center;
    height: calc(var(--base-font) * 2);
    min-width: calc(var(--base-font) * 3.6);
    padding: 0 calc(var(--base-font) * 0.85);
    border-radius: 999px;
    background: transparent;
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Lato', sans-serif;
    font-weight: 500;
    font-size: calc(var(--base-font) * 0.78);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease, transform 160ms ease;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .pw-fpill.is-active {
    background: linear-gradient(180deg, var(--gold-300), var(--gold-500));
    border-color: var(--gold-500);
    color: var(--paper);
    box-shadow: 0 4px 10px -4px rgba(148, 111, 56, 0.55);
  }
  .pw-fpill:hover:not(.is-active) {
    border-color: var(--hair-hi);
    color: var(--onyx-700);
  }
  .pw-fpill:active { transform: scale(0.96); }
  .pw-fpill.is-disabled { opacity: 0.32; pointer-events: none; }

  /* Plan selector — sits with filters on the right */
  .pw-plan-select {
    margin-left: auto;
    position: relative;
    display: inline-flex; align-items: center;
  }
  .pw-plan-select select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--paper-2);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.74);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    height: calc(var(--base-font) * 2);
    padding: 0 calc(var(--base-font) * 2) 0 calc(var(--base-font) * 0.9);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease, color 200ms ease;
  }
  .pw-plan-select select:hover {
    border-color: var(--hair-hi);
    color: var(--onyx-700);
  }
  .pw-plan-select::after {
    content: '';
    position: absolute;
    right: calc(var(--base-font) * 0.85);
    top: 50%;
    width: 6px; height: 6px;
    border-right: 1.2px solid var(--gold-500);
    border-bottom: 1.2px solid var(--gold-500);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  /* ── CONTROLS BAR (selectors row) ────────────────────────────── */
  .pw-controls {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    gap: calc(var(--base-font) * 0.9);
    padding: calc(var(--base-font) * 0.85) var(--pad-x);
    border-bottom: 1px solid var(--hair-lo);
  }
  .pw-ctl {
    display: flex; flex-direction: column;
    gap: calc(var(--base-font) * 0.34);
    min-width: 0;
  }
  .pw-ctl.is-grow { flex: 1 1 40%; }
  .pw-ctl-lbl {
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.62);
    letter-spacing: 0.30em; text-transform: uppercase;
    color: var(--taupe-400);
    padding-left: 2px;
  }
  .pw-select {
    position: relative;
    display: inline-flex; align-items: center;
  }
  .pw-select select {
    appearance: none; -webkit-appearance: none;
    width: 100%;
    background: var(--paper-2);
    border: 1px solid var(--hair);
    color: var(--onyx-700);
    font-family: 'Lato', sans-serif;
    font-weight: 500;
    font-size: calc(var(--base-font) * 0.82);
    letter-spacing: 0.02em;
    height: calc(var(--base-font) * 2.5);
    padding: 0 calc(var(--base-font) * 2.1) 0 calc(var(--base-font) * 0.95);
    border-radius: calc(var(--base-font) * 0.7);
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease;
  }
  .pw-select select:hover  { border-color: var(--hair-hi); }
  .pw-select select:focus  { outline: none; border-color: var(--gold-400); }
  .pw-select::after {
    content: '';
    position: absolute;
    right: calc(var(--base-font) * 0.95); top: 50%;
    width: 6px; height: 6px;
    border-right: 1.4px solid var(--gold-500);
    border-bottom: 1.4px solid var(--gold-500);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  /* ── FILTER BAR (Bedrooms · Wing) ────────────────────────────── */
  .pw-filterbar {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: calc(var(--base-font) * 1.5);
    padding: calc(var(--base-font) * 0.7) var(--pad-x);
    border-bottom: 1px solid var(--hair-lo);
    background: var(--paper-2);
  }

  /* ── CANVAS (floor-plan area) ────────────────────────────────── */
  .pw-canvas-wrap {
    position: relative;
    flex: 1 1 auto;            /* canvas claims the flexible space */
    margin: var(--canvas-pad) var(--canvas-pad) calc(var(--canvas-pad) * 0.7);
    background: var(--paper-2);
    border: 1px solid var(--hair-lo);
    border-radius: var(--canvas-radius);
    overflow: hidden;
    min-height: 0;
  }
  .pw-canvas-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(47, 90, 120, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47, 90, 120, 0.05) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
  }
  .pw-zoom-stage {
    position: absolute; inset: 0;
    transform-origin: center center;
    transform: translate(0, 0) scale(1);
    transition: transform 200ms ease;
    /* will-change only during active pan/pinch — lets the browser re-rasterize
       the HD plan at the zoomed scale when idle, so it stays crisp (no blur). */
    cursor: grab;
    touch-action: none;
  }
  .pw-zoom-stage.is-zoomed { cursor: grab; }
  .pw-zoom-stage.is-panning { cursor: grabbing; transition: none; will-change: transform; }
  .pw-blueprint {
    position: absolute;
    inset: 5% 5% 5% 5%;
    width: 90%;
    height: 90%;
  }
  /* Clean paper backing card so white-interior line-art reads as a
     complete sheet and never blends into the blueprint background. */
  .pw-sheet {
    position: absolute; inset: 0;
    background: #FCFAF4;
    border: 1px solid var(--hair-lo);
    border-radius: calc(var(--canvas-radius) * 0.55);
    box-shadow:
      0 18px 40px -16px rgba(80, 58, 28, 0.30),
      0 6px 16px  -8px  rgba(40, 28, 10, 0.16);
    padding: calc(var(--base-font) * 1.1);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .pw-plan-img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  .pw-compass {
    position: absolute;
    top: calc(var(--base-font) * 1); left: calc(var(--base-font) * 1.1);
    width: calc(var(--base-font) * 3.6);
    height: calc(var(--base-font) * 3.6);
    z-index: 4;
    color: var(--blueprint-wall);
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.04));
  }

  .pw-zoom-stack {
    position: absolute;
    top: calc(var(--base-font) * 1); right: calc(var(--base-font) * 1.1);
    display: flex; flex-direction: column;
    gap: calc(var(--base-font) * 0.45);
    z-index: 4;
  }
  .pw-zoom-btn {
    width: calc(var(--base-font) * 2.6);
    height: calc(var(--base-font) * 2.6);
    border-radius: 999px;
    background: rgba(252, 250, 244, 0.92);
    border: 1px solid var(--hair);
    color: var(--gold-500);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: calc(var(--base-font) * 1.4);
    line-height: 1;
    box-shadow: 0 2px 6px rgba(40, 28, 10, 0.08);
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease, transform 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .pw-zoom-btn:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .pw-zoom-btn:active { transform: scale(0.92); }
  .pw-zoom-btn.pw-zoom-fit {
    font-size: calc(var(--base-font) * 0.66);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--taupe-400);
  }

  .pw-zoom-indicator {
    position: absolute;
    bottom: calc(var(--base-font) * 1); left: calc(var(--base-font) * 1.2);
    font-family: 'Lato', sans-serif;
    font-weight: 500;
    font-size: calc(var(--base-font) * 0.66);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--taupe-400);
    background: rgba(252, 250, 244, 0.78);
    border: 1px solid var(--hair-lo);
    padding: 4px 10px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 4;
    font-variant-numeric: tabular-nums;
  }

  /* ── SPECS row ───────────────────────────────────────────────── */
  .pw-specs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: calc(var(--base-font) * 0.9) var(--pad-x) calc(var(--base-font) * 0.9);
    border-top: 1px solid var(--hair-lo);
  }
  .pw-spec {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    position: relative;
  }
  .pw-spec + .pw-spec::before {
    content: '';
    position: absolute;
    left: -3px; top: 14%; bottom: 14%;
    width: 1px;
    background: var(--hair-lo);
  }
  .pw-spec .ico {
    width: calc(var(--base-font) * 1.55);
    height: calc(var(--base-font) * 1.55);
    color: var(--gold-500);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pw-spec .ico svg { width: 100%; height: 100%; }
  .pw-spec .num {
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-style: italic; font-weight: 500;
    font-size: var(--spec-num);
    line-height: 1;
    color: var(--onyx-700);
  }
  .pw-spec .lbl {
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.60);
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: var(--taupe-400);
    white-space: nowrap;
  }

  /* ── PRICE SHEET ─────────────────────────────────────────────── */
  .pw-price {
    padding: calc(var(--base-font) * 0.8) var(--pad-x) calc(var(--base-font) * 1.1);
    border-top: 1px solid var(--hair-lo);
    background: var(--paper-2);
  }
  .pw-price h4 {
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.72);
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--gold-500);
    margin: 0 0 calc(var(--base-font) * 0.5);
  }
  .pw-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: var(--price-row-pad) 0;
    border-bottom: 1px dashed var(--hair-lo);
  }
  .pw-row:last-of-type { border-bottom: none; }
  .pw-row .k {
    font-family: 'Lato', sans-serif;
    font-size: calc(var(--base-font) * 0.82);
    color: var(--taupe-500);
    letter-spacing: 0.02em;
  }
  .pw-row .v {
    font-family: 'Lato', sans-serif;
    font-weight: 500;
    font-size: calc(var(--base-font) * 0.88);
    color: var(--onyx-700);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .pw-total {
    margin-top: 4px;
    padding: calc(var(--base-font) * 0.9) 0 0;
    border-top: 1px solid var(--hair);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .pw-total .k {
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: calc(var(--base-font) * 0.74);
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--onyx-700);
  }
  .pw-total .v {
    font-family: 'Lato', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-style: italic; font-weight: 500;
    font-size: var(--total-size);
    color: var(--gold-500);
    line-height: 1;
    letter-spacing: 0.005em;
  }
  .pw-rera {
    margin: calc(var(--base-font) * 0.5) 0 0;
    font-family: 'Lato', sans-serif;
    font-size: calc(var(--base-font) * 0.60);
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--taupe-400);
  }

  /* ── TOAST ───────────────────────────────────────────────────── */
  .toast {
    position: absolute;
    bottom: 36px; left: 50%;
    transform: translate(-50%, 12px);
    background: rgba(26, 24, 20, 0.92);
    color: var(--paper);
    font-family: 'Lato', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 10px 18px;
    border-radius: 999px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease, transform 220ms ease;
    box-shadow: 0 10px 30px rgba(20, 14, 6, 0.30);
  }
  .toast.is-on {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ── CREAM VEIL (page-exit transition) ───────────────────────── */
  .veil {
    position: absolute; inset: 0;
    background: var(--bone);
    opacity: 0;
    pointer-events: none;
    z-index: 99;
    transition: opacity 220ms ease-in-out;
  }
  body.is-leaving .veil { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
  /* fabricated pricing hidden until client provides real figures */
  .pw-price{display:none !important;}
  /* full-sheet plans carry their own title/area/specs — hide window duplicates */
  .pw-carpet, .pw-specs, .pw-tier-pill, .pw-sub-row { display:none !important; }

  /* ══════════════════════════════════════════════════════════════
     COMPARE FLOW — pre-comparison picker, in-comparison switch drawer,
     and the lightweight per-panel switch bar.
     ══════════════════════════════════════════════════════════════ */

  /* shared overlay surface — reads as a full, native screen (not a sheet):
     same paper-texture + grain treatment the real screens use via .stage-bg
     / .stage-grain, layered as pseudo-elements so no markup/JS changes. */
  .fp-overlay {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    background: transparent;
    opacity: 0; visibility: hidden;
    transition: opacity 420ms ease, visibility 0s linear 420ms;
  }
  /* paper layer — mirrors .stage-bg */
  .fp-overlay::before {
    content: ''; position: absolute; inset: -2px; z-index: 0; pointer-events: none;
    background-color: var(--paper);
    background-image: url('assets/bg-paper.png');
    background-size: cover; background-position: center center; background-repeat: no-repeat;
  }
  /* grain layer — mirrors .stage-grain */
  .fp-overlay::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.022;
    background-image:
      radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.5) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 1px;
  }
  /* keep all picker content above the texture layers */
  .fp-overlay > * { position: relative; z-index: 2; }
  .fp-overlay.is-open { opacity: 1; visibility: visible; transition: opacity 420ms ease; }

  /* picker header — editorial, integrated (matches screen headers,
     not a boxed modal title): gold Lato eyebrow + Cinzel title + a
     thin centered gold hairline divider underneath. */
  .fp-head {
    flex: 0 0 auto;
    padding: 56px 56px 18px;
    text-align: center;
  }
  .fp-eyebrow {
    font-family: 'Lato', sans-serif;
    font-weight: 500; font-size: 10px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-500); margin-bottom: 14px;
  }
  .fp-title {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 600; font-size: 40px; line-height: 1.04;
    letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--onyx-700); margin: 0 0 16px;
  }
  /* thin gold hairline under the title, centered like other screens */
  .fp-head::after {
    content: ''; display: block; width: 64px; height: 1px;
    margin: 0 auto 16px;
    background: var(--gold-500); opacity: 0.55;
  }
  .fp-sub {
    font-family: 'Lato', sans-serif; font-weight: 300;
    font-size: 14.5px; color: var(--taupe-500);
    max-width: 560px; margin: 0 auto;
  }

  /* type tabs */
  .fp-tabs {
    flex: 0 0 auto;
    display: flex; justify-content: center; gap: 6px;
    padding: 14px 0 6px;
  }
  .fp-tab {
    font-family: 'Lato', sans-serif; font-weight: 600;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--taupe-500);
    padding: 11px 26px; border-radius: 999px;
    background: transparent; border: 1px solid transparent;
    cursor: pointer; transition: all 220ms ease;
    -webkit-appearance: none; appearance: none;
  }
  .fp-tab:hover { color: var(--onyx-700); border-color: var(--hair); }
  .fp-tab.is-active {
    color: var(--paper); background: var(--gold-500);
    border-color: var(--gold-500);
    box-shadow: 0 6px 16px -8px rgba(148,111,56,0.7);
  }

  /* catalog (scrollable) */
  .fp-catalog {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
    padding: 18px 56px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .fp-catalog::-webkit-scrollbar { width: 8px; }
  .fp-catalog::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 8px; }

  .fp-sec { margin-bottom: 30px; }
  .fp-sec-head {
    display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
  }
  .fp-sec-name {
    font-family: 'Lato', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--gold-600); white-space: nowrap;
  }
  .fp-sec-rule { flex: 1 1 auto; height: 1px; background: var(--hair-lo); }

  .fp-cards {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(208px, 1fr));
  }

  /* a plan card */
  .fp-card {
    position: relative; text-align: left;
    background: var(--paper);
    border: 1px solid var(--hair-lo); border-radius: 12px;
    padding: 12px; cursor: pointer; overflow: hidden;
    transition: transform 220ms cubic-bezier(.2,.7,.3,1), box-shadow 240ms ease, border-color 220ms ease;
    -webkit-appearance: none; appearance: none;
  }
  .fp-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow); border-color: var(--hair); }
  .fp-card.is-selected { border-color: var(--gold-400); box-shadow: 0 0 0 2px var(--gold-300) inset, var(--card-shadow); }
  .fp-card-thumb {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    border-radius: 8px; overflow: hidden;
    background: var(--bone-50);
    display: flex; align-items: center; justify-content: center;
  }
  .fp-card-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .fp-card-title {
    font-family: 'Lato', sans-serif; font-weight: 700;
    font-size: 13.5px; color: var(--onyx-700);
    margin: 11px 2px 3px; line-height: 1.25;
  }
  .fp-card-sub {
    font-family: 'Lato', sans-serif; font-weight: 400;
    font-size: 11.5px; color: var(--taupe-500); margin: 0 2px;
  }
  .fp-card-badge {
    position: absolute; top: 18px; right: 18px;
    width: 26px; height: 26px; border-radius: 999px;
    background: var(--gold-500); color: var(--paper);
    display: none; align-items: center; justify-content: center;
    font-family: 'Lato', sans-serif; font-weight: 700; font-size: 13px;
    box-shadow: 0 4px 10px -3px rgba(148,111,56,0.8);
  }
  .fp-card.is-selected .fp-card-badge { display: inline-flex; }
  .fp-card-pick {
    position: absolute; top: 18px; right: 18px;
    width: 26px; height: 26px; border-radius: 999px;
    background: rgba(252,250,244,0.9); border: 1px solid var(--hair);
    color: var(--gold-500); display: inline-flex; align-items:center; justify-content:center;
    font-size: 15px; opacity: 0; transition: opacity 200ms ease;
  }
  .fp-card:hover .fp-card-pick { opacity: 1; }
  .fp-card.is-selected .fp-card-pick { display: none; }

  /* comparison tray (picker only) — a footer bar of the screen, not a
     modal footer: hairline top edge + translucent paper wash that lets
     the page texture read through, echoing the topbar treatment. */
  .fp-tray {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 16px;
    padding: 18px 56px 24px;
    border-top: 1px solid var(--hair-lo);
    background: linear-gradient(180deg, rgba(252,250,244,0) 0%, rgba(252,250,244,0.72) 32%, var(--paper-2) 100%);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .fp-tray-label {
    font-family: 'Lato', sans-serif; font-weight: 700;
    font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--taupe-400); white-space: nowrap;
  }
  .fp-slots { display: flex; gap: 10px; flex: 1 1 auto; }
  .fp-slot {
    flex: 0 0 auto; min-width: 168px; max-width: 220px;
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; border-radius: 10px;
    background: var(--bone-50); border: 1px dashed var(--hair);
    font-family: 'Lato', sans-serif;
  }
  .fp-slot.is-empty { color: var(--taupe-400); font-size: 12px; font-style: italic; border-style: dashed; }
  .fp-slot.is-filled { border-style: solid; border-color: var(--hair); background: var(--paper); }
  .fp-slot .n {
    width: 20px; height: 20px; border-radius: 999px; flex: 0 0 auto;
    background: var(--gold-500); color: var(--paper);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px;
  }
  .fp-slot .t { flex: 1 1 auto; font-size: 12px; font-weight: 600; color: var(--onyx-700);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-slot .x { flex: 0 0 auto; cursor: pointer; color: var(--taupe-400); font-size: 15px;
    background: none; border: none; padding: 0 2px; }
  .fp-slot .x:hover { color: var(--copper); }
  .fp-compare {
    flex: 0 0 auto;
    font-family: 'Lato', sans-serif; font-weight: 700;
    font-size: 13px; letter-spacing: 0.08em;
    padding: 14px 30px; border-radius: 999px;
    background: var(--onyx-700); color: var(--paper);
    border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px;
    transition: transform 180ms ease, opacity 220ms ease, background 220ms ease;
  }
  .fp-compare:hover:not(:disabled) { transform: translateX(2px); background: var(--onyx-500); }
  .fp-compare:disabled { opacity: 0.34; cursor: not-allowed; }
  /* close — echoes the topbar circular control (.tc) so it reads as a
     native screen control, not a modal dismiss. Sits above texture. */
  .fp-close {
    position: absolute; top: 30px; right: 40px; z-index: 6;
    width: 44px; height: 44px; border-radius: 999px;
    background: rgba(252, 250, 244, 0.72); border: 1px solid var(--hair);
    color: var(--gold-500); font-weight: 300; font-size: 22px; line-height: 1;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 220ms ease, color 220ms ease, border-color 220ms ease, transform 200ms ease;
  }
  .fp-close:hover { background: var(--paper); color: var(--onyx-700); border-color: var(--hair-hi); }
  .fp-close:active { transform: scale(0.94); }

  /* slide-in drawer (in-comparison change) */
  .fp-drawer {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 40;
    width: min(560px, 64%);
    display: flex; flex-direction: column;
    background: var(--paper);
    box-shadow: -30px 0 80px -30px rgba(40,28,10,0.4);
    transform: translateX(102%);
    transition: transform 420ms cubic-bezier(.2,.8,.2,1);
  }
  .fp-drawer.is-open { transform: translateX(0); }
  .fp-scrim {
    position: absolute; inset: 0; z-index: 39;
    background: rgba(26,24,20,0.32);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; visibility: hidden;
    transition: opacity 380ms ease, visibility 0s linear 380ms;
  }
  .fp-scrim.is-open { opacity: 1; visibility: visible; transition: opacity 380ms ease; }
  .fp-drawer-head {
    flex: 0 0 auto; padding: 26px 30px 12px;
    display: flex; align-items: flex-start; justify-content: space-between;
    border-bottom: 1px solid var(--hair-lo);
  }
  .fp-drawer-head .ttl {
    font-family: 'Cinzel', Georgia, serif; font-weight: 600;
    font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--onyx-700); margin: 0;
  }
  .fp-drawer-head .sub {
    font-family: 'Lato', sans-serif; font-weight: 400; font-size: 12px;
    color: var(--taupe-500); margin-top: 4px;
  }
  .fp-drawer .fp-tabs { padding: 14px 24px 4px; justify-content: flex-start; flex-wrap: wrap; }
  .fp-drawer .fp-catalog { padding: 14px 24px 28px; }
  .fp-drawer .fp-cards { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .fp-drawer-close {
    width: 36px; height: 36px; border-radius: 999px; flex: 0 0 auto;
    background: var(--bone-50); border: 1px solid var(--hair-lo);
    color: var(--taupe-500); font-size: 18px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .fp-drawer-close:hover { color: var(--onyx-700); }

  /* lightweight per-panel switch bar (replaces the old type/filter/dropdown stack) */
  .pw-switch {

<script>
  // ── Stage scaler — scale-to-fit (contain). Fixes iPad13 side overflow.
  (function () {
    const W = 1440, H = 900;
    function scale() {
      const stage = document.querySelector('.stage-inner') || document.getElementById('stage');
      if (!stage) return;
      let vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const s = Math.min(vw / W, vh / H);
      // FULL-SCREEN FILL: grow the stage to exactly cover the viewport. Uniform
      // scale (no distortion); design dims stay >= 1440x900 so no content is
      // cropped; the surplus is breathing room around the anchored chrome.
      stage.style.width  = Math.ceil(vw / s) + 'px';
      stage.style.height = Math.ceil(vh / s) + 'px';
      const t = 'scale(' + s + ')';
      stage.style.transform = t;
      stage.style.webkitTransform = t;
      document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
    }
    window.__scale = scale;
    window.addEventListener('resize', scale);
    window.addEventListener('orientationchange', scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scale);
      window.visualViewport.addEventListener('scroll', scale);
    }
    document.addEventListener('DOMContentLoaded', scale);
    window.addEventListener('load', scale);

    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend',    e => e.preventDefault());
  })();
</script>

<script>
  // ──────────────────────────────────────────────────────────────
  // PLAN DATA — 3 plan datasets (Plan 01 / 02 / 03)
  //   Plan 01 = 3 BHK Compact
  //   Plan 02 = 5 BHK Grand
  //   Plan 03 = 4 BHK Classic (default)
  // Each plan carries its own metadata + a builder for the SVG.
  // ──────────────────────────────────────────────────────────────

  function room(x, y, w, h, name, dim, fill) {
    fill = fill || '#D8E5EF';
    const cx = x + w/2, cy = y + h/2;
    const nameY = dim ? cy - 4 : cy + 4;
    const dimY = cy + 12;
    let svg = '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="#2F5A78" stroke-width="2"/>';
    svg += '<text x="'+cx+'" y="'+nameY+'" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.18em" fill="#1F3D55">'+name+'</text>';
    if (dim) {
      svg += '<text x="'+cx+'" y="'+dimY+'" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.12em" fill="#5B7C95">'+dim+'</text>';
    }
    return svg;
  }
  function smallRoom(x, y, w, h, name, fill) {
    fill = fill || '#D8E5EF';
    const cx = x + w/2, cy = y + h/2 + 3;
    let svg = '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="#2F5A78" stroke-width="1.6"/>';
    svg += '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="600" letter-spacing="0.14em" fill="#1F3D55">'+name+'</text>';
    return svg;
  }

  const BG = `
    <defs>
      <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2F5A78" stroke-width="0.15" opacity="0.25"/>
      </pattern>
      <linearGradient id="bp-fill-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#D8E5EF" />
        <stop offset="100%" stop-color="#C0D5E4" />
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="880" height="600" fill="url(#bp-grid)" />
    <rect x="40" y="32" width="800" height="536" fill="none" stroke="#2F5A78" stroke-width="3" opacity="0.55"/>
  `;
