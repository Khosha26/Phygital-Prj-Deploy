<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Embassy ONE Private Residences · Floor Plans</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  RESIDENCES · FLOOR PLANS — rebuilt to match the approved reference
  ("Generous, never excessive.").
  ──────────────────────────────────────────────────────────────────────
  · Parchment bg. Top: RETURN · "THE RESIDENCES · FLOOR PLANS" · "UP TO 3 SIDE BY SIDE".
  · Heading + intro. Six configuration chips (+ to add, × to remove, max 3).
  · 1–3 white plan cards side by side, each with independent pan & zoom
    (wheel / pinch / drag / dbl-click reset / + − buttons), a zoom-%
    + sq-ft footer, and the FULL high-res booklet sheet (original colours,
    3600px → crisp at any zoom).
  · Bottom hint line.  Plans live in ../assets/floorplans/hi/*.webp.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* iPad strip fix: the root paints app-beige so viewport shifts (safe-area / overscroll) never expose white */
  html{background:#efe8da}
  :root{
    /* deck palette (redesign brief) */
    --ink:#121621; --ink-2:#1a2030; --ink-3:#222a3a;
    --bone:#efe8da; --bone-2:#e6dcc8; --paper:#faf7f0;
    --taupe:#6e5c58; --champ:#c9a84c;
    --on-dark:#ece8e0; --on-dark-dim:#9aa1ad;
    --on-light:#121621; --on-light-dim:#7a7264;
    --line-dark:rgba(236,232,224,.14); --line-light:rgba(18,22,33,.12);
    --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
    /* legacy aliases remapped to deck palette (no gold) */
    --card:#faf7f0; --muted:#7a7264; --faint:#8a8f99; --line:rgba(18,22,33,.12);
    --navy:#121621; --navy-2:#1a2030; --navy-3:#222a3a; --on-navy:#ece8e0; --on-navy-dim:#9aa1ad;
    --gold:#c9a84c; --gold-d:#8a7a66; --gold-l:#c9a84c; --gold-lt:#c9a84c; --brass:#c9a84c; --parch:#1a2030;
    --ease:cubic-bezier(.23,1,.32,1); --expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; width:100%; background:#efe8da; color:var(--ink); font-family:"Jost",sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow:hidden;
    position:fixed; inset:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
  img,svg{-webkit-user-drag:none}
  /* blue theme background with the real ONE tower blended in (duotone), matching the suite */
  .bg{position:fixed; inset:0; z-index:0; background:radial-gradient(125% 95% at 50% 0%, #efe8da, #e0d5c0 62%), #efe8da}
  /* the tower render, desaturated + luminosity-blended so it reads as a soft blue-toned presence (kept very subtle behind the bright plan cards) */
  .bg::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:url(../assets/renders/exterior/tower-hero.webp) center 16% / cover no-repeat;
    filter:saturate(.32) brightness(.55) contrast(1.02); opacity:.08; mix-blend-mode:multiply}
  /* subtle grain, blended */
  .bg::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:radial-gradient(rgba(18,22,33,.05) .5px, transparent .6px); background-size:3px 3px}
  .wrap{position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    padding:clamp(16px,2.2vh,28px) clamp(22px,3vw,58px) clamp(10px,1.4vh,18px)}

  /* top bar */
  .top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; flex:0 0 auto; gap:12px}
  .back{justify-self:start; display:inline-flex; align-items:center; gap:11px; cursor:pointer;
    background:#121621; border:1px solid rgba(18,22,33,.25);
    color:#faf7f0; font-weight:500; font-size:clamp(9px,1.15vh,13px); letter-spacing:.32em;
    text-transform:uppercase; padding:11px 22px 11px 16px; border-radius:999px;
    box-shadow:0 8px 18px -8px rgba(0,0,0,.4);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    transition:transform .16s cubic-bezier(.16,1,.3,1), box-shadow .3s, background .3s}
  .back:active{ transform:scale(.97); }
  .back svg{width:15px;height:15px;display:block; stroke:#faf7f0}
  .eyebrow{justify-self:center; font-size:clamp(9px,1.2vh,13px); letter-spacing:.42em; text-transform:uppercase; color:var(--champ); white-space:nowrap}
  .corner{justify-self:end; font-size:clamp(8.5px,1.05vh,12px); letter-spacing:.34em; text-transform:uppercase; color:var(--on-light-dim)}

  /* config chips — glass floor-type selector buttons (no gold border) */
  .chips{flex:0 0 auto; display:flex; gap:clamp(8px,1vw,16px); margin-top:clamp(8px,1.4vh,16px); flex-wrap:wrap;
    background:transparent; padding:0}
  .chip{flex:1 1 0; min-width:140px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
    background:#121621;
    border:1px solid rgba(18,22,33,.25); border-radius:14px; padding:clamp(8px,1.1vh,12px) clamp(12px,1.1vw,16px);
    text-align:left; -webkit-backdrop-filter:blur(16px) saturate(1.12); backdrop-filter:blur(16px) saturate(1.12);
    box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12); transition:background .2s, border-color .2s, box-shadow .25s, transform .16s var(--ease-out)}
  @media(hover:hover){ .chip:hover{border-color:rgba(201,168,76,.34); transform:translateY(-1px)} }
  .chip:active{transform:scale(.97)}
  .chip .ct{display:flex; flex-direction:column; gap:3px; min-width:0}
  .chip .cl{font-size:clamp(11px,1.3vh,14.5px); font-weight:500; color:var(--on-dark); letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip .cs{font-size:clamp(9.5px,1.1vh,12.5px); font-weight:300; color:var(--on-dark-dim); letter-spacing:.1em; font-variant-numeric:tabular-nums}
  .chip .cbtn{flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line-dark); color:var(--on-dark-dim); transition:background .25s,color .25s,transform .3s}
  .chip .cbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
  /* selected/active — brighter ink fill + stronger champagne hairline */
  .chip.sel{
    background:#121621;
    border-color:rgba(201,168,76,.42);
    box-shadow:0 22px 50px -22px rgba(6,9,16,.78), inset 0 1px 0 rgba(236,232,224,.16)}
  .chip.sel .cl{color:var(--on-dark)} .chip.sel .cs{color:var(--champ)}
  .chip.sel .cbtn{background:rgba(236,232,224,.16); color:var(--on-dark); border-color:var(--line-dark)}
  .chip.disabled{opacity:.5; pointer-events:none}

  /* comparison panels */
  .stage{flex:1 1 auto; min-height:0; display:flex; gap:clamp(14px,1.6vw,26px); margin-top:clamp(8px,1.1vh,14px)}
  .panel{flex:1 1 0; min-width:0; position:relative; display:flex; flex-direction:column;
    background:#faf7f0;
    border:1px solid rgba(18,22,33,.12); border-radius:18px; overflow:hidden;
    box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12);
    animation:panelIn .5s var(--expo) both}
  @keyframes panelIn{from{opacity:0; transform:translateY(14px) scale(.99)} to{opacity:1; transform:none}}
  .planview{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; background:transparent; cursor:grab}
  .planimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform-origin:center; will-change:transform}
  .planimg.dragging{cursor:grabbing}
  .zctrl{position:absolute; top:50%; right:clamp(10px,.8vw,16px); transform:translateY(-50%); z-index:6; display:flex; flex-direction:column; gap:8px}
  .zb{width:clamp(34px,4.2vh,44px); height:clamp(34px,4.2vh,44px); border-radius:12px; cursor:pointer; border:1px solid rgba(18,22,33,.25);
    background:#121621;
    -webkit-backdrop-filter:blur(16px) saturate(1.12); backdrop-filter:blur(16px) saturate(1.12); color:var(--on-dark-dim); display:grid; place-items:center; box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12);
    transition:background .2s,color .2s,border-color .2s,transform .16s var(--ease-out)}
  @media(hover:hover){ .zb:hover{border-color:rgba(201,168,76,.34); color:var(--on-dark)} } .zb:active{transform:scale(.97)} .zb:disabled{opacity:.4; cursor:default}
  .zb svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pfoot{flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:clamp(11px,1.5vh,17px) clamp(15px,1.3vw,22px);
    border-top:1px solid rgba(18,22,33,.1);
    background:#faf7f0}
  .pfoot .tico{flex:0 0 auto; width:clamp(34px,4.4vh,46px); height:clamp(34px,4.4vh,46px); border-radius:50%; border:1px solid rgba(18,22,33,.12); display:grid; place-items:center}
  .pfoot .tico svg{width:52%;height:52%;stroke:var(--taupe);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .pfoot .pname{font-family:"Cormorant Garamond",serif; font-weight:600; font-size:clamp(15px,2.1vh,24px); color:var(--ink); line-height:1; flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pfoot .pmeta{display:flex; align-items:center; gap:10px; font-size:clamp(9.5px,1.15vh,13px); letter-spacing:.16em; color:var(--taupe); white-space:nowrap; font-variant-numeric:tabular-nums}
  .pfoot .pmeta .zpct{color:var(--ink)} .pfoot .pmeta .sep{opacity:.5}
  .pclose{position:absolute; top:12px; left:12px; z-index:6; width:30px; height:30px; border-radius:50%; cursor:pointer; border:1px solid rgba(236,232,224,.24);
    background:#121621;
    color:#faf7f0; display:grid; place-items:center; box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12); opacity:0; transition:opacity .25s, background .2s}
  @media (hover:hover){ .panel:hover .pclose{opacity:1} }
  @media (hover:none){ .pclose{opacity:.85} }     /* touch devices: keep remove control reachable */
  .pclose svg{width:48%;height:48%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

  .empty{flex:1 1 auto; display:flex; align-items:center; justify-content:center; text-align:center;
    border:1px dashed rgba(201,168,76,.24); border-radius:18px; color:var(--on-dark-dim);
    background:linear-gradient(155deg, rgba(30,46,104,.44), rgba(18,30,68,.38)); -webkit-backdrop-filter:blur(14px) saturate(1.12); backdrop-filter:blur(14px) saturate(1.12);
    box-shadow:inset 0 1px 0 rgba(236,232,224,.1);
    font-family:"Cormorant Garamond",serif; font-style:italic; font-size:clamp(16px,2.4vh,28px)}

  .hint{flex:0 0 auto; text-align:center; margin-top:clamp(8px,1.2vh,14px);
    font-size:clamp(8px,1vh,11px); letter-spacing:.28em; text-transform:uppercase; color:var(--on-light-dim); opacity:.85}
  .hint .sep{margin:0 .7em; color:var(--champ); opacity:.7}

  .fadein{opacity:0; transform:translateY(10px); animation:fin .8s var(--expo) forwards}
  @keyframes fin{to{opacity:1;transform:none}}

  /* ── PORTRAIT / NARROW: stack comparison panels so each plan gets full width ── */
  @media (max-aspect-ratio:1/1){
    .wrap{overflow-y:auto; -webkit-overflow-scrolling:touch}
    .stage{flex-direction:column; gap:clamp(12px,1.6vh,20px)}
    .panel{flex:0 0 auto; min-height:min(48vh,420px)}
    .empty{min-height:30vh}
  }

  /* ── PHONE: chips wrap 2-up, top bar can't clip, plans readable ── */
  @media (max-width:560px){
    .wrap{padding:clamp(12px,2.2vh,18px) clamp(14px,4vw,22px) clamp(10px,1.4vh,16px)}
    .eyebrow{display:none}                      /* avoid 3-col clip; Return + corner stay */
    .corner{justify-self:end; font-size:9.5px; letter-spacing:.18em; white-space:normal; text-align:right; max-width:40vw}
    .top{grid-template-columns:auto 1fr; gap:8px}   /* Return | corner (eyebrow hidden) */
    .chips{gap:8px; margin-top:clamp(8px,1.6vh,14px)}
    .chip{flex:1 1 calc(50% - 4px); min-width:0}     /* 2 per row on phone */
    .chip .cl{font-size:11.5px; white-space:normal}
    .chip .cbtn{width:26px; height:26px}             /* tappable */
    .stage{margin-top:clamp(8px,1.4vh,12px)}
    .panel{min-height:min(52vh,380px)}
    .zb{width:40px; height:40px}                      /* ≥44px-ish touch, large enough */
    .pfoot{padding:10px 14px; gap:10px}
    .pfoot .pname{font-size:clamp(15px,4.6vw,20px)}
    .hint{font-size:9px; letter-spacing:.18em}
  }
  @media (max-width:380px){
    .chip{flex:1 1 100%}                              /* single column chips on very small phones */
  }

  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
  /* v2-unify: consistent glass back button across all screens */
  .back{justify-self:start!important; align-self:flex-start!important; display:inline-flex!important; align-items:center!important; gap:10px!important; min-height:44px!important; padding:9px 20px 9px 16px!important; border-radius:999px!important; cursor:pointer!important; background:#121621!important; color:#faf7f0!important; font-family:"Jost",sans-serif!important; font-size:clamp(10px,1.15vh,13px)!important; font-weight:500!important; letter-spacing:.22em!important; text-transform:uppercase!important; -webkit-backdrop-filter:blur(16px) saturate(1.12)!important; backdrop-filter:blur(16px) saturate(1.12)!important; box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12)!important; transition:background .3s,border-color .3s,transform .16s!important}
  @media(hover:hover){ .back:hover{border-color:rgba(201,168,76,.34)!important; box-shadow:0 24px 54px -24px rgba(6,9,16,.72), inset 0 1px 0 rgba(236,232,224,.18)!important} }
  .back:active{transform:scale(.97)!important}
  .back svg{width:15px!important; height:15px!important; display:block!important; stroke:#faf7f0!important}

  /* ── 360° view button (top bar, right cell) + full-screen viewer ── */
  .nav360{justify-self:end; align-self:center; display:inline-flex; align-items:center; gap:9px; cursor:pointer;
    padding:10px 18px 10px 15px; border-radius:999px; border:1px solid rgba(18,22,33,.25); color:#faf7f0;
    background:#121621; font-family:"Jost",sans-serif; font-weight:500; letter-spacing:.2em; text-transform:uppercase; font-size:clamp(9px,1.15vh,13px);
    box-shadow:0 8px 20px -10px rgba(0,0,0,.45); transition:transform .16s var(--ease-out), background .2s, border-color .2s}
  .nav360:active{transform:scale(.97)}
  @media(hover:hover){ .nav360:hover{background:#121621; border-color:rgba(201,168,76,.5); transform:translateY(-1px)} }
  .nav360 svg{width:16px; height:16px; stroke:#faf7f0; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  #view360{position:fixed; inset:0; z-index:90; background:#0a0d14; opacity:0; visibility:hidden; transition:opacity .4s var(--ease)}
  #view360.show{opacity:1; visibility:visible}
  #view360 iframe{width:100%; height:100%; border:0; display:block}
  #back360{position:fixed; top:max(clamp(14px,2.4vh,26px),env(safe-area-inset-top)); left:max(clamp(14px,2.4vw,26px),env(safe-area-inset-left)); z-index:91; display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    padding:clamp(10px,1.4vh,14px) clamp(16px,1.6vw,22px); border-radius:999px; border:1px solid rgba(236,232,224,.24); color:#faf7f0;
    background:#121621; -webkit-backdrop-filter:blur(14px) saturate(1.1); backdrop-filter:blur(14px) saturate(1.1); font-family:"Jost",sans-serif; font-weight:500; letter-spacing:.2em; text-transform:uppercase; font-size:clamp(10px,1.3vh,13px); box-shadow:0 10px 26px -12px rgba(0,0,0,.7); transition:transform .16s var(--ease-out), background .2s}
  #back360:active{transform:scale(.97)}
  @media(hover:hover){ #back360:hover{background:#121621} }
  @media (max-width:560px){ .nav360{padding:9px 14px 9px 12px; gap:7px} .nav360 svg{width:14px;height:14px} }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="top">
      <button class="back" id="back" aria-label="Return">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>Return
      </button>
      <div class="eyebrow">The Residences · Floor Plans</div>
      <button class="nav360" id="btn360" aria-label="360 degree view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4.2"/><path d="M7.6 8.4 4.4 9.2l1.9 2.7"/></svg>
        <span>360°</span>
      </button>
    </div>

    <div class="chips fadein" id="chips" style="animation-delay:.06s"></div>

    <div class="stage" id="stage"></div>

    <div class="hint">Drag to pan <span class="sep">·</span> Scroll or pinch to zoom <span class="sep">·</span> + / − to step <span class="sep">·</span> Double-click to reset</div>
  </div>

  <!-- floating 360° view viewer -->
  <div id="view360" aria-hidden="true">
    <iframe id="frame360" title="Embassy ONE — 360° View" allow="fullscreen; accelerometer; gyroscope; magnetometer; xr-spatial-tracking" allowfullscreen></iframe>
    <button id="back360" aria-label="Back">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Back</span>
    </button>
  </div>

<script>
  var TICO='<svg viewBox="0 0 24 24"><path d="M9.5 21V8.2L12 4l2.5 4.2V21"/><path d="M8.8 21h6.4M9.8 12.5h4.4M9.8 16.2h4.4"/></svg>';
  var CONFIGS=[
    {key:'2br-duplex',     label:'2-Bedroom Duplexes',                          sqft:'4,149 sq ft',          area:'4,149',          img:'../assets/floorplans/hi/2br-duplex.webp'},
    {key:'3br',            label:'3-Bedroom Residences',                        sqft:'5,423 sq ft',          area:'5,423',          img:'../assets/floorplans/hi/3br.webp'},
    {key:'3br-sm',         label:'3-Bedroom + Study / + Media',                 sqft:'5,856 – 7,549 sq ft',  area:'5,856 – 7,549',  img:'../assets/floorplans/hi/3br-study-media.webp'},
    {key:'4br',            label:'4-Bedroom &amp; 4-Bedroom + Study Residences',sqft:'6,272 – 7,571 sq ft',  area:'6,272 – 7,571',  img:'../assets/floorplans/hi/4br.webp'},
    {key:'4br-rec',        label:'4-Bedroom Recessed Residences',               sqft:'6,280 – 6,335 sq ft',  area:'6,280 – 6,335',  img:'../assets/floorplans/hi/4br-recessed.webp'},
    {key:'5br-ph',         label:'5-Bedroom Penthouse Duplexes',                sqft:'12,977 – 15,124 sq ft',area:'12,977 – 15,124',img:'../assets/floorplans/hi/5br-penthouse-lower.webp'}
  ];
  var MAX=3;
  var selected=[];

  var PLUS='<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>';
  var CROSS='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  var chipsEl=document.getElementById('chips'), stageEl=document.getElementById('stage');
  var chipEls={};
  CONFIGS.forEach(function(c){
    var b=document.createElement('button'); b.className='chip'; b.setAttribute('data-key',c.key);
    b.innerHTML='<span class="ct"><span class="cl">'+c.label+'</span><span class="cs">'+c.sqft+'</span></span><span class="cbtn">'+PLUS+'</span>';
    b.addEventListener('click', function(){ toggle(c.key); });
    chipsEl.appendChild(b); chipEls[c.key]=b;
  });

  function cfg(key){ for(var i=0;i<CONFIGS.length;i++){ if(CONFIGS[i].key===key) return CONFIGS[i]; } return null; }

  function toggle(key){
    var i=selected.indexOf(key);
    if(i>=0){ selected.splice(i,1); }
    else { if(selected.length>=MAX) return; selected.push(key);
      try{var _c=cfg(key); window.RDA&&RDA.track('floorplan_view', (_c&&_c.label)||key);}catch(_){} }
    render();
  }

  function render(){
    CONFIGS.forEach(function(c){
      var on=selected.indexOf(c.key)>=0;
      var b=chipEls[c.key];
      b.classList.toggle('sel', on);
      b.classList.toggle('disabled', !on && selected.length>=MAX);
      b.querySelector('.cbtn').innerHTML = on ? CROSS : PLUS;
    });
    stageEl.innerHTML='';
    if(selected.length===0){
      var e=document.createElement('div'); e.className='empty';
      e.textContent='Select a configuration above to begin. Add up to three to compare.';
      stageEl.appendChild(e); return;
    }
    selected.forEach(function(key){ stageEl.appendChild(buildPanel(cfg(key))); });
  }

  function buildPanel(c){
    var p=document.createElement('div'); p.className='panel';
    p.innerHTML=
      '<button class="pclose" aria-label="Remove">'+CROSS+'</button>'+
      '<div class="planview"><img class="planimg" src="'+c.img+'" alt="'+c.label+' floor plan" draggable="false"></div>'+
      '<div class="zctrl">'+

  function attachZoom(view, img, pct, zin, zout, zrst){
    var MIN=1, MAX_Z=5, scale=1, tx=0, ty=0, drag=false, sx=0, sy=0, stx=0, sty=0, pd=0, ps=1;
    function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
    function clampPan(){ var w=view.clientWidth, h=view.clientHeight;
      var ex=Math.max(0,(w*scale-w)/2), ey=Math.max(0,(h*scale-h)/2); tx=clamp(tx,-ex,ex); ty=clamp(ty,-ey,ey); }
    function apply(an){ img.style.transition=an?'transform .3s var(--ease)':'none';
      img.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
      view.classList.toggle('zoomed', scale>1.001);
      pct.textContent=Math.round(scale*100)+'%'; zout.disabled=scale<=MIN+0.001; zin.disabled=scale>=MAX_Z-0.001; }
    function reset(an){ scale=1; tx=0; ty=0; drag=false; img.classList.remove('dragging'); apply(an); }
    function zoomTo(n,cx,cy,an){ n=clamp(n,MIN,MAX_Z); if(n===scale) return; var k=n/scale; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=n; clampPan(); apply(an); }
    function focal(e){ var r=img.getBoundingClientRect(); return {x:e.clientX-(r.left+r.width/2), y:e.clientY-(r.top+r.height/2)}; }
    view.addEventListener('wheel', function(e){ e.preventDefault(); var f=focal(e); zoomTo(scale*(e.deltaY<0?1.12:1/1.12), f.x, f.y, false); }, {passive:false});
    img.addEventListener('dblclick', function(e){ e.preventDefault(); if(scale>1.001) reset(true); else { var f=focal(e); zoomTo(2.4,f.x,f.y,true); } });
    img.addEventListener('mousedown', function(e){ if(scale<=1.001) return; e.preventDefault(); drag=true; img.classList.add('dragging'); sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; });
    window.addEventListener('mousemove', function(e){ if(!drag) return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); clampPan(); apply(false); });
    window.addEventListener('mouseup', function(){ if(drag){ drag=false; img.classList.remove('dragging'); } });
    view.addEventListener('touchstart', function(e){ if(e.touches.length===2){ pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); ps=scale; }
      else if(e.touches.length===1 && scale>1.001){ drag=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; stx=tx; sty=ty; } }, {passive:false});
    view.addEventListener('touchmove', function(e){ if(e.touches.length===2){ e.preventDefault(); var r=img.getBoundingClientRect();
        var f={x:(e.touches[0].clientX+e.touches[1].clientX)/2-(r.left+r.width/2), y:(e.touches[0].clientY+e.touches[1].clientY)/2-(r.top+r.height/2)};
        zoomTo(ps*(Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pd), f.x, f.y, false); }
      else if(drag && e.touches.length===1){ e.preventDefault(); tx=stx+(e.touches[0].clientX-sx); ty=sty+(e.touches[0].clientY-sy); clampPan(); apply(false); } }, {passive:false});
    view.addEventListener('touchend', function(e){ if(e.touches.length<2) pd=0; if(e.touches.length===0){ drag=false; img.classList.remove('dragging'); } });
    zin.addEventListener('click', function(){ zoomTo(scale+0.6,0,0,true); });
    zout.addEventListener('click', function(){ zoomTo(scale-0.6,0,0,true); });
    zrst.addEventListener('click', function(){ reset(true); });
    apply(false);
  }
