<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Grounds · Master Plan</title>
<!--
  ──────────────────────────────────────────────────────────────────────
  THE GROUNDS — MASTER PLAN EXPLORER
  ──────────────────────────────────────────────────────────────────────
  An interactive master-plan viewer:
   · The Master plan carries the 25 numbered features from the landscape
     legend, pinned onto the real drawing; the legend is a navigable list
     (click an item → fly-to + spotlight that pin).
   · Pan (drag), zoom (wheel cursor-anchored / pinch / ± / double-click
     reset). Plans sourced from the landscape CD.
  Plan drawings: assets/masterplan/views/*.webp
-->
<link href="../assets/fonts/fonts.css" rel="stylesheet"><!-- brand faces self-hosted (Tenor Sans + Poppins) -->
<style>
  /* iPad strip fix: the root paints app-beige so viewport shifts (safe-area / overscroll) never expose white */
  html{background:#efe8da}
  /* native buttons/inputs don't inherit font-family — force the brand face everywhere */
  button,input,select,textarea{font-family:inherit}

  /* iPad standalone PWA (installed): drop the top chrome below the status bar and let the
     backdrop bleed under the bottom home-indicator band, so the app reads truly full-screen.
     Inert in a normal browser tab (display-mode is not standalone there). */
  @media (display-mode:standalone){
    :where(.top,.topbar,.dtop,.loc>.bar){margin-top:env(safe-area-inset-top,0px)}
    :where(body,#home,.wrap,.stage,main)>:where(.back,.float360,.nav360,.views,.corner-logo,.hour-dial){margin-top:env(safe-area-inset-top,0px)}
    body,.bg,#map{min-height:100lvh}
  }

  :root{
    /* deck palette — ink-navy + bone */
    --deck-ink:#121621; --ink-2:#1a2030; --ink-3:#222a3a;
    --bone-2:#e6dcc8; --taupe:#6e5c58;
    --on-dark:#ece8e0; --on-dark-dim:#9aa1ad;
    --on-light:#121621; --on-light-dim:#7a7264;
    --line-dark:rgba(236,232,224,.14); --line-light:rgba(18,22,33,.12);
    --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
    /* legacy aliases remapped to the deck palette (reskin) */
    --parch:#efe8da; --paper:#faf7f0; --ink:#121621; --muted:#7a7264; --faint:#9a9aa0;
    --gold:#b3a184; --gold-d:#857a66; --gold-l:#c9a84c; --gold-lt:#c9a84c; --line:#d8d0c2;
    --navy:#121621; --navy-2:#1a2030; --navy-3:#222a3a;
    --bone:#efe8da; --champ:#c9a84c; --on-navy:#ece8e0; --on-navy-dim:#9aa1ad; --brass:#c9a84c;
    --exo:cubic-bezier(0.23,1,0.32,1);          /* strong ease-out (design-eng) */
    --eio:cubic-bezier(0.77,0,0.175,1);          /* strong ease-in-out */
    --overshoot:cubic-bezier(.34,1.56,.64,1);    /* spring-like overshoot */
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; width:100%; color:var(--ink); background:#efe8da; font-family:"Poppins",sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; position:fixed; inset:0;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none}
  img,svg{-webkit-user-drag:none}
  /* beige background (theme) */
  .bg{position:fixed; inset:0; z-index:0; background:radial-gradient(125% 100% at 50% 0%, #efe8da, #e0d5c0)}
  /* faint architectural line-drawing of the real ONE tower (INK lines for the light ground), bottom-left */
  .bg::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:url(../assets/renders/exterior/tower-outline.webp) no-repeat left -4% bottom;
    background-size:auto 98%; opacity:.07; mix-blend-mode:multiply}
  /* subtle grain */
  .bg::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:radial-gradient(rgba(18,22,33,.05) .5px, transparent .6px); background-size:3px 3px}

  /* ── TOP BAR ─────────────────────────────────────────── */
  .top{position:fixed; top:0; left:0; right:0; z-index:40; display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; padding:clamp(14px,2vh,26px) clamp(20px,3vw,52px) 0; gap:12px; pointer-events:none}
  .top>*{pointer-events:auto}
  .back{justify-self:start; display:inline-flex; align-items:center; gap:11px; cursor:pointer;
    background:#121621; border:1px solid rgba(250,247,240,.14); color:#faf7f0; font-weight:500; font-size:clamp(9px,1.15vh,13px);
    letter-spacing:.34em; text-transform:uppercase; padding:11px 22px 11px 16px; border-radius:999px;
    box-shadow:0 8px 18px -8px rgba(17,21,32,.45);
    -webkit-backdrop-filter:none; backdrop-filter:none;
    transition:transform .16s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s}
  .back:hover{ background:#121621; border-color:rgba(250,247,240,.28);
    box-shadow:0 10px 22px -8px rgba(17,21,32,.5); }
  .back:active{ transform:scale(.97); } .back svg{width:15px;height:15px; stroke:#faf7f0}
  .eyebrow{justify-self:center; font-size:clamp(9px,1.2vh,13px); letter-spacing:.46em; text-transform:uppercase; color:#7a684a; white-space:nowrap}
  .corner{justify-self:end; font-size:clamp(8.5px,1.05vh,12px); letter-spacing:.36em; text-transform:uppercase; color:#6e5c58}

  /* ── STAGE (pan/zoom plan) ───────────────────────────── */
  .stage{position:fixed; inset:0; z-index:5; overflow:hidden; cursor:grab; isolation:isolate}
  .stage.grabbing{cursor:grabbing}
  .canvas{position:absolute; inset:0; transform-origin:0 0; will-change:transform}
  .planwrap{position:absolute; right:0.5%; top:50%; transform:translateY(-50%);
    width:min(80vw,1680px); aspect-ratio:4961/3507; max-height:97vh;
    filter:drop-shadow(0 18px 40px rgba(40,28,12,.10))}
  .planimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    /* client-22 / perf: the muted brick-bronze boundary (saturate .65 · sepia .22) is now BAKED into master-fs.webp.
       No live CSS filter => the 15MP plan is a plain compositable texture, so pan/zoom never re-rasterizes a filtered layer. */
    transition:opacity .42s var(--exo)}
  .planimg.swapping{opacity:0; filter:blur(6px)}
  /* ── SVG zones overlay (Zones view): real polygons over the master plan ── */
  .zonesvg-layer{position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity .45s var(--exo)}
  .zonesvg-layer.on{opacity:1}
  .zonesvg-layer svg{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:136%; height:136%; overflow:visible; pointer-events:none}
  .zpath{fill:var(--zc,#caa36a); fill-opacity:.45; stroke:#ffffff; stroke-opacity:.6; stroke-width:3; paint-order:stroke;
    cursor:pointer; pointer-events:auto; transition:fill-opacity .35s var(--exo), filter .35s var(--exo), stroke-opacity .35s}
  @media(hover:hover){ .zpath:hover{fill-opacity:.62; filter:drop-shadow(0 0 16px var(--zc))} }
  .zpath.is-active{fill-opacity:.72; stroke-opacity:1; filter:drop-shadow(0 0 28px var(--zc)) drop-shadow(0 0 10px var(--zc))}
  .zpath.dim{fill-opacity:.12; stroke-opacity:.2; filter:none}
  /* zone spotlight (zoning view): dims the plan except a soft glow over the selected zone */
  .zonespot{position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; transition:opacity .45s var(--exo);
    background:radial-gradient(circle at var(--zx,50%) var(--zy,50%), transparent 0, transparent 11%, rgba(8,11,18,.34) 30%, rgba(8,11,18,.52) 100%)}
  .zonespot.on{opacity:1}
  .zonespot::before{content:""; position:absolute; left:var(--zx,50%); top:var(--zy,50%); width:24%; height:24%;
    transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, var(--zc,#caa36a) 0%, transparent 68%);
    opacity:.55; mix-blend-mode:screen; filter:blur(5px); animation:zpulse 2.6s ease-in-out infinite}
  @keyframes zpulse{0%,100%{transform:translate(-50%,-50%) scale(.9); opacity:.4} 50%{transform:translate(-50%,-50%) scale(1.1); opacity:.62}}

  /* clickable zone pins (zoning view) */
  .zpin{position:absolute; transform:translate(-50%,-50%); z-index:4; cursor:pointer;
    width:clamp(17px,1.7vw,25px); height:clamp(17px,1.7vw,25px); border-radius:50%;
    border:2px solid #fbf8f1; box-shadow:0 3px 11px -2px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.18);
    transition:transform .34s var(--overshoot), box-shadow .3s, opacity .3s}
  .zpin::after{content:""; position:absolute; inset:-9px; border-radius:50%; border:1.5px solid currentColor; opacity:0; pointer-events:none}
  @media(hover:hover){ .zpin:hover{transform:translate(-50%,-50%) scale(1.2)} }
  .zpin.is-active{transform:translate(-50%,-50%) scale(1.34); box-shadow:0 5px 18px -2px rgba(0,0,0,.6), 0 0 0 3px rgba(250,248,244,.4)}
  .zpin.is-active::after{opacity:.9; animation:ping 1.9s var(--exo) infinite}
  .zpin.dim{opacity:.34}

  /* floating zone info card — anchored above the selected pin, springs up smoothly */
  .zonepop{position:fixed; z-index:60; width:clamp(380px,32vw,500px);
    transform:translate(-50%,-100%) translateY(8px) scale(.94); transform-origin:50% calc(100% + 14px);
    opacity:0; pointer-events:none; transition:opacity .3s var(--exo), transform .46s var(--overshoot)}
  .zonepop.on{opacity:1; transform:translate(-50%,-100%) translateY(0) scale(1); pointer-events:auto}
  .zonepop .card{position:relative; border-radius:14px; padding:14px 30px 15px 16px; overflow:hidden;
    background:#121621;
    border:1px solid rgba(201,168,76,.4); color:var(--on-dark);
    box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12)}
  .zonepop .zpimg{display:block; height:clamp(180px,22vh,240px); object-fit:cover;
    margin:-14px -30px 12px -16px; width:calc(100% + 46px); border-radius:14px 14px 0 0}
  .zonepop .tail{position:absolute; left:50%; bottom:-8px; width:16px; height:16px; transform:translateX(-50%) rotate(45deg);
    background:#121621;
    border-right:1px solid rgba(201,168,76,.4); border-bottom:1px solid rgba(201,168,76,.4)}
  .zonepop .zc{display:flex; align-items:center; gap:9px; margin-bottom:6px}
  .zonepop .zc .sw{flex:0 0 auto; width:18px; height:18px; border-radius:5px; border:1px solid rgba(236,232,224,.2)}
  .zonepop .zc .k{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--champ)}
  .zonepop h3{font-family:"Tenor Sans",sans-serif; font-weight:600; font-size:clamp(23px,3vh,32px); color:var(--on-dark); line-height:1.1}
  .zonepop p{font-weight:300; color:var(--on-dark-dim); font-size:clamp(13px,1.7vh,17px); line-height:1.6; margin-top:7px}
  .zonepop .x{position:absolute; top:9px; right:9px; width:24px; height:24px; border:0; background:rgba(9,12,24,.5); border-radius:50%; color:var(--on-dark); cursor:pointer; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center}
  .zonepop .x:hover{color:#fff; background:rgba(9,12,24,.72)}

  /* numbered pins (master view) */
  .pin{position:absolute; transform:translate(-50%,-50%); z-index:3; cursor:pointer;
    width:clamp(20px,2.0vw,30px); height:clamp(20px,2.0vw,30px);
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:rgba(250,248,244,.92); border:1.5px solid var(--gold);
    color:var(--gold-d); font-size:clamp(9px,1.1vw,13px); font-weight:500; font-family:"Poppins";
    box-shadow:0 3px 9px -2px rgba(12,16,24,.4); transition:transform .18s var(--exo), background .2s, color .2s, border-color .2s}
  @media (hover:hover){ .pin:hover{transform:translate(-50%,-50%) scale(1.18); background:var(--gold); color:#fff} }
  .pin:active{transform:translate(-50%,-50%) scale(1.05)}
  .pin.is-active{background:var(--gold); color:#fff; border-color:var(--gold-l)}
  .pin.is-lantern{border-color:var(--gold-d); background:var(--gold-d); color:#fff}
  .pin.dim{opacity:.32}
  .pin .ring{position:absolute; inset:-7px; border-radius:50%; border:1.5px solid var(--gold); opacity:0; pointer-events:none}
  .pin.is-active .ring{animation:ping 1.6s var(--exo) infinite}
  @keyframes ping{0%{transform:scale(.7);opacity:.7}70%{transform:scale(1.7);opacity:0}100%{opacity:0}}

  /* ── LEFT RAIL ───────────────────────────────────────── */
  .rail{position:fixed; top:0; left:0; bottom:0; z-index:30; width:clamp(290px,24vw,372px);
    display:flex; flex-direction:column; padding:clamp(64px,9vh,96px) clamp(16px,1.4vw,26px) clamp(16px,2vh,26px) clamp(20px,3vw,52px);
    pointer-events:none}
  .rail>*{pointer-events:auto}
  .rail-head{font-family:"Tenor Sans",sans-serif; font-weight:600; font-size:clamp(28px,3.8vh,44px); line-height:1.04; color:#121621; text-transform:uppercase; letter-spacing:.08em}
  .rail-head em{font-style:normal; color:#8a7350}   /* client 2026-07-09: straight, not italic */
  .rail-sub{font-weight:300; color:#7a7264; font-size:clamp(11px,1.35vh,14px); line-height:1.55; margin:10px 0 16px; max-width:34ch}

  /* view switcher */
  .views{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
  .vbtn{appearance:none; cursor:pointer;
    background:#121621;
    -webkit-backdrop-filter:none; backdrop-filter:none;
    border:1px solid rgba(250,247,240,.14);
    box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12);
    color:#faf7f0; font-family:"Poppins"; font-size:clamp(9px,1.1vh,12px); letter-spacing:.14em; text-transform:uppercase;
    padding:8px 13px; border-radius:999px; transition:color .2s, border-color .2s, transform .14s var(--exo)}
  .vbtn:hover{border-color:rgba(250,247,240,.28); color:#faf7f0} .vbtn:active{transform:scale(.97)}
  .vbtn.is-active{background:#121621; color:#c9a84c; border-color:#c9a84c}

  /* facts */
  /* metadata = quiet stat line (de-emphasised so the legend frame can be taller) */
  .facts{display:grid; grid-template-columns:1fr 1fr; gap:3px 14px; margin-bottom:9px; opacity:.92}
  .fact{background:none; border:0; border-radius:0; padding:1px 0; display:flex; align-items:baseline; gap:7px}
  .fact .n{font-family:"Tenor Sans",sans-serif; font-weight:600; font-size:clamp(12px,1.5vh,16px); color:#8a7350; line-height:1.1; font-variant-numeric:tabular-nums}
  .fact .l{font-size:clamp(7px,.82vh,9px); letter-spacing:.1em; text-transform:uppercase; color:#7a7264; margin-top:0}

  /* legend list — glassmorphic cream panel (matches the Location rail for consistency) */
  .legend{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; color:var(--on-dark);
    background:#121621;
    -webkit-backdrop-filter:none; backdrop-filter:none;
    border:1px solid rgba(201,168,76,.4); border-radius:18px; overflow:hidden;
    box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12); outline:1px solid rgba(201,168,76,.20); outline-offset:-4px}
  .legend-h{flex:0 0 auto; padding:12px 16px; font-size:clamp(9px,1.1vh,12px); letter-spacing:.24em; text-transform:uppercase;
    color:var(--champ); border-bottom:1px solid rgba(201,168,76,.22); display:flex; justify-content:space-between; align-items:center}
  .legend-h .ct{color:var(--on-dark-dim); letter-spacing:.1em}
  .legend-body{flex:1 1 auto; overflow-y:auto; padding:6px}
  .legend-body::-webkit-scrollbar{width:7px} .legend-body::-webkit-scrollbar-thumb{background:rgba(201,168,76,.5); border-radius:7px}
  .lg-group-h{font-size:clamp(8.5px,1vh,11px); letter-spacing:.2em; text-transform:uppercase; color:var(--on-dark-dim);
    padding:11px 9px 5px}
  .lg-item{display:flex; align-items:center; gap:10px; padding:8px 9px; border-radius:9px; cursor:pointer;
    transition:background .16s var(--exo)}
  .lg-item:hover{background:rgba(201,168,76,.16)}
  .lg-item.is-active{background:rgba(201,168,76,.26)}
  .lg-item .num{flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:500; color:var(--on-dark); border:1.5px solid var(--champ); background:rgba(236,232,224,.06)}
  .lg-item.lantern .num{background:var(--champ); color:#121621; border-color:var(--champ)}
  .lg-item .sw{flex:0 0 auto; width:16px; height:16px; border-radius:5px; border:1px solid rgba(236,232,224,.2)}
  .lg-item .t{flex:1 1 auto; font-size:clamp(11px,1.35vh,14px); color:var(--on-dark); line-height:1.25}
  .lg-item .t small{display:block; font-size:clamp(8.5px,1vh,10.5px); color:var(--on-dark-dim); letter-spacing:.02em; margin-top:1px}
  .lg-item .go{flex:0 0 auto; color:var(--champ); opacity:0; transition:opacity .16s, transform .16s var(--exo)}
  .lg-item:hover .go{opacity:1; transform:translateX(2px)}

  /* zoom controls */
  .zoomctl{position:fixed; right:clamp(16px,1.6vw,28px); bottom:clamp(16px,2.4vh,30px); z-index:31; display:flex; flex-direction:column; gap:8px}
  .zbtn{width:42px; height:42px; border-radius:12px; cursor:pointer; color:#faf7f0;
    background:#121621;
    -webkit-backdrop-filter:none; backdrop-filter:none;
    border:1px solid rgba(250,247,240,.14);
    box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12);
    display:flex; align-items:center; justify-content:center; transition:transform .14s var(--exo), border-color .2s}
  .zbtn:hover{border-color:rgba(250,247,240,.28)} .zbtn:active{transform:scale(.94)}
  .zbtn svg{width:18px;height:18px}

  /* info card */
  .info{position:fixed; right:clamp(16px,1.6vw,28px); bottom:clamp(72px,11vh,108px); z-index:33;
    width:clamp(244px,21vw,320px); border-radius:15px; padding:16px 17px; color:var(--on-dark);
    background:
      radial-gradient(130% 100% at 78% 8%, rgba(90,120,210,.18), transparent 60%),
      linear-gradient(155deg, rgba(30,46,104,.60), rgba(18,30,68,.52));
    -webkit-backdrop-filter:blur(16px) saturate(1.12); backdrop-filter:blur(16px) saturate(1.12);
    border:1px solid rgba(201,168,76,.20);
    box-shadow:0 22px 50px -26px rgba(6,9,16,.62), inset 0 1px 0 rgba(236,232,224,.12);
    opacity:0; transform:translateY(10px) scale(.97); transform-origin:bottom right; pointer-events:none;
    transition:opacity .26s var(--exo), transform .26s var(--exo)}
  .info.on{opacity:1; transform:translateY(0) scale(1); pointer-events:auto}
  .info .ic{display:flex; align-items:center; gap:9px; margin-bottom:8px}
  .info .ic .b{width:26px;height:26px;border-radius:50%;background:var(--gold-d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
  .info .ic .cat{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--champ)}
  .info h3{font-family:"Tenor Sans",sans-serif; font-weight:600; font-size:clamp(19px,2.5vh,26px); color:var(--on-dark); line-height:1.05}
  .info p{font-weight:300; color:var(--on-dark-dim); font-size:clamp(11px,1.3vh,13.5px); line-height:1.55; margin-top:6px}
  .info .x{position:absolute; top:11px; right:12px; width:24px;height:24px;border:none;background:transparent;color:var(--on-dark-dim);cursor:pointer;font-size:17px}
  .info .x:hover{color:var(--on-dark)}

  /* illustrated (iframe) view */
  .illus{position:fixed; inset:0; z-index:20; border:0; width:100%; height:100%; opacity:0; visibility:hidden; transition:opacity .4s var(--exo), visibility .4s}
  .illus.on{opacity:1; visibility:visible}

  .scalehint{position:fixed; left:clamp(16px,1.4vw,26px); bottom:clamp(16px,2.4vh,30px); z-index:31;
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--on-dark-dim); font-variant-numeric:tabular-nums}
  @media (max-width:1024px){ .rail{width:clamp(220px,38vw,300px)} .planwrap{width:min(70vw,980px); right:1%} }

  /* ── SURVIVAL KIT: gate hover so iOS sticky-hover never flickers ── */
  @media (hover:none){
    .back:hover{background:#121621!important; border-color:rgba(250,247,240,.14)!important; box-shadow:0 8px 20px -10px rgba(6,9,16,.55)!important}
    .vbtn:hover{border-color:rgba(201,168,76,.20); color:var(--on-dark-dim)}
    .lg-item:hover{background:none}
    .lg-item:hover .go{opacity:0; transform:none}
    .zbtn:hover{border-color:rgba(201,168,76,.20)}
    .pin:hover{transform:translate(-50%,-50%)}
    .zpin:hover{transform:translate(-50%,-50%)}
  }

  /* ── PHONE PORTRAIT: rail → bottom sheet so the plan fills the screen ── */
  @media (max-width:560px) and (max-aspect-ratio:3/4){
    /* top bar: stack so the eyebrow never clips; drop the corner */
    .top{grid-template-columns:auto 1fr; gap:8px; padding:clamp(12px,2vh,20px) clamp(14px,4vw,24px) 0}
    .eyebrow{justify-self:end; font-size:9px; letter-spacing:.24em; text-align:right;
      max-width:55vw; white-space:normal; line-height:1.3}
    .corner{display:none}

    /* plan: fill the upper area above the sheet */
    .planwrap{width:min(150vw,1100px); right:auto; left:50%; transform:translate(-50%,-50%); top:42%; max-height:78vh}

    /* rail becomes a compact bottom sheet */
    .rail{top:auto; left:0; right:0; bottom:0; width:auto; flex-direction:column;
      padding:0; max-height:46vh; pointer-events:none}
    .rail>*{pointer-events:auto}
