<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Residences · Floor Plans</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  RESIDENCES · FLOOR PLANS — rebuilt to match the approved reference
  ("Generous, never excessive.").
  ──────────────────────────────────────────────────────────────────────
  · Parchment bg. Top: RETURN · "THE RESIDENCES · FLOOR PLANS" · "UP TO 3 SIDE BY SIDE".
  · Heading + intro. Six configuration chips (+ to add, × to remove, max 3).
  · 1–3 white plan cards side by side, each with independent pan & zoom
    (wheel / pinch / drag / dbl-click reset / + − buttons), a zoom-%
    + sq-ft footer, and the FULL high-res booklet sheet (original colours,
    3600px → crisp at any zoom).
  · Bottom hint line.  Plans live in ../assets/floorplans/hi/*.webp.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parch:#f1e9d8; --paper:#fbf8f1; --ink:#2b2a26; --muted:#6e685b; --faint:#9a917f;
    --gold:#b8924e; --gold-d:#8a6e45; --gold-l:#c89b61; --line:#d8ccb4; --card:#fdfaf3;
    --ease:cubic-bezier(.2,.7,.2,1); --expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; width:100%; color:var(--ink); font-family:"Jost",sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow:hidden;
    position:fixed; inset:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
  img,svg{-webkit-user-drag:none}
  .bg{position:fixed; inset:0; z-index:0; background:#efe7d6 url("../assets/bg-inner.webp") center/cover no-repeat}
  .wrap{position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    padding:clamp(16px,2.2vh,28px) clamp(22px,3vw,58px) clamp(10px,1.4vh,18px)}

  /* top bar */
  .top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; flex:0 0 auto; gap:12px}
  .back{justify-self:start; display:inline-flex; align-items:center; gap:11px; cursor:pointer;
    background:linear-gradient(180deg,#fdfaf3,#f2e8d4); border:1px solid #b8924e;
    color:#8a6e45; font-weight:500; font-size:clamp(9px,1.15vh,13px); letter-spacing:.32em;
    text-transform:uppercase; padding:11px 22px 11px 16px; border-radius:999px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6), 0 8px 18px -8px rgba(40,28,10,.28), 0 0 10px rgba(233,199,135,.55);
    backdrop-filter:none; -webkit-backdrop-filter:none;
    transition:transform .16s cubic-bezier(.16,1,.3,1), box-shadow .3s, background .3s}
  .back:hover{ background:linear-gradient(180deg,#ffffff,#f6eeda); border-color:#c89b61;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.72), 0 10px 22px -8px rgba(40,28,10,.32), 0 0 14px rgba(233,199,135,.72); }
  .back:active{ transform:scale(.97); }
  .back svg{width:15px;height:15px;display:block; stroke:#8a6e45}
  .eyebrow{justify-self:center; font-size:clamp(9px,1.2vh,13px); letter-spacing:.42em; text-transform:uppercase; color:var(--gold-d); white-space:nowrap}
  .corner{justify-self:end; font-size:clamp(8.5px,1.05vh,12px); letter-spacing:.34em; text-transform:uppercase; color:var(--faint)}

  /* heading + intro */
  .lead{flex:0 0 auto; margin-top:clamp(8px,1.6vh,20px)}
  .lead h1{font-family:"Cormorant Garamond",serif; font-weight:600; line-height:1; color:var(--ink); font-size:clamp(30px,5vh,58px); letter-spacing:.005em}
  .lead p{font-weight:300; color:var(--muted); line-height:1.6; font-size:clamp(11px,1.4vh,15px); margin-top:clamp(6px,1vh,12px); max-width:64ch}

  /* config chips */
  .chips{flex:0 0 auto; display:flex; gap:clamp(8px,1vw,16px); margin-top:clamp(12px,1.8vh,22px); flex-wrap:wrap}
  .chip{flex:1 1 0; min-width:150px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;
    background:rgba(253,250,243,.6); border:1px solid var(--line); border-radius:12px; padding:clamp(10px,1.5vh,16px) clamp(13px,1.1vw,18px);
    text-align:left; transition:background .25s, border-color .25s, box-shadow .25s, transform .2s}
  .chip:hover{border-color:var(--gold-l); background:rgba(253,250,243,.85)}
  .chip .ct{display:flex; flex-direction:column; gap:3px; min-width:0}
  .chip .cl{font-size:clamp(11.5px,1.35vh,15px); font-weight:500; color:var(--ink); letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip .cs{font-size:clamp(9.5px,1.1vh,12.5px); font-weight:300; color:var(--gold-d); letter-spacing:.04em}
  .chip .cbtn{flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--gold); color:var(--gold-d); transition:background .25s,color .25s,transform .3s}
  .chip .cbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
  .chip.sel{background:linear-gradient(170deg, rgba(199,160,87,.26), rgba(199,160,87,.1)); border-color:var(--gold);
    box-shadow:0 8px 22px -10px rgba(120,90,30,.4), inset 0 0 0 1px rgba(184,146,78,.4)}
  .chip.sel .cbtn{background:var(--gold); color:#fff; border-color:var(--gold)}
  .chip.disabled{opacity:.5; pointer-events:none}

  /* comparison panels */
  .stage{flex:1 1 auto; min-height:0; display:flex; gap:clamp(14px,1.6vw,26px); margin-top:clamp(12px,1.8vh,20px)}
  .panel{flex:1 1 0; min-width:0; position:relative; display:flex; flex-direction:column;
    background:var(--card); border:1px solid rgba(184,146,78,.4); border-radius:18px; overflow:hidden;
    box-shadow:0 26px 56px -26px rgba(60,42,16,.42), 0 5px 16px -8px rgba(40,28,10,.18);
    outline:1px solid rgba(255,250,240,.5); outline-offset:-3px; animation:panelIn .5s var(--expo) both}
  @keyframes panelIn{from{opacity:0; transform:translateY(14px) scale(.99)} to{opacity:1; transform:none}}
  .planview{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; background:#fff; cursor:grab}
  .planimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform-origin:center; will-change:transform}
  .planimg.dragging{cursor:grabbing}
  .zctrl{position:absolute; top:50%; right:clamp(10px,.8vw,16px); transform:translateY(-50%); z-index:6; display:flex; flex-direction:column; gap:8px}
  .zb{width:clamp(34px,4.2vh,44px); height:clamp(34px,4.2vh,44px); border-radius:11px; cursor:pointer; border:1px solid rgba(184,146,78,.45);
    background:rgba(253,250,243,.9); color:var(--gold-d); display:grid; place-items:center; box-shadow:0 6px 16px -8px rgba(60,42,16,.4);
    transition:background .2s,color .2s,transform .15s}
  .zb:hover{background:#fff; color:var(--gold)} .zb:active{transform:scale(.93)} .zb:disabled{opacity:.4; cursor:default}
  .zb svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pfoot{flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:clamp(11px,1.5vh,17px) clamp(15px,1.3vw,22px);
    border-top:1px solid rgba(184,146,78,.22); background:linear-gradient(180deg, rgba(253,250,243,.4), rgba(247,240,228,.7))}
  .pfoot .tico{flex:0 0 auto; width:clamp(34px,4.4vh,46px); height:clamp(34px,4.4vh,46px); border-radius:50%; border:1px solid rgba(184,146,78,.5); display:grid; place-items:center}
  .pfoot .tico svg{width:52%;height:52%;stroke:var(--gold-d);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .pfoot .pname{font-family:"Cormorant Garamond",serif; font-weight:600; font-size:clamp(15px,2.1vh,24px); color:var(--ink); line-height:1; flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pfoot .pmeta{display:flex; align-items:center; gap:10px; font-size:clamp(9.5px,1.15vh,13px); letter-spacing:.16em; color:var(--gold-d); white-space:nowrap; font-variant-numeric:tabular-nums}
  .pfoot .pmeta .zpct{color:var(--gold)} .pfoot .pmeta .sep{opacity:.5}
  .pclose{position:absolute; top:12px; left:12px; z-index:6; width:30px; height:30px; border-radius:50%; cursor:pointer; border:1px solid rgba(184,146,78,.4);
    background:rgba(253,250,243,.85); color:var(--gold-d); display:grid; place-items:center; opacity:0; transition:opacity .25s, background .2s}
  .panel:hover .pclose{opacity:1}
  .pclose svg{width:48%;height:48%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

  .empty{flex:1 1 auto; display:flex; align-items:center; justify-content:center; text-align:center;
    border:1px dashed rgba(184,146,78,.4); border-radius:18px; color:var(--faint);
    font-family:"Cormorant Garamond",serif; font-style:italic; font-size:clamp(16px,2.4vh,28px)}

  .hint{flex:0 0 auto; text-align:center; margin-top:clamp(8px,1.2vh,14px);
    font-size:clamp(8px,1vh,11px); letter-spacing:.28em; text-transform:uppercase; color:var(--gold-d); opacity:.8}
  .hint .sep{margin:0 .7em; color:var(--gold); opacity:.6}

  .fadein{opacity:0; transform:translateY(10px); animation:fin .8s var(--expo) forwards}
  @keyframes fin{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="top">
      <button class="back" id="back" aria-label="Return">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>Return
      </button>
      <div class="eyebrow">The Residences · Floor Plans</div>
      <div class="corner">Up to 3 side by side</div>
    </div>

    <div class="lead fadein">
      <h1>Generous, never excessive.</h1>
      <p>Choose a configuration to study its plan — pan and zoom freely.<br>Add up to three to compare them side by side, scale for scale.</p>
    </div>

    <div class="chips fadein" id="chips" style="animation-delay:.08s"></div>

    <div class="stage" id="stage"></div>

    <div class="hint">Drag to pan <span class="sep">·</span> Scroll or pinch to zoom <span class="sep">·</span> + / − to step <span class="sep">·</span> Double-click to reset</div>
  </div>

<script>
  var TICO='<svg viewBox="0 0 24 24"><path d="M9.5 21V8.2L12 4l2.5 4.2V21"/><path d="M8.8 21h6.4M9.8 12.5h4.4M9.8 16.2h4.4"/></svg>';
  var CONFIGS=[
    {key:'2br-duplex',     label:'2-Bedroom Duplex',           sqft:'4,149 sq ft',          area:'4,149',          img:'../assets/floorplans/hi/2br-duplex.webp'},
    {key:'3br',            label:'3-Bedroom',                  sqft:'5,423 sq ft',          area:'5,423',          img:'../assets/floorplans/hi/3br.webp'},
    {key:'3br-sm',         label:'3-Bedroom + Study / Media',  sqft:'7,454 sq ft',          area:'7,454',          img:'../assets/floorplans/hi/3br-study-media.webp'},
    {key:'4br',            label:'4-Bedroom & + Study',        sqft:'6,272–7,571 sq ft',    area:'6,272–7,571',    img:'../assets/floorplans/hi/4br.webp'},
    {key:'4br-rec',        label:'4-Bedroom Recessed',         sqft:'6,280–6,335 sq ft',    area:'6,280–6,335',    img:'../assets/floorplans/hi/4br-recessed.webp'},
    {key:'5br-ph',         label:'5-Bedroom Penthouse Duplex', sqft:'12,977–15,124 sq ft',  area:'12,977–15,124',  img:'../assets/floorplans/hi/5br-penthouse-lower.webp'}
  ];
  var MAX=3;
  var selected=[];

  var PLUS='<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>';
  var CROSS='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  var chipsEl=document.getElementById('chips'), stageEl=document.getElementById('stage');
  var chipEls={};
  CONFIGS.forEach(function(c){
    var b=document.createElement('button'); b.className='chip'; b.setAttribute('data-key',c.key);
    b.innerHTML='<span class="ct"><span class="cl">'+c.label+'</span><span class="cs">'+c.sqft+'</span></span><span class="cbtn">'+PLUS+'</span>';
    b.addEventListener('click', function(){ toggle(c.key); });
    chipsEl.appendChild(b); chipEls[c.key]=b;
  });

  function cfg(key){ for(var i=0;i<CONFIGS.length;i++){ if(CONFIGS[i].key===key) return CONFIGS[i]; } return null; }

  function toggle(key){
    var i=selected.indexOf(key);
    if(i>=0){ selected.splice(i,1); }
    else { if(selected.length>=MAX) return; selected.push(key); }
    render();
  }

  function render(){
    CONFIGS.forEach(function(c){
      var on=selected.indexOf(c.key)>=0;
      var b=chipEls[c.key];
      b.classList.toggle('sel', on);
      b.classList.toggle('disabled', !on && selected.length>=MAX);
      b.querySelector('.cbtn').innerHTML = on ? CROSS : PLUS;
    });
    stageEl.innerHTML='';
    if(selected.length===0){
      var e=document.createElement('div'); e.className='empty';
      e.textContent='Select a configuration above to begin. Add up to three to compare.';
      stageEl.appendChild(e); return;
    }
    selected.forEach(function(key){ stageEl.appendChild(buildPanel(cfg(key))); });
  }

  function buildPanel(c){
    var p=document.createElement('div'); p.className='panel';
    p.innerHTML=
      '<button class="pclose" aria-label="Remove">'+CROSS+'</button>'+
      '<div class="planview"><img class="planimg" src="'+c.img+'" alt="'+c.label+' floor plan" draggable="false"></div>'+
      '<div class="zctrl">'+
        '<button class="zb zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/></svg></button>'+
        '<button class="zb zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg></button>'+
        '<button class="zb zrst" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M3 11a8 8 0 1 1 2.3 5.6M3 21v-5h5"/></svg></button>'+
      '</div>'+
      '<div class="pfoot"><span class="tico">'+TICO+'</span><span class="pname">'+c.label+'</span>'+
        '<span class="pmeta"><span class="zpct">100%</span><span class="sep">|</span><span>'+c.area+' SQ FT</span></span></div>';
    p.querySelector('.pclose').addEventListener('click', function(){ toggle(c.key); });
    var view=p.querySelector('.planview'), img=p.querySelector('.planimg'), zpct=p.querySelector('.zpct');
    attachZoom(view, img, zpct, p.querySelector('.zin'), p.querySelector('.zout'), p.querySelector('.zrst'));
    return p;
  }

  function attachZoom(view, img, pct, zin, zout, zrst){
    var MIN=1, MAX_Z=5, scale=1, tx=0, ty=0, drag=false, sx=0, sy=0, stx=0, sty=0, pd=0, ps=1;
    function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
    function clampPan(){ var w=view.clientWidth, h=view.clientHeight;
      var ex=Math.max(0,(w*scale-w)/2), ey=Math.max(0,(h*scale-h)/2); tx=clamp(tx,-ex,ex); ty=clamp(ty,-ey,ey); }
    function apply(an){ img.style.transition=an?'transform .3s var(--ease)':'none';
      img.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
      view.classList.toggle('zoomed', scale>1.001);
      pct.textContent=Math.round(scale*100)+'%'; zout.disabled=scale<=MIN+0.001; zin.disabled=scale>=MAX_Z-0.001; }
    function reset(an){ scale=1; tx=0; ty=0; drag=false; img.classList.remove('dragging'); apply(an); }
    function zoomTo(n,cx,cy,an){ n=clamp(n,MIN,MAX_Z); if(n===scale) return; var k=n/scale; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=n; clampPan(); apply(an); }
    function focal(e){ var r=img.getBoundingClientRect(); return {x:e.clientX-(r.left+r.width/2), y:e.clientY-(r.top+r.height/2)}; }
    view.addEventListener('wheel', function(e){ e.preventDefault(); var f=focal(e); zoomTo(scale*(e.deltaY<0?1.12:1/1.12), f.x, f.y, false); }, {passive:false});
    img.addEventListener('dblclick', function(e){ e.preventDefault(); if(scale>1.001) reset(true); else { var f=focal(e); zoomTo(2.4,f.x,f.y,true); } });
    img.addEventListener('mousedown', function(e){ if(scale<=1.001) return; e.preventDefault(); drag=true; img.classList.add('dragging'); sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; });
    window.addEventListener('mousemove', function(e){ if(!drag) return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); clampPan(); apply(false); });
    window.addEventListener('mouseup', function(){ if(drag){ drag=false; img.classList.remove('dragging'); } });
    view.addEventListener('touchstart', function(e){ if(e.touches.length===2){ pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); ps=scale; }
      else if(e.touches.length===1 && scale>1.001){ drag=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; stx=tx; sty=ty; } }, {passive:false});
    view.addEventListener('touchmove', function(e){ if(e.touches.length===2){ e.preventDefault(); var r=img.getBoundingClientRect();
        var f={x:(e.touches[0].clientX+e.touches[1].clientX)/2-(r.left+r.width/2), y:(e.touches[0].clientY+e.touches[1].clientY)/2-(r.top+r.height/2)};
        zoomTo(ps*(Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pd), f.x, f.y, false); }
      else if(drag && e.touches.length===1){ e.preventDefault(); tx=stx+(e.touches[0].clientX-sx); ty=sty+(e.touches[0].clientY-sy); clampPan(); apply(false); } }, {passive:false});
    view.addEventListener('touchend', function(e){ if(e.touches.length<2) pd=0; if(e.touches.length===0){ drag=false; img.classList.remove('dragging'); } });
    zin.addEventListener('click', function(){ zoomTo(scale+0.6,0,0,true); });
    zout.addEventListener('click', function(){ zoomTo(scale-0.6,0,0,true); });
    zrst.addEventListener('click', function(){ reset(true); });
    apply(false);
  }

  document.getElementById('back').addEventListener('click', function(){ try{ parent.postMessage('eo-screen-close','*'); }catch(e){} });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ try{ parent.postMessage('eo-screen-close','*'); }catch(_){ } } });

  selected=['3br','3br-sm'];
  render();
</script>
