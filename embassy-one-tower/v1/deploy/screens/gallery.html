<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Gallery · Embassy ONE</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  GALLERY — rebuilt to match the approved reference
  (ChatGPT Image Jun 15 2026, 05_23_59).
  ──────────────────────────────────────────────────────────────────────
  · Parchment bg (assets/bg-inner.webp) + leaf filigree (from the bg).
  · Top bar: RETURN pill · centred "<CATEGORY> · GALLERY" · EMBASSY ONE.
  · Left column: "The visual world." + gold rule + intro copy.
  · Hero: large gold-hairline framed image, caption overlay (icon + title +
    italic sub), flanking circular prev/next, zoom-in/out + fullscreen cluster.
  · Pan & zoom on the hero (wheel / pinch / drag / dbl-click / buttons).
  · Fullscreen = immersive dark overlay with the same zoom engine.
  · Thumbnail carousel: slide left/right (drag + end arrows), active thumb
    gets a gold frame + caret; progress rule tracks position.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parch:#f1e9d8; --paper:#fbf8f1; --ink:#2b2a26; --muted:#6e685b; --faint:#9a917f;
    --gold:#b8924e; --gold-d:#8a6e45; --gold-l:#c89b61; --line:#d8ccb4;
    --ease:cubic-bezier(.2,.7,.2,1); --expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; width:100%; color:var(--ink); font-family:"Jost",sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow:hidden;
    position:fixed; inset:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
  img,svg{-webkit-user-drag:none}
  .bg{position:fixed; inset:0; z-index:0; background:#efe7d6 url("../assets/bg-inner.webp") center/cover no-repeat}

  .wrap{position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    padding:clamp(16px,2.2vh,30px) clamp(22px,3vw,60px) clamp(14px,2vh,26px)}

  /* ── TOP BAR ──────────────────────────────────────────────────── */
  .top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; flex:0 0 auto; gap:12px}
  .back{justify-self:start; display:inline-flex; align-items:center; gap:11px; cursor:pointer;
    background:linear-gradient(180deg,#fdfaf3,#f2e8d4); border:1px solid #b8924e;
    color:#8a6e45; font-weight:500; font-size:clamp(9px,1.15vh,13px); letter-spacing:.32em;
    text-transform:uppercase; padding:11px 22px 11px 16px; border-radius:999px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6), 0 8px 18px -8px rgba(40,28,10,.28), 0 0 10px rgba(233,199,135,.55);
    backdrop-filter:none; -webkit-backdrop-filter:none;
    transition:transform .16s cubic-bezier(.16,1,.3,1), box-shadow .3s, background .3s}
  .back:hover{ background:linear-gradient(180deg,#ffffff,#f6eeda); border-color:#c89b61;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.72), 0 10px 22px -8px rgba(40,28,10,.32), 0 0 14px rgba(233,199,135,.72); }
  .back:active{ transform:scale(.97); }
  .back svg{width:15px;height:15px;display:block; stroke:#8a6e45}
  .eyebrow{justify-self:center; font-size:clamp(9px,1.2vh,13px); letter-spacing:.42em; text-transform:uppercase;
    color:var(--gold-d); font-weight:400; white-space:nowrap; transition:opacity .3s}
  .eyebrow.swap{opacity:0}
  .brand{justify-self:end; font-size:clamp(9px,1.2vh,13px); letter-spacing:.42em; text-transform:uppercase; color:var(--gold-d)}

  /* ── BODY: left column + hero ─────────────────────────────────── */
  .stage{flex:1 1 auto; min-height:0; display:grid; grid-template-columns:clamp(220px,21vw,300px) 1fr;
    gap:clamp(20px,2.6vw,52px); align-items:center; padding-top:clamp(10px,1.6vh,22px)}
  .lead{align-self:center}
  .lead h1{font-family:"Cormorant Garamond",serif; font-weight:600; line-height:.98; color:var(--ink);
    font-size:clamp(34px,6.2vh,76px); letter-spacing:.005em}
  .lead .rule{width:54px; height:2px; background:linear-gradient(90deg,var(--gold),transparent); margin:clamp(14px,2.2vh,26px) 0 clamp(12px,1.8vh,22px)}
  .lead p{font-weight:300; color:var(--muted); line-height:1.7; font-size:clamp(12px,1.55vh,17px); max-width:30ch}

  /* hero */
  .heroarea{position:relative; height:100%; min-height:0; display:flex; align-items:center}
  .hero{position:relative; width:100%; height:min(100%, 58vw); max-height:100%;
    border-radius:20px; overflow:hidden; background:#0d0a06;
    border:1px solid rgba(184,146,78,.6);
    box-shadow:0 40px 80px -30px rgba(60,42,16,.6), 0 8px 22px -10px rgba(40,28,10,.4), inset 0 0 0 5px rgba(20,15,9,.55);
    outline:1px solid rgba(255,250,240,.35); outline-offset:-1px}
  .hero .frameln{position:absolute; inset:7px; border:1px solid rgba(200,155,97,.4); border-radius:14px; z-index:5; pointer-events:none}
  .heroimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center;
    will-change:transform; cursor:grab}
  .heroimg.dragging{cursor:grabbing}
  .hero.zoomed{cursor:grab}
  .heroimg.fade{opacity:0; transition:opacity .28s ease}
  .heroimg{transition:opacity .4s ease}

  /* caption overlay */
  .cap{position:absolute; left:0; right:0; bottom:0; z-index:6; pointer-events:none;
    padding:clamp(20px,4vh,52px) clamp(20px,3vw,44px) clamp(16px,2.6vh,34px);
    background:linear-gradient(0deg, rgba(12,9,5,.82) 0%, rgba(12,9,5,.5) 42%, transparent 100%);
    display:flex; align-items:center; gap:16px; transition:opacity .3s}
  .cap.swap{opacity:0}
  .cap .cic{flex:0 0 auto; width:clamp(34px,4.6vh,50px); height:clamp(34px,4.6vh,50px); border-radius:50%;
    border:1px solid rgba(200,155,97,.7); display:grid; place-items:center}
  .cap .cic svg{width:54%;height:54%;stroke:var(--gold-l);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .cap .ctitle{font-size:clamp(13px,1.9vh,21px); letter-spacing:.22em; text-transform:uppercase; color:#e9cd96; font-weight:400}
  .cap .csub{font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:500; color:#f3ead8;
    font-size:clamp(14px,2.1vh,24px); line-height:1.1; margin-top:2px}

  /* flanking nav arrows */
  .nav{position:absolute; top:50%; transform:translateY(-50%); z-index:8; width:clamp(44px,5.4vh,62px); height:clamp(44px,5.4vh,62px);
    border-radius:50%; border:1px solid rgba(184,146,78,.6); cursor:pointer; display:grid; place-items:center;
    background:linear-gradient(180deg,#2c241b,#16110a); color:var(--gold-l);
    box-shadow:0 12px 26px -10px rgba(40,28,10,.7); transition:transform .25s var(--expo), color .25s, border-color .25s}
  .nav:hover{color:#fff7e6; border-color:var(--gold-l); transform:translateY(-50%) scale(1.07)}
  .nav:active{transform:translateY(-50%) scale(.96)}
  .nav svg{width:42%;height:42%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .nav.prev{left:clamp(-22px,-1.4vw,-14px)} .nav.next{right:clamp(-22px,-1.4vw,-14px)}

  /* zoom + fullscreen control cluster (top-right of hero) */
  .ctrls{position:absolute; top:clamp(12px,1.8vh,20px); right:clamp(12px,1.4vw,20px); z-index:8; display:flex; gap:8px}
  .ctrl{width:clamp(34px,4.4vh,42px); height:clamp(34px,4.4vh,42px); border-radius:50%; cursor:pointer;
    border:1px solid rgba(184,146,78,.55); background:rgba(18,13,8,.62); color:var(--gold-l); display:grid; place-items:center;
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); box-shadow:0 6px 16px -8px rgba(20,15,9,.8);
    transition:background .25s, color .25s, border-color .25s, transform .2s}
  .ctrl:hover{background:rgba(40,30,18,.8); color:#fff7e6; border-color:var(--gold-l)}
  .ctrl:active{transform:scale(.94)} .ctrl:disabled{opacity:.34; cursor:default}
  .ctrl svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ── THUMBNAIL CAROUSEL ───────────────────────────────────────── */
  .rail{flex:0 0 auto; margin-top:clamp(12px,1.8vh,22px); display:flex; align-items:center; gap:clamp(10px,1.2vw,20px)}
  .progress{position:relative; height:2px; background:rgba(184,146,78,.22); border-radius:2px; margin:0 auto clamp(10px,1.4vh,16px); width:min(620px,52vw)}
  .progress .fill{position:absolute; left:0; top:0; height:100%; background:linear-gradient(90deg,var(--gold-l),var(--gold)); border-radius:2px; transition:left .4s var(--expo), width .4s var(--expo)}
  .progwrap{flex:0 0 auto}
  .slidebtn{flex:0 0 auto; width:clamp(38px,4.6vh,48px); height:clamp(38px,4.6vh,48px); border-radius:50%; cursor:pointer;
    border:1px solid rgba(184,146,78,.45); background:rgba(251,248,241,.7); color:var(--gold-d); display:grid; place-items:center;
    box-shadow:0 6px 16px -8px rgba(60,42,16,.4); transition:background .25s,color .25s,border-color .25s,transform .2s; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
  .slidebtn:hover{background:#fff; color:var(--gold); border-color:var(--gold-l)}
  .slidebtn:active{transform:scale(.94)} .slidebtn:disabled{opacity:.3; cursor:default}
  .slidebtn svg{width:40%;height:40%;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .viewport{flex:1 1 auto; min-width:0; overflow:hidden; padding:10px 4px}
  .strip{display:flex; gap:clamp(10px,1.1vw,18px); transition:transform .5s var(--expo); will-change:transform; touch-action:pan-y}
  .thumb{position:relative; flex:0 0 auto; width:clamp(108px,11.5vw,168px); height:clamp(74px,8.4vh,112px);
    border-radius:11px; overflow:hidden; cursor:pointer; border:0; padding:0; background:#0d0a06;
    box-shadow:0 10px 22px -12px rgba(40,28,10,.5); transition:transform .3s var(--expo), box-shadow .3s; outline:1px solid rgba(184,146,78,.25); outline-offset:-1px}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; opacity:.92; transition:opacity .3s, transform .5s var(--expo)}
  .thumb:hover{transform:translateY(-3px)} .thumb:hover img{opacity:1; transform:scale(1.05)}
  .thumb.sel{box-shadow:0 14px 28px -10px rgba(120,90,30,.6)}
  .thumb.sel::after{content:""; position:absolute; inset:0; border-radius:11px; border:2px solid var(--gold-l); z-index:3;
    box-shadow:inset 0 0 0 3px rgba(20,15,9,.7)}
  .thumb.sel::before{content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%); z-index:4;
    border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:8px solid var(--gold-l)}
  .thumb.sel img{opacity:1}

  /* ── FULLSCREEN overlay ───────────────────────────────────────── */
  .fs{position:fixed; inset:0; z-index:60; background:rgba(14,10,6,.96); display:none;
    align-items:center; justify-content:center; opacity:0; transition:opacity .35s ease}
  .fs.open{display:flex; opacity:1}
  .fsimg{max-width:94vw; max-height:90vh; transform-origin:center; will-change:transform; cursor:grab; box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .fsimg.dragging{cursor:grabbing}
  .fs .fsclose{position:fixed; top:24px; right:28px; z-index:62}
  .fs .fsctrls{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:62; display:flex; gap:10px; align-items:center;
    background:rgba(18,13,8,.7); border:1px solid rgba(184,146,78,.4); border-radius:999px; padding:8px 12px; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
  .fs .fscap{position:fixed; bottom:26px; left:30px; z-index:62; color:#e9cd96; font-size:12px; letter-spacing:.18em; text-transform:uppercase}
  .fs .nav{position:fixed}
  .fs .nav.prev{left:24px} .fs .nav.next{right:24px}
  .fsnum{color:#e9cd96; font-size:11px; letter-spacing:.2em; font-variant-numeric:tabular-nums; padding:0 6px}

  .fadein{opacity:0; transform:translateY(12px); animation:fin .9s var(--expo) forwards}
  @keyframes fin{to{opacity:1;transform:none}}

  /* portrait / tablet stack */
  @media (max-aspect-ratio:1/1){
    .stage{grid-template-columns:1fr; gap:14px; padding-top:6px}
    .lead{order:-1} .lead h1{font-size:clamp(30px,5vh,56px)} .lead p{max-width:none}
    .lead .rule{margin:10px 0}
    .hero{height:min(100%,70vh)}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="wrap">
    <!-- top bar -->
    <div class="top">
      <button class="back" id="back" aria-label="Return">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>Return
      </button>
      <div class="eyebrow" id="eyebrow">THE TOWER · GALLERY</div>
      <div class="brand">Embassy ONE</div>
    </div>

    <!-- stage -->
    <div class="stage">
      <div class="lead fadein">
        <h1>The visual<br>world.</h1>
        <div class="rule"></div>
        <p>The tower at dusk, the gardens through the seasons, the lantern-lit grounds — rendered as they are meant to be lived.</p>
      </div>

      <div class="heroarea fadein" style="animation-delay:.1s">
        <div class="hero" id="hero">
          <img class="heroimg" id="heroimg" src="" alt="">
          <div class="frameln"></div>
          <div class="ctrls">
            <button class="ctrl" id="zin"  aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/></svg></button>
            <button class="ctrl" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg></button>
            <button class="ctrl" id="fs"   aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          </div>
          <div class="cap" id="cap">
            <span class="cic" id="cic"></span>
            <span class="ctxt"><span class="ctitle" id="ctitle"></span><span class="csub" id="csub"></span></span>
          </div>
          <button class="nav prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="nav next" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </div>

    <!-- thumbnail carousel -->
    <div>
      <div class="progress progwrap"><span class="fill" id="pfill"></span></div>
      <div class="rail">
        <button class="slidebtn" id="sprev" aria-label="Slide left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="viewport" id="viewport"><div class="strip" id="strip"></div></div>
        <button class="slidebtn" id="snext" aria-label="Slide right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>

  <!-- fullscreen -->
  <div class="fs" id="fsov" aria-hidden="true">
    <img class="fsimg" id="fsimg" src="" alt="">
    <button class="nav prev" id="fsprev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="fsnext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ctrl fsclose" id="fsclose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="fscap" id="fscap"></div>
    <div class="fsctrls">
      <button class="ctrl" id="fszout" aria-label="Zoom out" style="border:0;background:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg></button>
      <span class="fsnum" id="fsnum"></span>
      <button class="ctrl" id="fszin" aria-label="Zoom in" style="border:0;background:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/></svg></button>
    </div>
  </div>

<script>
  // category icons
  var ICONS={
    tower:'<svg viewBox="0 0 24 24"><path d="M9.5 21V8.2L12 4l2.5 4.2V21"/><path d="M8.8 21h6.4M9.8 12.5h4.4M9.8 16.2h4.4"/></svg>',
    grounds:'<svg viewBox="0 0 24 24"><path d="M12 21V9"/><path d="M12 12C9 12 7 10 7 7c3 0 5 2 5 5ZM12 11c3 0 5-2 5-5-3 0-5 2-5 5Z"/></svg>',
    gardens:'<svg viewBox="0 0 24 24"><path d="M12 21c4-6 7-8 7-12a7 7 0 1 0-14 0c0 4 3 6 7 12Z"/><path d="M12 9v6"/></svg>',
    amenities:'<svg viewBox="0 0 24 24"><path d="M3 16c2 0 2-1.5 4.5-1.5S10 16 12 16s2-1.5 4.5-1.5S19 16 21 16"/><path d="M3 20c2 0 2-1.5 4.5-1.5S10 20 12 20s2-1.5 4.5-1.5S19 20 21 20"/><path d="M5 11l7-5 7 5"/></svg>',
    arrival:'<svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>'
  };

  var SHOTS=[
    {img:"../assets/renders/exterior/ext-1.webp",  cat:"THE TOWER",  ic:"tower",     title:"Approach & Arrival",      sub:"Arrival experience at dusk"},
    {img:"../assets/renders/exterior/ext-2.webp",  cat:"THE TOWER",  ic:"tower",     title:"A Vertical Manor",        sub:"Thirty floors against the sky"},
    {img:"../assets/renders/exterior/ext-3.webp",  cat:"THE TOWER",  ic:"tower",     title:"The Northern Skyline",    sub:"The tower at first light"},
    {img:"../assets/renders/lanterns/center.webp", cat:"THE GROUNDS",ic:"grounds",   title:"The Central Court",       sub:"The lantern at the pool's edge"},
    {img:"../assets/renders/lanterns/twin.webp",   cat:"THE GROUNDS",ic:"grounds",   title:"The Twin Lanterns",       sub:"Light, guidance, gathering"},
    {img:"../assets/renders/lanterns/spring.webp", cat:"THE GARDENS",ic:"gardens",   title:"Spring at the Forest",    sub:"The Miyawaki garden in bloom"},
    {img:"../assets/renders/lanterns/summer.webp", cat:"THE GARDENS",ic:"gardens",   title:"The Rain Terrace",        sub:"Monsoon over the gardens"},
    {img:"../assets/renders/amenities/lawn.webp",  cat:"AMENITIES",  ic:"amenities", title:"The Open Lawn",           sub:"Room to breathe, within the gate"},
    {img:"../assets/renders/amenities/yoga.webp",  cat:"AMENITIES",  ic:"amenities", title:"Yoga & Meditation Deck",  sub:"A quiet start to the day"},
    {img:"../assets/renders/lanterns/lobby.webp",  cat:"ARRIVAL",    ic:"arrival",   title:"The Lobby, Lantern-lit",  sub:"The threshold home"}
  ];

  var heroimg=document.getElementById("heroimg"), cap=document.getElementById("cap"),
      cic=document.getElementById("cic"), ctitle=document.getElementById("ctitle"), csub=document.getElementById("csub"),
      eyebrow=document.getElementById("eyebrow"), strip=document.getElementById("strip"), cur=0;

  // build thumbnails
  SHOTS.forEach(function(s,i){
    var t=document.createElement("button"); t.className="thumb"; t.setAttribute("data-i",i);
    t.innerHTML='<img src="'+s.img+'" alt="'+s.title+'" loading="lazy">';
    t.addEventListener("click", function(){ go(i); });
    strip.appendChild(t);
  });
  var thumbs=Array.prototype.slice.call(strip.children);

  function setHero(i, instant){
    var s=SHOTS[i];
    eyebrow.classList.add("swap"); cap.classList.add("swap"); heroimg.classList.add("fade");
    setTimeout(function(){
      heroimg.src=s.img; heroimg.alt=s.title;
      cic.innerHTML=ICONS[s.ic]||""; ctitle.textContent=s.title; csub.textContent=s.sub;
      eyebrow.textContent=s.cat+" · GALLERY";
      eyebrow.classList.remove("swap"); cap.classList.remove("swap"); heroimg.classList.remove("fade");
    }, instant?0:200);
  }
  function go(i){
    cur=(i+SHOTS.length)%SHOTS.length;
    thumbs.forEach(function(t,k){ t.classList.toggle("sel", k===cur); });
    resetZoom(true);
    setHero(cur,false);
    ensureThumbVisible(cur);
    if(fsov.classList.contains("open")) loadFs();
  }

  /* ── thumbnail carousel slide ── */
  var viewport=document.getElementById("viewport"), pfill=document.getElementById("pfill"),
      sprev=document.getElementById("sprev"), snext=document.getElementById("snext");
  var offset=0; // px translateX (<=0)
  function maxOffset(){ return Math.min(0, viewport.clientWidth - strip.scrollWidth); }
  function applyStrip(){
    offset=Math.max(maxOffset(), Math.min(0, offset));
    strip.style.transform="translateX("+offset+"px)";
    var total=Math.max(1, strip.scrollWidth - viewport.clientWidth);
    var frac=total>0 ? (-offset/total) : 0;
    var vis=viewport.clientWidth/Math.max(strip.scrollWidth,1);
    pfill.style.width=(vis*100)+"%"; pfill.style.left=(frac*(100-vis*100))+"%";
    sprev.disabled = offset>=-0.5;

  function page(dir){

  }
  sprev.addEventListener("click", function(){ page(-1); });
  snext.addEventListener("click", function(){ page(1); });
  function ensureThumbVisible(i){
    var t=thumbs[i]; if(!t) return;
    var left=t.offsetLeft, right=left+t.offsetWidth;
    var vl=-offset, vr=vl+viewport.clientWidth;

    else if(right>vr) offset=-(right-viewport.clientWidth)-12;
    applyStrip();
  }
  // drag / swipe the strip
  (function(){
    var down=false, moved=false, sx=0, so=0;
    function start(x){ down=true; moved=false; sx=x; so=offset; strip.style.transition="none"; }
    function move(x){ if(!down) return; var dx=x-sx; if(Math.abs(dx)>4) moved=true; offset=so+dx; strip.style.transform="translateX("+Math.max(maxOffset(),Math.min(0,offset))+"px)"; }

    window.addEventListener("mousemove", function(e){ move(e.clientX); });
    window.addEventListener("mouseup", end);
    strip.addEventListener("touchstart", function(e){ start(e.touches[0].clientX); }, {passive:true});
    strip.addEventListener("touchmove", function(e){ move(e.touches[0].clientX); }, {passive:true});

  /* ── pan & zoom engine (generalised over a target element) ── */
  function makeZoom(getImg, getHost){

      window.addEventListener("mousemove", function(e){ if(!dragging) return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); clampPan(); apply(false); });
      window.addEventListener("mouseup", function(){ if(dragging){ dragging=false; getImg().classList.remove("dragging"); } });
      host.addEventListener("touchstart", function(e){ if(e.touches.length===2){ pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); ps=scale; }
        else if(e.touches.length===1 && scale>1.001){ dragging=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; stx=tx; sty=ty; } }, {passive:false});
      host.addEventListener("touchmove", function(e){ if(e.touches.length===2){ e.preventDefault(); var img=getImg(); var r=img.getBoundingClientRect();
          var f={x:(e.touches[0].clientX+e.touches[1].clientX)/2-(r.left+r.width/2), y:(e.touches[0].clientY+e.touches[1].clientY)/2-(r.top+r.height/2)};
          zoomTo(ps*(Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pd), f.x, f.y, false); }
        else if(dragging && e.touches.length===1){ e.preventDefault(); tx=stx+(e.touches[0].clientX-sx); ty=sty+(e.touches[0].clientY-sy); clampPan(); apply(false); } }, {passive:false});

    }
    return { bind:bind, reset:reset, zoomIn:function(){ zoomTo(scale+0.6,0,0,true); }, zoomOut:function(){ zoomTo(scale-0.6,0,0,true); }, get:function(){return scale;} };
  }

  var heroZoom=makeZoom(function(){return heroimg;}, function(){return document.getElementById("hero");});
  heroZoom.bind();
  function resetZoom(an){ heroZoom.reset(an); }
  document.getElementById("zin").addEventListener("click", function(e){ e.stopPropagation(); heroZoom.zoomIn(); });
  document.getElementById("zout").addEventListener("click", function(e){ e.stopPropagation(); heroZoom.zoomOut(); });

  document.getElementById("prev").addEventListener("click", function(e){ e.stopPropagation(); go(cur-1); });
  document.getElementById("next").addEventListener("click", function(e){ e.stopPropagation(); go(cur+1); });

  /* ── fullscreen ── */
  var fsov=document.getElementById("fsov"), fsimg=document.getElementById("fsimg"),
      fscap=document.getElementById("fscap"), fsnum=document.getElementById("fsnum");
  var fsZoom=makeZoom(function(){return fsimg;}, function(){return fsov;});
  fsZoom.bind();
  function loadFs(){ var s=SHOTS[cur]; fsimg.src=s.img; fscap.textContent=s.cat+" · "+s.title; fsnum.textContent=(cur+1)+" / "+SHOTS.length; fsZoom.reset(false); }
  function openFs(){ loadFs(); fsov.classList.add("open"); fsov.setAttribute("aria-hidden","false"); }
  function closeFs(){ fsov.classList.remove("open"); fsov.setAttribute("aria-hidden","true"); }
  document.getElementById("fs").addEventListener("click", openFs);

  /* ── close + keys ── */
  document.getElementById("back").addEventListener("click", function(){ try{ parent.postMessage("eo-screen-close","*"); }catch(e){} });

    if(fsov.classList.contains("open")){
      if(e.key==="Escape") closeFs();
      else if(e.key==="ArrowLeft") go(cur-1);
      else if(e.key==="ArrowRight") go(cur+1);

    else if(e.key==="ArrowRight") go(cur+1);

  setHero(0,true);
  setTimeout(applyStrip, 50);
