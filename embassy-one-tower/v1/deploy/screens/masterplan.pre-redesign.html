<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Grounds · Master Plan</title>

<!--
  ──────────────────────────────────────────────────────────────────────
  THE GROUNDS · MASTER PLAN & AMENITIES — full-screen explorer
  ──────────────────────────────────────────────────────────────────────
  · 4K master plan (no drop-shadow — shade removed) on parchment. Pan & zoom.
  · Markers pinned by % to real plan features (re-checked, all inside the site).
    Categories: Five Lanterns · Amenities · Gardens · Arrival — filterable.
  · Click a marker/row → spotlight + fly-to + a POPUP card anchored to the pin
    with the amenity's IMAGE + name + description. Tap the image → fullscreen.
  · plan: ../assets/masterplan/masterplan-4k.webp · imagery: ../assets/renders/*
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parch:#f1e9d8; --paper:#fbf8f1; --ink:#2b2a26; --muted:#6e685b; --faint:#9a917f;
    --gold:#b8924e; --gold-d:#8a6e45; --gold-l:#c89b61; --line:#d8ccb4; --sage:#8a9a6e; --water:#5f93a6;
    --glass:rgba(249,244,234,.84); --ease:cubic-bezier(.2,.7,.2,1); --expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; width:100%; color:var(--ink); font-family:"Jost",sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow:hidden;
    position:fixed; inset:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
  img,svg{-webkit-user-drag:none}
  .bg{position:fixed; inset:0; z-index:0; background:#efe7d6 url("../assets/bg-inner.png") center/cover no-repeat}

  .stage{position:fixed; inset:0; z-index:1; overflow:hidden; cursor:grab}
  .stage.zoomed{cursor:grab}
  .layerwrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}
  .layer{position:relative; height:94%; aspect-ratio:3671/3297; max-width:80%;
    transform-origin:center center; will-change:transform; transition:transform .7s var(--expo)}
  .layer.dragging{transition:none}
  .layer img{width:100%; height:100%; object-fit:contain; display:block}

  /* markers (positioned in % of the plan layer) */
  .mk{position:absolute; transform:translate(-50%,-50%); z-index:5; cursor:pointer; display:flex; align-items:center; gap:7px; white-space:nowrap}
  .mk .dot{position:relative; width:16px; height:16px; border-radius:50%; flex:0 0 auto; border:2px solid #fff;
    box-shadow:0 1px 6px rgba(20,15,9,.55), 0 0 0 1px rgba(20,15,9,.15); transition:transform .25s}
  .mk .dot::after{content:""; position:absolute; inset:-2px; border-radius:50%; z-index:-1; box-shadow:0 0 0 0 currentColor; animation:pp 3s ease-out infinite}
  .mk .lbl{font-size:11px; letter-spacing:.02em; color:#fff6e6; background:rgba(22,16,11,.82); border:1px solid rgba(184,146,78,.5);
    padding:3px 9px; border-radius:11px; box-shadow:0 2px 8px -3px rgba(20,15,9,.6); opacity:0; transform:translateX(-4px); transition:opacity .25s, transform .25s}
  .mk:hover .dot, .mk.sel .dot{transform:scale(1.3)}
  .mk:hover .lbl, .mk.sel .lbl{opacity:1; transform:none}
  .mk.cat-lantern .dot{background:#e1b15e; color:rgba(225,177,94,.55)}
  .mk.cat-amenity .dot{background:#5f93a6; color:rgba(95,147,166,.55)}
  .mk.cat-garden .dot{background:#8a9a6e; color:rgba(138,154,110,.55)}
  .mk.cat-arrival .dot{background:#2b2a26; color:rgba(120,100,70,.55)}
  .mk.sel .lbl{border-color:var(--gold-l); background:rgba(34,26,17,.92)}
  .mk.dim{opacity:.26; filter:grayscale(.4)}
  .mk.hide{display:none}
  @keyframes pp{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 16px transparent}}

  /* top bar */
  .top{position:fixed; top:0; left:0; right:0; z-index:40; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:clamp(16px,2.2vh,28px) clamp(22px,3vw,54px) 0; gap:12px; pointer-events:none}
  .top>*{pointer-events:auto}
  .back{justify-self:start; display:inline-flex; align-items:center; gap:11px; background:rgba(22,16,11,.84);
    border:1px solid rgba(184,146,78,.55); cursor:pointer; color:#f3e9d4; font-weight:400; font-size:clamp(9px,1.15vh,13px);
    letter-spacing:.32em; text-transform:uppercase; padding:10px 20px 10px 15px; border-radius:999px;
    box-shadow:0 6px 18px -6px rgba(40,28,10,.5); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); transition:background .3s, border-color .3s, transform .2s}
  .back:hover{background:rgba(45,38,30,.92); border-color:var(--gold-l)} .back:active{transform:scale(.97)} .back svg{width:15px;height:15px}
  .eyebrow{justify-self:center; font-size:clamp(9px,1.2vh,13px); letter-spacing:.42em; text-transform:uppercase; color:var(--gold-d); white-space:nowrap}
  .corner{justify-self:end; font-size:clamp(8.5px,1.05vh,12px); letter-spacing:.34em; text-transform:uppercase; color:var(--faint)}

  /* glass rail */
  .rail{position:fixed; left:clamp(14px,1.9vw,26px); top:clamp(78px,11vh,120px); bottom:clamp(16px,2.4vh,30px); z-index:30;
    width:clamp(252px,25vw,348px); display:flex; flex-direction:column;
    background:var(--glass); -webkit-backdrop-filter:blur(15px) saturate(1.1); backdrop-filter:blur(15px) saturate(1.1); border:1px solid rgba(255,250,240,.6); border-radius:18px; overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(60,42,16,.45); outline:1px solid rgba(184,146,78,.28); outline-offset:-4px}
  .rhead{padding:clamp(15px,2vh,22px) clamp(15px,1.5vw,21px) clamp(10px,1.4vh,14px)}
  .rhead .rk{font-size:9.5px; letter-spacing:.4em; text-transform:uppercase; color:var(--gold-d)}
  .rhead h1{font-family:"Cormorant Garamond",serif; font-weight:600; font-size:clamp(24px,3.6vh,38px); line-height:1; margin:5px 0 8px}
  .rhead p{font-weight:300; color:var(--muted); font-size:clamp(11px,1.35vh,14px); line-height:1.55}
  .filters{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 clamp(15px,1.5vw,21px) clamp(13px,1.7vh,17px); border-bottom:1px solid rgba(184,146,78,.2)}
  /* clearly selectable toggle buttons (filled = on, outlined = off) */
  .filt{display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:1.5px solid var(--gold-l);
    border-radius:10px; padding:9px 12px; font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink); background:rgba(184,146,78,.15); box-shadow:0 2px 7px -3px rgba(60,42,16,.32);
    transition:background .2s,border-color .2s,opacity .2s, color .2s, box-shadow .2s, transform .12s}
  .filt .fd{width:11px;height:11px;border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(255,255,255,.7)}
  .filt.f-lantern .fd{background:#e1b15e}.filt.f-amenity .fd{background:#5f93a6}.filt.f-garden .fd{background:#8a9a6e}.filt.f-arrival .fd{background:#2b2a26}
  .filt:hover{background:rgba(184,146,78,.24); transform:translateY(-1px)} .filt:active{transform:translateY(0) scale(.98)}
  .filt.off{opacity:1; background:rgba(253,250,243,.55); border-color:var(--line); color:var(--faint); box-shadow:none}
  .filt.off .fd{opacity:.32; box-shadow:none}
  .listhead{padding:clamp(10px,1.4vh,14px) clamp(15px,1.5vw,21px) 6px; font-size:9px; letter-spacing:.36em; text-transform:uppercase; color:var(--gold-d)}
  .zrow{padding:8px 10px; border-bottom:1px solid rgba(184,146,78,.1)}
  .zrow b{display:block; font-weight:500; font-size:clamp(11px,1.25vh,13.5px); color:var(--ink)}
  .zrow span{display:block; font-weight:300; font-size:clamp(9.5px,1.1vh,12px); color:var(--muted); line-height:1.4; margin-top:2px}
  .list{flex:1 1 auto; min-height:40px; overflow-y:auto; padding:0 clamp(8px,1vw,12px) clamp(10px,1.4vh,14px); scrollbar-width:thin; scrollbar-color:var(--gold-l) transparent}
  .list::-webkit-scrollbar{width:5px}.list::-webkit-scrollbar-thumb{background:var(--gold-l);border-radius:3px}
  .lrow{display:flex; align-items:center; gap:11px; width:100%; border:0; background:none; cursor:pointer; text-align:left; font:inherit; color:inherit;
    padding:9px 10px; border-radius:8px; border-bottom:1px solid rgba(184,146,78,.12); transition:background .2s, transform .2s}
  .lrow:hover{background:rgba(184,146,78,.1); transform:translateX(2px)} .lrow.sel{background:rgba(184,146,78,.18); box-shadow:inset 3px 0 0 var(--gold)}
  .lrow .ld{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .lrow.c-lantern .ld{background:#e1b15e}.lrow.c-amenity .ld{background:#5f93a6}.lrow.c-garden .ld{background:#8a9a6e}.lrow.c-arrival .ld{background:#2b2a26}
  .lrow b{font-weight:500; font-size:clamp(11.5px,1.3vh,14px); color:var(--ink)} .lrow.hide{display:none}

  /* popup card (image + text) anchored to the selected pin */
  .pop{position:fixed; z-index:45; width:clamp(248px,24vw,320px); transform:translate(-50%,-100%); pointer-events:none; opacity:0;
    transition:opacity .3s ease; will-change:left,top}
  .pop.on{opacity:1; pointer-events:auto}
  .pop .pcard{background:var(--paper); border:1px solid rgba(184,146,78,.5); border-radius:14px; overflow:hidden;
    box-shadow:0 26px 54px -20px rgba(40,28,10,.6); outline:1px solid rgba(255,250,240,.5); outline-offset:-3px}
  .pop .pimg{position:relative; height:clamp(118px,16vh,168px); background:#0d0a06; cursor:zoom-in; overflow:hidden}
  .pop .pimg img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s var(--expo)}
  .pop .pimg:hover img{transform:scale(1.05)}
  .pop .pexp{position:absolute; top:9px; right:9px; width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
    background:rgba(18,13,8,.62); border:1px solid rgba(184,146,78,.5); color:var(--gold-l); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px)}
  .pop .pexp svg{width:50%;height:50%;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .pop .pbody{padding:clamp(11px,1.6vh,16px) clamp(13px,1.4vw,18px) clamp(12px,1.7vh,17px)}
  .pop .pk{font-size:8.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold-d)}
  .pop .ph{font-family:"Cormorant Garamond",serif; font-weight:600; font-size:clamp(16px,2.2vh,23px); line-height:1.05; margin:4px 0 0; color:var(--ink)}
  .pop .pp{font-weight:300; color:var(--muted); font-size:clamp(11px,1.3vh,13.5px); line-height:1.5; margin-top:6px}
  .pop .pclose{position:absolute; top:9px; left:9px; width:26px;height:26px;border-radius:50%; display:grid; place-items:center; cursor:pointer;
    background:rgba(18,13,8,.55); border:1px solid rgba(184,146,78,.45); color:#f0dcb0; -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px)}
  .pop .pclose svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .pop .ptail{position:absolute; left:50%; bottom:-7px; transform:translateX(-50%) rotate(45deg); width:14px;height:14px;
    background:var(--paper); border-right:1px solid rgba(184,146,78,.5); border-bottom:1px solid rgba(184,146,78,.5)}

  /* zoom controls + hint */
  .zctrl{position:fixed; right:clamp(14px,1.9vw,26px); bottom:clamp(40px,6vh,64px); z-index:30; display:flex; flex-direction:column; gap:8px}
  .zb{width:42px;height:42px;border-radius:11px;cursor:pointer;border:1px solid rgba(184,146,78,.45);background:rgba(253,250,243,.85);color:var(--gold-d);display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(60,42,16,.4);transition:background .2s,transform .15s}
  .zb:hover{background:#fff;color:var(--gold)} .zb:active{transform:scale(.93)} .zb svg{width:44%;height:44%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .hint{position:fixed; right:clamp(14px,1.9vw,26px); bottom:clamp(12px,1.8vh,18px); z-index:30; font-size:8.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold-d); opacity:.7}

  /* fullscreen image */
  .fs{position:fixed; inset:0; z-index:60; background:rgba(14,10,6,.96); display:none; align-items:center; justify-content:center; flex-direction:column; gap:18px; opacity:0; transition:opacity .35s}
  .fs.open{display:flex; opacity:1}
  .fs img{max-width:92vw; max-height:82vh; border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .fs .fscap{color:#e9cd96; font-size:13px; letter-spacing:.24em; text-transform:uppercase}
  .fsx{position:fixed; top:24px; right:28px; z-index:62; width:46px;height:46px;border-radius:50%; cursor:pointer; border:1px solid rgba(184,146,78,.5);
    background:rgba(18,13,8,.7); color:var(--gold-l); display:grid; place-items:center}
  .fsx svg{width:42%;height:42%;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}

  .fadein{opacity:0; transform:translateY(10px); animation:fin .8s var(--expo) forwards} @keyframes fin{to{opacity:1;transform:none}}
  @media (max-aspect-ratio:1/1){ .rail{top:auto;left:0;right:0;bottom:0;width:auto;max-height:42vh} .layer{max-width:96%} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="stage" id="stage">
    <div class="layerwrap">
      <div class="layer" id="layer">
        <img src="../assets/masterplan/masterplan-psd.webp" alt="Embassy ONE master plan" id="planImg">
      </div>
    </div>
  </div>

  <div class="top">
    <button class="back" id="back" aria-label="Return"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>Return</button>
    <div class="eyebrow">The Grounds · Master Plan</div>
    <div class="corner">Embassy ONE</div>
  </div>

  <aside class="rail fadein">
    <div class="rhead">
      <div class="rk">Two acres of calm</div>
      <h1>The Grounds</h1>
      <p>Arrival unfolds slowly; the gardens reveal themselves in sequence. Filter and tap a point to explore.</p>
    </div>
    <div class="filters" id="filters">
      <button class="filt f-lantern" data-cat="lantern"><span class="fd"></span>Lanterns</button>
      <button class="filt f-amenity" data-cat="amenity"><span class="fd"></span>Amenities</button>
      <button class="filt f-garden" data-cat="garden"><span class="fd"></span>Gardens</button>
      <button class="filt f-arrival" data-cat="arrival"><span class="fd"></span>Arrival</button>
    </div>
    <div class="listhead">What's where</div>
    <div class="list" id="list"></div>
  </aside>

  <!-- popup card -->
  <div class="pop" id="pop">
    <div class="pcard">
      <div class="pimg" id="pimg"><img id="popImg" src="" alt=""><button class="pclose" id="popClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="pexp"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span></div>
      <div class="pbody"><div class="pk" id="popK">Amenity</div><div class="ph" id="popH">Title</div><div class="pp" id="popP">Description</div></div>
    </div>
    <span class="ptail"></span>
  </div>

  <div class="zctrl">
    <button class="zb" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/></svg></button>
    <button class="zb" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg></button>
    <button class="zb" id="zrst" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M3 11a8 8 0 1 1 2.3 5.6M3 21v-5h5"/></svg></button>
  </div>
  <div class="hint">Drag to pan · Scroll to zoom</div>

  <!-- fullscreen image -->
  <div class="fs" id="fs"><img id="fsImg" src="" alt=""><div class="fscap" id="fsCap"></div><button class="fsx" id="fsx" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<script>
  var R='../assets/renders/';
  // points pinned by % of the plan layer — re-checked against the original plan, all inside the site
  // 25 features pinned to the OFFICIAL master-plan positions (numbers 1–25 from the client legend)
  var POINTS=[
    {id:'p1',  cat:'lantern', name:'Twin Lantern',                x:83, y:68, dk:'Lantern', img:R+'lanterns/twin.webp',   desc:'Twin jali columns marking the arrival threshold.'},
    {id:'p2',  cat:'arrival', name:'Drop-off',                    x:63, y:72, dk:'Arrival', img:R+'lanterns/lobby.webp',  desc:'The arrival court — where the address first announces itself.'},
    {id:'p3',  cat:'lantern', name:'Winter Lantern',              x:63, y:83, dk:'Lantern', img:R+'lanterns/twin.webp',   desc:'The entrance icon — clay jali beside the winter blossom tree.'},
    {id:'p4',  cat:'garden',  name:"Pet's Park",                  x:43, y:80, dk:'Garden',  img:R+'amenities/pets.webp',  desc:'A green run set aside for the household’s smallest members.'},
    {id:'p5',  cat:'amenity', name:'Linear Playground',           x:44, y:60, dk:'Amenity', img:R+'amenities/pets.webp',  desc:'A play trail woven through the western gardens.'},
    {id:'p6',  cat:'amenity', name:'Yoga Deck',                   x:45, y:46, dk:'Amenity', img:R+'amenities/yoga.webp',  desc:'A deck set apart, for a quiet start to the day.'},
    {id:'p7',  cat:'amenity', name:'Half Muga / Pickleball Court',x:48, y:29, dk:'Amenity', img:R+'amenities/muga.webp',  desc:'A half-muga and pickleball court within the gardens.'},
    {id:'p8',  cat:'garden',  name:'Orchard Garden',              x:37, y:31, dk:'Garden',  img:R+'amenities/lawn.webp',  desc:'A fruiting orchard along the western edge.'},
    {id:'p9',  cat:'amenity', name:'Padel Court',                 x:52, y:18, dk:'Amenity', img:R+'amenities/muga.webp',  desc:'A full padel court at the northern corner.'},
    {id:'p10', cat:'lantern', name:'Summer Lantern',              x:51, y:29, dk:'Lantern', img:R+'lanterns/summer.webp', desc:'A monsoon cabana, mirrored on still water at the solstice.'},
    {id:'p11', cat:'amenity', name:'Rain Terrace',                x:58, y:27, dk:'Amenity', img:R+'amenities/lawn.webp',  desc:'A sheltered terrace that frames the monsoon.'},
    {id:'p12', cat:'garden',  name:'Open Lawn',                   x:54, y:17, dk:'Garden',  img:R+'amenities/lawn.webp',  desc:'A broad green for gathering and play.'},
    {id:'p13', cat:'amenity', name:'Seating Area',                x:57, y:11, dk:'Amenity', img:R+'lanterns/lobby.webp',  desc:'Shaded seating among the northern trees.'},
    {id:'p14', cat:'lantern', name:'Center Lantern',              x:58, y:40, dk:'Lantern', img:R+'lanterns/center.webp', desc:'The heart — frosted glass floating at the pool’s edge, gathering every season into one glow.'},
    {id:'p15', cat:'amenity', name:'Swimming Pool',               x:63, y:43, dk:'Amenity', img:R+'lanterns/center.webp', desc:'The infinity pool at the centre of the grounds.'},
    {id:'p16', cat:'amenity', name:'Children Pool Cabana',        x:55, y:43, dk:'Amenity', img:R+'lanterns/center.webp', desc:'A cabana beside the children’s pool.'},
    {id:'p17', cat:'amenity', name:'Pool Deck Cabana',            x:49, y:47, dk:'Amenity', img:R+'lanterns/center.webp', desc:'A private cabana on the pool deck.'},
    {id:'p18', cat:'amenity', name:'Jacuzzi Cabana',              x:72, y:43, dk:'Amenity', img:R+'lanterns/center.webp', desc:'A jacuzzi cabana at the pool’s eastern end.'},
    {id:'p19', cat:'amenity', name:'Pool Deck',                   x:60, y:49, dk:'Amenity', img:R+'lanterns/center.webp', desc:'Sun-deck terracing along the pool.'},
    {id:'p20', cat:'lantern', name:'Spring Lantern · Miyawaki Forest', x:68, y:31, dk:'Lantern', img:R+'lanterns/spring.webp', desc:'A folly in the Miyawaki forest, marking the year’s first bloom.'},
    {id:'p21', cat:'amenity', name:'Grand Trellis',               x:80, y:40, dk:'Amenity', img:R+'amenities/lawn.webp',  desc:'A shaded trellis walk on the eastern edge.'},
    {id:'p22', cat:'lantern', name:'Autumn Lantern',              x:81, y:45, dk:'Lantern', img:R+'lanterns/autumn.webp', desc:'A moon lantern among night-blooming fragrance — the festival of lights.'},
    {id:'p23', cat:'garden',  name:'Banquet Garden',              x:87, y:43, dk:'Garden',  img:R+'amenities/lawn.webp',  desc:'A garden setting for the banquet pavilion.'},
    {id:'p24', cat:'amenity', name:'Banquet Cabana',              x:88, y:57, dk:'Amenity', img:R+'lanterns/lobby.webp',  desc:'A cabana serving the banquet lawn.'},
    {id:'p25', cat:'amenity', name:'Banquet Spill-out Deck',      x:82, y:57, dk:'Amenity', img:R+'lanterns/lobby.webp',  desc:'An open deck spilling out from the banquet hall.'}
  ];

  var layer=document.getElementById('layer'), stage=document.getElementById('stage'), list=document.getElementById('list');
  var pop=document.getElementById('pop'), markers={}, sel=null;

  POINTS.forEach(function(pt){
    var m=document.createElement('div'); m.className='mk cat-'+pt.cat; m.style.left=pt.x+'%'; m.style.top=pt.y+'%';
    m.innerHTML='<span class="dot"></span><span class="lbl">'+pt.name+'</span>';
    m.addEventListener('click', function(e){ e.stopPropagation(); select(pt.id, true); });
    layer.appendChild(m); markers[pt.id]={pt:pt, el:m};
    var r=document.createElement('button'); r.className='lrow c-'+pt.cat; r.setAttribute('data-id',pt.id); r.setAttribute('data-cat',pt.cat);
    r.innerHTML='<span class="ld"></span><b>'+pt.name+'</b>';
    r.addEventListener('click', function(){ select(pt.id, true); });
    list.appendChild(r);
  });

  /* landscape ZONES (from the FOUR SEASONS Landscape Concept) — informational, below the points */
  var ZONES=[
    ['Sports Zone','Padel, half-muga & pickleball at the cool northern corner.'],
    ['Lawn & Rain Terrace','The open green heart, framed by the monsoon terrace.'],
    ['Forest Zone','A dense, native Miyawaki forest.'],
    ['Gardens of the Seasons','Winter, spring, summer & autumn beds — each blooming in turn.'],
    ['Herbs Garden','Fragrant beds along the western walk.'],
    ['Pool Area','The infinity pool and its sun decks.'],
    ['Banquet Spill-out','Gathering lawns east of the residences.'],
    ['Bridge & Rear Entrance','The eastern crossing and quiet arrival.'],
    ['Drop-off & Arrival','The vehicular court and porte-cochère.'],
    ['Pet-Friendly Zone','A green run for the household’s smallest.']
  ];
  var zh=document.createElement('div'); zh.className='listhead'; zh.style.marginTop='8px'; zh.textContent='The Landscape Zones'; list.appendChild(zh);
  ZONES.forEach(function(z){
    var zr=document.createElement('div'); zr.className='zrow';
    zr.innerHTML='<b>'+z[0]+'</b><span>'+z[1]+'</span>'; list.appendChild(zr);
  });

  /* pan & zoom of the whole plan layer */
  var scale=1, tx=0, ty=0, MIN=1, MAXZ=4, drag=false, sx=0, sy=0, stx=0, sty=0, pd=0, ps=1;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function apply(an){ layer.classList.toggle('dragging', !an); layer.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    stage.classList.toggle('zoomed', scale>1.001); positionPop(); }
  function reset(){ scale=1; tx=0; ty=0; apply(true); }
  function focal(e){ var r=stage.getBoundingClientRect(); return {x:e.clientX-(r.left+r.width/2), y:e.clientY-(r.top+r.height/2)}; }
  function zoomTo(n,cx,cy,an){ n=clamp(n,MIN,MAXZ); var k=n/scale; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=n; apply(an); }
  stage.addEventListener('wheel', function(e){ e.preventDefault(); var f=focal(e); zoomTo(scale*(e.deltaY<0?1.12:1/1.12), f.x, f.y, false); }, {passive:false});
  stage.addEventListener('mousedown', function(e){ drag=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; });
  window.addEventListener('mousemove', function(e){ if(!drag) return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); apply(false); });
  window.addEventListener('mouseup', function(){ drag=false; });
  stage.addEventListener('touchstart', function(e){ if(e.touches.length===2){ pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); ps=scale; } else if(e.touches.length===1){ drag=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; stx=tx; sty=ty; } }, {passive:false});
  stage.addEventListener('touchmove', function(e){ if(e.touches.length===2){ e.preventDefault(); var f=focal({clientX:(e.touches[0].clientX+e.touches[1].clientX)/2, clientY:(e.touches[0].clientY+e.touches[1].clientY)/2}); zoomTo(ps*(Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pd), f.x, f.y, false); } else if(drag&&e.touches.length===1){ e.preventDefault(); tx=stx+(e.touches[0].clientX-sx); ty=sty+(e.touches[0].clientY-sy); apply(false); } }, {passive:false});
  stage.addEventListener('touchend', function(e){ if(e.touches.length<2) pd=0; if(e.touches.length===0) drag=false; });
  document.getElementById('zin').addEventListener('click', function(){ zoomTo(scale+0.5,0,0,true); });
  document.getElementById('zout').addEventListener('click', function(){ zoomTo(scale-0.5,0,0,true); });
  document.getElementById('zrst').addEventListener('click', function(){ clearSel(); reset(); });

  function flyTo(pt){
    var lr=layer.getBoundingClientRect(); var w=lr.width/scale, h=lr.height/scale; var target=2.1;
    var ox=(pt.x/100 - 0.5)*w, oy=(pt.y/100 - 0.5)*h;
    tx=-ox*target; ty=-oy*target; scale=target; apply(true);
  }
  function positionPop(){
    if(!sel || !markers[sel]) return;
    var pt=markers[sel].pt; var lr=layer.getBoundingClientRect();
    var px=lr.left + (pt.x/100)*lr.width, py=lr.top + (pt.y/100)*lr.height;
    px=clamp(px, 200, window.innerWidth-180); py=clamp(py, 230, window.innerHeight-20);
    pop.style.left=px+'px'; pop.style.top=(py-26)+'px';
  }

  function select(id, fly){
    sel=id; var pt=markers[id].pt;
    for(var k in markers){ markers[k].el.classList.toggle('sel', k===id); markers[k].el.classList.toggle('dim', k!==id); }
    document.querySelectorAll('.lrow').forEach(function(r){ r.classList.toggle('sel', r.getAttribute('data-id')===id); });
    document.getElementById('popImg').src=pt.img; document.getElementById('popImg').alt=pt.name;
    document.getElementById('popK').textContent=pt.dk; document.getElementById('popH').textContent=pt.name; document.getElementById('popP').textContent=pt.desc;
    if(fly) flyTo(pt);
    pop.classList.add('on');
    requestAnimationFrame(positionPop); setTimeout(positionPop, 720);
  }
  function clearSel(){ sel=null; pop.classList.remove('on'); for(var k in markers){ markers[k].el.classList.remove('sel','dim'); } document.querySelectorAll('.lrow').forEach(function(r){ r.classList.remove('sel'); }); }
  stage.addEventListener('click', function(e){ if(e.target===stage || e.target.classList.contains('layerwrap') || e.target.id==='planImg'){ clearSel(); } });
  document.getElementById('popClose').addEventListener('click', clearSel);

  /* filters */
  document.querySelectorAll('.filt').forEach(function(b){
    b.addEventListener('click', function(){ b.classList.toggle('off'); var cat=b.getAttribute('data-cat'), off=b.classList.contains('off');
      for(var k in markers){ if(markers[k].pt.cat===cat) markers[k].el.classList.toggle('hide', off); }
      document.querySelectorAll('.lrow[data-cat="'+cat+'"]').forEach(function(r){ r.classList.toggle('hide', off); });
      if(off && sel && markers[sel] && markers[sel].pt.cat===cat){ clearSel(); }
    });
  });

  /* fullscreen image */
  var fs=document.getElementById('fs');
  document.getElementById('pimg').addEventListener('click', function(e){
    if(e.target.closest('.pclose')) return;
    if(!sel) return; var pt=markers[sel].pt;
    document.getElementById('fsImg').src=pt.img; document.getElementById('fsCap').textContent=pt.dk+' · '+pt.name;
    fs.classList.add('open');
  });
  document.getElementById('fsx').addEventListener('click', function(){ fs.classList.remove('open'); });
  fs.addEventListener('click', function(e){ if(e.target===fs) fs.classList.remove('open'); });

  document.getElementById('back').addEventListener('click', function(){ try{ parent.postMessage('eo-screen-close','*'); }catch(e){} });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(fs.classList.contains('open')){ fs.classList.remove('open'); return; } if(sel){ clearSel(); reset(); } else { try{ parent.postMessage('eo-screen-close','*'); }catch(_){ } } } });
  window.addEventListener('resize', positionPop);

  apply(false);
  // dev: ?sel=<id> opens that marker's popup
  (function(){ try{ var s=new URLSearchParams(location.search).get('sel'); if(s && markers[s]) setTimeout(function(){ select(s,true); }, 300); }catch(e){} })();
</script>
  <script src="../assets/leaf.js"></script>
</body>
</html>
