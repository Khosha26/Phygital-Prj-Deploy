<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Highland Mayfields — An Opulence of Luxury</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mayfields">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles/brand.css">
<style>
  /* ============ INTRO + APP SHELL ============ */
  html,body{ height:100%; }
  #app{ position:fixed; inset:0; background:var(--hm-espresso-2); overflow:hidden; }

  /* ---- home iframe (preloaded under the intro) ---- */
  #homeFrame{
    position:absolute; inset:0; width:100%; height:100%; border:0;
    opacity:0; visibility:hidden; transition:opacity 1.1s var(--ease-settle);
  }
  #app.entered #homeFrame{ opacity:1; visibility:visible; }

  /* ---- intro root ---- */
  #intro{ position:absolute; inset:0; z-index:5; background:var(--hm-espresso-2);
    transition:opacity 1.1s var(--ease-settle); }
  #app.entered #intro{ opacity:0; pointer-events:none; }

  /* faint quatrefoil watermark + grain shared */
  .grain{ position:absolute; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  /* ====== 1 · START GATE ====== */
  #gate{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(1.4rem,3vh,2.6rem);
    background:radial-gradient(120% 120% at 50% 42%, #2a1e19 0%, var(--hm-espresso-2) 62%);
    transition:opacity .9s var(--ease-settle); cursor:pointer; }
  #gate.gone{ opacity:0; pointer-events:none; }
  #gate .mark{ width:clamp(78px,11vw,150px); filter:drop-shadow(0 6px 26px rgba(0,0,0,.5)); }
  #gate .markSvg{ width:clamp(64px,8vw,110px); height:auto; }
  #gate .markSvg path{ fill:none; stroke:var(--hm-copper); stroke-width:6; }
  .gate-breathe{ animation:gate-breathe 4.6s var(--ease-soft) infinite; }
  @keyframes gate-breathe{ 0%,100%{ transform:translateY(0) scale(1); opacity:.92 } 50%{ transform:translateY(-4px) scale(1.025); opacity:1 } }
  #gate .touch{ display:flex; flex-direction:column; align-items:center; gap:.9rem; opacity:0; animation:gate-touch-in 1.2s var(--ease-settle) .5s forwards; }
  @keyframes gate-touch-in{ to{ opacity:1 } }
  #gate .touch .dot{ width:6px; height:6px; border-radius:50%; background:var(--hm-gold); opacity:.85;
    animation:gate-pulse 2.4s ease-in-out infinite; }
  @keyframes gate-pulse{ 0%,100%{ transform:scale(1); opacity:.4 } 50%{ transform:scale(1.7); opacity:1 } }
  #gate .touch span{ font-family:var(--font-label); text-transform:uppercase; letter-spacing:var(--track-label);
    font-size:var(--t-label); color:var(--ink-dim); }

  /* ====== 2 · VIDEO STAGE ====== */
  #videoStage{ position:absolute; inset:0; z-index:20; background:#000; opacity:0;
    transition:opacity .8s var(--ease-settle); }
  #videoStage.on{ opacity:1; }
  #introVideo{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #skip{ position:absolute; right:clamp(1rem,2.4vw,2.4rem); bottom:clamp(1rem,2.4vw,2.4rem);
    z-index:22; font-family:var(--font-label); font-size:var(--t-micro); letter-spacing:var(--track-wide);
    text-transform:uppercase; color:rgba(244,242,235,.5); background:none; border:0; cursor:pointer;
    display:flex; align-items:center; gap:.6em; opacity:0; transition:opacity .6s, color .3s; }
  #skip.show{ opacity:1; }
  #skip:hover{ color:var(--ink); }
  #skip::after{ content:""; width:1.6em; height:1px; background:currentColor; }

  /* ====== 3 · ENTER SCENE (post-film composition) ====== */
  #enterScene{ position:absolute; inset:0; z-index:25; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    opacity:0; visibility:hidden; transition:opacity 1.2s var(--ease-settle); }
  #enterScene.on{ opacity:1; visibility:visible; }
  /* twilight hero bleeding in behind */
  #enterScene .bg{ position:absolute; inset:0; background-size:cover; background-position:50% 42%;
    transform:scale(1.08); transition:transform 9s linear; }
  #enterScene.on .bg{ transform:scale(1.14); }
  #enterScene .veil{ position:absolute; inset:0;
    background:radial-gradient(120% 100% at 50% 38%, rgba(26,18,15,.34), rgba(26,18,15,.82) 78%); }
  #enterScene .inner{ position:relative; z-index:2; display:flex; flex-direction:column;
    align-items:center; gap:clamp(1.1rem,2.4vh,2rem); padding:var(--pad-stage); }
  #enterScene .lockup{ width:clamp(280px,40vw,640px); filter:drop-shadow(0 10px 40px rgba(0,0,0,.55));
    opacity:0; transform:translateY(14px); }
  #enterScene.on .lockup{ animation:rise 1.3s var(--ease-settle) .15s forwards; }
  #enterScene .rule{ width:min(46vw,420px); opacity:0; }
  #enterScene.on .rule{ animation:fade 1s var(--ease-settle) .8s forwards; }
  #enterScene .tag{ font-family:var(--font-body); font-style:italic; font-size:var(--t-sub);
    color:var(--ink-dim); letter-spacing:.02em; opacity:0; }
  #enterScene.on .tag{ animation:fade 1.1s var(--ease-settle) 1s forwards; }
  #enterScene .enterWrap{ opacity:0; margin-top:.4rem; }
  #enterScene.on .enterWrap{ animation:rise 1.1s var(--ease-settle) 1.5s forwards; }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) } }
  @keyframes fade{ to{ opacity:1 } }

  /* ---- ENTER button — HOME-SCREEN PLAQUE style (cut-corner glass plate + gold hairline) ---- */
  #enterBtn{ position:relative; overflow:visible; display:inline-grid; place-items:center;
    width:clamp(244px,31vw,312px); height:clamp(66px,8.6vh,84px); padding:0;
    border-radius:0; background:transparent;
    transition:transform .3s var(--ease-soft); will-change:transform; }
  #enterBtn::before,#enterBtn::after{ display:none !important; }  /* kill base .hm-enter pill border + glow */
  /* the vector plate — same .pl-* anatomy as the home plaques (thin non-scaling gold edge) */
  #enterBtn .pl-plate{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none;
    transition:transform .45s var(--ease-soft), filter .45s var(--ease-soft);
    filter:drop-shadow(0 12px 22px rgba(0,0,0,.5)); }
  #enterBtn .pl-glass{ fill:url(#enterGlass); }
  #enterBtn .pl-inner{ fill:none; stroke:var(--hm-gold); stroke-width:1; vector-effect:non-scaling-stroke; opacity:.2; }
  #enterBtn .pl-edge{ fill:none; stroke:var(--hm-gold-soft); stroke-width:1.15; vector-effect:non-scaling-stroke; opacity:.92; }
  /* face: label + arrow, styled like a plaque title */
  #enterBtn .pl-face{ position:relative; z-index:2; display:inline-flex; align-items:center; gap:.7em;
    font-family:var(--font-display); font-weight:300; letter-spacing:.04em; text-transform:none;
    font-size:calc(var(--t-label)*1.14); color:var(--hm-gold-bright);
    transition:color .4s var(--ease-soft), letter-spacing .4s var(--ease-soft); }
  #enterBtn .arrow{ display:inline-block; transition:transform .4s var(--ease-soft); }
  /* champagne sheen sweep, clipped to the cut-corner silhouette */
  #enterBtn .sheen{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(105deg,transparent 42%,color-mix(in srgb,var(--hm-gold-bright) 40%,transparent) 50%,transparent 58%);
    background-size:250% 100%; background-repeat:no-repeat; background-position:175% 0;
    clip-path:polygon(7.3% 3.1%,92.7% 3.1%,99.1% 25%,99.1% 75%,92.7% 96.9%,7.3% 96.9%,.9% 75%,.9% 25%); }
  #enterScene.on #enterBtn .sheen{ animation:btn-sheen 5.6s var(--ease-soft) 2.4s infinite; }
  @keyframes btn-sheen{ 0%{ background-position:175% 0 } 34%{ background-position:-75% 0 } 100%{ background-position:-75% 0 } }
  /* hover/focus = home plaque lift + glow */
  @media (hover:hover){
    #enterBtn:hover .pl-plate{ transform:translateY(-3px) scale(1.025);
      filter:drop-shadow(0 16px 26px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(184,156,109,.46)); }
    #enterBtn:hover .pl-face{ color:#fff; letter-spacing:.07em; }
    #enterBtn:hover .arrow{ transform:translateX(6px); }
  }
  #enterBtn:focus-visible{ outline:none; }
  #enterBtn:focus-visible .pl-plate{ transform:translateY(-3px) scale(1.025);
    filter:drop-shadow(0 16px 26px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(184,156,109,.55)); }
  #enterBtn:active{ transform:translateY(1px); }
  /* press ripple (kept) */
  #enterBtn .rip{ position:absolute; border-radius:50%; pointer-events:none; z-index:1; transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle,color-mix(in srgb,var(--hm-gold-bright) 55%,transparent),transparent 70%); animation:btn-rip .7s ease-out forwards; }
  @keyframes btn-rip{ to{ transform:translate(-50%,-50%) scale(1); opacity:0 } }

  /* ====== intro → home : soft luxury CROSS-DISSOLVE ======
     The home iframe fades up while #intro fades out (see #homeFrame / #intro transitions
     above). No lattice wipe — quiet, cinematic. */

  /* enter-scene exit push-in */
  #app.leaving #enterScene .inner{ transform:scale(1.08); opacity:0; transition:all 1.1s var(--ease-settle); }

  /* ====== subtle UNIFIED BACKGROUND inside the intro (same layers as home/screens, lower opacity) ====== */
  #intro{ background:transparent; }   /* let the shared texture show; gate/video/scene carry their own grounds */
  .ibg{ position:fixed; inset:0; z-index:-3; overflow:hidden;
    background:radial-gradient(150% 130% at 76% 36%, #2b211c 0%, var(--hm-espresso) 48%, var(--hm-espresso-2) 100%); }
  .ibg::before{ content:""; position:absolute; inset:-6%; background-image:var(--hm-lattice);
    background-size:clamp(86px,9vw,132px); opacity:.04; animation:bg-lattice 70s linear infinite; }
  @keyframes bg-lattice{ to{ background-position:132px 132px; } }
  .ibg::after{ content:""; position:absolute; inset:-25%; mix-blend-mode:screen;
    background:linear-gradient(116deg, transparent 40%, rgba(201,176,120,.06) 48%, rgba(231,208,152,.13) 50.5%, rgba(201,176,120,.06) 53%, transparent 61%);
    animation:bg-sweep 13s ease-in-out infinite; }
  @keyframes bg-sweep{ 0%{ transform:translate3d(-42%,-22%,0); opacity:0 } 22%{ opacity:1 } 78%{ opacity:1 } 100%{ transform:translate3d(42%,22%,0); opacity:0 } }
  .ibgimg{ position:fixed; inset:0; z-index:-2; pointer-events:none; --xpeak:.24;
    background-image:url("assets/bg-wireframe@2560.webp"); background-repeat:no-repeat;
    background-position:center; background-size:cover; opacity:.24; mix-blend-mode:screen;
    animation:bg-drift 56s ease-in-out infinite, bg-xfade 28s ease-in-out infinite; will-change:transform,opacity; }
  @keyframes bg-drift{ 0%,100%{ transform:scale(1.04) translate(0,0) } 50%{ transform:scale(1.09) translate(-1.4%,1%) } }
  .ibgline{ position:fixed; inset:0; z-index:-2; pointer-events:none; --xpeak:.32;
    background-image:url("assets/bg-lineart.png"); background-repeat:no-repeat;
    background-position:center; background-size:cover; opacity:.32; mix-blend-mode:screen;
    animation:bg-line 44s ease-in-out infinite, bg-xfade-line 28s ease-in-out -14s infinite; will-change:transform,opacity; }
  @keyframes bg-line{ 0%,100%{ transform:scale(1.05) translate(0,0) } 50%{ transform:scale(1.1) translate(1.6%,-1%) } }
  @keyframes bg-xfade{ 0%{ opacity:0 } 8%{ opacity:var(--xpeak,.3) } 42%{ opacity:var(--xpeak,.3) } 50%{ opacity:0 } 100%{ opacity:0 } }
  /* outline line-art never fully fades: troughs held at ~10% of peak so it stays faintly visible at all times (subtler on intro) */
  @keyframes bg-xfade-line{ 0%{ opacity:calc(var(--xpeak,.32)*.1) } 8%{ opacity:var(--xpeak,.32) } 42%{ opacity:var(--xpeak,.32) } 50%{ opacity:calc(var(--xpeak,.32)*.1) } 100%{ opacity:calc(var(--xpeak,.32)*.1) } }
  .igrain{ position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  @media (prefers-reduced-motion:reduce){ .ibg::before,.ibg::after,.ibgimg,.ibgline{ animation:none; } }

  /* ============ FIRST-RUN "DOWNLOAD THE EXPERIENCE" GATE ============ */
  #dlGate{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:clamp(1.5rem,3.4vh,2.8rem);
    background:radial-gradient(120% 120% at 50% 40%, #2a1e19 0%, #1e1816 62%);
    transition:opacity .85s var(--ease-settle); }
  #dlGate.gone{ opacity:0; pointer-events:none; }
  #dlGate .dl-main{ display:flex; flex-direction:column; align-items:center;
    gap:clamp(1.2rem,2.8vh,2.2rem); transition:opacity .5s ease; }
  #dlGate .dl-crest{ width:clamp(88px,11vw,148px); height:auto;
    filter:drop-shadow(0 8px 30px rgba(0,0,0,.55)); animation:gate-breathe 4.6s var(--ease-soft) infinite; }
  #dlGate .dl-name{ font-family:var(--font-display,'Cormorant Garamond',serif); font-weight:400;
    font-size:clamp(1.7rem,4vw,3rem); letter-spacing:.14em; color:var(--hm-gold-bright,#e7d098);
    text-transform:uppercase; line-height:1.05; }
  #dlGate .dl-sub{ font-family:var(--font-body,'EB Garamond',serif); font-style:italic;
    font-size:clamp(.85rem,1.7vw,1.15rem); color:var(--ink-dim,rgba(244,242,235,.6)); margin-top:-.4rem; }
  #dlGate .dl-progwrap{ display:flex; flex-direction:column; align-items:center; gap:.9rem;
    width:min(52vw,560px); }
  #dlGate .dl-track{ position:relative; width:100%; height:3px; border-radius:3px;
    background:rgba(184,156,109,.16); overflow:hidden; }
  #dlGate .dl-bar{ position:absolute; inset:0 auto 0 0; width:0%; border-radius:3px;
    background:linear-gradient(90deg, #b89c6d, #e7d098 55%, #f2e6c8);
    box-shadow:0 0 14px rgba(231,208,152,.5); transition:width .3s ease; }
  #dlGate .dl-meta{ display:flex; align-items:center; gap:.9em;
    font-family:var(--font-label,'Jost',sans-serif); font-size:clamp(.62rem,1.1vw,.78rem);
    letter-spacing:.26em; text-transform:uppercase; color:var(--ink-dim,rgba(244,242,235,.55)); }
  #dlGate .dl-pct{ color:var(--hm-gold,#c9b078); font-variant-numeric:tabular-nums; }
  /* rotate-to-landscape hint (portrait only) */
  #dlGate .dl-rotate{ display:none; position:absolute; inset:0; z-index:2;
    flex-direction:column; align-items:center; justify-content:center; gap:1.2rem;
    background:radial-gradient(120% 120% at 50% 42%, #2a1e19, #1e1816 70%); }
  #dlGate .dl-rotate svg{ width:clamp(46px,9vw,72px); height:auto; color:var(--hm-gold,#c9b078);
    animation:dl-rot 2.8s var(--ease-soft) infinite; }
  @keyframes dl-rot{ 0%,100%{ transform:rotate(0) } 55%,80%{ transform:rotate(-90deg) } }
  #dlGate .dl-rotate span{ font-family:var(--font-label,'Jost',sans-serif); text-transform:uppercase;
    letter-spacing:.24em; font-size:clamp(.66rem,1.4vw,.82rem); color:var(--ink-dim,rgba(244,242,235,.6)); }
  @media (orientation:portrait){
    #dlGate .dl-main{ opacity:.14; filter:blur(1px); }
    #dlGate .dl-rotate{ display:flex; }
  }

  /* ---- app-wide portrait rotate hint (landscape-only kiosk suite) ---- */
  #rotateHint{ display:none; position:fixed; inset:0; z-index:55;
    flex-direction:column; align-items:center; justify-content:center; gap:1.3rem; text-align:center;
    background:radial-gradient(120% 120% at 50% 42%, #2a1e19, #1e1816 70%); }
  #rotateHint svg{ width:clamp(48px,10vw,80px); height:auto; color:var(--hm-gold,#c9b078);
    animation:dl-rot 2.8s var(--ease-soft) infinite; }
  #rotateHint .rh-name{ font-family:var(--font-display,'Cormorant Garamond',serif);
    font-size:clamp(1.1rem,3vw,1.7rem); letter-spacing:.14em; text-transform:uppercase;
    color:var(--hm-gold-bright,#e7d098); }
  #rotateHint span.rh-cap{ font-family:var(--font-label,'Jost',sans-serif); text-transform:uppercase;
    letter-spacing:.24em; font-size:clamp(.66rem,1.5vw,.84rem); color:var(--ink-dim,rgba(244,242,235,.6)); }
  @media (orientation:portrait){ #rotateHint{ display:flex; } }
</style>
</head>
<body>
<div id="app" data-kd-brand="highland-mayfields">

  <!-- first-run download-the-experience gate (offline precache) -->
  <div id="dlGate" role="status" aria-live="polite" aria-label="Preparing offline experience">
    <div class="dl-main">
      <img class="dl-crest" src="assets/logo-crest.png" alt="" aria-hidden="true">
      <div>
        <div class="dl-name">Highland Mayfields</div>
        <div class="dl-sub">An opulence of luxury</div>
      </div>
      <div class="dl-progwrap">
        <div class="dl-track"><div class="dl-bar" id="dlBar"></div></div>
        <div class="dl-meta"><span class="dl-cap" id="dlCap">Preparing the estate</span><span class="dl-pct" id="dlPct">0%</span></div>
      </div>
    </div>
    <div class="dl-rotate" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 19h6"/>
      </svg>
      <span>Rotate to landscape</span>
    </div>
  </div>

  <!-- app-wide portrait rotate hint (landscape-only kiosk) -->
  <div id="rotateHint" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 19h6"/>
    </svg>
    <div class="rh-name">Highland Mayfields</div>
    <span class="rh-cap">Rotate to landscape</span>
  </div>

  <!-- preloaded home, revealed on enter -->
  <iframe id="homeFrame" title="Highland Mayfields" loading="eager"></iframe>

  <!-- premium voice greeting (plays on lock-in) -->
  <audio id="welcome" preload="auto">
    <source src="assets/welcome.m4a" type="audio/mp4">
    <source src="assets/welcome.mp3" type="audio/mpeg">
  </audio>

  <!-- intro -->
  <div id="intro">
    <!-- subtle shared background texture (cohesion with home + inside screens) -->
    <div class="ibg" aria-hidden="true"></div>
    <div class="ibgline" aria-hidden="true"></div>
    <div class="ibgimg" aria-hidden="true"></div>
    <div class="igrain" aria-hidden="true"></div>
    <div class="grain"></div>

    <!-- 3 · enter scene -->
    <div id="enterScene">
      <div class="bg" id="enterBg"></div>
      <div class="veil"></div>
      <div class="inner">
        <img class="lockup" id="enterLockup" alt="Highland Mayfields" src="assets/logo-lockup-light.png">
        <div class="hm-rule rule"></div>
        <p class="tag">An opulence of luxury</p>
        <div class="enterWrap">
          <button class="hm-enter" id="enterBtn" aria-label="Enter Highland Mayfields">
            <svg class="pl-plate" viewBox="0 0 220 64" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="enterGlass" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" style="stop-color:var(--hm-espresso)"/>
                  <stop offset=".55" style="stop-color:var(--hm-espresso-2)"/>
                  <stop offset="1" style="stop-color:var(--hm-espresso-2)"/>
                </linearGradient>
              </defs>
              <polygon class="pl-glass" points="16,2 204,2 218,16 218,48 204,62 16,62 2,48 2,16"/>
              <polygon class="pl-inner" points="22,8 198,8 212,20 212,44 198,56 22,56 8,44 8,20"/>
              <polygon class="pl-edge"  points="16,2 204,2 218,16 218,48 204,62 16,62 2,48 2,16"/>
            </svg>
            <span class="sheen" aria-hidden="true"></span>
            <span class="pl-face">
              <span class="label">Enter the Estate</span>
              <span class="arrow" aria-hidden="true">&rarr;</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- 2 · video -->
    <div id="videoStage">
      <video id="introVideo" playsinline preload="auto" poster="assets/logo-poster.jpg">
        <source src="assets/logo-animation.webm" type="video/webm">
        <source src="assets/logo-animation.mp4" type="video/mp4">
      </video>
      <button id="skip">Skip intro</button>
    </div>

    <!-- 1 · start gate -->
    <div id="gate" role="button" tabindex="0" aria-label="Touch to begin">
      <img class="mark gate-breathe" id="gateMark" alt="" src="assets/logo-crest.png"
           onerror="this.style.display='none';document.getElementById('gateMarkSvg').style.display='block';">
      <svg id="gateMarkSvg" class="markSvg gate-breathe" viewBox="0 0 100 100" style="display:none" aria-hidden="true">
        <path d="M50 8 C58 28 72 42 92 50 C72 58 58 72 50 92 C42 72 28 58 8 50 C28 42 42 28 50 8 Z"/>
      </svg>
      <div class="touch"><span class="dot"></span><span>Touch to begin</span></div>
    </div>

  </div>
</div>

<script>
(function(){
  var app   = document.getElementById('app');
  var gate  = document.getElementById('gate');
  var vstage= document.getElementById('videoStage');
  var vid   = document.getElementById('introVideo');
  var skip  = document.getElementById('skip');
  var scene = document.getElementById('enterScene');
  var enterBg = document.getElementById('enterBg');
  var enterBtn= document.getElementById('enterBtn');
  var welcome = document.getElementById('welcome');
  var started=false, ended=false, entered=false, greeted=false;

  /* luxury transition sound (no visible toggle; fails silently if blocked) */
  var sfxTransition=null;
  try{ sfxTransition=new Audio('assets/sfx/transition.mp3'); sfxTransition.preload='auto'; sfxTransition.volume=.35; }catch(e){}
  function playTransition(){ if(!sfxTransition) return; try{ sfxTransition.currentTime=0; var p=sfxTransition.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }

  /* preload home immediately so Enter is instant */
  document.getElementById('homeFrame').src = 'home.html?v='+Date.now();

  /* set twilight hero behind the enter scene (webp w/ jpg fallback) */
  (function(){
    var img=new Image();
    img.onload=function(){ enterBg.style.backgroundImage="url('assets/hero-intro.webp')"; };
    img.onerror=function(){
      var j=new Image();
      j.onload=function(){ enterBg.style.backgroundImage="url('assets/hero-intro.jpg')"; };
      j.onerror=function(){ enterBg.style.background="radial-gradient(120% 120% at 50% 40%, #2a1e19, #14100d)"; };
      j.src='assets/hero-intro.jpg';
    };
    img.src='assets/hero-intro.webp';
  })();

  function begin(){
    if(started) return; started=true;
    gate.classList.add('gone');
    vstage.classList.add('on');
    // user gesture -> sound allowed
    var p = vid.play();
    if(p && p.catch){ p.catch(function(){
      // autoplay-with-sound blocked: try muted, else skip to scene
      vid.muted=true; vid.play().catch(function(){ showScene(); });
    }); }
    setTimeout(function(){ if(!ended) skip.classList.add('show'); }, 2200);
  }
  function showScene(){
    if(ended) return; ended=true;
    skip.classList.remove('show');
    vstage.style.opacity='0';
    setTimeout(function(){ vstage.style.display='none'; }, 800);
    scene.classList.add('on');
    // premium voice greeting — plays HERE, on the intro scene only (gate touch already unlocked audio)
    if(!greeted){ greeted=true; setTimeout(function(){ try{ welcome.currentTime=0; welcome.play().catch(function(){}); }catch(e){} }, 850); }
  }
  function enter(){
    entered=true;
    playTransition();                 // soft luxury touch-cue on the cross-dissolve into home
    app.classList.add('leaving');
    // the greeting belongs to the intro only — silence it before home is revealed
    try{ welcome.pause(); welcome.currentTime=0; }catch(e){}
    setTimeout(function(){
      app.classList.add('entered');   // home iframe fades up while #intro fades out (soft cross-dissolve)
      /* tell home to POP its medallions in from air exactly as it's revealed */
      try{ document.getElementById('homeFrame').contentWindow.postMessage('hm:enter','*'); }catch(e){}
    }, 480);
    setTimeout(function(){
      // free intro resources after the cut
      try{ vid.pause(); vid.removeAttribute('src'); vid.load(); }catch(e){}
      document.getElementById('intro').style.display='none';
    }, 1500);
  }

  gate.addEventListener('click', begin);
  gate.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); begin(); }});
  vid.addEventListener('ended', showScene);
  vid.addEventListener('error', function(){ if(started) showScene(); });
  skip.addEventListener('click', function(e){ e.stopPropagation(); try{vid.pause();}catch(_){ } showScene(); });
  enterBtn.addEventListener('click', enter);

  /* magnetic cursor-follow + press ripple on the enter button */
  (function(){
    var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(!reduce){
      enterBtn.addEventListener('pointermove', function(e){
        var r=enterBtn.getBoundingClientRect();
        var dx=(e.clientX-(r.left+r.width/2))/r.width, dy=(e.clientY-(r.top+r.height/2))/r.height;
        enterBtn.style.transform='translate('+(dx*12).toFixed(1)+'px,'+(dy*9).toFixed(1)+'px)';
      });
      enterBtn.addEventListener('pointerleave', function(){ enterBtn.style.transform=''; });
    }
    enterBtn.addEventListener('pointerdown', function(e){
      var r=enterBtn.getBoundingClientRect(), s=document.createElement('span'); s.className='rip';
      var d=Math.max(r.width,r.height)*1.7; s.style.width=s.style.height=d+'px';
      s.style.left=(e.clientX-r.left)+'px'; s.style.top=(e.clientY-r.top)+'px';
      enterBtn.appendChild(s); setTimeout(function(){ s.remove(); },700);
    });
  })();

  /* intro ENTER button — morph through 3 distinct plaque silhouettes on a 3s loop
     (octagon → hexagon banner → soft rectangle). All 8-point so they tween smoothly. */
  (function(){
    var glass=enterBtn.querySelector('.pl-glass'), inner=enterBtn.querySelector('.pl-inner'),
        edge=enterBtn.querySelector('.pl-edge'), sheen=enterBtn.querySelector('.sheen');
    if(!glass||!edge||!inner) return;
    var SHAPES=[
      { o:'20,2 200,2 218,18 218,46 200,62 20,62 2,46 2,18', i:'26,8 194,8 212,22 212,42 194,56 26,56 8,42 8,22' }, /* octagon  */
      { o:'20,2 200,2 218,32 218,32 200,62 20,62 2,32 2,32', i:'26,8 194,8 212,32 212,32 194,56 26,56 8,32 8,32' }, /* hexagon  */
      { o:'8,2 212,2 218,8 218,56 212,62 8,62 2,56 2,8',     i:'14,8 206,8 212,14 212,50 206,56 14,56 8,50 8,14' }  /* rectangle*/
    ];
    var idx=0, raf=0, timer=0;
    var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    function nums(s){ return s.trim().split(/[ ,]+/).map(Number); }
    function str(a){ var o=''; for(var k=0;k<a.length;k+=2){ o+=(k?' ':'')+a[k]+','+a[k+1]; } return o; }
    function clip(a){ var o='polygon('; for(var k=0;k<a.length;k+=2){ o+=(k?',':'')+(a[k]/220*100).toFixed(2)+'% '+(a[k+1]/64*100).toFixed(2)+'%'; } return o+')'; }
    function apply(o,i){ var so=str(o); glass.setAttribute('points',so); edge.setAttribute('points',so); inner.setAttribute('points',str(i)); if(sheen) sheen.style.clipPath=clip(o); }
    function ease(x){ return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
    function morph(to){
      var fO=nums(SHAPES[idx].o), fI=nums(SHAPES[idx].i), tO=nums(SHAPES[to].o), tI=nums(SHAPES[to].i), t0=null, dur=700;
      cancelAnimationFrame(raf);
      function step(ts){ if(t0===null)t0=ts; var p=Math.min(1,(ts-t0)/dur), e=ease(p);
        apply(fO.map(function(v,n){return v+(tO[n]-v)*e;}), fI.map(function(v,n){return v+(tI[n]-v)*e;}));
        if(p<1) raf=requestAnimationFrame(step); else idx=to;
      }
      raf=requestAnimationFrame(step);
    }
    apply(nums(SHAPES[0].o), nums(SHAPES[0].i));
    if(!reduce){ timer=setInterval(function(){ if(entered){ clearInterval(timer); cancelAnimationFrame(raf); return; } morph((idx+1)%SHAPES.length); }, 3000); }
  })();

  /* ---- RESTART : home's logo asks to return to the intro gate (soft fade, no hard reload) ---- */
  function restartIntro(){
    if(!entered) return;                 // only meaningful once we're inside home
    playTransition();
    var intro=document.getElementById('intro');
    intro.style.display='';              // bring the intro layer back so it can fade in
    // reset the opening sequence to the touch-gate
    gate.classList.remove('gone');
    scene.classList.remove('on');
    vstage.classList.remove('on'); vstage.style.display=''; vstage.style.opacity='';
    try{ vid.pause(); vid.currentTime=0; vid.load(); }catch(e){}
    skip.classList.remove('show');
    enterBtn.style.transform='';
    started=false; ended=false; entered=false; greeted=false;
    // re-arm home for the next enter (so its medallions bloom again)
    var hf=document.getElementById('homeFrame');
    try{ hf.contentWindow.location.replace('home.html?v='+Date.now()); }catch(e){ hf.src='home.html?v='+Date.now(); }
    // cross-dissolve: intro fades up while home fades out
    requestAnimationFrame(function(){ app.classList.remove('entered','leaving'); });
  }

  /* messages from the home child */
  window.addEventListener('message', function(e){
    if(!e) return;
    if(e.data==='hm:restart-intro') restartIntro();
    /* 'hm:home-ready' acknowledged silently */
  });
})();
</script>

<!-- offline-first PWA: register SW, then prefetch heavy renders when idle -->
<script>
(function(){
  if(!('serviceWorker' in navigator)) return;
  /* Only reload when an EXISTING controller is REPLACED (a real SW update). On the very
     first claim (controller was null) we must NOT reload — that would interrupt the
     first-run download gate. */
  var _hadController = !!navigator.serviceWorker.controller;
  var _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(_reloaded || !_hadController) return; _reloaded=true; window.location.reload();
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      try{ if(reg.update) reg.update(); }catch(e){}
      var fire=function(){
        var c=navigator.serviceWorker.controller;
        if(c){ c.postMessage('PREFETCH_SECONDARY'); }
        else { navigator.serviceWorker.ready.then(function(reg){
          if(reg && reg.active){ reg.active.postMessage('PREFETCH_SECONDARY'); }
        }); }
      };
      if('requestIdleCallback' in window){ requestIdleCallback(fire, {timeout:4000}); }
      else { setTimeout(fire, 2500); }
    }).catch(function(){});
  });
})();
</script>

<!-- first-run "Download the experience" gate: precache the whole app into the SW cache -->
<script>
(function(){
  var VER='hm-v3', KEY='hm-downloaded';
  var gate=document.getElementById('dlGate');
  if(!gate) return;
  var params=new URLSearchParams(location.search);
  var force=params.has('pwa');
  var alreadyDone = (function(){ try{ return localStorage.getItem(KEY)===VER; }catch(e){ return false; } })();

  /* subsequent launches: skip the gate entirely, boot straight from cache */
  if(alreadyDone && !force){ if(gate.parentNode) gate.parentNode.removeChild(gate); return; }

  var bar=document.getElementById('dlBar'), pctEl=document.getElementById('dlPct'), capEl=document.getElementById('dlCap');
  function setProgress(done,total){
    var p = total ? Math.round(done/total*100) : 100;
    if(p>100) p=100;
    bar.style.width=p+'%'; pctEl.textContent=p+'%';
  }
  function finish(){
    try{ localStorage.setItem(KEY,VER); }catch(e){}
    if(capEl) capEl.textContent='Ready';
    gate.classList.add('gone');
    setTimeout(function(){ if(gate.parentNode) gate.parentNode.removeChild(gate); }, 900);
  }

  async function run(){
    var list=[];
    try{
      var r=await fetch('asset-manifest.json?v='+Date.now(), {cache:'no-store'});
      list=await r.json();
    }catch(e){ list=[]; }
    if(!Array.isArray(list)) list=[];
    /* guarantee the shell + manifest are covered even if the scan missed them */
    ['./','index.html','home.html','manifest.json','sw.js','asset-manifest.json'].forEach(function(u){
      if(list.indexOf(u)<0) list.push(u);
    });
    var total=list.length, done=0;
    setProgress(0,total);
    if(!total){ finish(); return; }

    var cache=null;
    try{ cache=await caches.open(VER); }catch(e){ cache=null; }

    async function grab(url){
      if(cache){ try{ if(await cache.match(url)) return; }catch(e){} }
      for(var attempt=0; attempt<2; attempt++){        /* one retry */
        try{
          var res=await fetch(url, {cache:'reload'});
          if(res && (res.ok || res.type==='opaque')){
            if(cache){ try{ await cache.put(url, res.clone()); }catch(e){} }
            return;
          }
        }catch(e){ /* fall through to retry, then skip */ }
      }
      /* skip-on-fail gracefully */
    }

    var idx=0, CONC=6;
    function worker(){
      return (async function(){
        while(idx<total){
          var my=idx++;
          await grab(list[my]);
          done++; setProgress(done,total);
        }
      })();
    }
    var pool=[]; for(var w=0; w<CONC; w++) pool.push(worker());
    await Promise.all(pool);
    setProgress(total,total);
    setTimeout(finish, 500);
  }

  /* run after paint so the branded screen shows immediately */
  requestAnimationFrame(function(){ requestAnimationFrame(run); });
})();
</script>
