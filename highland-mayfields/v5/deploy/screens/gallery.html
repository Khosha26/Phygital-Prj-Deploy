<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Gallery — Highland Mayfields</title>
<link rel="stylesheet" href="../styles/brand.css">
<link rel="stylesheet" href="../assets/css/hm-tools.css">
<link rel="stylesheet" href="_kit.css">
<style>
  /* ============================================================
     GALLERY — full-bleed cinematic hero + floating glass chooser.
     Three clearly-distinct modes: Images · Films · Day↔Night.
     No page scroll: hero fills the body, chooser floats over it.
     ============================================================ */

  .gal-stage{ position:relative; height:100%; width:100%; }

  /* ---------- MAIN HERO FRAME ---------- */
  .gal-hero{ position:absolute; inset:0; border-radius:var(--r-tile); overflow:hidden;
    border:1px solid var(--hairline-soft); background:#0e0b0a; }
  .gal-hero::after{ content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(120% 90% at 50% 35%, transparent 55%, rgba(14,11,10,.55) 100%); }
  /* media inside hero (image OR film share these) */
  .gal-media{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; z-index:1; }
  .gal-hero .gal-media.kb{ animation:gal-kb 1.1s var(--ease-settle) both; }
  @keyframes gal-kb{ from{ opacity:0; transform:scale(1.035) } to{ opacity:1; transform:scale(1) } }
  /* soft top + bottom veils so caption + chooser read over any render */
  .gal-veil{ position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(20,15,13,.42) 0%, transparent 26%, transparent 58%, rgba(20,15,13,.78) 100%); }

  /* hero caption — top-left glass tag */
  .gal-cap{ position:absolute; top:clamp(.8rem,2.4vh,1.6rem); left:clamp(.8rem,2.4vw,1.7rem); z-index:4;
    max-width:min(60ch,72%); padding:.7rem 1rem .8rem; cursor:pointer; text-align:left;
    background:rgba(26,20,18,.9); border:1px solid var(--hairline-soft); border-radius:var(--r-tile);
    -webkit-tap-highlight-color:transparent;
    transition:border-color .3s, background .3s; }
  @media(hover:hover){ .gal-cap:hover{ border-color:var(--hairline); background:rgba(34,26,24,.92); } }
  .gal-cap .top{ display:flex; align-items:center; gap:.7em; margin-bottom:.15rem; }
  .gal-cap .tag{ font-family:var(--font-label); font-size:9px; letter-spacing:var(--track-wide);
    text-transform:uppercase; color:var(--accent); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:.25em .7em; }
  .gal-cap .ix{ font-family:var(--font-display); font-weight:200; font-size:var(--t-micro); color:var(--ink-dim); letter-spacing:.1em; }
  .gal-cap b{ display:block; font-family:var(--font-display); font-weight:300; letter-spacing:.012em;
    font-size:clamp(1.05rem,2vw,1.7rem); color:var(--ink); line-height:1.1; }
  .gal-cap .hint{ display:inline-flex; align-items:center; gap:.45em; margin-top:.4rem;
    font-family:var(--font-label); font-size:var(--t-micro); letter-spacing:var(--track-wide);
    text-transform:uppercase; color:var(--ink-dim); opacity:.78; }
  .gal-cap .hint svg{ width:12px; height:12px; }
  .gal-cap .hint svg *{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

  /* film play overlay (poster state) */
  .gal-play{ position:absolute; inset:0; z-index:4; display:grid; place-items:center; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .gal-play .pbtn{ width:84px; height:84px; border-radius:50%; background:rgba(34,26,24,.9); border:1px solid var(--accent);
    display:grid; place-items:center; transition:transform .35s var(--ease-settle); }
  .gal-play .pbtn::after{ content:""; border-left:20px solid var(--hm-gold-bright);
    border-top:12px solid transparent; border-bottom:12px solid transparent; margin-left:6px; }
  @media(hover:hover){ .gal-play:hover .pbtn{ transform:scale(1.08); } }
  video.gal-media{ object-fit:contain; background:#000; }

  /* ---------- DAY ↔ NIGHT COMPARE ---------- */
  .gal-cmp{ position:absolute; inset:0; z-index:1; touch-action:none; cursor:ew-resize; -webkit-tap-highlight-color:transparent; }
  .gal-cmp img{ position:absolute; top:0; left:0; height:100%; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  /* DAY fills the frame. Both images share object-fit:cover so the seam + handle
     measure against the SAME displayed rectangle (element box == image box, no letterbox drift). */
  .gal-cmp img.cmp-day{ width:100%; object-fit:cover; object-position:center; z-index:1; }
  /* NIGHT reveal = a width-clipped wrapper (compositor-friendly: changing the wrapper's
     width re-clips a promoted layer instead of repainting the ~500KB webp every frame).
     Day shows left-of-seam (base image); the wrapper covers the RIGHT portion (seam→100%)
     and holds the night <img> at FULL frame width, anchored right so it stays registered
     with the day image beneath — it never squishes as the wrapper narrows. */
  .cmp-night-wrap{ position:absolute; top:0; right:0; bottom:0; width:calc((100 - var(--pos,50)) * 1%);
    overflow:hidden; z-index:2; will-change:width; }
  .cmp-night-wrap img.cmp-night{ left:auto; right:0; width:var(--cmp-w,100%); max-width:none;
    object-fit:cover; object-position:center; }
  .gal-cmp.anim .cmp-night-wrap{ transition:width .45s var(--ease-soft); }
  .gal-cmp .cmp-fade{ position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(20,15,13,.35) 0%, transparent 22%, transparent 70%, rgba(20,15,13,.6) 100%); }
  /* the draggable handle line */
  .cmp-handle{ position:absolute; top:0; bottom:0; left:calc(var(--pos,50) * 1%); width:0; z-index:5; pointer-events:none; }
  .gal-cmp.anim .cmp-handle{ transition:left .45s var(--ease-soft); }
  .cmp-handle .line{ position:absolute; top:0; bottom:0; left:50%; width:2px; transform:translateX(-50%);
    background:linear-gradient(180deg, transparent, var(--hm-gold-soft) 12%, var(--hm-gold-bright) 50%, var(--hm-gold-soft) 88%, transparent);
    box-shadow:0 0 18px rgba(0,0,0,.6); }
  .cmp-handle .grip{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
    background:rgba(26,20,18,.9); border:1px solid var(--accent);
    box-shadow:0 10px 30px rgba(0,0,0,.55); }
  .cmp-handle .grip svg{ width:30px; height:30px; }
  .cmp-handle .grip svg path{ fill:none; stroke:var(--hm-gold-bright); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  /* DAY / NIGHT pills */
  .cmp-lab{ position:absolute; top:clamp(.9rem,3vh,1.6rem); z-index:5; display:inline-flex; align-items:center; gap:.5em;
    padding:.4em .9em; border-radius:var(--r-pill); pointer-events:none;
    font-family:var(--font-label); font-size:var(--t-micro); letter-spacing:var(--track-wide); text-transform:uppercase;
    background:rgba(26,20,18,.9); border:1px solid var(--hairline); color:var(--ink);
    transition:opacity .3s, color .3s, border-color .3s; }
  .cmp-lab svg{ width:13px; height:13px; }
  .cmp-lab svg *{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .cmp-lab.day{ left:clamp(.9rem,3vw,1.7rem); color:var(--hm-gold-bright); }
  .cmp-lab.night{ right:clamp(.9rem,3vw,1.7rem); }
  .cmp-hint{ position:absolute; left:50%; bottom:clamp(6.5rem,16vh,8.5rem); transform:translateX(-50%); z-index:5;
    display:inline-flex; align-items:center; gap:.5em; padding:.4em .95em; border-radius:var(--r-pill); pointer-events:none;
    font-family:var(--font-label); font-size:var(--t-micro); letter-spacing:var(--track-wide); text-transform:uppercase;
    color:var(--ink-dim); background:rgba(26,20,18,.9); border:1px solid var(--hairline-soft);
    transition:opacity .4s; }
  .cmp-hint svg{ width:14px; height:14px; }
  .cmp-hint svg *{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .gal-cmp.touched .cmp-hint{ opacity:0; }

  /* ---------- FLOATING CHOOSER FIELD ---------- */
  .gal-chooser{ position:absolute; left:50%; bottom:clamp(.55rem,2vh,1.3rem); transform:translateX(-50%); z-index:6;
    width:min(1240px,95%); display:flex; flex-direction:column; gap:clamp(.55rem,1.4vh,.9rem);
    padding:clamp(.65rem,1.5vh,1rem) clamp(.75rem,1.6vw,1.15rem);
    background:rgba(26,20,18,.74); border:1px solid var(--hairline); border-radius:12px;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 24px 60px rgba(0,0,0,.55); }
  .gal-chooser.cmp-mode .gal-strow{ display:none; }

  .gal-ctop{ display:flex; align-items:center; gap:clamp(.7rem,1.4vw,1.1rem); flex-wrap:wrap; }

  /* ---- segmented Images / Films / Day-Night toggle (distinct, icon-led) ---- */
  .gal-seg{ flex:0 0 auto; display:inline-flex; gap:4px; padding:4px;
    background:rgba(14,11,10,.5); border:1px solid var(--hairline-soft); border-radius:14px; }
  .gseg{ position:relative; display:inline-flex; align-items:center; gap:.55em; min-height:46px;
    padding:.5em .95em .5em .8em; border:1px solid transparent; border-radius:10px; cursor:pointer;
    color:var(--ink-dim); background:transparent; -webkit-tap-highlight-color:transparent;
    transition:color .25s var(--ease-soft), background .25s var(--ease-soft), border-color .25s; }
  .gseg .gico{ width:22px; height:22px; flex:0 0 auto; display:block; }
  .gseg .gico *{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .gseg .gico .fill{ fill:currentColor; stroke:none; }
  .gseg .glab{ font-family:var(--font-label); font-size:var(--t-micro); letter-spacing:var(--track-wide);
    text-transform:uppercase; white-space:nowrap; }
  .gseg .gnum{ min-width:1.5em; height:1.5em; padding:0 .35em; display:inline-grid; place-items:center;
    font-family:var(--font-display); font-weight:300; font-size:11px; line-height:1;
    border-radius:var(--r-pill); color:var(--accent-text); background:rgba(0,0,0,.28); border:1px solid var(--hairline-soft); }
  .gseg:hover{ color:var(--ink); }
  .gseg.active{ color:var(--hm-espresso); background:var(--accent); border-color:var(--accent);
    box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .gseg.active .gnum{ color:var(--hm-espresso); background:rgba(34,26,24,.18); border-color:rgba(34,26,24,.25); }

  .gal-cats{ flex:1 1 240px; min-width:0; }
  .gal-cats.hide{ display:none; }
  .gal-count{ flex:0 0 auto; margin-left:auto; font-family:var(--font-display); font-weight:200;
    font-size:var(--t-micro); letter-spacing:.14em; color:var(--accent-text); text-transform:uppercase; white-space:nowrap; }
  .gal-count.hide{ display:none; }

  /* thumb strip row: arrows + scroller */
  .gal-strow{ display:flex; align-items:center; gap:.6rem; }
  .gal-arrow{ flex:0 0 auto; width:40px; height:clamp(70px,9vh,104px); border-radius:var(--r-tile);
    display:grid; place-items:center; cursor:pointer; color:var(--ink);
    background:rgba(34,26,24,.55); border:1px solid var(--hairline-soft); -webkit-tap-highlight-color:transparent;
    transition:color .25s, border-color .25s, background .25s, opacity .25s; }
  .gal-arrow:hover{ color:var(--hm-gold-bright); border-color:var(--hairline); background:rgba(44,34,30,.6); }
  .gal-arrow svg{ width:20px; height:20px; }
  .gal-arrow svg path{ fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .gal-arrow[disabled]{ opacity:.22; pointer-events:none; }

  .gal-strip{ flex:1 1 auto; min-width:0; display:flex; gap:clamp(.45rem,.9vw,.7rem);
    overflow-x:auto; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    padding:3px; scroll-snap-type:x proximity; }
  .gal-strip::-webkit-scrollbar{ display:none; }
  .gal-thumb{ flex:0 0 auto; width:clamp(112px,12vw,172px); height:clamp(70px,9vh,104px); position:relative;
    border-radius:var(--r-tile); overflow:hidden; border:1px solid var(--hairline-soft); background:#0e0b0a;
    cursor:pointer; scroll-snap-align:center; -webkit-tap-highlight-color:transparent;
    transition:border-color .25s, transform .25s var(--ease-soft), box-shadow .25s, filter .25s; }
  .gal-thumb img{ width:100%; height:100%; object-fit:cover; display:block; filter:saturate(.92) brightness(.86); transition:filter .25s; }
  @media(hover:hover){ .gal-thumb:hover{ border-color:var(--hairline); transform:translateY(-3px); }
    .gal-thumb:hover img{ filter:saturate(1) brightness(1); } }
  .gal-thumb.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 10px 26px rgba(0,0,0,.45); transform:translateY(-3px); }
  .gal-thumb.active img{ filter:saturate(1.02) brightness(1.02); }
  .gal-thumb.active::after{ content:""; position:absolute; left:8px; bottom:7px; width:18px; height:2px; border-radius:2px;
    background:var(--hm-gold-bright); box-shadow:0 0 10px var(--hm-gold-bright); z-index:3; }
  .gal-thumb .tnum{ position:absolute; top:0; left:0; padding:.2em .5em; z-index:2;
    font-family:var(--font-label); font-size:9px; letter-spacing:.12em; color:var(--ink);
    background:linear-gradient(135deg, rgba(14,11,10,.8), transparent); }
  .gal-thumb .tplay{ position:absolute; inset:0; display:grid; place-items:center; z-index:2; pointer-events:none; }
  .gal-thumb .tplay span{ width:34px; height:34px; border-radius:50%; background:rgba(26,20,18,.55);
    border:1px solid var(--accent); display:grid; place-items:center; }
  .gal-thumb .tplay span::after{ content:""; border-left:11px solid var(--hm-gold-bright);
    border-top:7px solid transparent; border-bottom:7px solid transparent; margin-left:3px; }
  .gal-thumb .tdur{ position:absolute; right:5px; bottom:5px; z-index:2; padding:.12em .45em; border-radius:var(--r-pill);
    font-family:var(--font-label); font-size:8px; letter-spacing:.1em; color:var(--ink);
    background:rgba(14,11,10,.7); border:1px solid var(--hairline-soft); }

  /* error / empty */
  .gal-empty{ position:absolute; inset:0; display:grid; place-items:center; z-index:5;
    font-family:var(--font-body); font-weight:300; color:var(--ink-dim); padding:2rem; text-align:center; }

  /* ============================================================
     ZOOM LIGHTBOX (own — pinch / wheel / double-tap / pan)
     ============================================================ */
  .gz{ position:fixed; inset:0; z-index:90; display:none; background:rgba(8,6,5,.94);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); -webkit-tap-highlight-color:transparent; }
  .gz.on{ display:block; animation:gz-in .35s var(--ease-soft) both; }
  @keyframes gz-in{ from{ opacity:0 } to{ opacity:1 } }
  .gz-stage{ position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
  .gz-stage.grabbing{ cursor:grabbing; }
  .gz-img{ position:absolute; top:50%; left:50%; max-width:92vw; max-height:86vh; object-fit:contain;
    transform:translate(-50%,-50%); transform-origin:center center; will-change:transform; user-select:none; -webkit-user-drag:none; }
  .gz-img.anim{ transition:transform .28s var(--ease-soft); }
  .gz-nav{ position:absolute; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%;
    z-index:3; display:grid; place-items:center; cursor:pointer; color:var(--ink);
    background:rgba(26,20,18,.9); border:1px solid var(--hairline); -webkit-tap-highlight-color:transparent;
    transition:color .25s, border-color .25s, background .25s; }
  .gz-nav:hover{ color:var(--hm-gold-bright); border-color:var(--accent); }
  .gz-nav svg{ width:24px; height:24px; }
  .gz-nav svg path{ fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .gz-nav.prev{ left:clamp(.6rem,3vw,2.4rem); } .gz-nav.next{ right:clamp(.6rem,3vw,2.4rem); }
  .gz-nav.hide{ opacity:0; pointer-events:none; }
  .gz-close{ position:absolute; top:clamp(.8rem,3vh,2rem); right:clamp(.8rem,3vw,2rem); z-index:4;
    width:48px; height:48px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:var(--ink);
    background:rgba(26,20,18,.9); border:1px solid var(--hairline); -webkit-tap-highlight-color:transparent;
    font-size:20px; line-height:1; transition:color .25s, border-color .25s; }
  .gz-close:hover{ color:var(--hm-gold-bright); border-color:var(--accent); }
  .gz-cap{ position:absolute; left:50%; bottom:clamp(1rem,4vh,2.4rem); transform:translateX(-50%); z-index:3; text-align:center;
    font-family:var(--font-display); font-weight:300; font-size:var(--t-sub); color:var(--ink); letter-spacing:.01em;
    padding:.45em 1.1em; background:rgba(20,15,13,.9); border:1px solid var(--hairline-soft); border-radius:var(--r-pill);
    pointer-events:none; }
  .gz-zc{ position:absolute; right:clamp(.8rem,3vw,2rem); bottom:clamp(1rem,4vh,2.4rem); z-index:4;
    display:inline-flex; gap:6px; padding:5px; border-radius:var(--r-pill);
    background:rgba(26,20,18,.9); border:1px solid var(--hairline); }
  .gz-zc button{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:var(--ink);
    background:transparent; border:0; -webkit-tap-highlight-color:transparent; transition:color .2s, background .2s; }
  .gz-zc button:hover{ color:var(--hm-gold-bright); background:rgba(0,0,0,.25); }
  .gz-zc svg{ width:20px; height:20px; }
  .gz-zc svg *{ fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .gz-zc .lvl{ display:grid; place-items:center; min-width:48px; padding:0 .3em;
    font-family:var(--font-label); font-size:var(--t-micro); letter-spacing:.06em; color:var(--accent-text); }

  @media (orientation:portrait){
    .gal-chooser{ width:96%; }
    .gal-cap{ max-width:80%; }
  }
  @media (max-width:680px){
    .gseg .glab{ display:none; }
    .gal-cats{ flex-basis:100%; order:4; }
    .gal-count{ order:3; }
  }
  @media (prefers-reduced-motion:reduce){
    .gal-hero .gal-media.kb{ animation:none; }
    .gal-cmp.anim .cmp-night-wrap, .gal-cmp.anim .cmp-handle{ transition:none; }
    .gz.on{ animation:none; }
    .gz-img.anim{ transition:none; }
  }
</style>
</head>
<body data-screen="gallery">
  <div class="scr">
    <header class="scr-top">
      <button class="scr-back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg> Home</button>
      <div class="scr-head">
        <span class="k-eyebrow">In light &amp; detail</span>
        <h1 class="scr-name">Gallery</h1>
      </div>
      <div class="scr-side"><img class="scr-crest" src="../assets/logo-crest.png" alt="" onerror="this.style.display='none'"></div>
    </header>

    <main class="scr-body">
      <div class="scr-wrap fill">
        <div class="gal-stage" data-reveal>

          <!-- MAIN HERO FRAME -->
          <div class="gal-hero" id="hero">
            <div class="gal-empty">Loading gallery…</div>
          </div>

          <!-- FLOATING CHOOSER -->
          <div class="gal-chooser" id="chooser" role="group" aria-label="Gallery chooser">
            <div class="gal-ctop">
              <div class="gal-seg" role="tablist" aria-label="Media type">
                <button id="segImg" class="gseg active" type="button" role="tab" aria-selected="true">
                  <svg class="gico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.4" cy="10" r="1.7"/><path d="M3.6 17l4.8-4.6 3.4 3.3 3.2-3 5.4 5.1"/></svg>
                  <span class="glab">Images</span><span class="gnum" id="nImg">0</span>
                </button>
                <button id="segFilm" class="gseg" type="button" role="tab" aria-selected="false">
                  <svg class="gico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9h18M7 5v4M12 5v4M17 5v4" opacity=".9"/><path class="fill" d="M10.4 10.6l4.4 2.6-4.4 2.6z"/></svg>
                  <span class="glab">Films</span><span class="gnum" id="nFilm">0</span>
                </button>
                <button id="segDN" class="gseg" type="button" role="tab" aria-selected="false">
                  <svg class="gico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path class="fill" d="M12 4.5a7.5 7.5 0 0 1 0 15z"/><path d="M12 1.5v1.6M12 20.9v1.6M22.5 12h-1.6M3.1 12H1.5M19.4 4.6l-1.1 1.1M5.7 18.3l-1.1 1.1" opacity=".55"/></svg>
                  <span class="glab">Day · Night</span>
                </button>
              </div>
              <div class="k-chips gal-cats" id="cats"></div>
              <span class="gal-count" id="count"></span>
            </div>
            <div class="gal-strow">
              <button class="gal-arrow" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
              <div class="gal-strip" id="strip"></div>
              <button class="gal-arrow" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- ZOOM LIGHTBOX -->
  <div class="gz" id="gz" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="gz-stage" id="gzStage"><img class="gz-img" id="gzImg" alt=""></div>
    <button class="gz-nav prev" id="gzPrev" type="button" aria-label="Previous image"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="gz-nav next" id="gzNext" type="button" aria-label="Next image"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="gz-close" id="gzClose" type="button" aria-label="Close">✕</button>
    <div class="gz-cap" id="gzCap"></div>
    <div class="gz-zc">
      <button id="gzOut" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M16.5 16.5L21 21"/></svg></button>
      <span class="lvl" id="gzLvl">100%</span>
      <button id="gzIn" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M16.5 16.5L21 21"/></svg></button>
    </div>
  </div>

  <script src="_kit.js"></script>
  <script>
  (function(){
    'use strict';
    var BASE = '../assets/screens/';
    var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

    window.HM_SCREEN_INFO = { title:'Gallery', html:
      '<p class="k-lede">Highland Mayfields in light &amp; detail — one cinematic hero frame and a floating chooser to browse every render, film and the day-to-night reveal.</p>'+
      '<ul style="list-style:none;padding:0;margin:.6rem 0;display:flex;flex-direction:column;gap:.5rem">'+
      '<li><b>Images</b> — filter by category, tap a thumbnail to load the hero, tap the hero to open full-screen with pinch / wheel / double-tap zoom.</li>'+
      '<li><b>Films</b> — two cinematic tours; tap to play with full controls.</li>'+
      '<li><b>Day · Night</b> — drag the gold handle to reveal the township from daylight into dusk.</li></ul>' };

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

    var heroEl   = document.getElementById('hero');
    var catsEl   = document.getElementById('cats');
    var stripEl  = document.getElementById('strip');
    var countEl  = document.getElementById('count');
    var chooser  = document.getElementById('chooser');
    var segImg   = document.getElementById('segImg');
    var segFilm  = document.getElementById('segFilm');
    var segDN    = document.getElementById('segDN');
    var nImgEl   = document.getElementById('nImg');
    var nFilmEl  = document.getElementById('nFilm');
    var prevBtn  = document.getElementById('prev');
    var nextBtn  = document.getElementById('next');

    var cats = [], allImages = [], films = [], dayNight = null;
    var mode = 'images', curCat = 'all', curList = [], curIdx = 0;

    fetch('../data/gallery.json').then(function(r){ return r.json(); }).then(build).catch(function(e){
      heroEl.innerHTML = '<div class="gal-empty">Gallery unavailable.</div>'; console.error(e);
    });

    function build(D){
      films = D.videos || [];
      cats  = D.categories || [];
      cats.forEach(function(c){ (c.items||[]).forEach(function(it){
        allImages.push({ src:it.src, title:it.title, tag:it.tag, cat:c.id, catName:c.name });
      }); });
      // locate the day / night aerials for the dedicated reveal (real assets only)
      var day = findImg('day-aerial.webp'), night = findImg('night-aerial.webp');
      if(day && night) dayNight = { day:day, night:night };
      else segDN.style.display = 'none';
      nImgEl.textContent  = allImages.length;
      nFilmEl.textContent = films.length;
      buildCats();
      setMode('images', true);
    }
    function findImg(name){ for(var i=0;i<allImages.length;i++){ if(allImages[i].src===name) return allImages[i]; } return null; }

    /* ---------- category chips ---------- */
    function buildCats(){
      var defs = [{ id:'all', name:'All' }].concat(cats.map(function(c){ return { id:c.id, name:c.name }; }));
      catsEl.innerHTML = '';
      defs.forEach(function(t){
        var chip = document.createElement('button');
        chip.type = 'button'; chip.className = 'k-chip' + (t.id===curCat ? ' active' : '');
        chip.textContent = t.name; chip.dataset.cat = t.id;
        chip.addEventListener('click', function(){ setCat(t.id); });
        catsEl.appendChild(chip);
      });
      if(window.HMKit) HMKit.bindRipples(catsEl);
    }
    function markCat(){
      catsEl.querySelectorAll('.k-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.cat===curCat); });
    }
    function filteredImages(){ return curCat==='all' ? allImages : allImages.filter(function(it){ return it.cat===curCat; }); }

    function setCat(id){
      curCat = id; markCat();
      if(mode!=='images'){ setMode('images'); return; }
      renderStrip();
      var l = filteredImages(); if(l.length) showImage(l, 0);
      updateArrows();
    }

    /* ---------- mode toggle ---------- */
    function setMode(m, initial){
      mode = m;
      segImg.classList.toggle('active', m==='images');  segImg.setAttribute('aria-selected', m==='images');
      segFilm.classList.toggle('active', m==='films');  segFilm.setAttribute('aria-selected', m==='films');
      segDN.classList.toggle('active', m==='daynight'); segDN.setAttribute('aria-selected', m==='daynight');
      catsEl.classList.toggle('hide', m!=='images');
      countEl.classList.toggle('hide', m==='daynight');
      chooser.classList.toggle('cmp-mode', m==='daynight');

      if(m==='daynight'){ showCompare(); return; }
      renderStrip();
      if(m==='images'){ var l = filteredImages(); if(l.length) showImage(l, 0); }
      else { if(films.length) showFilm(0, false); }
      stripEl.scrollLeft = 0; updateArrows();
    }
    segImg.addEventListener('click', function(){ if(mode!=='images') setMode('images'); });
    segFilm.addEventListener('click', function(){ if(mode!=='films') setMode('films'); });
    segDN.addEventListener('click', function(){ if(mode!=='daynight' && dayNight) setMode('daynight'); });

    /* ---------- thumbnail strip ---------- */
    function renderStrip(){
      stripEl.innerHTML = '';
      if(mode==='images'){
        var l = filteredImages();
        countEl.textContent = l.length + (l.length===1?' View':' Views');
        l.forEach(function(it, i){
          var t = document.createElement('button');
          t.type = 'button'; t.className = 'gal-thumb'; t.dataset.i = i;
          t.innerHTML = '<span class="tnum">'+('0'+(i+1)).slice(-2)+'</span>'+
            '<img src="'+BASE+it.src+'" alt="'+esc(it.title)+'" loading="lazy" onerror="this.style.opacity=.25">';
          t.addEventListener('click', function(){ showImage(l, i); });
          stripEl.appendChild(t);
        });
      } else {
        countEl.textContent = films.length + (films.length===1?' Film':' Films');
        films.forEach(function(v, i){
          var t = document.createElement('button');
          t.type = 'button'; t.className = 'gal-thumb'; t.dataset.i = i;
          t.innerHTML = '<span class="tnum">'+('0'+(i+1)).slice(-2)+'</span>'+
            '<img src="'+BASE+v.poster+'" alt="'+esc(v.title)+'" loading="lazy" onerror="this.style.opacity=.25">'+
            '<span class="tplay"><span></span></span>'+
            '<span class="tdur">Video</span>';
          t.addEventListener('click', function(){ showFilm(i, true); });
          stripEl.appendChild(t);
        });
      }
      if(window.HMKit) HMKit.bindRipples(stripEl);
    }
    function markActive(i){
      var t = stripEl.querySelectorAll('.gal-thumb');
      t.forEach(function(el, k){ el.classList.toggle('active', k===i); });
      if(t[i]) t[i].scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
    }

    /* ---------- hero: image ---------- */
    function showImage(list, idx){
      mode = 'images'; curList = list; curIdx = idx;
      var it = list[idx]; if(!it) return;
      heroEl.innerHTML =
        '<img class="gal-media kb" src="'+BASE+it.src+'" alt="'+esc(it.title)+'" onerror="this.style.display=\'none\'">'+
        '<div class="gal-veil"></div>'+
        '<button class="gal-cap" type="button" aria-label="Open full screen">'+
          '<span class="top">'+(it.tag?'<span class="tag">'+esc(it.tag)+'</span>':'')+'<span class="ix">'+('0'+(idx+1)).slice(-2)+' · '+esc(it.catName||'')+'</span></span>'+
          '<b>'+esc(it.title)+'</b>'+
          '<span class="hint"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg> Tap to enlarge &amp; zoom</span>'+
        '</button>';
      var open = function(){ openZoom(list, curIdx); };
      heroEl.querySelector('.gal-cap').addEventListener('click', open);
      heroEl.querySelector('.gal-media').addEventListener('click', open);
      markActive(idx);
    }

    /* ---------- hero: film ---------- */
    function showFilm(idx, autoplay){
      mode = 'films'; curIdx = idx;
      var v = films[idx]; if(!v) return;
      if(autoplay){
        heroEl.innerHTML = '';
        var vid = document.createElement('video');
        vid.className = 'gal-media kb'; vid.src = BASE + v.src; vid.poster = BASE + v.poster;
        vid.controls = true; vid.autoplay = true; vid.playsInline = true; vid.setAttribute('playsinline','');
        heroEl.appendChild(vid);
        var play = vid.play(); if(play && play.catch) play.catch(function(){});
      } else {
        heroEl.innerHTML =
          '<img class="gal-media kb" src="'+BASE+v.poster+'" alt="'+esc(v.title)+'" onerror="this.style.display=\'none\'">'+
          '<div class="gal-veil"></div>'+
          '<div class="gal-cap" style="cursor:default">'+
            '<span class="top"><span class="tag">Film</span><span class="ix">'+('0'+(idx+1)).slice(-2)+' · '+esc(v.desc||'')+'</span></span>'+
            '<b>'+esc(v.title)+'</b>'+
          '</div>'+
          '<div class="gal-play" role="button" aria-label="Play film"><div class="pbtn"></div></div>';
        heroEl.querySelector('.gal-play').addEventListener('click', function(){ showFilm(idx, true); });
      }
      markActive(idx);
    }

    /* ---------- hero: DAY ↔ NIGHT compare ---------- */
    function showCompare(){
      if(!dayNight) return;
      mode = 'daynight';
      heroEl.innerHTML =
        '<div class="gal-cmp anim" id="cmp" style="--pos:50" role="slider" tabindex="0" '+
             'aria-label="Day to night reveal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">'+
          '<img class="cmp-day"  src="'+BASE+dayNight.day.src+'"   alt="'+esc(dayNight.day.title)+'" draggable="false">'+
          '<div class="cmp-night-wrap"><img class="cmp-night" src="'+BASE+dayNight.night.src+'" alt="'+esc(dayNight.night.title)+'" draggable="false"></div>'+
          '<div class="cmp-fade"></div>'+
          '<div class="cmp-lab day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M21.5 12h-2M4.5 12h-2M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4M18.7 18.7l-1.4-1.4M6.7 6.7L5.3 5.3"/></svg> Day</div>'+
          '<div class="cmp-lab night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.4 6.4 0 0 0 10.5 10.5z"/></svg> Night</div>'+
          '<div class="cmp-handle"><div class="line"></div><div class="grip"><svg viewBox="0 0 24 24"><path d="M9 7l-4 5 4 5M15 7l4 5-4 5"/></svg></div></div>'+
          '<div class="cmp-hint"><svg viewBox="0 0 24 24"><path d="M8 7l-4 5 4 5M16 7l4 5-4 5"/></svg> Drag to reveal night</div>'+
        '</div>';
      markActive(-1);
      wireCompare();
    }
    function wireCompare(){
      var cmp = document.getElementById('cmp'); if(!cmp) return;
      var dragging = false, rafId = null, pendingX = 0;
      // --cmp-w = the frame's pixel width; keeps the night <img> at full width so it
      // never squishes inside the narrowing wrapper. Re-synced on resize.
      function syncW(){ cmp.style.setProperty('--cmp-w', cmp.getBoundingClientRect().width + 'px'); }
      syncW();
      function setPos(p, animate){
        p = clamp(p, 0, 100);
        cmp.classList.toggle('anim', !!animate);   // transitions ON for sweeps/keys, OFF during drag
        cmp.style.setProperty('--pos', p.toFixed(2));
        cmp.setAttribute('aria-valuenow', Math.round(p));
        var dEl = cmp.querySelector('.cmp-lab.day'), nEl = cmp.querySelector('.cmp-lab.night');
        if(dEl) dEl.style.opacity = clamp(0.45 + (100-p)/100 * 0.55, .4, 1);
        if(nEl) nEl.style.opacity = clamp(0.45 + p/100 * 0.55, .4, 1);
      }
      // both images are object-fit:cover so the element box IS the displayed-image rect
      function posFromX(clientX){
        var r = cmp.getBoundingClientRect();
        return (clientX - r.left) / r.width * 100;
      }
      cmp.addEventListener('pointerdown', function(e){
        dragging = true; cmp.classList.add('touched');
        try{ cmp.setPointerCapture(e.pointerId); }catch(_){}
        setPos(posFromX(e.clientX), false);
      });
      // rAF-throttle: coalesce many pointermoves into one paint per frame (no jank)
      cmp.addEventListener('pointermove', function(e){
        if(!dragging) return;
        pendingX = e.clientX;
        if(rafId) return;
        rafId = requestAnimationFrame(function(){ rafId = null; setPos(posFromX(pendingX), false); });
      });
      function end(){ dragging = false; if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }
      cmp.addEventListener('pointerup', end);
      cmp.addEventListener('pointercancel', end);
      cmp.addEventListener('keydown', function(e){
        var cur = parseFloat(cmp.style.getPropertyValue('--pos'))||50;
        if(e.key==='ArrowLeft'){ setPos(cur-4, true); e.preventDefault(); }
        else if(e.key==='ArrowRight'){ setPos(cur+4, true); e.preventDefault(); }
      });
      window.addEventListener('resize', function(){ if(document.getElementById('cmp')===cmp) syncW(); });
      // a gentle auto sweep to advertise the affordance (skipped for reduced motion)
      if(!reduce){
        setPos(64, true);
        setTimeout(function(){ if(!cmp.classList.contains('touched')) setPos(38, true); }, 650);
        setTimeout(function(){ if(!cmp.classList.contains('touched')) setPos(50, true); }, 1300);
      } else { setPos(50, false); }
    }

    /* ---------- strip arrows ---------- */
    function step(){ var t = stripEl.querySelector('.gal-thumb'); return t ? (t.offsetWidth + 10) * 3 : 360; }
    prevBtn.addEventListener('click', function(){ stripEl.scrollBy({ left:-step(), behavior:'smooth' }); });
    nextBtn.addEventListener('click', function(){ stripEl.scrollBy({ left: step(), behavior:'smooth' }); });
    function updateArrows(){
      var max = stripEl.scrollWidth - stripEl.clientWidth - 2;
      var off = max <= 0;
      prevBtn.disabled = off || stripEl.scrollLeft <= 1;
      nextBtn.disabled = off || stripEl.scrollLeft >= max;
    }
    stripEl.addEventListener('scroll', updateArrows, { passive:true });
    window.addEventListener('resize', updateArrows);

    /* hero swipe → next / prev (images & film posters only) */
    if(window.HMKit && HMKit.swipe){
      HMKit.swipe(heroEl, {
        onLeft:  function(){ heroNav(1); },
        onRight: function(){ heroNav(-1); }
      });
    }
    function heroNav(d){
      if(mode==='images'){
        var l = filteredImages(); if(!l.length) return;
        showImage(l, (curIdx + d + l.length) % l.length);
      } else if(mode==='films'){
        if(!films.length) return;
        showFilm((curIdx + d + films.length) % films.length, false);
      }
    }

    /* ============================================================
       ZOOM LIGHTBOX
       ============================================================ */
    var gz = document.getElementById('gz'), gzStage = document.getElementById('gzStage'),
        gzImg = document.getElementById('gzImg'), gzCap = document.getElementById('gzCap'),
        gzLvl = document.getElementById('gzLvl'), gzPrev = document.getElementById('gzPrev'),
        gzNext = document.getElementById('gzNext');
    var zList = [], zIdx = 0, scale = 1, tx = 0, ty = 0, MIN = 1, MAX = 5;
    var natW = 0, natH = 0;

    function applyT(animate){
      gzImg.classList.toggle('anim', !!animate);
      gzImg.style.transform = 'translate(calc(-50% + '+tx+'px), calc(-50% + '+ty+'px)) scale('+scale+')';
      gzLvl.textContent = Math.round(scale*100) + '%';
      var z = scale > 1.01;
      gzStage.classList.toggle('grabbing', false);
      gzPrev.classList.toggle('hide', z); gzNext.classList.toggle('hide', z || zList.length<2);
      if(!z){ gzNext.classList.toggle('hide', zList.length<2); }
    }
    function bounds(){
      var r = gzImg.getBoundingClientRect();
      // displayed (unscaled) size = current rect / scale
      var w = r.width / scale, h = r.height / scale;
      var maxX = Math.max(0, (w*scale - gzStage.clientWidth)/2);
      var maxY = Math.max(0, (h*scale - gzStage.clientHeight)/2);
      return { maxX:maxX, maxY:maxY };
    }
    function clampPan(){ var b = bounds(); tx = clamp(tx, -b.maxX, b.maxX); ty = clamp(ty, -b.maxY, b.maxY); }
    function reset(animate){ scale = 1; tx = 0; ty = 0; clampPan(); applyT(animate); }

    function zoomAt(clientX, clientY, ns, animate){
      ns = clamp(ns, MIN, MAX);
      var r = gzStage.getBoundingClientRect();
      var cx = clientX - (r.left + r.width/2);
      var cy = clientY - (r.top + r.height/2);
      // point in image space stays under cursor
      var ix = (cx - tx) / scale, iy = (cy - ty) / scale;
      scale = ns;
      tx = cx - ix*scale; ty = cy - iy*scale;
      clampPan(); applyT(animate);
    }

    function gzRender(){
      var it = zList[zIdx] || {};
      reset(false);
      gzImg.src = it.src || '';
      gzCap.textContent = it.title || '';
      gzPrev.classList.toggle('hide', zList.length<2);
      gzNext.classList.toggle('hide', zList.length<2);
    }
    function gzGo(d){ if(!zList.length) return; zIdx = (zIdx + d + zList.length) % zList.length; gzRender(); }

    function openZoom(list, idx){
      zList = (list||[]).map(function(x){ return { src:BASE+x.src, title:x.title }; });
      zIdx = idx||0; gz.classList.add('on'); document.body.style.overflow='hidden'; gzRender();
    }
    function closeZoom(){ gz.classList.remove('on'); document.body.style.overflow=''; }

    document.getElementById('gzClose').addEventListener('click', closeZoom);
    gzPrev.addEventListener('click', function(e){ e.stopPropagation(); gzGo(-1); });
    gzNext.addEventListener('click', function(e){ e.stopPropagation(); gzGo(1); });
    document.getElementById('gzIn').addEventListener('click', function(){ var r=gzStage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, scale+0.6, true); });
    document.getElementById('gzOut').addEventListener('click', function(){ var r=gzStage.getBoundingClientRect(); var ns=scale-0.6; zoomAt(r.left+r.width/2, r.top+r.height/2, ns, true); if(ns<=MIN) reset(true); });
    gz.addEventListener('click', function(e){ if(e.target===gz) closeZoom(); });
    document.addEventListener('keydown', function(e){
      if(!gz.classList.contains('on')) return;
      if(e.key==='Escape'){ closeZoom(); }
      else if(e.key==='ArrowRight'){ if(scale<=1.01) gzGo(1); }
      else if(e.key==='ArrowLeft'){ if(scale<=1.01) gzGo(-1); }
      else if(e.key==='+'||e.key==='='){ var r=gzStage.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,scale+0.6,true); }
      else if(e.key==='-'){ var r2=gzStage.getBoundingClientRect(); zoomAt(r2.left+r2.width/2,r2.top+r2.height/2,scale-0.6,true); }
    });

    /* wheel zoom */
    gzStage.addEventListener('wheel', function(e){
      if(!gz.classList.contains('on')) return;
      e.preventDefault();
      var factor = e.deltaY < 0 ? 1.12 : 1/1.12;
      zoomAt(e.clientX, e.clientY, scale*factor, false);
      if(scale<=MIN+0.001){ reset(false); }
    }, { passive:false });

    /* double-click / double-tap toggle */
    gzStage.addEventListener('dblclick', function(e){
      if(scale>1.01) reset(true); else zoomAt(e.clientX, e.clientY, 2.6, true);
    });

    /* pointer pan + pinch + tap-detection */
    var pts = {}, panStart = null, startTx=0, startTy=0, pinchD0=0, pinchS0=1, pinchMid=null;
    var downT=0, downX=0, downY=0, lastTap=0, moved=false;
    gzStage.addEventListener('pointerdown', function(e){
      pts[e.pointerId] = { x:e.clientX, y:e.clientY };
      try{ gzStage.setPointerCapture(e.pointerId); }catch(_){}
      var ids = Object.keys(pts);
      if(ids.length===1){
        panStart = { x:e.clientX, y:e.clientY }; startTx=tx; startTy=ty;
        downT=Date.now(); downX=e.clientX; downY=e.clientY; moved=false;
        gzStage.classList.add('grabbing');
      } else if(ids.length===2){
        var a=pts[ids[0]], b=pts[ids[1]];
        pinchD0 = Math.hypot(a.x-b.x, a.y-b.y); pinchS0 = scale;
        pinchMid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
        panStart = null;
      }
    });
    gzStage.addEventListener('pointermove', function(e){
      if(!pts[e.pointerId]) return;
      pts[e.pointerId] = { x:e.clientX, y:e.clientY };
      var ids = Object.keys(pts);
      if(ids.length>=2){
        var a=pts[ids[0]], b=pts[ids[1]];
        var d = Math.hypot(a.x-b.x, a.y-b.y);
        if(pinchD0>0){ var mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; zoomAt(mid.x, mid.y, pinchS0 * (d/pinchD0), false); }
        moved = true;
      } else if(panStart){
        var dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
        if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true;
        if(scale>1.01){ tx = startTx+dx; ty = startTy+dy; clampPan(); applyT(false); }
      }
    });
    function pointerEnd(e){
      var wasOne = Object.keys(pts).length===1;
      delete pts[e.pointerId];
      gzStage.classList.remove('grabbing');
      if(Object.keys(pts).length<2){ pinchD0=0; }
      if(Object.keys(pts).length===1){
        var id=Object.keys(pts)[0]; panStart={x:pts[id].x,y:pts[id].y}; startTx=tx; startTy=ty;
      }
      // tap / double-tap when at base scale and not panning a zoomed image
      if(wasOne && !moved){
        var now=Date.now();
        if(now-lastTap < 300){
          // double tap
          if(scale>1.01) reset(true); else zoomAt(downX, downY, 2.6, true);
          lastTap=0;
        } else { lastTap=now; }
      }
      if(scale<=MIN+0.001){ reset(false); }
    }
    gzStage.addEventListener('pointerup', pointerEnd);
    gzStage.addEventListener('pointercancel', pointerEnd);

    /* swipe-to-navigate inside lightbox at base scale (touch) */
    if(window.HMKit && HMKit.swipe){
      HMKit.swipe(gzStage, {
        onLeft:  function(){ if(scale<=1.01) gzGo(1); },
        onRight: function(){ if(scale<=1.01) gzGo(-1); }
      });
    }

  })();
  </script>
</body>
