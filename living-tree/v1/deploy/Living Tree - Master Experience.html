<style>
  /* ===== Safari / WebKit hardening — prevent text-zoom, long-press menus, double-tap zoom, bounce ===== */
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    height: 100%;
    height: 100dvh;
  }
  html, body {
    margin: 0; padding: 0;
    background: #050a07;
    font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    user-select: none;
    width: 100%;
    height: 100%;
    height: 100dvh;
    position: fixed;
    inset: 0;
  }
  * { box-sizing: border-box; }
  img { -webkit-user-drag: none; -webkit-touch-callout: none; pointer-events: auto; }

  /* Stage fits viewport with letterboxing. Safe-area insets are honored so the stage
     never sits under the iPhone notch / Dynamic Island in landscape standalone mode. */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    padding-top:    env(safe-area-inset-top);
    padding-right:  env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left:   env(safe-area-inset-left);
    background: radial-gradient(ellipse at center, #0a120d 0%, #050a07 80%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    -webkit-transform: translate(-50%, -50%) scale(1);
    box-shadow: 0 60px 140px rgba(0,0,0,0.6);
    border-radius: 2px;
    overflow: hidden;
    touch-action: none;
    /* Hardware-accelerate the scaled stage on Safari for smoother motion */
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }

  /* ====== KEYFRAMES ====== */
  @keyframes leafFall {
    0%   { transform: translate(0, 0) rotate(var(--rotS)); }
    100% { transform: translate(var(--driftX), calc(100vh + 80px)) rotate(var(--rotE)); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: 0.55; }
    50%      { transform: scale(1.04); opacity: 0.85; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes treeDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes dashIn {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes fadeInOpacity {
    from { opacity: 0; }
    to   { opacity: 0.85; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleFadeIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes springIn {
    0%   { transform: scale(0.5); }
    100% { transform: scale(1); }
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  @keyframes kenBurns {
    0%   { transform: scale(1.0) translate(0, 0); }
    50%  { transform: scale(1.08) translate(-1%, -1.5%); }
    100% { transform: scale(1.0) translate(0, 0); }
  }
  .canopyBg { animation: kenBurns 36s ease-in-out infinite; }

  /* themed scrollbar for inner screens */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
  ::-webkit-scrollbar-thumb { background: rgba(217,178,122,0.3); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(217,178,122,0.5); background-clip: padding-box; }
</style>
<script>
  // Stage scaling — uses visualViewport on Safari to handle URL-bar collapse smoothly.
  // Aspect-aware fit:
  //   - When the viewport aspect ratio is close to or wider than the stage (1.6 / 16:10),
  //     use CONTAIN (Math.min). This preserves the existing behaviour on 16:10 tablets
  //     (Galaxy Tab S7), 16:9 desktops, 16:10 MacBooks, ultrawide monitors, and phones in
  //     landscape — exactly the devices the user said are "currently proper".
  //   - When the viewport is significantly more square than the stage (iPad Pro 12.9 = 4:3,
  //     iPad Pro 11 / iPad Air ≈ 1.43:1), use COVER (Math.max). The stage scales up to fill
  //     the viewport, the top/bottom letterbox bars disappear, and any minor edge overflow
  //     is clipped by #stage-wrap's overflow:hidden. The COVER trigger is gated on the
  //     viewport being landscape (vw > vh) so phones/tablets in portrait keep contain.
  (function() {
    const W = 1440, H = 900;
    const STAGE_ASPECT = W / H;          // 1.6 — 16:10
    const COVER_THRESHOLD = 0.97;        // Trigger cover only when viewport aspect is <97%
                                         // of stage aspect (≈ 1.55). 16:9 (1.78), 16:10 (1.6)
                                         // and ultrawide stay in contain. iPad Pro 12.9
                                         // (1.33), iPad Pro 11 (1.43), iPad Air (1.44) all
                                         // fall under the threshold and switch to cover.
    function scale() {
      const wrap = document.getElementById("stage-wrap");
      const stage = document.getElementById("stage");
      if (!wrap || !stage) return;
      var vw = wrap.clientWidth, vh = wrap.clientHeight;
      if (window.visualViewport) {
        vw = Math.min(vw, window.visualViewport.width);
        vh = Math.min(vh, window.visualViewport.height);
      }
      const viewAspect = vw / vh;
      const isSquarishLandscape =
        viewAspect > 1 && viewAspect < STAGE_ASPECT * COVER_THRESHOLD;
      const s = isSquarishLandscape
        ? Math.max(vw / W, vh / H)        // cover — fill viewport, clip side overflow
        : Math.min(vw / W, vh / H);       // contain — letterbox, no clipping
      const t = "translate(-50%, -50%) scale(" + s + ")";
      stage.style.transform = t;
      stage.style.webkitTransform = t;
    }
    window.__ltScale = scale;
    window.addEventListener("resize", scale);
    window.addEventListener("orientationchange", scale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", scale);
      window.visualViewport.addEventListener("scroll", scale);
    }
    document.addEventListener("DOMContentLoaded", scale);
    window.addEventListener("load", scale);

    // Block iOS double-tap zoom (in case viewport meta is ignored — rare but defensive)
    var lastTouchEnd = 0;
    document.addEventListener("touchend", function(e) {
      var now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    // Block pinch zoom on iOS Safari (viewport user-scalable=no isn't always honored)
    document.addEventListener("gesturestart",  function(e) { e.preventDefault(); });
    document.addEventListener("gesturechange", function(e) { e.preventDefault(); });
    document.addEventListener("gestureend",    function(e) { e.preventDefault(); });
  })();
</script>

<script>
  /* PWA — register the service worker for installability + offline */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        /* When the app is idle, ask SW to download the secondary assets so
           offline navigation feels instant on subsequent screens. */
        var prefetch = function () {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage("PREFETCH_SECONDARY");
          } else if (reg.active) {
            reg.active.postMessage("PREFETCH_SECONDARY");
          }
        };
        if ("requestIdleCallback" in window) {
          requestIdleCallback(prefetch, { timeout: 3500 });
        } else {
          setTimeout(prefetch, 2500);
        }
      }).catch(function () {});
    });
  }

  /* Capture install prompt so we can use it from the UI if desired */
  window.__ltDeferredInstall = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__ltDeferredInstall = e;
  });
</script>
