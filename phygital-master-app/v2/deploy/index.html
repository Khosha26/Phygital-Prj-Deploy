<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Phygital — Experiences</title>
  <meta name="theme-color" content="#0d1417" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />

  <!-- Safari / iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Phygital" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./intro.css" />

  <!-- warm up the experience hosts so a tapped project starts loading instantly -->
  <link rel="preconnect" href="https://the-universe-salessuite.netlify.app" crossorigin />
  <link rel="preconnect" href="https://living-tree.netlify.app" crossorigin />
  <link rel="preconnect" href="https://embassy-citadel.netlify.app" crossorigin />
  <link rel="preconnect" href="https://sunny-squirrel-3f220f.netlify.app" crossorigin />
  <link rel="dns-prefetch" href="https://the-universe-salessuite.netlify.app" />
  <link rel="dns-prefetch" href="https://living-tree.netlify.app" />
  <link rel="dns-prefetch" href="https://embassy-citadel.netlify.app" />
  <link rel="dns-prefetch" href="https://sunny-squirrel-3f220f.netlify.app" />
</head>
<body>
  <!-- cinematic intro: particles fly in → form the dp logo → fingerprint to enter -->
  <div class="intro" id="intro" role="dialog" aria-label="Enter Phygital">
    <canvas class="introfx" id="introfx" aria-hidden="true"></canvas>
    <div class="intro__ui">
      <button class="intro__enter" id="introEnter" type="button" aria-label="Tap to enter">
        <span class="intro__print" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.2 11a6.8 6.8 0 0 1 13.6 0"/>
            <path d="M7.5 11.4a4.5 4.5 0 0 1 9 0v1.1"/>
            <path d="M9.8 11.6a2.2 2.2 0 0 1 4.4 0v3.2"/>
            <path d="M12 11.7v5.2"/>
            <path d="M7.6 14.6a8 8 0 0 0 .9 4"/>
            <path d="M16.4 14.4a8.5 8.5 0 0 1-.5 5.1"/>
            <path d="M9.9 17.2a5 5 0 0 0 .4 2.9"/>
            <path d="M14.1 17a5.5 5.5 0 0 1-.3 3.4"/>
          </svg>
        </span>
      </button>
      <span class="intro__label">Tap to enter</span>
    </div>
    <span class="intro__brand">The Phygital Studio</span>
  </div>

  <!-- ambient field -->
  <div class="field" aria-hidden="true">
    <div class="bloom bloom--pink"></div>
    <div class="bloom bloom--teal"></div>
    <div class="grain"></div>
  </div>

  <!-- soft studio spotlight (smooth radial, faded corners) falling on the dp logo -->
  <div class="spotlight" aria-hidden="true">
    <div class="spotlight__vignette"></div>
    <div class="spotlight__beam"></div>
    <div class="spotlight__pool"></div>
  </div>

  <!-- pink lens shine / flare over the dp logo (right side), low opacity -->
  <div class="flare" aria-hidden="true">
    <div class="flare__glow"></div>
    <div class="flare__streak flare__streak--h"></div>
    <div class="flare__streak flare__streak--v"></div>
    <div class="flare__star"></div>
  </div>

  <!-- subtle particle hand: physical × digital -->
  <canvas class="handfx" id="handfx" aria-hidden="true"></canvas>

  <main class="stage">
    <header class="topbar">
      <div class="status">
        <span class="status__live"><i></i> live</span>
        <time class="status__clock" id="clock">--:--</time>
      </div>
    </header>

    <section class="center">
      <div class="hero">
        <p class="eyebrow">Select an experience</p>
        <h1 class="title">Crafted, on screen and in space.</h1>
      </div>

      <div class="catalog">
        <nav class="cats" id="cats" aria-label="Categories"></nav>
        <section class="grid" id="grid" aria-label="Experiences">
          <div class="loading" id="loading">Loading experiences…</div>
        </section>
      </div>
    </section>

    <footer class="footnote">
      <span>The Phygital Studio</span>
      <span class="footnote__sep">·</span>
      <span>unforgettable digital experiences</span>
    </footer>
  </main>

  <!-- toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- fullscreen experience viewer (in-page iframe) -->
  <div class="viewer" id="viewer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Experience">
    <div class="viewer__loading" id="viewerLoading">
      <span class="spinner" aria-hidden="true"></span>
      <span class="viewer__loadlabel" id="viewerLoadLabel">Loading…</span>
    </div>
    <iframe
      class="viewer__frame"
      id="viewerFrame"
      title="Experience"
      allow="fullscreen; autoplay; clipboard-read; clipboard-write; accelerometer; gyroscope"
      allowfullscreen
    ></iframe>
    <button class="viewer__close" id="viewerClose" type="button" aria-label="Close experience">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      <span>Close</span>
    </button>
  </div>

  <script src="./handfx.js"></script>
  <script src="./intro.js"></script>
  <script src="./app.js"></script>
  <script>
    // PWA: register the offline service worker (no-op where unsupported).
    // When a new SW takes control (after an update), reload once so the latest
    // HTML/CSS/JS shows immediately — no manual hard-refresh needed.
    if ("serviceWorker" in navigator) {
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => reg.update())
          .catch(() => {});
      });
    }
  </script>
<script src="assets/rda.js" data-base="https://analytics.khosha.tech" data-slug="phygital-master-app" data-token="rdk_ff03879abd57b4d71406927b3b1a05f972ef3a2fb621dc1c" data-label=""></script>
</body>
</html>
